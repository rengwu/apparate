<!doctype html><meta charset=utf-8><style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#ececf0;
 background:radial-gradient(120% 120% at 20% 0%,#2c3a63 0%,#1d2340 45%,#14172a 100%);
 display:flex;justify-content:center;align-items:flex-start;padding:28px 16px;-webkit-font-smoothing:antialiased;user-select:none}
.mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
.dim{color:rgba(235,235,245,.55)}
.dimmer{color:rgba(235,235,245,.35)}
img.ic{display:block;flex:none}

.win{width:min(560px,100%);border-radius:12px;background:#24252b;border:1px solid rgba(255,255,255,.14);box-shadow:0 20px 60px rgba(0,0,0,.55);overflow:hidden}
.bar{height:38px;display:flex;align-items:center;gap:8px;padding:0 14px;border-bottom:1px solid rgba(0,0,0,.35);background:#2a2b31}
.dot{width:12px;height:12px;border-radius:50%;background:#4a4b52}.dot.r{background:#ff5f57}
.title{font-weight:600;margin-left:10px;color:rgba(235,235,245,.85)}
.body{padding:16px 22px 20px;overflow:auto}
h3{font-size:13px;font-weight:700;margin:14px 0 8px}h3:first-child{margin-top:0}
.grid{display:grid;grid-template-columns:150px 1fr;row-gap:9px;column-gap:14px;align-items:center}
.lbl{color:rgba(235,235,245,.9)}
.note{font-size:11px;color:rgba(235,235,245,.5);grid-column:2}
.rec{display:inline-flex;align-items:center;gap:8px;padding:3px 10px;border-radius:6px;background:#3a3b42;border:1px solid rgba(255,255,255,.1);min-width:120px}
.btn{display:inline-block;padding:3px 11px;border-radius:6px;background:#4a4b53;border:1px solid rgba(255,255,255,.08);font-size:12.5px;cursor:default}
.btn.blue{background:#3a6fd8}
.chk{display:inline-flex;align-items:center;gap:7px}.chk i{width:15px;height:15px;border-radius:4px;background:#3a6fd8;display:inline-grid;place-items:center;font-style:normal;font-size:11px}
.pop{display:inline-flex;align-items:center;gap:18px;padding:3px 8px 3px 10px;border-radius:6px;background:#4a4b53;font-size:12.5px}
.pop:after{content:"⌃⌄";font-size:8px;line-height:7px;width:6px;white-space:pre-wrap;color:rgba(255,255,255,.8)}
.field{padding:3px 8px;border-radius:5px;background:#1c1d22;border:1px solid rgba(255,255,255,.12);font-size:12.5px}
table{width:100%;border-collapse:collapse;background:#2d2e35;border-radius:8px;overflow:hidden}
th{font-weight:500;text-align:left;font-size:12px;color:rgba(235,235,245,.6);padding:5px 10px;background:#33343c}
td{padding:5px 10px;border-top:1px solid rgba(255,255,255,.06)}
.tfoot{display:flex;gap:2px;padding:3px 6px;background:#33343c;color:rgba(235,235,245,.8);border-top:1px solid rgba(255,255,255,.06)}
.tfoot span{width:22px;text-align:center}
.warn{color:#f5b54a}

.step{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid rgba(255,255,255,.07)}
.step:first-of-type{border-top:0}
.ok{color:#5ac46a;font-weight:600}.todo{width:16px;height:16px;border-radius:50%;border:1.5px solid rgba(235,235,245,.4);display:inline-block}
.sub{font-size:11px;color:rgba(235,235,245,.5);margin-top:2px}
.foot{display:flex;justify-content:flex-end;gap:8px;padding:12px 22px;border-top:1px solid rgba(255,255,255,.08)}
[data-act]{cursor:default}
</style><div class="win"><div class="bar"><span class="dot r"></span><span class="dot"></span><span class="dot"></span><span class="title">Apparate</span></div><div class="body" style=""><div style="font-size:15px;font-weight:600;margin-bottom:4px">Set up Apparate</div><div class="step" data-key="spot"><span><span data-when="done" class="ok">✓</span><span data-when="todo" class="todo"></span></span><div><div>Free up ⌘Space</div><div class="sub">Spotlight uses ⌘Space. Turn off its shortcut, then Apparate takes it.</div></div><span><span data-when="todo" class="btn" data-act="spot">Open Keyboard Shortcuts…</span><span data-when="done" class="dim">Done</span></span></div><div class="step" data-key="access"><span><span data-when="done" class="ok">✓</span><span data-when="todo" class="todo"></span></span><div><div>Allow access to Desktop, Documents and Downloads</div><div class="sub">macOS asks once for each folder. ~/Projects needs no permission.</div></div><span><span data-when="todo" class="btn" data-act="access">Allow Access…</span><span data-when="done" class="dim">Done</span></span></div></div><div class="foot"><span class="btn">Choose Folders…</span><span class="btn blue">Done</span></div></div><script>const P=window.fungiPreview||window.grill||{state:{},setState(){}};let st=Object.assign({},P.state||{});
function render(){document.querySelectorAll('[data-key]').forEach(el=>{const done=!!st[el.dataset.key];el.querySelectorAll('[data-when]').forEach(x=>x.style.display=(x.dataset.when==='done')===done?'':'none')});
document.querySelectorAll('[data-page]').forEach(el=>el.style.display=String(st.page||1)===el.dataset.page?'':'none');
const rows=[...document.querySelectorAll('.f3row')];rows.forEach(r=>r.style.background='');const v=rows.find(r=>r.offsetParent);if(v)v.style.background='#3a6fd8';}
document.addEventListener('click',e=>{const a=e.target.closest('[data-act]');if(!a)return;const k=a.dataset.act;
if(k==='next')st.page=(st.page||1)+1;else if(k==='back')st.page=Math.max(1,(st.page||1)-1);else st[k]=true;try{P.setState(st)}catch(_){}render();});render();</script>
