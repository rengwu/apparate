*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;color:#ececf0;

.sep{height:1px;background:rgba(255,255,255,.1)}
.list{flex:1;padding:6px;overflow:hidden}
.row{display:flex;align-items:center;gap:9px;height:28px;padding:0 9px;border-radius:6px}
.row.sel{background:#3a6fd8}
.row .t{flex:none;white-space:nowrap}
.row .s{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:rgba(235,235,245,.45)}
.row.sel .s{color:rgba(255,255,255,.7)}
.row .k{font-size:11px;color:rgba(235,235,245,.45)}.row.sel .k{color:rgba(255,255,255,.8)}
.foot{display:flex;gap:16px;padding:7px 14px;border-top:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(235,235,245,.6);height:29px}
.foot b{font-weight:500;color:rgba(235,235,245,.8);margin-right:4px}

const KORD = {app:0, cmd:1, setting:2, folder:3, file:4, web:5};
const P = window.fungiPreview || window.grill || {state:{}, setState(){}};
DATA.forEach((d, n) => d.id = n);
function words(t){ return t.replace(/([a-z])([A-Z])/g,'$1 $2').toLowerCase().split(/[\s\-_./—,&›]+/).filter(Boolean); }
function acronym(q, ws){
  function rec(qi, wi){
    if (qi === q.length) return true;
    if (wi >= ws.length) return false;
    const w = ws[wi]; let n = 0;
    while (n < w.length && qi + n < q.length && w[n] === q[qi + n]) n++;
    for (let m = n; m >= 1; m--) if (rec(qi + m, wi + 1)) return true;
    return rec(qi, wi + 1);
  }
  return rec(0, 0);
}
function span(q, t){ let j = 0, first = -1, last = -1;
  for (const c of q){ j = t.indexOf(c, j); if (j < 0) return -1; if (first < 0) first = j; last = j; j++; }
  return last - first; }
function score(q, d){
  const t = d.t.toLowerCase(), qq = q.replace(/\s+/g, '');
  if (t === q) return [6, 0];
  if (t.startsWith(q)) return [5, t.length];
  if (acronym(qq, d.w || (d.w = words(d.t)))) return [4, t.length];
  const p = t.indexOf(q); if (p >= 0) return [3, p];
  const s = span(qq, t); if (s >= 0 && s < qq.length * 4) return [2, s];
  if (d.x && d.x.toLowerCase().split(/,\s*/).some(k => k.startsWith(q))) return [1, t.length];
  return null;
}
function highlight(title, q){
  const t = title.toLowerCase(), qq = q.replace(/\s+/g,''); const hit = new Set();
  const p = t.indexOf(q);
  if (q && p >= 0) { for (let i = p; i < p + q.length; i++) hit.add(i); }
  else { let j = 0; for (const c of qq){ j = t.indexOf(c, j); if (j < 0) { hit.clear(); break; } hit.add(j); j++; } }
  let out = ''; [...title].forEach((ch, i) => { const e = ch.replace(/&/g,'&amp;').replace(/</g,'&lt;'); out += hit.has(i) ? '<b>' + e + '</b>' : e; });
  return out;
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }
function search(raw, limit){
  let mode = 'all', q = raw;
  if (raw[0] === "'") { mode = 'files'; q = raw.slice(1); }
  else if (raw[0] === '.') { mode = 'settings'; q = raw.slice(1); }
  else if (raw[0] === '?') { mode = 'web'; q = raw.slice(1); }
  q = q.trim().toLowerCase();
  if (!q) return {mode, q, items: []};
  if (mode === 'web') return {mode, q, items: [webRow(q)]};
  const hits = [];
  for (const d of DATA){
    if (mode === 'files' && d.k !== 'folder' && d.k !== 'file') continue;
    if (mode === 'settings' && d.k !== 'setting') continue;
    const s = score(q, d); if (s) hits.push([s, d]);
  }
  hits.sort((a, b) => b[0][0] - a[0][0] || KORD[a[1].k] - KORD[b[1].k] || a[0][1] - b[0][1] || a[1].t.localeCompare(b[1].t));
  const items = hits.slice(0, limit).map(h => h[1]);
  if (!items.length && mode === 'all') items.push(webRow(q));
  return {mode, q, items};
}
function webRow(q){ return {id: 'web', k: 'web', t: 'Search DuckDuckGo for “' + q + '”', s: 'Opens in your default browser', i: 'web'}; }
function hints(d){
  if (!d) return [];
  if (d.k === 'web') return [['↩', 'Search']];
  if (d.k === 'cmd' && d.t === 'Restart') return [['↩', armed ? 'Restart' : 'Restart…']];
  if (d.k === 'folder' || d.k === 'file') return [['↩', 'Open'], ['⌘↩', 'Reveal in Finder'], ['⌘C', 'Copy path']];
  return [['↩', 'Open']];
}
let query = '', results = {items: []}, sel = 0, selId = null, armed = false, statusMsg = '', statusTimer = null;
function flash(msg){ statusMsg = msg; clearTimeout(statusTimer); statusTimer = setTimeout(() => { statusMsg = ''; draw(); }, 1800); draw(); }
function where(d){ return d.k === 'setting' ? (d.s === 'System Settings' ? 'System Settings' : 'System Settings › ' + d.s) : d.s; }
function act(d, how){
  if (!d) return;
  if (how === 'reveal') { if (d.k === 'folder' || d.k === 'file') flash('Revealed in Finder: ' + d.s + '/' + d.t); return; }
  if (how === 'copy') { if (d.k === 'folder' || d.k === 'file') flash('Copied ' + d.s + '/' + d.t); return; }
  if (d.k === 'web') return flash('Opened DuckDuckGo in your browser');
  if (d.k === 'cmd' && d.t === 'Restart' && !armed) { armed = true; return draw(); }
  if (d.k === 'cmd') { armed = false; return flash(d.t + ' (simulated)'); }
  if (d.k === 'setting') return flash('Opened ' + (d.s === 'System Settings' ? 'System Settings › ' + d.t : 'System Settings › ' + d.s + ' › ' + d.t));
  if (d.k === 'folder' || d.k === 'file') return flash('Opened ' + d.s + '/' + d.t);
  flash('Opened ' + d.t);
}
function update(){
  results = search(query, LIMIT);
  const keep = results.items.findIndex(d => d.id === selId);
  sel = keep >= 0 ? keep : 0; selId = results.items[sel] ? results.items[sel].id : null; armed = false;
  try { P.setState({query}); } catch (e) {}
  draw();
}
function move(n){ if (!results.items.length) return; sel = (sel + n + results.items.length) % results.items.length; selId = results.items[sel].id; armed = false; draw(); }
function bind(input){
  input.addEventListener('input', () => { query = input.value; update(); });
  input.addEventListener('keydown', e => {
    if (e.key === 'ArrowDown') { e.preventDefault(); move(1); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); move(-1); }
    else if (e.key === 'Enter') { e.preventDefault(); act(results.items[sel], e.metaKey ? 'reveal' : 'open'); }
    else if (e.key === 'Escape') { e.preventDefault(); if (query) { input.value = query = ''; update(); } else flash('The panel would close'); }
    else if (e.metaKey && e.key.toLowerCase() === 'c' && !window.getSelection().toString()) { e.preventDefault(); act(results.items[sel], 'copy'); }
    else if (e.metaKey && /^[1-9]$/.test(e.key)) { e.preventDefault(); const d = results.items[+e.key - 1]; if (d) { sel = +e.key - 1; selId = d.id; act(d, 'open'); } }
  });
  document.addEventListener('mousedown', e => { if (e.target !== input) { setTimeout(() => input.focus(), 0); } });
  const s = P.state || {};
  if (s.query) { input.value = query = s.query; }
  update(); input.focus();
}

const list = document.querySelector('.list'), foot = document.querySelector('.foot');
function draw(){
  list.innerHTML = results.items.map((d, n) => {
    const sub = d.k === 'app' ? '' : (armed && n === sel && d.t === 'Restart' ? 'Press Return again to restart' : where(d));
    return '<div class="row' + (n === sel ? ' sel' : '') + '" data-n="' + n + '"><img class="ic" width="18" height="18" src="' + ICONS[d.i] + '"><span class="t">' + esc(d.t) + '</span><span class="s">' + esc(sub) + '</span><span class="k mono">' + (n < 9 ? '⌘' + (n + 1) : '') + '</span></div>';
  }).join('');
  foot.innerHTML = statusMsg ? esc(statusMsg) : hints(results.items[sel]).map(h => '<span><b>' + h[0] + '</b>' + h[1] + '</span>').join('');
}
list.addEventListener('click', e => { const r = e.target.closest('.row'); if (r) { sel = +r.dataset.n; selId = results.items[sel].id; act(results.items[sel], 'open'); } });
bind(document.querySelector('input'));
</script>
