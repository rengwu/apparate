does not prove settings items are absent from every Spotlight store (narrowed after review). The `.searchTerms` files are a catalog that can be read directly, so Apparate should read them itself. They change only on OS updates, so cache them and re-read when the Extensions folder's modification date changes (Tinycast's approach for panes).\n\n**Opening them:**\n\n- A pane opens with `x-apple.systempreferences:\u003cbundle id>`. That much is verified as the documented community form, and the Keyboard extension declares `allowsXAppleSystemPreferencesURLScheme`.\n- A sub-item likely opens with `x-apple.systempreferences:\u003cbundle id>?\u003canchor>`. Whether the `.searchTerms` group keys are valid anchors is **unverified**. Some (`CustomizeModifierKeys`, `TextReplacements`, `CapsLockInputSources`) appear as literal strings in the Keyboard extension binary; others (`InputSources`, `FunctionKeys`) do not.\n- Plan a spike: for each entry, try the anchor URL and observe whether the right section opens. Where no anchor works, fall back to opening the pane.\n- Community anchor lists (bvanpeski/SystemPreferences, rmcdongit gist) cover older pane IDs and are not authoritative.\n\n**Open-source comparison (verified, source):** Tinycast lists panes only (`SettingsPaneScanner`, with name and icon overrides for broken bundles). Sol lists legacy `.prefPane` bundles with a hard-coded name map. Neither offers sub-items, so this is a real gap Apparate can fill.\n\n## Fuzzy matching and ranking\n\n| Algorithm | Notes |\n| --- | --- |\n| fzf v1 / v2 | v1 greedy, v2 Smith-Waterman-style DP with boundary bonuses; the standard for terminals |\n| fzy | DP with consecutive/word/camel/dot bonuses and gap penalties; simple, good quality; used in the benchmark |\n| Quicksilver `QSSense` | Recursive abbreviation scorer with transliteration fallback; origin of many launcher scorers |\n| Tinycast `LauncherMatch` | DP alignment: word start 3 points, first char 4, others 2, gap −1; camel humps precomputed; rough-subsequence pre-check; three sensitivity thresholds (verified, source) |\n| Flow Launcher `StringMatcher` | Separate acronym pass (index 0, after space, uppercase, digit groups: `vs19` → Visual Studio 2019) plus substring fuzzy (verified, source) |\n| fuse.js (Kunkun, Ueli option, some Sol lists) / fuzzysort (Ueli default) / MiniSearch (Sol root search) | JS libraries; fuse.js is Bitap-based and tolerates typos, but its acronym ranking is weak (expected from its design, not measured here) |\n| Alfred / Raycast | Alfred matches apps by capital letters or from any word boundary (docs). Raycast: \"Fuzzy search means you don't need an exact match\" (`msg` → Messages), sensitivity setting, frecency per query (manual) |\n\nMeasured on this machine (see [benchmark](benchmark.md)): an fzy-style scorer over pre-folded bytes with a 64-bit character bitmask prefilter and bounded top-50 selection.\n\n- 20k candidates: 0.13 ms mean, 0.49 ms slowest keystroke on one thread.\n- 200k candidates: 1.30 ms mean, 5.2 ms slowest keystroke on one thread; 0.29 ms mean, 1.0 ms slowest on 10 threads.\n- \"Slowest keystroke\" is the maximum over keystrokes of each keystroke's best of 7 runs, not an observed worst case or p95. Re-run after review with a checksum over the selected top-K IDs, so the selection cannot be optimised away; results were unchanged within noise.\n- These numbers are not directly comparable with Codex's (different corpus, queries, and statistics). Codex also measured full-path scoring at 200k: about 44 ms median, up to 81 ms. Name-first matching is therefore required, with a separate path mode.\n- `vsc` → Visual Studio Code ranks first with no special acronym code, because word-start bonuses dominate.\n\nRanking recommendation:\n\n1. **Tiers first, score second:** exact alias > alias prefix > exact name > name prefix > word-start/acronym > fuzzy. This matches Raycast's documented order and Sol's relevance-tier-before-usage behaviour.\n2. **Kind priority within a tier:** apps > settings > folders > files by default (configurable). Without it, `term` ranks two files above Terminal (measured).\n3. **Frecency** keyed by the query typed. Tinycast adds 100 per open, halves every 10 days, floors at 1, and stores the last few query terms per entry. Raycast tracks frecency per query. Frecency should reorder within a tier, never lift a weak fuzzy hit above an exact match.\n4. **Deterministic ties:** shorter name, then a stable ID. Keep the selected item selected if it is still in the new list.\n\n## Recommended architecture\n\n- **Language/UI:** Swift 6 + AppKit for the panel, text field and results list (`NSTableView`, fixed row height, view reuse). SwiftUI is acceptable for the settings window. Reason: deterministic control over first draw and keyboard handling (Raycast v1's stated reason). Tinycast shows SwiftUI-in-NSPanel can work, but with a lot of workaround code.\n- **Process model:** one agent process (`LSUIElement`) launched at login with `SMAppService`. Optionally run the initial file crawl in a short-lived helper process, as Tinycast does, so peak crawl memory is returned to the OS. That is worth it only if measured peak memory is large.\n- **Providers:** each source returns entries into one in-memory table of folded byte strings with kind, ID, display name, alternate names, and icon key.\n  - **Apps:** scan the standard app folders and watch them with FSEvents.\n  - **Settings:** parse panes and `.searchTerms`, cached by the Extensions folder's modification date.\n  - **Files:** user-selected roots only. Crawl on a background queue with ignore rules (`.gitignore`, `node_modules`, caches, hidden items by default). Persist a compact snapshot plus the last FSEvents event ID; replay on launch.\n- **Query path (changed after review):**\n  1. The main thread parses the prefix and hands the query, with an increasing generation number, to one serial search worker.\n  2. The worker matches against an immutable snapshot of the scope, then tiers, ranks and takes the top K.\n  3. The main thread publishes the complete list in one reload, only if the generation is still current, so a late result for `v` never overwrites `vsc`.\n\n  At the measured costs this normally lands within the same frame. Typing is never blocked, even at 200k candidates or when an index update is running. The first version ran the match synchronously on the main thread. Codex argued, and I agree, that atomic publication alone gives the stability, without risking a blocked keystroke. Split across cores only if measurement shows a need; energy use of parallel scoring was not measured.\n- **Prefix commands:** a small table in config mapping a leading character to a scope, e.g. `'` → files and folders, `.` → settings, `>` → commands, `=` → calculator. An escape such as a doubled prefix searches the literal character.\n- **Config:** one versioned JSON file (`Codable`, no dependency) in Application Support or `~/.config/apparate/`, watched for changes. It holds the hotkey, file roots, ignore patterns, prefixes, aliases and kind order. The user asked for prefixes \"configured in settings\". Whether that means a settings window or a config file is for the user to decide (raised in review).\n- **Budgets** (aspirational targets, none measured on a real build):\n  - Hotkey to visible panel: ≤ 1 frame (~16 ms).\n  - Keystroke to updated results: ≤ 8 ms at 20k candidates.\n  - Idle CPU: 0%.\n  - Idle memory: ≤ 40 MB with a 20k-entry index loaded. The bare shell measured 18 MB without icons, index structures or drawing; count any helper processes too.\n\n## Additional feature suggestions\n\nPriority 1 is small, fits a minimal launcher, and is common to Alfred, Raycast and LaunchBar:\n\n1. **Aliases** (`vsc` → VS Code) and learned ranking. Ranking gets better with use at almost no cost.\n2. **Actions on a result:** Reveal in Finder, Copy path, Quick Look, Open with…, Show info. Without these, file search is half useful.\n3. **Inline calculator and unit/currency conversion.** Saves opening an app; no index needed.\n4. **Quicklinks / web search with a template** (`gh apparate` → GitHub search). The fallback when nothing local matches.\n5. **Running-app commands:** switch to, hide, quit, force quit.\n6. **System commands:** lock screen, sleep, restart, empty Trash, toggle dark mode, eject disks.\n\nPriority 2 is useful but costs more:\n\n7. **Script commands:** run a user's shell script with a title and an optional argument. Unlimited extension with no plugin runtime.\n8. **Recent files and folders** when the query is empty, from the file index's modification dates.\n9. **Browser bookmarks and history search.** Each browser has a different format.\n10. **Emoji and symbol picker.**\n\nNot recommended initially:\n\n- Clipboard history: Spotlight in macOS 26+ already has it.\n- Snippets/text expansion: needs an Accessibility event tap.\n- Extension store, AI chat, window management, notes. Each multiplies footprint and scope.\n\n## Risks and open questions\n\nRisks:\n\n- **Settings sub-item anchors** may not open the exact section; `.searchTerms` is an undocumented format that can change with macOS releases. Mitigation: prototype spike, then fallback to the pane.\n- **TCC prompts** for Desktop, Documents and Downloads, and the Full Disk Access trade-off for broader roots.\n- **⌘Space** conflicts with Spotlight until the user disables Spotlight's shortcut.\n- **Development signing:** without Xcode, builds are scripted; ad-hoc signing resets privacy grants on every rebuild.\n\nDecisions for the user:\n\n1. UI stack: AppKit (recommended) vs SwiftUI.\n2. File search engine: own index (recommended) vs Spotlight queries vs own index for names plus Spotlight for an explicit content search.\n3. Default file roots and ignore rules.\n4. Hotkey: replace ⌘Space, or another chord.\n5. Config: file only first (recommended) vs settings UI from the start.\n6. Which additional features belong in v1.\n7. Distribution: personal use only, or public (Developer ID and notarization).\n8. Default kind order (apps > settings > folders > files?).\n\n## Corrections after review\n\nCodex reviewed this report on 2026-11-18, after both reports were complete. Changes made in response, marked inline:\n\n1. Spotlight's slowness: the suspected causes are now labelled inference, since neither report profiled Spotlight.\n2. \"No per-keystroke IPC\" was too broad. Flow Launcher → Everything is a fast cross-process counterexample. Reworded to predictable latency and one complete result set.\n3. Raycast 2.0's indexer follows \"file system events\"; the specific FSEvents API is inference.\n4. Sol's file search uses `NSString.scoreAgainst` and an alphabetical sort, not fuse.js. Its root search uses MiniSearch. Verified in source at `873ae1c`.\n5. Query path changed from synchronous main-thread search to a serial worker with generation numbers and atomic publication.\n6. Benchmark \"worst\" relabelled as the maximum of per-keystroke best-of-7 runs. Re-run with a checksum over the top-K selection; unchanged.\n7. Settings counts: 41 files / 688 entries in ExtensionKit, plus 1 legacy prefPane file / 3 entries, for 42 / 691.\n8. The ad-hoc signing and TCC claim is now stated as reported, not tested. Added `NSOpenPanel` and security-scoped bookmarks, and dataless iCloud files.\n9. Budgets labelled aspirational, with corpus size stated. Config-file-only is no longer presented as settled, because the user said prefixes are configured \"in settings\".\n10. After Codex's alignment review: the opening summary no longer suggests our scorer measures Spotlight. The `mdfind` result is narrowed to what that one query shows.\n\nNot changed: the recommendation itself (Swift + AppKit, own name index, fzy-style tiers with frecency, settings from `.searchTerms`). Codex's review agreed with it.\n\n## Sources\n\n- Raycast: [A technical deep dive into the new Raycast](https://www.raycast.com/blog/a-technical-deep-dive-into-the-new-raycast) (May 2026); [File Search manual](https://manual.raycast.com/file-search); [Search Bar manual](https://manual.raycast.com/search-bar); [Spotlight troubleshooting](https://manual.raycast.com/troubleshooting/spotlight)\n- Alfred: [Indexing troubleshooting](https://alfredapp.com/help/troubleshooting/indexing); [Can Alfred work without Spotlight?](https://www.alfredapp.com/help/troubleshooting/indexing/spotlight/); [Default results](https://www.alfredapp.com/help/features/default-results/)\n- LaunchBar: [Indexing rules](https://obdev.at/resources/launchbar/help/IndexingRules.html); [Index window](https://obdev.at/resources/launchbar/help/IndexWindow.html)\n- Spotlight in macOS 26: [MacRumors](https://www.macrumors.com/2025/06/09/apple-supercharges-spotlight-in-macos-tahoe-with-quick-keys-and-more/); [TechCrunch](https://techcrunch.com/2025/06/09/apple-updates-spotlight-to-take-actions-on-your-mac/); slowness reports: [Six Colors](https://sixcolors.com/?p=39502), [Apple Community](https://discussions.apple.com/thread/256313638?page=1)\n- Source code read (shallow clones, 2026-11-18): [Sol](https://github.com/ospfranco/sol) `873ae1c`; [Tinycast](https://github.com/abue-ammar/tinycast) `99d1d17`; [Ueli](https://github.com/oliverschwendener/ueli) `9410429`; [Albert](https://github.com/albertlauncher/albert) `c703546`; [Flow Launcher](https://github.com/Flow-Launcher/Flow.Launcher) `58b7997`; [Kunkun](https://github.com/kunkunsh/kunkun) `d4383c5`; [Quicksilver](https://github.com/quicksilver/Quicksilver) `12d7543`; [fsearch](https://github.com/cboxdoerfer/fsearch) `74295de`\n- Everything: [voidtools FAQ](https://www.voidtools.com/faq/); plocate: [plocate.sesse.net](https://plocate.sesse.net/)\n- Filesystem: [FSEvents programming guide](https://developer.apple.com/library/mac/documentation/Darwin/Conceptual/FSEvents_ProgGuide/UsingtheFSEventsFramework/UsingtheFSEventsFramework.html); [readdir vs getattrlistbulk thread](https://lists.apple.com/archives/filesystem-dev/2019/Apr/msg00005.html); [Tempelmann 2019](https://blog.tempel.org/2019/04/); [mjtsai summary](https://mjtsai.com/blog/2019/04/22/performance-considerations-when-reading-directories-on-macos)\n- Settings deep links (community, not authoritative): [Apple developer forums](https://developer.apple.com/forums/thread/709289); [bvanpeski/SystemPreferences](https://github.com/bvanpeski/SystemPreferences/blob/main/macos_preferencepanes-Ventura.md)\n- Measured on this Mac: app/settings/file counts, `mdfind` timings, home walk, matching benchmark, idle footprint ([benchmark](benchmark.md)).\n","toc":[{"id":"summary","title":"Summary","depth":2},{"id":"how-existing-launchers-are-fast","title":"How existing launchers are fast","depth":2},{"id":"how-they-index-apps-and-files","title":"How they index apps and files","depth":2},{"id":"macos-platform","title":"macOS platform","depth":2},{"id":"system-settings-items","title":"System Settings items","depth":2},{"id":"fuzzy-matching-and-ranking","title":"Fuzzy matching and ranking","depth":2},{"id":"recommended-architecture","title":"Recommended architecture","depth":2},{"id":"additional-feature-suggestions","title":"Additional feature suggestions","depth":2},{"id":"risks-and-open-questions","title":"Risks and open questions","depth":2},{"id":"corrections-after-review","title":"Corrections after review","depth":2},{"id":"sources","title":"Sources","depth":2}],"titleAnchor":"claude-research-report","links":["research/claude/benchmark","research/claude/benchmark","research/claude/benchmark"],"attachments":[],"html":"\u003cp>Claude's independent research for Apparate, written in parallel with Codex's report. The two are compared in the alignment page. Confidence labels: \u003cstrong>verified\u003c/strong> means read in source code or official docs, or measured on this machine. \u003cstrong>Unverified\u003c/strong> means a secondary source or inference.\u003c/p>\n\u003cp>Supporting page: \u003ca href=\"#/research/claude/benchmark\">matching benchmark\u003c/a> (method, numbers, and source).\u003c/p>\n\u003ch2 id=\"summary\">Summary\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Our own scorer is cheap; Spotlight was not measured.\u003c/strong> A Swift fzy-style scorer matches ~20k names in about 0.13 ms per keystroke on this Mac (verified, measured). That does not measure Spotlight's matching, and Spotlight's pipeline was not profiled. Suspected causes are the per-keystroke query to a system daemon and the merge of results that arrive asynchronously from several providers. That is \u003cstrong>inference\u003c/strong> (corrected after review; the first version stated it as fact).\u003c/li>\n\u003cli>\u003cstrong>The fast launchers prepare what they search before the user types, and keep the window alive.\u003c/strong> How they get results varies. Alfred queries the Spotlight index for files (verified, Alfred docs). Flow Launcher calls Everything over IPC. Raycast 2.0 moved file search off Spotlight to its own Rust indexer that follows \"file system events\" (verified, Raycast blog, May 2026; that it uses the FSEvents API specifically is inference). LaunchBar keeps its own rule-based index (verified, docs). Tinycast builds a memory-mapped index with \u003ccode>getattrlistbulk\u003c/code> and FSEvents (verified, source). Cross-process calls are not slow in themselves; what matters is predictable latency and publishing one complete result set (corrected after review).\u003c/li>\n\u003cli>\u003cstrong>Apparate's data is small.\u003c/strong> 336 app bundles, 688 settings items, and ~22k files and folders in the home folder outside Library (verified, measured). That fits in a few MB of memory, and a full scan takes well under a second.\u003c/li>\n\u003cli>\u003cstrong>System Settings sub-items come from \u003ccode>.searchTerms\u003c/code> plists\u003c/strong> inside each settings extension. On macOS 27, in English, the ExtensionKit extensions hold 41 files with 688 entries. One legacy \u003ccode>DateAndTime.prefPane\u003c/code> file adds 3 more, for 42/691 (verified, on disk; scope clarified after review). The tested \u003ccode>mdfind\u003c/code> query did not find them, and none of the open-source launchers reviewed (Sol, Tinycast) reads them. Opening a specific sub-item via URL anchor is \u003cstrong>unverified\u003c/strong> and needs a prototype spike.\u003c/li>\n\u003cli>\u003cstrong>Recommended stack:\u003c/strong> a single-process Swift + AppKit agent app with a pre-built, hidden, non-activating \u003ccode>NSPanel\u003c/code>. Use a Carbon global hotkey, an in-memory index, and an fzy-style scorer with a bitmask prefilter and tiered ranking with frecency. A minimal shell of this kind measured 18 MB idle (verified, measured), against Raycast's 200–450 MB.\u003c/li>\n\u003cli>\u003cstrong>\"No shifting results\" is a design rule, not an optimisation.\u003c/strong> All local sources are computed in one synchronous pass before drawing. Nothing is appended after the first draw. Ties break deterministically, rows have a fixed height, and icons are pre-cached with same-size placeholders.\u003c/li>\n\u003cli>\u003cstrong>Main risks:\u003c/strong> deep-link anchors for settings sub-items; privacy prompts (TCC) for Desktop, Documents and Downloads; replacing ⌘Space requires disabling Spotlight's shortcut. Building without full Xcode works (Swift 6.4 Command Line Tools). It is commonly reported, but not tested here, that ad-hoc signed rebuilds lose their TCC grants.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"how-existing-launchers-are-fast\">How existing launchers are fast\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Launcher\u003c/th>\n\u003cth>Stack\u003c/th>\n\u003cth>Why it feels fast\u003c/th>\n\u003cth>Footprint\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Raycast v1\u003c/td>\n\u003ctd>Swift + AppKit, custom list rows; avoided SwiftUI \"for performance and control\"\u003c/td>\n\u003ctd>Native rendering, own keyboard handling, windows kept in memory\u003c/td>\n\u003ctd>~200–300 MB (Raycast blog)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Raycast 2.0 (2026)\u003c/td>\n\u003ctd>AppKit shell + WKWebView (React) + Node backend + Rust core\u003c/td>\n\u003ctd>Windows shown at \u003ccode>alphaValue = 0\u003c/code>, render forced in \u003ccode>requestAnimationFrame\u003c/code>, then revealed; WebKit occlusion throttling disabled; emoji font pre-warmed\u003c/td>\n\u003ctd>~350–450 MB (Raycast blog, \u003ccode>phys_footprint\u003c/code>)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Alfred\u003c/td>\n\u003ctd>Native Objective-C/Cocoa (secondary sources)\u003c/td>\n\u003ctd>Small native app; apps and preferences in default results; files via the Spotlight metadata index\u003c/td>\n\u003ctd>Vendor/secondary claims of 20–50 MB, unverified\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>LaunchBar\u003c/td>\n\u003ctd>Native\u003c/td>\n\u003ctd>Own index built from user-defined indexing rules; abbreviation learning\u003c/td>\n\u003ctd>Not found\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Spotlight (macOS 26/27)\u003c/td>\n\u003ctd>System UI + \u003ccode>mds\u003c/code>/\u003ccode>corespotlightd\u003c/code>\u003c/td>\n\u003ctd>Same index as everything else; now also actions, Quick Keys, clipboard history\u003c/td>\n\u003ctd>User reports of slowness and lag on 26.x (Six Colors, Apple Community; unverified as to cause)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tinycast (open source, AGPL)\u003c/td>\n\u003ctd>Swift 6, SwiftUI inside AppKit \u003ccode>NSPanel\u003c/code>s, no dependencies\u003c/td>\n\u003ctd>Folds text once per index change, never per keystroke; ranking cached per query; file crawl in a helper process\u003c/td>\n\u003ctd>Not measured; codebase is ~182k lines of Swift despite the name\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sol (open source)\u003c/td>\n\u003ctd>React Native macOS UI + Swift native modules\u003c/td>\n\u003ctd>Persistent non-activating \u003ccode>NSPanel\u003c/code>; app list in memory\u003c/td>\n\u003ctd>Not measured\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Quicksilver (open source, still maintained)\u003c/td>\n\u003ctd>Objective-C\u003c/td>\n\u003ctd>\"Catalog\" of sources rescanned periodically; \u003ccode>QSSense\u003c/code> abbreviation scorer (origin of many launcher scorers)\u003c/td>\n\u003ctd>Not measured\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ueli, Kunkun\u003c/td>\n\u003ctd>Electron / Tauri + web UI\u003c/td>\n\u003ctd>fuzzysort or fuse.js in JS\u003c/td>\n\u003ctd>Larger web-runtime baseline (not measured)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Flow Launcher (Windows)\u003c/td>\n\u003ctd>C#/WPF\u003c/td>\n\u003ctd>Delegates file search to Everything over IPC; own acronym matcher\u003c/td>\n\u003ctd>Not measured\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Common factors in the fast ones (verified across the sources above):\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>The window already exists.\u003c/strong> Sol, Tinycast and Raycast keep the launcher window alive and only order it front. Sol and Tinycast use \u003ccode>NSPanel\u003c/code> with \u003ccode>.nonactivatingPanel\u003c/code> (verified, source). The launcher can take keyboard focus without activating its app, so the hotkey-to-visible path skips app activation.\u003c/li>\n\u003cli>\u003cstrong>The search set is in-process memory.\u003c/strong> Apps, commands and settings are lists in memory. Text is folded once when the list changes (Tinycast: \"Folded once per index change, never per keystroke\").\u003c/li>\n\u003cli>\u003cstrong>Results come from a source with predictable latency.\u003c/strong> For most, that is in-process memory. Flow Launcher's file results come from Everything over IPC, which shows a cross-process call can be fast (corrected after review). Alfred's file results depend on Spotlight's health; its own troubleshooting docs say it can find only what Spotlight has indexed.\u003c/li>\n\u003cli>\u003cstrong>Ranking is cached and learned.\u003c/strong> Tinycast caches ranking per query and learns per-term usage. Raycast documents the order: exact alias &gt; alias prefix &gt; title fuzzy score &gt; subtitle/keyword &gt; frecency.\u003c/li>\n\u003c/ol>\n\u003cp>Why Spotlight is slow and shifts (partly \u003cstrong>inference\u003c/strong>): every keystroke is a query to a system daemon, and results stream in from several providers (files, apps, settings, suggestions, actions) that finish at different times. Since macOS 26 it also does more work per query (App Intents actions, Quick Keys, clipboard). The user reports cited above describe waits when launching apps; I found no Apple statement of cause.\u003c/p>\n\u003ch2 id=\"how-they-index-apps-and-files\">How they index apps and files\u003c/h2>\n\u003cp>\u003cstrong>Apps\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Scan the standard folders and watch them with FSEvents: \u003ccode>/Applications\u003c/code>, \u003ccode>/System/Applications\u003c/code> (+ \u003ccode>Utilities\u003c/code>), \u003ccode>~/Applications\u003c/code>, \u003ccode>/System/Library/CoreServices/Applications\u003c/code>, plus fixed extras such as \u003ccode>Finder.app\u003c/code> (Sol, verified source). Sol scans to depth 4 and keeps an ignore list. Tinycast re-scans on every open and notes that \"LaunchServices can trail a deletion by seconds.\"\u003c/li>\n\u003cli>An alternative is a one-time \u003ccode>mdfind kMDItemContentType == \"com.apple.application-bundle\"\u003c/code> for apps outside those folders. It returned 336 unique names in 66 ms here, but it includes helper apps buried in Application Support that need filtering (verified, measured).\u003c/li>\n\u003cli>Names: use the localized display name, plus alternate names (\u003ccode>CFBundleAlternateNames\u003c/code>, Spotlight keywords). Raycast documents \u003ccode>iCal\u003c/code> → Calendar; Tinycast ranks alternate titles like the name.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Files\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Approach\u003c/th>\n\u003cth>Used by\u003c/th>\n\u003cth>Pros\u003c/th>\n\u003cth>Cons\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Query Spotlight (\u003ccode>MDQuery\u003c/code>/\u003ccode>NSMetadataQuery\u003c/code>) per keystroke\u003c/td>\n\u003ctd>Alfred, Raycast v1, Ueli (apps, via \u003ccode>mdfind\u003c/code>)\u003c/td>\n\u003ctd>No index to maintain; content search possible\u003c/td>\n\u003ctd>66–153 ms per query here (\u003ccode>mdfind\u003c/code>, includes process start); results async; only finds what Spotlight indexed; inherits Spotlight's problems\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Own name index + file system events\u003c/td>\n\u003ctd>Raycast 2.0 (Rust, separate process; FSEvents API not named), Tinycast, Sol (SQLite)\u003c/td>\n\u003ctd>Synchronous, predictable, works when Spotlight is broken; scope and ignore rules under our control\u003c/td>\n\u003ctd>Must handle crawl, permissions, persistence, change replay\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Own rule-based index, rebuilt on schedule\u003c/td>\n\u003ctd>LaunchBar, Quicksilver\u003c/td>\n\u003ctd>Simple\u003c/td>\n\u003ctd>Stale between rebuilds\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Reference designs (other OSes)\u003c/td>\n\u003ctd>Everything (NTFS MFT + USN journal), plocate (trigram posting lists)\u003c/td>\n\u003ctd>Everything: ~250k files in ~5 s and ~35 MB RAM; 1M files ~100 MB (voidtools FAQ). plocate: 27M files searched in 8 ms (plocate site)\u003c/td>\n\u003ctd>Not macOS; Apparate's scale (~10⁴–10⁵) doesn't need trigram indexes\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Notable implementation details (verified, source):\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Tinycast:\u003c/strong> crawls with \u003ccode>getattrlistbulk\u003c/code> (\"one call lists hundreds of entries with their mtime, so nothing is stat'd\"). The crawl runs in a separate helper process \"so its memory leaves when that process exits.\" The index is memory-mapped \"so searches answer even while a rebuild runs.\" FSEvents replays from the snapshot's own event ID, and it rebuilds on \u003ccode>RootChanged\u003c/code> or \u003ccode>EventIdsWrapped\u003c/code>. Searches run in parallel across cores, and changes are applied as an overlay until a rebuild is cheaper.\u003c/li>\n\u003cli>\u003cstrong>Sol:\u003c/strong> stores files in SQLite, but its search query is \u003ccode>SELECT path, name, is_folder FROM files LIMIT 1000\u003c/code>. It then scores with \u003ccode>NSString.scoreAgainst\u003c/code> (threshold 0.5) and sorts alphabetically. Only the first 1,000 rows are ever matched, so it is not a correct full-corpus design. (Corrected after review: the first version said fuse.js. Sol's root app/command search uses MiniSearch in \u003ccode>src/stores/ui.store.tsx\u003c/code>.)\u003c/li>\n\u003cli>\u003cstrong>Raycast 2.0:\u003c/strong> name-only by default, with \u003ccode>.gitignore\u003c/code>/\u003ccode>.ignore\u003c/code>/\u003ccode>.rayignore\u003c/code> support, built-in noise filters (\u003ccode>node_modules\u003c/code>, caches), and default scope = home folder + \u003ccode>/Applications\u003c/code>. Content search is delegated to the OS index (verified, manual).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"macos-platform\">macOS platform\u003c/h2>\n\u003cp>\u003cstrong>File indexing primitives\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>FSEvents\u003c/strong> (verified, Apple docs and Tinycast source): use \u003ccode>kFSEventStreamCreateFlagFileEvents\u003c/code> for per-file events. Persist the last event ID, and on next launch pass it as \u003ccode>sinceWhen\u003c/code> to replay changes made while the app was not running (the macOS analogue of Everything's USN journal). Handle \u003ccode>MustScanSubDirs\u003c/code>, \u003ccode>RootChanged\u003c/code>, and \u003ccode>EventIdsWrapped\u003c/code> by rescanning.\u003c/li>\n\u003cli>\u003cstrong>Directory enumeration:\u003c/strong> Apple's Jim Luther (filesystem-dev, 2019) said \u003ccode>readdir\u003c/code> is fastest for names only and \u003ccode>getattrlistbulk\u003c/code> wins when attributes are needed. Tempelmann's 2019 tests favour \u003ccode>fts\u003c/code> on APFS. Tinycast uses \u003ccode>getattrlistbulk\u003c/code>. A pruned walk of this home folder (22k entries) took 0.6 s with \u003ccode>find\u003c/code>. That is cold-path work done once, so the choice matters little at this scale (measured).\u003c/li>\n\u003cli>\u003cstrong>Spotlight queries:\u003c/strong> \u003ccode>NSMetadataQuery\u003c/code>/\u003ccode>MDQuery\u003c/code> are fine for occasional or optional searches (file contents, \"search whole disk\"), not for the per-keystroke path.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Privacy (TCC)\u003c/strong> (verified, Raycast manual and Tinycast source; behaviour well documented): a non-sandboxed app reading Desktop, Documents, Downloads, iCloud Drive, removable or network volumes gets a per-folder consent prompt. Full Disk Access covers all of them and can be revoked at any time without notice. Tinycast re-checks it for that reason. Let the user pick roots with \u003ccode>NSOpenPanel\u003c/code>; a sandboxed build would also need security-scoped bookmarks (added after review). Folder consent and sandbox access are separate mechanisms. TCC ties grants to the app's code signature; it is commonly reported, not tested here, that ad-hoc signed rebuilds lose their grants. A stable self-signed certificate for development avoids the question. Also avoid reading dataless iCloud files, which can trigger downloads (Codex's point).\u003c/p>\n\u003cp>\u003cstrong>Global hotkey:\u003c/strong> Carbon \u003ccode>RegisterEventHotKey\u003c/code> needs no permission prompt and is what Tinycast's \u003ccode>HotKeyCenter\u003c/code> uses (verified, source). \u003ccode>CGEventTap\u003c/code> (used by Sol) needs Accessibility/Input Monitoring permission and is only required for things like double-tap modifiers or hyper keys. ⌘Space works only after the user disables Spotlight's shortcut in Keyboard settings.\u003c/p>\n\u003cp>\u003cstrong>Window strategy:\u003c/strong> create the \u003ccode>NSPanel\u003c/code> at launch with \u003ccode>.nonactivatingPanel\u003c/code> and \u003ccode>canBecomeKey = true\u003c/code>. Pin it across Spaces (\u003ccode>.canJoinAllSpaces\u003c/code>, \u003ccode>.fullScreenAuxiliary\u003c/code>) at \u003ccode>.floating\u003c/code> level and hide it on \u003ccode>windowDidResignKey\u003c/code> (Sol, verified source). Showing it is then \u003ccode>makeKeyAndOrderFront\u003c/code>. Run as an agent app (\u003ccode>LSUIElement\u003c/code>, accessory activation policy) with no Dock icon.\u003c/p>\n\u003cp>\u003cstrong>Icons:\u003c/strong> \u003ccode>NSWorkspace.icon(forFile:)\u003c/code> for apps and files; cache by path and modification date (Tinycast keys app icons on bundle icon changes). Settings panes have icons declared as \u003ccode>ISGraphicIconConfiguration\u003c/code> / content types such as \u003ccode>com.apple.graphic-icon.keyboard\u003c/code>. Tinycast loads these as content-type icons, i.e. \u003ccode>NSWorkspace.icon(for: UTType)\u003c/code> (verified, source).\u003c/p>\n\u003cp>\u003cstrong>Launching:\u003c/strong> \u003ccode>NSWorkspace.openApplication(at:configuration:)\u003c/code> for apps, and \u003ccode>NSWorkspace.open(_:)\u003c/code> for files, folders and \u003ccode>x-apple.systempreferences:\u003c/code> URLs.\u003c/p>\n\u003cp>\u003cstrong>Toolchain on this machine:\u003c/strong> Swift 6.4.2 with Command Line Tools only, no Xcode (verified). SwiftPM can build the executable. The \u003ccode>.app\u003c/code> bundle (Info.plist with \u003ccode>LSUIElement\u003c/code>) and code signing are a small script.\u003c/p>\n\u003ch2 id=\"system-settings-items\">System Settings items\u003c/h2>\n\u003cp>\u003cstrong>Data source (verified, on disk):\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Settings panes are ExtensionKit extensions in \u003ccode>/System/Library/ExtensionKit/Extensions/*.appex\u003c/code> whose \u003ccode>Info.plist\u003c/code> has \u003ccode>EXAppExtensionAttributes.EXExtensionPointIdentifier = com.apple.Settings.extension.ui\u003c/code> (52 on this Mac). Legacy \u003ccode>.prefPane\u003c/code> bundles still exist in \u003ccode>/System/Library/PreferencePanes\u003c/code> (40) and in \u003ccode>/Library/PreferencePanes\u003c/code> for third-party panes.\u003c/li>\n\u003cli>Each pane names its search file in \u003ccode>SettingsExtensionAttributes.searchTermsFileName\u003c/code>. The file is \u003ccode>Contents/Resources/&lt;lang&gt;.lproj/&lt;name&gt;.searchTerms\u003c/code>, an XML plist with this layout: group key (e.g. \u003ccode>InputSources\u003c/code>) → \u003ccode>localizableStrings\u003c/code> → entries with \u003ccode>title\u003c/code> (\"Keyboard layouts\") and \u003ccode>index\u003c/code> (comma-separated keywords, e.g. \"QWERTY, AZERTY, Dvorak, …\").\u003c/li>\n\u003cli>42 English files and 691 entries on macOS 27.0. This is exactly what Spotlight shows as settings sub-items in the user's screenshot.\u003c/li>\n\u003cli>The same \u003ccode>Info.plist\u003c/code> has the pane's bundle ID (\u003ccode>com.apple.Keyboard-Settings.extension\u003c/code>), its legacy ID (\u003ccode>com.apple.preference.keyboard\u003c/code>), \u003ccode>allowsXAppleSystemPreferencesURLScheme\u003c/code>, and its icon configuration.\u003c/li>\n\u003cli>\u003ccode>mdfind 'kMDItemDisplayName == \"Keyboard layouts\"'\u003c/code> returns nothing. That shows the metadata query does not expose this item; it does not prove settings items are absent from every Spotlight store (narrowed after review). The \u003ccode>.searchTerms\u003c/code> files are a catalog that can be read directly, so Apparate should read them itself. They change only on OS updates, so cache them and re-read when the Extensions folder's modification date changes (Tinycast's approach for panes).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Opening them:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>A pane opens with \u003ccode>x-apple.systempreferences:&lt;bundle id&gt;\u003c/code>. That much is verified as the documented community form, and the Keyboard extension declares \u003ccode>allowsXAppleSystemPreferencesURLScheme\u003c/code>.\u003c/li>\n\u003cli>A sub-item likely opens with \u003ccode>x-apple.systempreferences:&lt;bundle id&gt;?&lt;anchor&gt;\u003c/code>. Whether the \u003ccode>.searchTerms\u003c/code> group keys are valid anchors is \u003cstrong>unverified\u003c/strong>. Some (\u003ccode>CustomizeModifierKeys\u003c/code>, \u003ccode>TextReplacements\u003c/code>, \u003ccode>CapsLockInputSources\u003c/code>) appear as literal strings in the Keyboard extension binary; others (\u003ccode>InputSources\u003c/code>, \u003ccode>FunctionKeys\u003c/code>) do not.\u003c/li>\n\u003cli>Plan a spike: for each entry, try the anchor URL and observe whether the right section opens. Where no anchor works, fall back to opening the pane.\u003c/li>\n\u003cli>Community anchor lists (bvanpeski/SystemPreferences, rmcdongit gist) cover older pane IDs and are not authoritative.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Open-source comparison (verified, source):\u003c/strong> Tinycast lists panes only (\u003ccode>SettingsPaneScanner\u003c/code>, with name and icon overrides for broken bundles). Sol lists legacy \u003ccode>.prefPane\u003c/code> bundles with a hard-coded name map. Neither offers sub-items, so this is a real gap Apparate can fill.\u003c/p>\n\u003ch2 id=\"fuzzy-matching-and-ranking\">Fuzzy matching and ranking\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Algorithm\u003c/th>\n\u003cth>Notes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>fzf v1 / v2\u003c/td>\n\u003ctd>v1 greedy, v2 Smith-Waterman-style DP with boundary bonuses; the standard for terminals\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fzy\u003c/td>\n\u003ctd>DP with consecutive/word/camel/dot bonuses and gap penalties; simple, good quality; used in the benchmark\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Quicksilver \u003ccode>QSSense\u003c/code>\u003c/td>\n\u003ctd>Recursive abbreviation scorer with transliteration fallback; origin of many launcher scorers\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tinycast \u003ccode>LauncherMatch\u003c/code>\u003c/td>\n\u003ctd>DP alignment: word start 3 points, first char 4, others 2, gap −1; camel humps precomputed; rough-subsequence pre-check; three sensitivity thresholds (verified, source)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Flow Launcher \u003ccode>StringMatcher\u003c/code>\u003c/td>\n\u003ctd>Separate acronym pass (index 0, after space, uppercase, digit groups: \u003ccode>vs19\u003c/code> → Visual Studio 2019) plus substring fuzzy (verified, source)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fuse.js (Kunkun, Ueli option, some Sol lists) / fuzzysort (Ueli default) / MiniSearch (Sol root search)\u003c/td>\n\u003ctd>JS libraries; fuse.js is Bitap-based and tolerates typos, but its acronym ranking is weak (expected from its design, not measured here)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Alfred / Raycast\u003c/td>\n\u003ctd>Alfred matches apps by capital letters or from any word boundary (docs). Raycast: \"Fuzzy search means you don't need an exact match\" (\u003ccode>msg\u003c/code> → Messages), sensitivity setting, frecency per query (manual)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Measured on this machine (see \u003ca href=\"#/research/claude/benchmark\">benchmark\u003c/a>): an fzy-style scorer over pre-folded bytes with a 64-bit character bitmask prefilter and bounded top-50 selection.\u003c/p>\n\u003cul>\n\u003cli>20k candidates: 0.13 ms mean, 0.49 ms slowest keystroke on one thread.\u003c/li>\n\u003cli>200k candidates: 1.30 ms mean, 5.2 ms slowest keystroke on one thread; 0.29 ms mean, 1.0 ms slowest on 10 threads.\u003c/li>\n\u003cli>\"Slowest keystroke\" is the maximum over keystrokes of each keystroke's best of 7 runs, not an observed worst case or p95. Re-run after review with a checksum over the selected top-K IDs, so the selection cannot be optimised away; results were unchanged within noise.\u003c/li>\n\u003cli>These numbers are not directly comparable with Codex's (different corpus, queries, and statistics). Codex also measured full-path scoring at 200k: about 44 ms median, up to 81 ms. Name-first matching is therefore required, with a separate path mode.\u003c/li>\n\u003cli>\u003ccode>vsc\u003c/code> → Visual Studio Code ranks first with no special acronym code, because word-start bonuses dominate.\u003c/li>\n\u003c/ul>\n\u003cp>Ranking recommendation:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Tiers first, score second:\u003c/strong> exact alias &gt; alias prefix &gt; exact name &gt; name prefix &gt; word-start/acronym &gt; fuzzy. This matches Raycast's documented order and Sol's relevance-tier-before-usage behaviour.\u003c/li>\n\u003cli>\u003cstrong>Kind priority within a tier:\u003c/strong> apps &gt; settings &gt; folders &gt; files by default (configurable). Without it, \u003ccode>term\u003c/code> ranks two files above Terminal (measured).\u003c/li>\n\u003cli>\u003cstrong>Frecency\u003c/strong> keyed by the query typed. Tinycast adds 100 per open, halves every 10 days, floors at 1, and stores the last few query terms per entry. Raycast tracks frecency per query. Frecency should reorder within a tier, never lift a weak fuzzy hit above an exact match.\u003c/li>\n\u003cli>\u003cstrong>Deterministic ties:\u003c/strong> shorter name, then a stable ID. Keep the selected item selected if it is still in the new list.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"recommended-architecture\">Recommended architecture\u003c/h2>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>Language/UI:\u003c/strong> Swift 6 + AppKit for the panel, text field and results list (\u003ccode>NSTableView\u003c/code>, fixed row height, view reuse). SwiftUI is acceptable for the settings window. Reason: deterministic control over first draw and keyboard handling (Raycast v1's stated reason). Tinycast shows SwiftUI-in-NSPanel can work, but with a lot of workaround code.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Process model:\u003c/strong> one agent process (\u003ccode>LSUIElement\u003c/code>) launched at login with \u003ccode>SMAppService\u003c/code>. Optionally run the initial file crawl in a short-lived helper process, as Tinycast does, so peak crawl memory is returned to the OS. That is worth it only if measured peak memory is large.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Providers:\u003c/strong> each source returns entries into one in-memory table of folded byte strings with kind, ID, display name, alternate names, and icon key.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Apps:\u003c/strong> scan the standard app folders and watch them with FSEvents.\u003c/li>\n\u003cli>\u003cstrong>Settings:\u003c/strong> parse panes and \u003ccode>.searchTerms\u003c/code>, cached by the Extensions folder's modification date.\u003c/li>\n\u003cli>\u003cstrong>Files:\u003c/strong> user-selected roots only. Crawl on a background queue with ignore rules (\u003ccode>.gitignore\u003c/code>, \u003ccode>node_modules\u003c/code>, caches, hidden items by default). Persist a compact snapshot plus the last FSEvents event ID; replay on launch.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Query path (changed after review):\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>The main thread parses the prefix and hands the query, with an increasing generation number, to one serial search worker.\u003c/li>\n\u003cli>The worker matches against an immutable snapshot of the scope, then tiers, ranks and takes the top K.\u003c/li>\n\u003cli>The main thread publishes the complete list in one reload, only if the generation is still current, so a late result for \u003ccode>v\u003c/code> never overwrites \u003ccode>vsc\u003c/code>.\u003c/li>\n\u003c/ol>\n\u003cp>At the measured costs this normally lands within the same frame. Typing is never blocked, even at 200k candidates or when an index update is running. The first version ran the match synchronously on the main thread. Codex argued, and I agree, that atomic publication alone gives the stability, without risking a blocked keystroke. Split across cores only if measurement shows a need; energy use of parallel scoring was not measured.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Prefix commands:\u003c/strong> a small table in config mapping a leading character to a scope, e.g. \u003ccode>'\u003c/code> → files and folders, \u003ccode>.\u003c/code> → settings, \u003ccode>&gt;\u003c/code> → commands, \u003ccode>=\u003c/code> → calculator. An escape such as a doubled prefix searches the literal character.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Config:\u003c/strong> one versioned JSON file (\u003ccode>Codable\u003c/code>, no dependency) in Application Support or \u003ccode>~/.config/apparate/\u003c/code>, watched for changes. It holds the hotkey, file roots, ignore patterns, prefixes, aliases and kind order. The user asked for prefixes \"configured in settings\". Whether that means a settings window or a config file is for the user to decide (raised in review).\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Budgets\u003c/strong> (aspirational targets, none measured on a real build):\u003c/p>\n\u003cul>\n\u003cli>Hotkey to visible panel: ≤ 1 frame (~16 ms).\u003c/li>\n\u003cli>Keystroke to updated results: ≤ 8 ms at 20k candidates.\u003c/li>\n\u003cli>Idle CPU: 0%.\u003c/li>\n\u003cli>Idle memory: ≤ 40 MB with a 20k-entry index loaded. The bare shell measured 18 MB without icons, index structures or drawing; count any helper processes too.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"additional-feature-suggestions\">Additional feature suggestions\u003c/h2>\n\u003cp>Priority 1 is small, fits a minimal launcher, and is common to Alfred, Raycast and LaunchBar:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Aliases\u003c/strong> (\u003ccode>vsc\u003c/code> → VS Code) and learned ranking. Ranking gets better with use at almost no cost.\u003c/li>\n\u003cli>\u003cstrong>Actions on a result:\u003c/strong> Reveal in Finder, Copy path, Quick Look, Open with…, Show info. Without these, file search is half useful.\u003c/li>\n\u003cli>\u003cstrong>Inline calculator and unit/currency conversion.\u003c/strong> Saves opening an app; no index needed.\u003c/li>\n\u003cli>\u003cstrong>Quicklinks / web search with a template\u003c/strong> (\u003ccode>gh apparate\u003c/code> → GitHub search). The fallback when nothing local matches.\u003c/li>\n\u003cli>\u003cstrong>Running-app commands:\u003c/strong> switch to, hide, quit, force quit.\u003c/li>\n\u003cli>\u003cstrong>System commands:\u003c/strong> lock screen, sleep, restart, empty Trash, toggle dark mode, eject disks.\u003c/li>\n\u003c/ol>\n\u003cp>Priority 2 is useful but costs more:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Script commands:\u003c/strong> run a user's shell script with a title and an optional argument. Unlimited extension with no plugin runtime.\u003c/li>\n\u003cli>\u003cstrong>Recent files and folders\u003c/strong> when the query is empty, from the file index's modification dates.\u003c/li>\n\u003cli>\u003cstrong>Browser bookmarks and history search.\u003c/strong> Each browser has a different format.\u003c/li>\n\u003cli>\u003cstrong>Emoji and symbol picker.\u003c/strong>\u003c/li>\n\u003c/ol>\n\u003cp>Not recommended initially:\u003c/p>\n\u003cul>\n\u003cli>Clipboard history: Spotlight in macOS 26+ already has it.\u003c/li>\n\u003cli>Snippets/text expansion: needs an Accessibility event tap.\u003c/li>\n\u003cli>Extension store, AI chat, window management, notes. Each multiplies footprint and scope.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"risks-and-open-questions\">Risks and open questions\u003c/h2>\n\u003cp>Risks:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Settings sub-item anchors\u003c/strong> may not open the exact section; \u003ccode>.searchTerms\u003c/code> is an undocumented format that can change with macOS releases. Mitigation: prototype spike, then fallback to the pane.\u003c/li>\n\u003cli>\u003cstrong>TCC prompts\u003c/strong> for Desktop, Documents and Downloads, and the Full Disk Access trade-off for broader roots.\u003c/li>\n\u003cli>\u003cstrong>⌘Space\u003c/strong> conflicts with Spotlight until the user disables Spotlight's shortcut.\u003c/li>\n\u003cli>\u003cstrong>Development signing:\u003c/strong> without Xcode, builds are scripted; ad-hoc signing resets privacy grants on every rebuild.\u003c/li>\n\u003c/ul>\n\u003cp>Decisions for the user:\u003c/p>\n\u003col>\n\u003cli>UI stack: AppKit (recommended) vs SwiftUI.\u003c/li>\n\u003cli>File search engine: own index (recommended) vs Spotlight queries vs own index for names plus Spotlight for an explicit content search.\u003c/li>\n\u003cli>Default file roots and ignore rules.\u003c/li>\n\u003cli>Hotkey: replace ⌘Space, or another chord.\u003c/li>\n\u003cli>Config: file only first (recommended) vs settings UI from the start.\u003c/li>\n\u003cli>Which additional features belong in v1.\u003c/li>\n\u003cli>Distribution: personal use only, or public (Developer ID and notarization).\u003c/li>\n\u003cli>Default kind order (apps &gt; settings &gt; folders &gt; files?).\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"corrections-after-review\">Corrections after review\u003c/h2>\n\u003cp>Codex reviewed this report on 2026-11-18, after both reports were complete. Changes made in response, marked inline:\u003c/p>\n\u003col>\n\u003cli>Spotlight's slowness: the suspected causes are now labelled inference, since neither report profiled Spotlight.\u003c/li>\n\u003cli>\"No per-keystroke IPC\" was too broad. Flow Launcher → Everything is a fast cross-process counterexample. Reworded to predictable latency and one complete result set.\u003c/li>\n\u003cli>Raycast 2.0's indexer follows \"file system events\"; the specific FSEvents API is inference.\u003c/li>\n\u003cli>Sol's file search uses \u003ccode>NSString.scoreAgainst\u003c/code> and an alphabetical sort, not fuse.js. Its root search uses MiniSearch. Verified in source at \u003ccode>873ae1c\u003c/code>.\u003c/li>\n\u003cli>Query path changed from synchronous main-thread search to a serial worker with generation numbers and atomic publication.\u003c/li>\n\u003cli>Benchmark \"worst\" relabelled as the maximum of per-keystroke best-of-7 runs. Re-run with a checksum over the top-K selection; unchanged.\u003c/li>\n\u003cli>Settings counts: 41 files / 688 entries in ExtensionKit, plus 1 legacy prefPane file / 3 entries, for 42 / 691.\u003c/li>\n\u003cli>The ad-hoc signing and TCC claim is now stated as reported, not tested. Added \u003ccode>NSOpenPanel\u003c/code> and security-scoped bookmarks, and dataless iCloud files.\u003c/li>\n\u003cli>Budgets labelled aspirational, with corpus size stated. Config-file-only is no longer presented as settled, because the user said prefixes are configured \"in settings\".\u003c/li>\n\u003cli>After Codex's alignment review: the opening summary no longer suggests our scorer measures Spotlight. The \u003ccode>mdfind\u003c/code> result is narrowed to what that one query shows.\u003c/li>\n\u003c/ol>\n\u003cp>Not changed: the recommendation itself (Swift + AppKit, own name index, fzy-style tiers with frecency, settings from \u003ccode>.searchTerms\u003c/code>). Codex's review agreed with it.\u003c/p>\n\u003ch2 id=\"sources\">Sources\u003c/h2>\n\u003cul>\n\u003cli>Raycast: \u003ca href=\"https://www.raycast.com/blog/a-technical-deep-dive-into-the-new-raycast\" rel=\"noreferrer\">A technical deep dive into the new Raycast\u003c/a> (May 2026); \u003ca href=\"https://manual.raycast.com/file-search\" rel=\"noreferrer\">File Search manual\u003c/a>; \u003ca href=\"https://manual.raycast.com/search-bar\" rel=\"noreferrer\">Search Bar manual\u003c/a>; \u003ca href=\"https://manual.raycast.com/troubleshooting/spotlight\" rel=\"noreferrer\">Spotlight troubleshooting\u003c/a>\u003c/li>\n\u003cli>Alfred: \u003ca href=\"https://alfredapp.com/help/troubleshooting/indexing\" rel=\"noreferrer\">Indexing troubleshooting\u003c/a>; \u003ca href=\"https://www.alfredapp.com/help/troubleshooting/indexing/spotlight/\" rel=\"noreferrer\">Can Alfred work without Spotlight?\u003c/a>; \u003ca href=\"https://www.alfredapp.com/help/features/default-results/\" rel=\"noreferrer\">Default results\u003c/a>\u003c/li>\n\u003cli>LaunchBar: \u003ca href=\"https://obdev.at/resources/launchbar/help/IndexingRules.html\" rel=\"noreferrer\">Indexing rules\u003c/a>; \u003ca href=\"https://obdev.at/resources/launchbar/help/IndexWindow.html\" rel=\"noreferrer\">Index window\u003c/a>\u003c/li>\n\u003cli>Spotlight in macOS 26: \u003ca href=\"https://www.macrumors.com/2025/06/09/apple-supercharges-spotlight-in-macos-tahoe-with-quick-keys-and-more/\" rel=\"noreferrer\">MacRumors\u003c/a>; \u003ca href=\"https://techcrunch.com/2025/06/09/apple-updates-spotlight-to-take-actions-on-your-mac/\" rel=\"noreferrer\">TechCrunch\u003c/a>; slowness reports: \u003ca href=\"https://sixcolors.com/?p=39502\" rel=\"noreferrer\">Six Colors\u003c/a>, \u003ca href=\"https://discussions.apple.com/thread/256313638?page=1\" rel=\"noreferrer\">Apple Community\u003c/a>\u003c/li>\n\u003cli>Source code read (shallow clones, 2026-11-18): \u003ca href=\"https://github.com/ospfranco/sol\" rel=\"noreferrer\">Sol\u003c/a> \u003ccode>873ae1c\u003c/code>; \u003ca href=\"https://github.com/abue-ammar/tinycast\" rel=\"noreferrer\">Tinycast\u003c/a> \u003ccode>99d1d17\u003c/code>; \u003ca href=\"https://github.com/oliverschwendener/ueli\" rel=\"noreferrer\">Ueli\u003c/a> \u003ccode>9410429\u003c/code>; \u003ca href=\"https://github.com/albertlauncher/albert\" rel=\"noreferrer\">Albert\u003c/a> \u003ccode>c703546\u003c/code>; \u003ca href=\"https://github.com/Flow-Launcher/Flow.Launcher\" rel=\"noreferrer\">Flow Launcher\u003c/a> \u003ccode>58b7997\u003c/code>; \u003ca href=\"https://github.com/kunkunsh/kunkun\" rel=\"noreferrer\">Kunkun\u003c/a> \u003ccode>d4383c5\u003c/code>; \u003ca href=\"https://github.com/quicksilver/Quicksilver\" rel=\"noreferrer\">Quicksilver\u003c/a> \u003ccode>12d7543\u003c/code>; \u003ca href=\"https://github.com/cboxdoerfer/fsearch\" rel=\"noreferrer\">fsearch\u003c/a> \u003ccode>74295de\u003c/code>\u003c/li>\n\u003cli>Everything: \u003ca href=\"https://www.voidtools.com/faq/\" rel=\"noreferrer\">voidtools FAQ\u003c/a>; plocate: \u003ca href=\"https://plocate.sesse.net/\" rel=\"noreferrer\">plocate.sesse.net\u003c/a>\u003c/li>\n\u003cli>Filesystem: \u003ca href=\"https://developer.apple.com/library/mac/documentation/Darwin/Conceptual/FSEvents_ProgGuide/UsingtheFSEventsFramework/UsingtheFSEventsFramework.html\" rel=\"noreferrer\">FSEvents programming guide\u003c/a>; \u003ca href=\"https://lists.apple.com/archives/filesystem-dev/2019/Apr/msg00005.html\" rel=\"noreferrer\">readdir vs getattrlistbulk thread\u003c/a>; \u003ca href=\"https://blog.tempel.org/2019/04/\" rel=\"noreferrer\">Tempelmann 2019\u003c/a>; \u003ca href=\"https://mjtsai.com/blog/2019/04/22/performance-considerations-when-reading-directories-on-macos\" rel=\"noreferrer\">mjtsai summary\u003c/a>\u003c/li>\n\u003cli>Settings deep links (community, not authoritative): \u003ca href=\"https://developer.apple.com/forums/thread/709289\" rel=\"noreferrer\">Apple developer forums\u003c/a>; \u003ca href=\"https://github.com/bvanpeski/SystemPreferences/blob/main/macos_preferencepanes-Ventura.md\" rel=\"noreferrer\">bvanpeski/SystemPreferences\u003c/a>\u003c/li>\n\u003cli>Measured on this Mac: app/settings/file counts, \u003ccode>mdfind\u003c/code> timings, home walk, matching benchmark, idle footprint (\u003ca href=\"#/research/claude/benchmark\">benchmark\u003c/a>).\u003c/li>\n\u003c/ul>\n","backlinks":["index","research/alignment","research/claude/benchmark"]},{"id":"research/codex/benchmark","title":"Swift matching benchmark","section":"Research","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Swift matching benchmark\nsection: Research\nupdated: 2026-11-18\n---\n# Swift matching benchmark\n\n**Verified—measured here, 2026-11-18.** A small fzy-like scorer was written and compiled in a temporary directory. This is a research executable, not Apparate product code. It demonstrates the cost of scoring names versus full paths and of adding a character mask. It is not a benchmark of upstream fzy/fzf/nucleo binaries.\n\n## Method\n\n- Shared environment facts: Apple M1 Pro, 16 GB RAM, macOS 27.0, Swift 6.4.2; Command Line Tools, no full Xcode.\n- Optimized compilation: `swiftc -O -whole-module-optimization`.\n- Corpus: 336 distinct app names from Spotlight plus 13,410 file/folder paths beneath `~/Projects`, excluding `.git`, `node_modules`, `target`, and `.build`. Symlink directories are not traversed. Names/paths only; file contents were not read.\n- 13,746 distinct seed strings, shuffled with Python seed 42, then repeated to 200,000 entries. Sizes use the first 1,000, 20,000, or 200,000. Repetition preserves this sample's distribution; it is **not 200,000 distinct real files**.\n- Full-path strings averaged 76.03 UTF-8 bytes, maximum 170. Basename variant used identical records with parent paths removed, averaging 18.09 bytes.\n- Queries: `v`, `vs`, `vsc`, `s`, `sw`, `swi`, `src`, `read`, `readme`, `app`, `zqxj`. Each is scored independently; no incremental reuse.\n- Single thread, two warmups, nine measured rounds per query/mode. Plain/mask order alternates. Reported times are medians. Nine samples are too few for reliable production tail-latency claims.\n- Both variants use ordered-subsequence rejection and reused DP rows. Mask adds a precomputed 64-bit byte-presence test. Collisions permit false positives but no false negatives relative to this byte matcher.\n- Timed: mask/subsequence checks, DP, counting and a checksum over all matches. Excluded: JSON parsing, directory walk, normalization, record construction, top-K selection/sorting, highlights, icons, IPC, window creation, drawing.\n- Correctness checks: `VSC` matches Visual Studio Code and outranks a scattered synthetic match; reversed `csv` does not match; mask/plain match counts and score checksums are equal for every measured pair. Swift `precondition` checks remain enabled under `-O`.\n- This was a live desktop, not an isolated thermal/power-controlled lab. ASCII-only case folding and byte-based boundaries are deliberate benchmark limitations.\n\nCorpus SHA-256 (full JSON): `c04fbb38563f0e2f06572565907cd58feca504f8df807780e778aef50ef1d829`. The full private path list is not copied into project documentation.\n\n## Results\n\nMedian of the eleven per-query medians, in milliseconds. These aggregate numbers describe this query mix only.\n\n| Candidates | Full path, plain | Full path, mask | Basename, plain | Basename, mask |\n| --- | --- | --- | --- | --- |\n| 1,000 | 0.221 | 0.216 | 0.022 | 0.011 |\n| 20,000 | 4.643 | 4.492 | 0.514 | 0.266 |\n| 200,000 | 46.301 | 43.863 | 6.089 | 3.941 |\n\nThe 200,000-candidate results show why both string length and selectivity matter:\n\n| Query | Full path plain / mask, ms | Basename plain / mask, ms | Full-path mask rejects | Basename mask rejects |\n| --- | --- | --- | --- | --- |\n| `v` | 38.067 / 36.036 | 6.880 / 4.244 | 27.6% | 70.1% |\n| `vs` | 45.695 / 43.669 | 6.750 / 4.429 | 27.7% | 77.0% |\n| `vsc` | 46.301 / 43.863 | 4.604 / 1.335 | 27.8% | 88.1% |\n| `s` | 26.293 / 26.538 | 6.785 / 6.312 | 1.0% | 26.3% |\n| `sw` | 41.837 / 39.004 | 5.682 / 2.157 | 31.1% | 85.3% |\n| `swi` | 52.834 / 49.755 | 5.093 / 1.288 | 31.8% | 88.7% |\n| `src` | 69.043 / 69.036 | 6.963 / 4.113 | 1.8% | 75.6% |\n| `read` | 82.888 / 80.823 | 7.124 / 3.941 | 19.0% | 82.3% |\n| `readme` | 47.467 / 45.792 | 5.144 / 1.702 | 21.9% | 84.2% |\n| `app` | 46.453 / 46.133 | 6.089 / 4.123 | 7.5% | 66.5% |\n| `zqxj` | 11.360 / 0.474 | 3.733 / 0.201 | 98.8% | 99.6% |\n\nFull paths repeat common directory characters, so their masks reject little for common queries. For `src`, full-path scoring stays around 69 ms with or without the mask. Basename scoring is much shorter and the mask rejects 75.6% of records, reducing that query to 4.11 ms. A rare no-match query benefits greatly, but must not stand in for the ordinary typing workload.\n\nPeak RSS from `/usr/bin/time -l`: 383,123,456 bytes (365.4 MiB) for the full-path harness; 99,991,552 bytes (95.4 MiB) for basename. These peaks include JSON/input strings, growing arrays, an **8-byte Double bonus per character**, and runtime allocation overhead. They are not steady-state app memory, not just the scorer's scratch space, and not a compact index memory estimate. Production should store boundary flags/bonuses compactly and avoid duplicated full paths. Four score rows at the full-path maximum consume only 5,440 bytes.\n\n**Conclusion:** 20k full-path scoring can fit within a frame in this workload, while 200k full-path DP cannot reliably do so. Basename-first search is the defensible default. Keep a separate path-aware mode and candidate narrowing for path queries. The proposed app must still measure top-K work and key-to-presented-frame latency.\n\n## Reproduce\n\nCreate a temporary directory outside the project. Save the following blocks as `collect.py` and `bench.swift` there, then run:\n\n```sh\npython3 collect.py\nswiftc -O -whole-module-optimization -o bench bench.swift\n/usr/bin/time -l ./bench candidates.json > results.csv\npython3 - \u003c\u003c'PYCODE'\nfrom pathlib import Path\nimport json\nnames = json.loads(Path('candidates.json').read_text())\nPath('basenames.json').write_text(json.dumps([Path(s).name for s in names], ensure_ascii=False))\nPYCODE\n/usr/bin/time -l ./bench basenames.json > results-basename.csv\n```\n\nThe live filesystem changes, so a later collection may produce a different count/hash. Preserve your own corpus when comparing changes. The CSV's `*_p95_ms` columns are nearest-rank estimates from nine samples (therefore the sample maximum), not robust p95 measurements.\n\n### collect.py\n\n```python\nfrom pathlib import Path\nimport os, random, subprocess, hashlib, json\nroot = Path.home() / 'Projects'\nprune = {'.git', 'node_modules', 'target', '.build'}\npaths = []\nfor parent, dirs, files in os.walk(root, followlinks=False):\n    dirs[:] = sorted(d for d in dirs if d not in prune)\n    paths += ['~/Projects/' + str((Path(parent)/n).relative_to(root)) for n in dirs+sorted(files)]\napps = subprocess.check_output(['mdfind', '-0', 'kMDItemContentType == \"com.apple.application-bundle\"']).decode().split('\\0')\napps = sorted(set(Path(p).stem for p in apps if p))\nbase = sorted(set(apps + paths))\nrandom.Random(42).shuffle(base)\ncorpus = (base * ((200000 + len(base)-1)//len(base)))[:200000]\n# JSON avoids newline/tab ambiguity in real filenames.\ndata = json.dumps(corpus, ensure_ascii=False).encode()\nPath(__file__).with_name('candidates.json').write_bytes(data)\nprint(json.dumps({'apps':len(apps),'paths':len(paths),'unique_base':len(base),'N':len(corpus),'mean_utf8_bytes':sum(len(x.encode()) for x in corpus)/len(corpus),'max_utf8_bytes':max(len(x.encode()) for x in corpus),'sha256':hashlib.sha256(data).hexdigest()}))\n```\n\n### bench.swift\n\nThe DP recurrence and bonus categories follow the [fzy source](https://github.com/jhawthorn/fzy/blob/34b88869d022e861da4846c4463aea3ddfb3ff30/src/match.c), implemented here as an intentionally small Swift experiment. It does not reproduce every fzy option or Unicode behaviour.\n\n```swift\nimport Foundation\nimport Dispatch\n\nstruct Candidate { let offset: Int; let count: Int; let mask: UInt64 }\n@inline(__always) func lower(_ b: UInt8) -> UInt8 { b >= 65 && b \u003c= 90 ? b + 32 : b }\n@inline(__always) func bit(_ b: UInt8) -> UInt64 { 1 \u003c\u003c UInt64(b & 63) }\nvar bytes = [UInt8](), bonuses = [Double](), candidates = [Candidate]()\nlet input = try Data(contentsOf: URL(fileURLWithPath: CommandLine.arguments[1]))\nlet names = try JSONDecoder().decode([String].self, from: input)\nfor name in names {\n    let raw = Array(name.utf8), offset = bytes.count\n    var mask: UInt64 = 0\n    for j in raw.indices {\n        let b = lower(raw[j]), previous: UInt8 = j == 0 ? 47 : raw[j-1]\n        bytes.append(b); mask |= bit(b)\n        let bonus: Double\n        if previous == 47 { bonus = 0.9 }\n        else if previous == 32 || previous == 45 || previous == 95 { bonus = 0.8 }\n        else if previous >= 97 && previous \u003c= 122 && raw[j] >= 65 && raw[j] \u003c= 90 { bonus = 0.7 }\n        else if previous == 46 { bonus = 0.6 }\n        else { bonus = 0 }\n        bonuses.append(bonus)\n    }\n    candidates.append(Candidate(offset: offset, count: raw.count, mask: mask))\n}\nlet width = max(1, candidates.map(\\.count).max()!)\n// Score only; reuse four rows, no allocation or match-position traceback per candidate.\nlet rows = UnsafeMutablePointer\u003cDouble>.allocate(capacity: width * 4)\nrows.initialize(repeating: 0, count: width * 4)\ndefer { rows.deinitialize(count: width * 4); rows.deallocate() }\nlet neg = -Double.infinity\n@inline(__always) func score(_ text: UnsafePointer\u003cUInt8>, _ bonus: UnsafePointer\u003cDouble>,\n                            _ n: Int, _ query: [UInt8]) -> Double {\n    let m = query.count\n    if m == 0 || m > n { return neg }\n    var q = 0\n    for j in 0..\u003cn {\n        if text[j] == query[q] { q += 1; if q == m { break } }\n    }\n    if q != m { return neg } // Exact ordered-subsequence prefilter in BOTH modes.\n    if m == n { return 1_000_000 }\n    var pd = rows, pm = rows + width, cd = rows + width * 2, cm = rows + width * 3\n    for i in 0..\u003cm {\n        var best = neg\n        let gap = i == m - 1 ? -0.005 : -0.01\n        for j in 0..\u003cn {\n            var d = neg\n            if text[j] == query[i] {\n                if i == 0 { d = Double(j) * -0.005 + bonus[j] }\n                else if j > 0 { d = max(pm[j-1] + bonus[j], pd[j-1] + 1.0) }\n            }\n            cd[j] = d; best = max(d, best + gap); cm[j] = best\n        }\n        swap(&pd, &cd); swap(&pm, &cm)\n    }\n    return pm[n-1]\n}\nstruct Result { let elapsed: Double; let checksum: Double; let matches: Int; let rejected: Int }\n@inline(never) func run(_ count: Int, _ query: [UInt8], _ useMask: Bool) -> Result {\n    var mask: UInt64 = 0\n    for b in query { mask |= bit(b) }\n    let start = DispatchTime.now().uptimeNanoseconds\n    var checksum = 0.0, matches = 0, rejected = 0\n    bytes.withUnsafeBufferPointer { bp in\n        bonuses.withUnsafeBufferPointer { sp in\n            for i in 0..\u003ccount {\n                let c = candidates[i]\n                if useMask && (c.mask & mask) != mask { rejected += 1; continue }\n                let value = score(bp.baseAddress! + c.offset, sp.baseAddress! + c.offset, c.count, query)\n                if value.isFinite { checksum += value; matches += 1 }\n            }\n        }\n    }\n    return Result(elapsed: Double(DispatchTime.now().uptimeNanoseconds - start)/1e6,\n                  checksum: checksum, matches: matches, rejected: rejected)\n}\n// Correctness checks are outside the timer.\nfunc testScore(_ name: String, _ query: String) -> Double {\n    let raw = Array(name.utf8), text = raw.map(lower)\n    let bonus = raw.indices.map { j -> Double in\n        let p: UInt8 = j == 0 ? 47 : raw[j-1]\n        if p == 47 { return 0.9 }\n        if p == 32 || p == 45 || p == 95 { return 0.8 }\n        if p >= 97 && p \u003c= 122 && raw[j] >= 65 && raw[j] \u003c= 90 { return 0.7 }\n        return p == 46 ? 0.6 : 0\n    }\n    return text.withUnsafeBufferPointer { t in bonus.withUnsafeBufferPointer { b in\n        score(t.baseAddress!, b.baseAddress!, text.count, Array(query.utf8).map(lower))\n    }}\n}\nprecondition(testScore(\"Visual Studio Code\", \"VSC\").isFinite)\nprecondition(testScore(\"Visual Studio Code\", \"VSC\") > testScore(\"avbsxc\", \"vsc\"))\nprecondition(!testScore(\"Visual Studio Code\", \"csv\").isFinite)\nprint(\"N,query,plain_ms,mask_ms,plain_p95_ms,mask_p95_ms,matches,mask_rejected_pct\")\nlet queries = [\"v\", \"vs\", \"vsc\", \"s\", \"sw\", \"swi\", \"src\", \"read\", \"readme\", \"app\", \"zqxj\"]\nvar sink = 0.0\nfor n in [1000, 20000, 200000] {\n    for query in queries {\n        let q = Array(query.utf8).map(lower)\n        var times = [[Double](), [Double]()]\n        var last = [Result]()\n        for round in 0..\u003c11 {\n            var pair = [Result?](repeating:nil, count:2)\n            for mode in (round % 2 == 0 ? [0,1] : [1,0]) {\n                let result = run(n, q, mode == 1); pair[mode] = result\n                if round >= 2 { times[mode].append(result.elapsed) }\n                sink += result.checksum\n            }\n            precondition(pair[0]!.matches == pair[1]!.matches)\n            precondition(pair[0]!.checksum == pair[1]!.checksum)\n            last = pair.map { $0! }\n        }\n        times[0].sort(); times[1].sort()\n        print(String(format: \"%d,%@,%.3f,%.3f,%.3f,%.3f,%d,%.1f\", n, query,\n                     times[0][4], times[1][4], times[0][8], times[1][8], last[0].matches,\n                     100.0 * Double(last[1].rejected)/Double(n)))\n    }\n}\nfputs(\"checksum=\\(sink)\\n\", stderr)\n```\n\nSee [fuzzy matching](fuzzy-matching.md) for the proposed production ranking and Unicode requirements, and the [report](report.md) for budgets and architecture.\n","toc":[{"id":"method","title":"Method","depth":2},{"id":"results","title":"Results","depth":2},{"id":"reproduce","title":"Reproduce","depth":2},{"id":"collect-py","title":"collect.py","depth":3},{"id":"bench-swift","title":"bench.swift","depth":3}],"titleAnchor":"swift-matching-benchmark","links":["research/codex/fuzzy-matching","research/codex/report"],"attachments":[],"html":"\u003cp>\u003cstrong>Verified—measured here, 2026-11-18.\u003c/strong> A small fzy-like scorer was written and compiled in a temporary directory. This is a research executable, not Apparate product code. It demonstrates the cost of scoring names versus full paths and of adding a character mask. It is not a benchmark of upstream fzy/fzf/nucleo binaries.\u003c/p>\n\u003ch2 id=\"method\">Method\u003c/h2>\n\u003cul>\n\u003cli>Shared environment facts: Apple M1 Pro, 16 GB RAM, macOS 27.0, Swift 6.4.2; Command Line Tools, no full Xcode.\u003c/li>\n\u003cli>Optimized compilation: \u003ccode>swiftc -O -whole-module-optimization\u003c/code>.\u003c/li>\n\u003cli>Corpus: 336 distinct app names from Spotlight plus 13,410 file/folder paths beneath \u003ccode>~/Projects\u003c/code>, excluding \u003ccode>.git\u003c/code>, \u003ccode>node_modules\u003c/code>, \u003ccode>target\u003c/code>, and \u003ccode>.build\u003c/code>. Symlink directories are not traversed. Names/paths only; file contents were not read.\u003c/li>\n\u003cli>13,746 distinct seed strings, shuffled with Python seed 42, then repeated to 200,000 entries. Sizes use the first 1,000, 20,000, or 200,000. Repetition preserves this sample's distribution; it is \u003cstrong>not 200,000 distinct real files\u003c/strong>.\u003c/li>\n\u003cli>Full-path strings averaged 76.03 UTF-8 bytes, maximum 170. Basename variant used identical records with parent paths removed, averaging 18.09 bytes.\u003c/li>\n\u003cli>Queries: \u003ccode>v\u003c/code>, \u003ccode>vs\u003c/code>, \u003ccode>vsc\u003c/code>, \u003ccode>s\u003c/code>, \u003ccode>sw\u003c/code>, \u003ccode>swi\u003c/code>, \u003ccode>src\u003c/code>, \u003ccode>read\u003c/code>, \u003ccode>readme\u003c/code>, \u003ccode>app\u003c/code>, \u003ccode>zqxj\u003c/code>. Each is scored independently; no incremental reuse.\u003c/li>\n\u003cli>Single thread, two warmups, nine measured rounds per query/mode. Plain/mask order alternates. Reported times are medians. Nine samples are too few for reliable production tail-latency claims.\u003c/li>\n\u003cli>Both variants use ordered-subsequence rejection and reused DP rows. Mask adds a precomputed 64-bit byte-presence test. Collisions permit false positives but no false negatives relative to this byte matcher.\u003c/li>\n\u003cli>Timed: mask/subsequence checks, DP, counting and a checksum over all matches. Excluded: JSON parsing, directory walk, normalization, record construction, top-K selection/sorting, highlights, icons, IPC, window creation, drawing.\u003c/li>\n\u003cli>Correctness checks: \u003ccode>VSC\u003c/code> matches Visual Studio Code and outranks a scattered synthetic match; reversed \u003ccode>csv\u003c/code> does not match; mask/plain match counts and score checksums are equal for every measured pair. Swift \u003ccode>precondition\u003c/code> checks remain enabled under \u003ccode>-O\u003c/code>.\u003c/li>\n\u003cli>This was a live desktop, not an isolated thermal/power-controlled lab. ASCII-only case folding and byte-based boundaries are deliberate benchmark limitations.\u003c/li>\n\u003c/ul>\n\u003cp>Corpus SHA-256 (full JSON): \u003ccode>c04fbb38563f0e2f06572565907cd58feca504f8df807780e778aef50ef1d829\u003c/code>. The full private path list is not copied into project documentation.\u003c/p>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003cp>Median of the eleven per-query medians, in milliseconds. These aggregate numbers describe this query mix only.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Candidates\u003c/th>\n\u003cth>Full path, plain\u003c/th>\n\u003cth>Full path, mask\u003c/th>\n\u003cth>Basename, plain\u003c/th>\n\u003cth>Basename, mask\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1,000\u003c/td>\n\u003ctd>0.221\u003c/td>\n\u003ctd>0.216\u003c/td>\n\u003ctd>0.022\u003c/td>\n\u003ctd>0.011\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>20,000\u003c/td>\n\u003ctd>4.643\u003c/td>\n\u003ctd>4.492\u003c/td>\n\u003ctd>0.514\u003c/td>\n\u003ctd>0.266\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>200,000\u003c/td>\n\u003ctd>46.301\u003c/td>\n\u003ctd>43.863\u003c/td>\n\u003ctd>6.089\u003c/td>\n\u003ctd>3.941\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The 200,000-candidate results show why both string length and selectivity matter:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Query\u003c/th>\n\u003cth>Full path plain / mask, ms\u003c/th>\n\u003cth>Basename plain / mask, ms\u003c/th>\n\u003cth>Full-path mask rejects\u003c/th>\n\u003cth>Basename mask rejects\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>v\u003c/code>\u003c/td>\n\u003ctd>38.067 / 36.036\u003c/td>\n\u003ctd>6.880 / 4.244\u003c/td>\n\u003ctd>27.6%\u003c/td>\n\u003ctd>70.1%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>vs\u003c/code>\u003c/td>\n\u003ctd>45.695 / 43.669\u003c/td>\n\u003ctd>6.750 / 4.429\u003c/td>\n\u003ctd>27.7%\u003c/td>\n\u003ctd>77.0%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>vsc\u003c/code>\u003c/td>\n\u003ctd>46.301 / 43.863\u003c/td>\n\u003ctd>4.604 / 1.335\u003c/td>\n\u003ctd>27.8%\u003c/td>\n\u003ctd>88.1%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>s\u003c/code>\u003c/td>\n\u003ctd>26.293 / 26.538\u003c/td>\n\u003ctd>6.785 / 6.312\u003c/td>\n\u003ctd>1.0%\u003c/td>\n\u003ctd>26.3%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sw\u003c/code>\u003c/td>\n\u003ctd>41.837 / 39.004\u003c/td>\n\u003ctd>5.682 / 2.157\u003c/td>\n\u003ctd>31.1%\u003c/td>\n\u003ctd>85.3%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>swi\u003c/code>\u003c/td>\n\u003ctd>52.834 / 49.755\u003c/td>\n\u003ctd>5.093 / 1.288\u003c/td>\n\u003ctd>31.8%\u003c/td>\n\u003ctd>88.7%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>src\u003c/code>\u003c/td>\n\u003ctd>69.043 / 69.036\u003c/td>\n\u003ctd>6.963 / 4.113\u003c/td>\n\u003ctd>1.8%\u003c/td>\n\u003ctd>75.6%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>read\u003c/code>\u003c/td>\n\u003ctd>82.888 / 80.823\u003c/td>\n\u003ctd>7.124 / 3.941\u003c/td>\n\u003ctd>19.0%\u003c/td>\n\u003ctd>82.3%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>readme\u003c/code>\u003c/td>\n\u003ctd>47.467 / 45.792\u003c/td>\n\u003ctd>5.144 / 1.702\u003c/td>\n\u003ctd>21.9%\u003c/td>\n\u003ctd>84.2%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>app\u003c/code>\u003c/td>\n\u003ctd>46.453 / 46.133\u003c/td>\n\u003ctd>6.089 / 4.123\u003c/td>\n\u003ctd>7.5%\u003c/td>\n\u003ctd>66.5%\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>zqxj\u003c/code>\u003c/td>\n\u003ctd>11.360 / 0.474\u003c/td>\n\u003ctd>3.733 / 0.201\u003c/td>\n\u003ctd>98.8%\u003c/td>\n\u003ctd>99.6%\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Full paths repeat common directory characters, so their masks reject little for common queries. For \u003ccode>src\u003c/code>, full-path scoring stays around 69 ms with or without the mask. Basename scoring is much shorter and the mask rejects 75.6% of records, reducing that query to 4.11 ms. A rare no-match query benefits greatly, but must not stand in for the ordinary typing workload.\u003c/p>\n\u003cp>Peak RSS from \u003ccode>/usr/bin/time -l\u003c/code>: 383,123,456 bytes (365.4 MiB) for the full-path harness; 99,991,552 bytes (95.4 MiB) for basename. These peaks include JSON/input strings, growing arrays, an \u003cstrong>8-byte Double bonus per character\u003c/strong>, and runtime allocation overhead. They are not steady-state app memory, not just the scorer's scratch space, and not a compact index memory estimate. Production should store boundary flags/bonuses compactly and avoid duplicated full paths. Four score rows at the full-path maximum consume only 5,440 bytes.\u003c/p>\n\u003cp>\u003cstrong>Conclusion:\u003c/strong> 20k full-path scoring can fit within a frame in this workload, while 200k full-path DP cannot reliably do so. Basename-first search is the defensible default. Keep a separate path-aware mode and candidate narrowing for path queries. The proposed app must still measure top-K work and key-to-presented-frame latency.\u003c/p>\n\u003ch2 id=\"reproduce\">Reproduce\u003c/h2>\n\u003cp>Create a temporary directory outside the project. Save the following blocks as \u003ccode>collect.py\u003c/code> and \u003ccode>bench.swift\u003c/code> there, then run:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">python3 collect.py\nswiftc -O -whole-module-optimization -o bench bench.swift\n/usr/bin/time -l ./bench candidates.json &gt; results.csv\npython3 - &lt;&lt;'PYCODE'\nfrom pathlib import Path\nimport json\nnames = json.loads(Path('candidates.json').read_text())\nPath('basenames.json').write_text(json.dumps([Path(s).name for s in names], ensure_ascii=False))\nPYCODE\n/usr/bin/time -l ./bench basenames.json &gt; results-basename.csv\n\u003c/code>\u003c/pre>\n\u003cp>The live filesystem changes, so a later collection may produce a different count/hash. Preserve your own corpus when comparing changes. The CSV's \u003ccode>*_p95_ms\u003c/code> columns are nearest-rank estimates from nine samples (therefore the sample maximum), not robust p95 measurements.\u003c/p>\n\u003ch3 id=\"collect-py\">collect.py\u003c/h3>\n\u003cpre>\u003ccode class=\"language-python\">from pathlib import Path\nimport os, random, subprocess, hashlib, json\nroot = Path.home() / 'Projects'\nprune = {'.git', 'node_modules', 'target', '.build'}\npaths = []\nfor parent, dirs, files in os.walk(root, followlinks=False):\n    dirs[:] = sorted(d for d in dirs if d not in prune)\n    paths += ['~/Projects/' + str((Path(parent)/n).relative_to(root)) for n in dirs+sorted(files)]\napps = subprocess.check_output(['mdfind', '-0', 'kMDItemContentType == \"com.apple.application-bundle\"']).decode().split('\\0')\napps = sorted(set(Path(p).stem for p in apps if p))\nbase = sorted(set(apps + paths))\nrandom.Random(42).shuffle(base)\ncorpus = (base * ((200000 + len(base)-1
