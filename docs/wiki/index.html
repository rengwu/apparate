03c/tr>\n\u003ctr>\n\u003ctd>DEC-021\u003c/td>\n\u003ctd>Apparate has a menu bar icon, which can be hidden in settings.\u003c/td>\n\u003ctd>User choice; matched the recommendation.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-022\u003c/td>\n\u003ctd>The UI spike covers all five interfaces: launcher panel, result rows, settings window, menu bar menu, and first run.\u003c/td>\n\u003ctd>User choice.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"round-3-ui-design-spike-2026-11-18\">Round 3 — UI design spike — 2026-11-18\u003c/h2>\n\u003cp>Source: the user's submitted grill-forms (\"Apparate UI — round 3\" and \"round 3b\"). Variations are described in the \u003ca href=\"#/spikes/2026-11-18-ui-design\">UI design spike\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-023\u003c/td>\n\u003ctd>The launcher panel is variation A: compact and fixed in size, with a search field, 28 pt rows, ⌘1–9 hints, and a footer with the selected result's keys (like Klip).\u003c/td>\n\u003ctd>User choice; matched the recommendation.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-024\u003c/td>\n\u003ctd>Result rows are variation C: one line, matched letters in bold, location dimmed after the title, ⌘N hint on the right.\u003c/td>\n\u003ctd>User choice; matched the recommendation.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-025\u003c/td>\n\u003ctd>The settings window uses toolbar tabs: General (hotkey with the Spotlight conflict notice, launch at login, menu bar icon), Search (prefix table, search engine, search URL), and Folders (folder table with depth and +/−, the .gitignore switch, index status with Rebuild).\u003c/td>\n\u003ctd>User choice in round 3b; Claude had recommended the one-page layout.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-026\u003c/td>\n\u003ctd>The menu bar menu has Open Apparate (⌘Space), Settings… (⌘,) and Quit Apparate (⌘Q). Index status and Rebuild live in the settings Folders tab, not the menu.\u003c/td>\n\u003ctd>User choice in round 3b; Claude had recommended adding index status to the menu.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-027\u003c/td>\n\u003ctd>First launch shows one setup window with two steps and their status: free up ⌘Space (opens Keyboard Shortcuts) and allow access to Desktop, Documents and Downloads. Buttons: Choose Folders… and Done.\u003c/td>\n\u003ctd>User choice in round 3b; matched the recommendation.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>In round 3, the form showed option previews in three narrow columns, which squeezed the designs. The user asked to see the settings window, menu and first run again in a single full-width column. Round 3b decided them.\u003c/p>\n\u003ch2 id=\"round-4-2026-11-18\">Round 4 — 2026-11-18\u003c/h2>\n\u003cp>Source: the user's submitted grill-form (\"Apparate decisions — round 4\"), asked after the \u003ca href=\"#/spikes/2026-11-18-settings-deep-links\">settings deep-link spike\u003c/a>, the \u003ca href=\"#/spikes/2026-11-18-panel-latency\">panel latency spike\u003c/a> and the draft \u003ca href=\"#/plan\">implementation plan\u003c/a>.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Decision\u003c/th>\n\u003cth>Basis\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>DEC-028\u003c/td>\n\u003ctd>The DEC-008 budgets stay as accepted, as provisional end-to-end goals. They are measured properly during the build (M6), then revisited.\u003c/td>\n\u003ctd>User choice; matched the joint recommendation of Claude and Codex.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-029\u003c/td>\n\u003ctd>When System Settings is already open, Apparate opens the settings link directly. It does not quit System Settings first, and there is no \"Close and reopen\" action.\u003c/td>\n\u003ctd>User choice of Codex's option, with the note \"just open directly, no need to close and reopen\", citing jstack's \u003ccode>rule-lean\u003c/code>. Claude had preferred quitting first; Codex had proposed the extra action.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-030\u003c/td>\n\u003ctd>The web search prefix is \u003ccode>?\u003c/code>.\u003c/td>\n\u003ctd>User choice; matched the recommendation. Confirms the prefix left open in DEC-017.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-031\u003c/td>\n\u003ctd>A query containing \u003ccode>/\u003c/code> searches full paths. Other queries match names only.\u003c/td>\n\u003ctd>User choice; matched the recommendation (Codex's proposal in the \u003ca href=\"#/research/alignment\">alignment\u003c/a>).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-032\u003c/td>\n\u003ctd>\u003cstrong>Provisional:\u003c/strong> no other default prefixes, so the defaults are \u003ccode>'\u003c/code> files and folders, \u003ccode>.\u003c/code> settings and \u003ccode>?\u003c/code> web. Users can add or change prefixes in settings.\u003c/td>\n\u003ctd>Not answered: the question was left untouched, and grill-form treats that as unresolved, not as \"none\". These defaults match the recommendation and stand until the user answers. Asked again in round 5.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-033\u003c/td>\n\u003ctd>\u003ccode>.gitignore\u003c/code> handling has a switch in the settings Folders tab, on by default.\u003c/td>\n\u003ctd>User choice; matched the recommendation. Refines DEC-006.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-034\u003c/td>\n\u003ctd>The public repository uses the MIT licence.\u003c/td>\n\u003ctd>User choice; matched the recommendation.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-035\u003c/td>\n\u003ctd>None of the four icon directions. Rework the icon as a serious, sleek direction, not in the style of Klip.\u003c/td>\n\u003ctd>User's note (\"rework. don't do it in the style of klip. do a serious, sleek direction\"). A new set of four directions follows.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-036\u003c/td>\n\u003ctd>Codex builds and Claude reviews. Claude gives detailed guidance for each milestone, with visual and non-visual references. Codex follows it but can push back. Disagreements between them go to the user in a grill-form.\u003c/td>\n\u003ctd>User choice with this note. It fixes the roles left open in DEC-011; Claude had recommended the reverse.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>DEC-037\u003c/td>\n\u003ctd>The project is under local git, with one commit per milestone. Nothing is pushed without the user's go-ahead.\u003c/td>\n\u003ctd>User choice; matched the recommendation.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"observed-from-the-reference-apps\">Observed from the reference apps\u003c/h2>\n\u003cp>Klip, Yacht and Portia (in \u003ccode>~/Projects\u003c/code>) are SwiftPM packages built by a \u003ccode>build.sh\u003c/code> script with Command Line Tools only. They are pure AppKit (no SwiftUI) menu bar apps. Each is released as a zip or DMG on GitHub Releases, ad-hoc signed and not notarized. Klip signs with a fixed designated requirement (\u003ccode>identifier \"local.klip\"\u003c/code>), which keeps privacy grants valid across rebuilds. These are observations, not decisions for Apparate; round 2 asks whether to follow them.\u003c/p>\n\u003ch2 id=\"not-yet-decided\">Not yet decided\u003c/h2>\n\u003cul>\n\u003cli>The app icon and menu bar glyph: a new set of serious, sleek directions (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-035\u003c/a>), in round 5.\u003c/li>\n\u003cli>Whether there are default prefixes beyond \u003ccode>'\u003c/code>, \u003ccode>.\u003c/code> and \u003ccode>?\u003c/code> (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-032\u003c/a> is provisional), in round 5.\u003c/li>\n\u003cli>Creating the GitHub repository and publishing a release need the user's go-ahead when M7 is reached.\u003c/li>\n\u003c/ul>\n","backlinks":["index","build/index","build/m1-foundation","features/config","features/search","plan","requirements","spikes/2026-11-18-panel-latency","spikes/2026-11-18-settings-deep-links","spikes/2026-11-18-ui-design"]},{"id":"plan","title":"Implementation plan","section":"Planning","order":0,"metadata":{"status":"Approved"},"metadataHtml":"\u003cspan>Status: Approved\u003c/span> \u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Implementation plan\nsection: Planning\nupdated: 2026-11-18\nstatus: Approved\n---\n# Implementation plan\n\nStatus: **approved** in grill-form round 4 ([DEC-036](decisions.md#round-4-2026-11-18)). Codex reviewed the drafts, and this version includes its changes and the round-4 answers.\n\nIt builds what the [requirements](requirements.md) and [decisions](decisions.md) describe, using the three spikes:\n\n- [UI design](spikes/2026-11-18-ui-design.md)\n- [settings deep links](spikes/2026-11-18-settings-deep-links.md)\n- [panel latency](spikes/2026-11-18-panel-latency.md)\n\n## How the build runs\n\nRoles follow [DEC-036](decisions.md#round-4-2026-11-18) and [DEC-037](decisions.md#round-4-2026-11-18).\n\n1. **Guide.** Before each milestone, Claude writes a build guide in [Build](build/index.md). It lists the decisions that apply, the scope and its order, the tests, and references: code in Klip, Yacht and Portia, Apple documentation, and screenshots of the agreed design.\n2. **Build.** Codex builds the milestone, following the guide. Codex can push back on any part, in writing and with reasons.\n3. **Disagreements.** If Claude and Codex still disagree after one exchange, the question goes to the user in a grill-form, with both positions attributed. Work that does not depend on the answer continues.\n4. **Review.** Codex reports what it built and how it verified it. Claude reviews the diff and the verification run, and Codex fixes what the review finds.\n5. **Commit.** After the review passes, the milestone is one local git commit. Nothing is pushed without the user's go-ahead.\n\nTwo jstack rules apply throughout: `rule-lean` (the user cited it in [DEC-029](decisions.md#round-4-2026-11-18)) and `rule-plain-ui` for every visible part. Both are in `~/Projects/jstack/skills/`.\n\n## Shape\n\nThe layout follows Klip, Yacht and Portia ([DEC-013](decisions.md#round-2-2026-11-18)).\n\n| Part | Role |\n| --- | --- |\n| `ApparateCore` (library, no AppKit) | Config, the item and query model, matcher and ranking, the settings catalog, the file crawler and FSEvents handling, SQLite storage, usage history. |\n| `Apparate` (AppKit app) | Adapters for hotkey, icons, opening items and launch at login; the panel; settings window, menu bar menu and first run. |\n| `ApparateCoreTests` (plain executable) | Core tests run with `swift run ApparateCoreTests`. On this Mac, `import XCTest` and `import Testing` both fail with Command Line Tools only, so tests use the same executable pattern as Klip. |\n| `build.sh` | Builds `build/Apparate.app`: arm64 only, ad-hoc signed with the designated requirement `identifier \"local.apparate\"` ([DEC-014](decisions.md#round-2-2026-11-18)). |\n\n- No third-party packages. SQLite comes from the system `libsqlite3`.\n- The build is arm64 only because Apple named macOS 26 the last release for Intel Macs, and Apparate needs macOS 27 ([DEC-010](decisions.md#round-1-2026-11-18)).\n- Data lives in `~/Library/Application Support/Apparate/`: `config.json` and `index.sqlite`.\n- Testing aids, as in Klip:\n  - `APPARATE_HOME` points a run at another folder.\n  - `APPARATE_SHOW=panel|settings|setup` opens that window at launch.\n- Core tests use a temporary home, fake actions and recorded file events. They never open real URLs, run system commands or touch the real index.\n\n## Ground rules for every milestone\n\n- **One consistent snapshot per search.** Search runs off the main thread on an immutable snapshot of the index. SQLite, crawling and icon loading never run on the keystroke path.\n- **Generations.**\n  - Every query, scope, config or snapshot change starts a new generation.\n  - Cancellation uses a synchronized token, not a shared plain integer.\n  - Only the current generation's complete result set is published. There are no partial sources and no stale results.\n- **Stable selection.** The selection follows an item ID across updates. If the item drops out, the selection falls back to the first row. Return, ⌘Return and ⌘C act on the selected item's ID, never on a row number.\n- **Typed text shows at once.** Typing is never held back to wait for results. Whether a short wait helps is tested in M4, not assumed; Claude and Codex differ on it.\n- **Measure early.** Each milestone records the timings and memory it can, using a corrected measurement method (see M6). The budgets in [DEC-008](decisions.md#round-1-2026-11-18) stay as provisional end-to-end goals ([DEC-028](decisions.md#round-4-2026-11-18)).\n\n## Milestones\n\nEach milestone ends with core tests passing, a verification run recorded in this wiki, Claude's review, and one commit (see [How the build runs](#how-the-build-runs)).\n\n### M1. Foundation, matching and ranking\n\n**Scaffold:** SwiftPM targets, `build.sh` with the real signing identity, and adapters for the environment, clock and actions.\n\n**Config:**\n\n- A versioned `config.json` with defaults, validation, atomic writes and migration.\n- If a hand edit breaks it, Apparate keeps the last valid config and reports the error.\n- Apparate reloads the file when it changes on disk, without polling and without reacting to its own saves.\n- Defined errors for:\n  - colliding or empty prefixes;\n  - bad depths or paths;\n  - an invalid search URL template.\n\n**Items and queries:**\n\n- Stable item IDs for every kind: app, settings item, folder, file, system command, web search.\n- Prefixes, configurable ([REQ-005](requirements.md)). Defaults, with no others for now ([DEC-032](decisions.md#round-4-2026-11-18) is provisional until round 5):\n  - `'` searches files and folders;\n  - `.` searches settings;\n  - `?` searches the web ([DEC-030](decisions.md#round-4-2026-11-18)).\n- Path search ([DEC-031](decisions.md#round-4-2026-11-18)): a query containing `/` matches full paths instead of names. It is a separate mode, so ordinary queries never score every full path.\n- An explicit prefix is read first, so a web query containing `/` still goes to the web.\n- Two features can never share one prefix.\n\n**Matching:**\n\n- Names first, fzy-style, with a character mask and subsequence pre-check as in the [benchmark](research/claude/benchmark.md).\n- Unicode is normalized consistently. Matched letters map back to what is displayed for the bold highlight.\n- The mask never rules out a real match.\n- No length limits are inherited from the benchmark.\n\n**Ranking, in order:**\n\n1. Tier: exact > prefix > word start or acronym > fuzzy > settings keyword.\n2. Kind: apps and commands > settings > folders > files ([DEC-002](decisions.md#round-1-2026-11-18)).\n3. Fuzzy score plus a bounded usage boost, so usage reorders only within a tier and kind.\n4. A fixed final tie-break: folded name, then ID.\n\n\"Exact\" includes an app's built-in alternate names, but not user aliases, which [DEC-016](decisions.md#round-2-2026-11-18) leaves out. Top 50 are kept.\n\n**Usage history:**\n\n- Stored in SQLite with a bounded size.\n- Survives a rebuild.\n- Updated only after an item actually opens.\n- Opening an item never reorders the list you are looking at.\n\n**Tests:**\n\n- `vsc` → Visual Studio Code, `keyboard la` → Keyboard layouts, `term` → Terminal before files.\n- A strong file match against a weak app match; ties between same-kind matches.\n- Prefixes and the fallback row.\n- Accented letters in both composed and decomposed forms, CJK, emoji, very long names and queries.\n\n### M2. Apps, settings, actions, and a first panel\n\n**Apps:**\n\n- Found in `/Applications`, `/System/Applications` (with Utilities), `~/Applications`, and any app folders the user adds. Kept current with FSEvents.\n- Duplicate installs and localized names are handled.\n- The plan does not promise to find apps stored elsewhere.\n\n**Settings items:**\n\n- From ExtensionKit `.searchTerms` and the legacy Date & Time pane.\n- Names from the localized bundle info, icons from the bundle, with overrides for Battery and Headphones.\n- The cache is rebuilt when the macOS build or language changes.\n- Opening: the pane-and-anchor URL, opened directly even when System Settings is already running ([DEC-029](decisions.md#round-4-2026-11-18)). If the URL fails to open, the error is reported. Settings rows show their pane, so landing on the pane alone is not a surprise.\n\n**Actions:**\n\n- Each kind has a typed action: open apps, files and folders ([REQ-003](requirements.md)); reveal and copy the path of the same item.\n- Missing items and launch failures are reported, and stale entries are dropped.\n\n**System commands:**\n\n- Lock, Sleep, Restart and Show Trash rank like apps.\n- Restart needs a second, deliberate Return ([DEC-019](decisions.md#round-2-2026-11-18)). Typing, moving the selection, Esc or hiding cancels it, and a held-down Return does not count.\n- Tests use a fake executor. One supervised smoke test checks that each real command works on macOS 27.\n- Automated checks never lock, sleep or restart the user's Mac.\n\n**Web search:**\n\n- Uses the prefix, plus the fallback row, which appears only after a complete local search finds nothing. An empty query is never a web search.\n- The URL template is checked, and the query is encoded properly (spaces, `&`, `+`, `#`, non-Latin text).\n- Opens through the default-browser API ([DEC-017](decisions.md#round-2-2026-11-18), [DEC-018](decisions.md#round-2-2026-11-18)).\n\n**First panel:**\n\n- A plain panel with the Carbon hotkey (default ⌘Space) and the real signed identity, so hotkey, focus and window behaviour are tested early.\n- A basic folder-access step from first run, so M3 never crawls protected folders without consent.\n\n### M3. File index\n\n**Folders:**\n\n- `~/Projects`, `~/Desktop`, `~/Documents` and `~/Downloads` by default, plus folders the user adds ([DEC-005](decisions.md#round-1-2026-11-18)).\n- Depth 10 by default, adjustable per folder ([DEC-020](decisions.md#round-2-2026-11-18)). Depth is defined as follows:\n  - the folder itself is depth 0, its children depth 1;\n  - entries at the maximum depth are indexed but not descended into.\n- Overlapping folders are indexed once. Symbolic links and app packages are listed but not followed.\n\n**Exclusions:**\n\n- Hidden files and `node_modules` are always skipped ([DEC-006](decisions.md#round-1-2026-11-18)).\n- `.gitignore` files follow Git's own rules:\n  - nested files, order, negation, anchored and folder-only patterns, `**`, and escaping;\n  - a file under an excluded folder cannot be re-included.\n- Rule files are read even though hidden files are not listed. When a rule file changes, that subtree is checked again.\n- Only `.gitignore` counts, not global Git excludes or `.ignore` files. A setting turns this off; it is on by default ([DEC-033](decisions.md#round-4-2026-11-18)).\n\n**Stored per entry:**\n\n- a stable ID;\n- which folder it belongs to;\n- its path relative to that folder;\n- its name, kind and change details.\n\nSame-named files in different places stay distinct.\n\n**Keeping it current with FSEvents:**\n\n- Watching starts before the first crawl, so changes during the crawl are not lost.\n- The last event ID is saved only after the changes it covers are stored, so a crash replays safely.\n- Rescans are triggered by:\n  - `MustScanSubDirs`;\n  - dropped events (`UserDropped`, `KernelDropped`);\n  - root moves and removals (watched with `WatchRoot`);\n  - `RootChanged` and `EventIdsWrapped` (full rescan);\n  - lost event history and failed streams;\n  - a change of folders, depth or rules.\n- \"Could not read\" is not \"empty\". A denied or unavailable folder keeps its old entries, marked unavailable, until it can be read again. A folder the user removes leaves search results at once.\n\n**Rebuild:**\n\n- The searcher sees either the old index or the new one, never a mix.\n- Usage history and config are kept.\n- Searching stays responsive while it runs.\n- Event backlogs and crawl work are bounded.\n\n**Tests (headless, in temporary folders):**\n\n- rename and delete;\n- changes during the first crawl;\n- crash and replay;\n- injected dropped events;\n- a moved or removed folder;\n- permission failure;\n- a change of rules.\n\nTimings and memory are also measured while searching during a rebuild.\n\n### M4. The launcher panel\n\n- Variation A layout with C rows ([DEC-023](decisions.md#round-3-ui-design-spike-2026-11-18), [DEC-024](decisions.md#round-3-ui-design-spike-2026-11-18)): fixed size, 9 visible rows, ⌘1–9 for the visible rows.\n- ↑ and ↓ scroll through all 50 results, so results past the ninth stay reachable. The hints follow the visible rows.\n- **Rows:** compare a custom Core Text list (fast in the spike) with manually laid-out table cells. Both must support:\n  - keyboard and mouse selection, VoiceOver, truncation and highlighting.\n\n  Choose by measured results with equal behaviour.\n- **Publishing:** start with immediate typing and asynchronous publishing of complete results. Measure whether a short wait gives a better result.\n- **Warm-up:** draw at launch without taking focus. Check that the first real hotkey press is fast.\n- **Keys:** ↑ ↓, Return (open), ⌘Return (reveal), ⌘C (copy path), ⌘1–9, Esc ([DEC-016](decisions.md#round-2-2026-11-18)).\n- **States:** empty, loading, error and \"no results\", plus the footer showing the selected item's keys.\n- Behaves correctly over full-screen apps and in other Spaces.\n\n### M5. Settings, menu bar and first run\n\n**Settings, toolbar tabs** ([DEC-025](decisions.md#round-3-ui-design-spike-2026-11-18)). All of these work against the M1 config:\n\n- **General:**\n  - hotkey recording, with the Spotlight conflict notice; a failed new hotkey keeps the old one;\n  - launch at login (`SMAppService`, showing its real state);\n  - menu bar icon on or off.\n- **Search:** prefixes, search engine, URL template.\n- **Folders:**\n  - folders with per-folder depth and + / −;\n  - the `.gitignore` switch ([DEC-033](decisions.md#round-4-2026-11-18));\n  - index status and Rebuild.\n\n**Menu bar menu:**\n\n- Open (showing the configured hotkey), Settings, Quit ([DEC-026](decisions.md#round-3-ui-design-spike-2026-11-18)).\n- With the icon hidden ([DEC-021](decisions.md#round-2-2026-11-18)), Settings and Quit stay reachable: ⌘, and ⌘Q in the panel, and opening the app again shows Settings.\n\n**First run** ([DEC-027](decisions.md#round-3-ui-design-spike-2026-11-18)):\n\n- Two steps with live status: free up ⌘Space, with a button that opens Keyboard Shortcuts; and folder access.\n- Buttons: Choose Folders… and Done.\n- Partly granted, denied or cancelled access is a normal state, and the launcher still works.\n- Folder access is stored apart from the hand-editable paths.\n\n### M6. Performance qualification\n\n**Measurement harness,** corrected from the spike:\n\n- each result set carries a generation marker that the detector checks;\n- every observation window has an end;\n- key presses are timed independently of results;\n- logging is thread-safe, with per-event records kept;\n- Core Animation commits happen naturally, not forced.\n\n**Runs on the built app:**\n\n- cold and warm hotkey presses from another app;\n- typing names, paths and Unicode;\n- searching during a rebuild and during file changes;\n- at the display's real refresh rates.\n\n**Reporting:**\n\n- Apparate's own timings (dispatch, search, commit) separately from on-screen timings.\n- Steady memory after typing, the peak during indexing, and any helper processes.\n- Idle CPU and wake-ups over at least 60 quiet seconds.\n\nThese are judged against DEC-008, kept as goals by [DEC-028](decisions.md#round-4-2026-11-18). The results then go back to the user.\n\n### M7. Release 0.1.0\n\n- App icon from the reworked direction ([DEC-035](decisions.md#round-4-2026-11-18)), refined, plus a menu bar glyph. `make-icon.sh` as in Klip.\n- README with install and update steps, and the MIT licence ([DEC-034](decisions.md#round-4-2026-11-18)).\n- A clean install check:\n  - version and minimum macOS are consistent;\n  - the signature and designated requirement are verified;\n  - existing config and index survive an upgrade;\n  - no personal data is in the zip.\n- A zip on GitHub Releases ([DEC-014](decisions.md#round-2-2026-11-18), [DEC-015](decisions.md#round-2-2026-11-18)). Creating the GitHub repository and publishing need the user's go-ahead at that point.\n- Before the repository is made public, check the wiki and `docs/design/` for personal details. Research pages, prototypes and screenshots name apps installed on this Mac and folders under `~/Projects`. The user decides what stays.\n\n## Records\n\nFollowing jstack conventions:\n\n- [feature map](features/index.md), with verification recipes;\n- runs in `verification/runs/`, with evidence in `evidence/`;\n- build guides in [`build/`](build/index.md), one per milestone;\n- this page tracks progress (below).\n\n## Progress\n\n| Milestone | Guide | Built | Reviewed | Commit |\n| --- | --- | --- | --- | --- |\n| M1 Foundation, matching and ranking | [written](build/m1-foundation.md) | [yes](verification/runs/2026-11-18T154000Z-m1.md) | [passed](build/m1-foundation.md#review); [fix verified](verification/runs/2026-11-18T154000Z-m1.md#post-review-fix) | waiting for git |\n| M2 Apps, settings, actions, first panel | draft | — | — | — |\n| M3 File index | — | — | — | — |\n| M4 Launcher panel | — | — | — | — |\n| M5 Settings, menu bar, first run | — | — | — | — |\n| M6 Performance qualification | — | — | — | — |\n| M7 Release 0.1.0 | — | — | — | — |\n\n## Risks\n\n- **Budgets:** the spike's display times were above the DEC-008 limits, but its harness was too rough for a verdict. The corrected M6 harness measures it, and the user revisits the budgets with those results ([DEC-028](decisions.md#round-4-2026-11-18)).\n- **Settings anchors:** in the spike, 10 of 57 settings anchors did not reach their item and 4 reached only the right sheet. In the one tested sequence where System Settings already showed a sheet, later links did not navigate. [DEC-029](decisions.md#round-4-2026-11-18) accepts this: Apparate opens links directly and adds no recovery action.\n- **Folder permissions:** the first prompts for Desktop, Documents and Downloads, and whether grants survive rebuilds of this app, are tested early (M2–M3). The fixed signing identity is meant to help, but signing alone does not grant access.\n- **Hotkey:** ⌘Space only works after the user frees it from Spotlight. First run guides this, and a failed hotkey must be visible.\n","toc":[{"id":"how-the-build-runs","title":"How the build runs","depth":2},{"id":"shape","title":"Shape","depth":2},{"id":"ground-rules-for-every-milestone","title":"Ground rules for every milestone","depth":2},{"id":"milestones","title":"Milestones","depth":2},{"id":"m1-foundation-matching-and-ranking","title":"M1. Foundation, matching and ranking","depth":3},{"id":"m2-apps-settings-actions-and-a-first-panel","title":"M2. Apps, settings, actions, and a first panel","depth":3},{"id":"m3-file-index","title":"M3. File index","depth":3},{"id":"m4-the-launcher-panel","title":"M4. The launcher panel","depth":3},{"id":"m5-settings-menu-bar-and-first-run","title":"M5. Settings, menu bar and first run","depth":3},{"id":"m6-performance-qualification","title":"M6. Performance qualification","depth":3},{"id":"m7-release-0-1-0","title":"M7. Release 0.1.0","depth":3},{"id":"records","title":"Records","depth":2},{"id":"progress","title":"Progress","depth":2},{"id":"risks","title":"Risks","depth":2}],"titleAnchor":"implementation-plan","links":["decisions","requirements","decisions","spikes/2026-11-18-ui-design","spikes/2026-11-18-settings-deep-links","spikes/2026-11-18-panel-latency","decisions","decisions","build/index","decisions","decisions","decisions","decisions","decisions","decisions","plan","requirements","decisions","decisions","decisions","research/claude/benchmark","decisions","decisions","decisions","requirements","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","features/index","build/index","build/m1-foundation","verification/runs/2026-11-18T154000Z-m1","build/m1-foundation","verification/runs/2026-11-18T154000Z-m1","decisions","decisions"],"attachments":[],"html":"\u003cp>Status: \u003cstrong>approved\u003c/strong> in grill-form round 4 (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-036\u003c/a>). Codex reviewed the drafts, and this version includes its changes and the round-4 answers.\u003c/p>\n\u003cp>It builds what the \u003ca href=\"#/requirements\">requirements\u003c/a> and \u003ca href=\"#/decisions\">decisions\u003c/a> describe, using the three spikes:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/spikes/2026-11-18-ui-design\">UI design\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/spikes/2026-11-18-settings-deep-links\">settings deep links\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/spikes/2026-11-18-panel-latency\">panel latency\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"how-the-build-runs\">How the build runs\u003c/h2>\n\u003cp>Roles follow \u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-036\u003c/a> and \u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-037\u003c/a>.\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Guide.\u003c/strong> Before each milestone, Claude writes a build guide in \u003ca href=\"#/build/index\">Build\u003c/a>. It lists the decisions that apply, the scope and its order, the tests, and references: code in Klip, Yacht and Portia, Apple documentation, and screenshots of the agreed design.\u003c/li>\n\u003cli>\u003cstrong>Build.\u003c/strong> Codex builds the milestone, following the guide. Codex can push back on any part, in writing and with reasons.\u003c/li>\n\u003cli>\u003cstrong>Disagreements.\u003c/strong> If Claude and Codex still disagree after one exchange, the question goes to the user in a grill-form, with both positions attributed. Work that does not depend on the answer continues.\u003c/li>\n\u003cli>\u003cstrong>Review.\u003c/strong> Codex reports what it built and how it verified it. Claude reviews the diff and the verification run, and Codex fixes what the review finds.\u003c/li>\n\u003cli>\u003cstrong>Commit.\u003c/strong> After the review passes, the milestone is one local git commit. Nothing is pushed without the user's go-ahead.\u003c/li>\n\u003c/ol>\n\u003cp>Two jstack rules apply throughout: \u003ccode>rule-lean\u003c/code> (the user cited it in \u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-029\u003c/a>) and \u003ccode>rule-plain-ui\u003c/code> for every visible part. Both are in \u003ccode>~/Projects/jstack/skills/\u003c/code>.\u003c/p>\n\u003ch2 id=\"shape\">Shape\u003c/h2>\n\u003cp>The layout follows Klip, Yacht and Portia (\u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-013\u003c/a>).\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Part\u003c/th>\n\u003cth>Role\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>ApparateCore\u003c/code> (library, no AppKit)\u003c/td>\n\u003ctd>Config, the item and query model, matcher and ranking, the settings catalog, the file crawler and FSEvents handling, SQLite storage, usage history.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>Apparate\u003c/code> (AppKit app)\u003c/td>\n\u003ctd>Adapters for hotkey, icons, opening items and launch at login; the panel; settings window, menu bar menu and first run.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>ApparateCoreTests\u003c/code> (plain executable)\u003c/td>\n\u003ctd>Core tests run with \u003ccode>swift run ApparateCoreTests\u003c/code>. On this Mac, \u003ccode>import XCTest\u003c/code> and \u003ccode>import Testing\u003c/code> both fail with Command Line Tools only, so tests use the same executable pattern as Klip.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>build.sh\u003c/code>\u003c/td>\n\u003ctd>Builds \u003ccode>build/Apparate.app\u003c/code>: arm64 only, ad-hoc signed with the designated requirement \u003ccode>identifier \"local.apparate\"\u003c/code> (\u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-014\u003c/a>).\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cul>\n\u003cli>No third-party packages. SQLite comes from the system \u003ccode>libsqlite3\u003c/code>.\u003c/li>\n\u003cli>The build is arm64 only because Apple named macOS 26 the last release for Intel Macs, and Apparate needs macOS 27 (\u003ca href=\"#/decisions~round-1-2026-11-18\">DEC-010\u003c/a>).\u003c/li>\n\u003cli>Data lives in \u003ccode>~/Library/Application Support/Apparate/\u003c/code>: \u003ccode>config.json\u003c/code> and \u003ccode>index.sqlite\u003c/code>.\u003c/li>\n\u003cli>Testing aids, as in Klip:\u003cul>\n\u003cli>\u003ccode>APPARATE_HOME\u003c/code> points a run at another folder.\u003c/li>\n\u003cli>\u003ccode>APPARATE_SHOW=panel|settings|setup\u003c/code> opens that window at launch.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Core tests use a temporary home, fake actions and recorded file events. They never open real URLs, run system commands or touch the real index.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"ground-rules-for-every-milestone\">Ground rules for every milestone\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>One consistent snapshot per search.\u003c/strong> Search runs off the main thread on an immutable snapshot of the index. SQLite, crawling and icon loading never run on the keystroke path.\u003c/li>\n\u003cli>\u003cstrong>Generations.\u003c/strong>\u003cul>\n\u003cli>Every query, scope, config or snapshot change starts a new generation.\u003c/li>\n\u003cli>Cancellation uses a synchronized token, not a shared plain integer.\u003c/li>\n\u003cli>Only the current generation's complete result set is published. There are no partial sources and no stale results.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Stable selection.\u003c/strong> The selection follows an item ID across updates. If the item drops out, the selection falls back to the first row. Return, ⌘Return and ⌘C act on the selected item's ID, never on a row number.\u003c/li>\n\u003cli>\u003cstrong>Typed text shows at once.\u003c/strong> Typing is never held back to wait for results. Whether a short wait helps is tested in M4, not assumed; Claude and Codex differ on it.\u003c/li>\n\u003cli>\u003cstrong>Measure early.\u003c/strong> Each milestone records the timings and memory it can, using a corrected measurement method (see M6). The budgets in \u003ca href=\"#/decisions~round-1-2026-11-18\">DEC-008\u003c/a> stay as provisional end-to-end goals (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-028\u003c/a>).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"milestones\">Milestones\u003c/h2>\n\u003cp>Each milestone ends with core tests passing, a verification run recorded in this wiki, Claude's review, and one commit (see \u003ca href=\"#/plan~how-the-build-runs\">How the build runs\u003c/a>).\u003c/p>\n\u003ch3 id=\"m1-foundation-matching-and-ranking\">M1. Foundation, matching and ranking\u003c/h3>\n\u003cp>\u003cstrong>Scaffold:\u003c/strong> SwiftPM targets, \u003ccode>build.sh\u003c/code> with the real signing identity, and adapters for the environment, clock and actions.\u003c/p>\n\u003cp>\u003cstrong>Config:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>A versioned \u003ccode>config.json\u003c/code> with defaults, validation, atomic writes and migration.\u003c/li>\n\u003cli>If a hand edit breaks it, Apparate keeps the last valid config and reports the error.\u003c/li>\n\u003cli>Apparate reloads the file when it changes on disk, without polling and without reacting to its own saves.\u003c/li>\n\u003cli>Defined errors for:\u003cul>\n\u003cli>colliding or empty prefixes;\u003c/li>\n\u003cli>bad depths or paths;\u003c/li>\n\u003cli>an invalid search URL template.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Items and queries:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Stable item IDs for every kind: app, settings item, folder, file, system command, web search.\u003c/li>\n\u003cli>Prefixes, configurable (\u003ca href=\"#/requirements\">REQ-005\u003c/a>). Defaults, with no others for now (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-032\u003c/a> is provisional until round 5):\u003cul>\n\u003cli>\u003ccode>'\u003c/code> searches files and folders;\u003c/li>\n\u003cli>\u003ccode>.\u003c/code> searches settings;\u003c/li>\n\u003cli>\u003ccode>?\u003c/code> searches the web (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-030\u003c/a>).\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Path search (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-031\u003c/a>): a query containing \u003ccode>/\u003c/code> matches full paths instead of names. It is a separate mode, so ordinary queries never score every full path.\u003c/li>\n\u003cli>An explicit prefix is read first, so a web query containing \u003ccode>/\u003c/code> still goes to the web.\u003c/li>\n\u003cli>Two features can never share one prefix.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Matching:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Names first, fzy-style, with a character mask and subsequence pre-check as in the \u003ca href=\"#/research/claude/benchmark\">benchmark\u003c/a>.\u003c/li>\n\u003cli>Unicode is normalized consistently. Matched letters map back to what is displayed for the bold highlight.\u003c/li>\n\u003cli>The mask never rules out a real match.\u003c/li>\n\u003cli>No length limits are inherited from the benchmark.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Ranking, in order:\u003c/strong>\u003c/p>\n\u003col>\n\u003cli>Tier: exact &gt; prefix &gt; word start or acronym &gt; fuzzy &gt; settings keyword.\u003c/li>\n\u003cli>Kind: apps and commands &gt; settings &gt; folders &gt; files (\u003ca href=\"#/decisions~round-1-2026-11-18\">DEC-002\u003c/a>).\u003c/li>\n\u003cli>Fuzzy score plus a bounded usage boost, so usage reorders only within a tier and kind.\u003c/li>\n\u003cli>A fixed final tie-break: folded name, then ID.\u003c/li>\n\u003c/ol>\n\u003cp>\"Exact\" includes an app's built-in alternate names, but not user aliases, which \u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-016\u003c/a> leaves out. Top 50 are kept.\u003c/p>\n\u003cp>\u003cstrong>Usage history:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Stored in SQLite with a bounded size.\u003c/li>\n\u003cli>Survives a rebuild.\u003c/li>\n\u003cli>Updated only after an item actually opens.\u003c/li>\n\u003cli>Opening an item never reorders the list you are looking at.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Tests:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>vsc\u003c/code> → Visual Studio Code, \u003ccode>keyboard la\u003c/code> → Keyboard layouts, \u003ccode>term\u003c/code> → Terminal before files.\u003c/li>\n\u003cli>A strong file match against a weak app match; ties between same-kind matches.\u003c/li>\n\u003cli>Prefixes and the fallback row.\u003c/li>\n\u003cli>Accented letters in both composed and decomposed forms, CJK, emoji, very long names and queries.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"m2-apps-settings-actions-and-a-first-panel\">M2. Apps, settings, actions, and a first panel\u003c/h3>\n\u003cp>\u003cstrong>Apps:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Found in \u003ccode>/Applications\u003c/code>, \u003ccode>/System/Applications\u003c/code> (with Utilities), \u003ccode>~/Applications\u003c/code>, and any app folders the user adds. Kept current with FSEvents.\u003c/li>\n\u003cli>Duplicate installs and localized names are handled.\u003c/li>\n\u003cli>The plan does not promise to find apps stored elsewhere.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Settings items:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>From ExtensionKit \u003ccode>.searchTerms\u003c/code> and the legacy Date &amp; Time pane.\u003c/li>\n\u003cli>Names from the localized bundle info, icons from the bundle, with overrides for Battery and Headphones.\u003c/li>\n\u003cli>The cache is rebuilt when the macOS build or language changes.\u003c/li>\n\u003cli>Opening: the pane-and-anchor URL, opened directly even when System Settings is already running (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-029\u003c/a>). If the URL fails to open, the error is reported. Settings rows show their pane, so landing on the pane alone is not a surprise.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Actions:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Each kind has a typed action: open apps, files and folders (\u003ca href=\"#/requirements\">REQ-003\u003c/a>); reveal and copy the path of the same item.\u003c/li>\n\u003cli>Missing items and launch failures are reported, and stale entries are dropped.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>System commands:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Lock, Sleep, Restart and Show Trash rank like apps.\u003c/li>\n\u003cli>Restart needs a second, deliberate Return (\u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-019\u003c/a>). Typing, moving the selection, Esc or hiding cancels it, and a held-down Return does not count.\u003c/li>\n\u003cli>Tests use a fake executor. One supervised smoke test checks that each real command works on macOS 27.\u003c/li>\n\u003cli>Automated checks never lock, sleep or restart the user's Mac.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Web search:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Uses the prefix, plus the fallback row, which appears only after a complete local search finds nothing. An empty query is never a web search.\u003c/li>\n\u003cli>The URL template is checked, and the query is encoded properly (spaces, \u003ccode>&amp;\u003c/code>, \u003ccode>+\u003c/code>, \u003ccode>#\u003c/code>, non-Latin text).\u003c/li>\n\u003cli>Opens through the default-browser API (\u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-017\u003c/a>, \u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-018\u003c/a>).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>First panel:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>A plain panel with the Carbon hotkey (default ⌘Space) and the real signed identity, so hotkey, focus and window behaviour are tested early.\u003c/li>\n\u003cli>A basic folder-access step from first run, so M3 never crawls protected folders without consent.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"m3-file-index\">M3. File index\u003c/h3>\n\u003cp>\u003cstrong>Folders:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>~/Projects\u003c/code>, \u003ccode>~/Desktop\u003c/code>, \u003ccode>~/Documents\u003c/code> and \u003ccode>~/Downloads\u003c/code> by default, plus folders the user adds (\u003ca href=\"#/decisions~round-1-2026-11-18\">DEC-005\u003c/a>).\u003c/li>\n\u003cli>Depth 10 by default, adjustable per folder (\u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-020\u003c/a>). Depth is defined as follows:\u003cul>\n\u003cli>the folder itself is depth 0, its children depth 1;\u003c/li>\n\u003cli>entries at the maximum depth are indexed but not descended into.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Overlapping folders are indexed once. Symbolic links and app packages are listed but not followed.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Exclusions:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Hidden files and \u003ccode>node_modules\u003c/code> are always skipped (\u003ca href=\"#/decisions~round-1-2026-11-18\">DEC-006\u003c/a>).\u003c/li>\n\u003cli>\u003ccode>.gitignore\u003c/code> files follow Git's own rules:\u003cul>\n\u003cli>nested files, order, negation, anchored and folder-only patterns, \u003ccode>**\u003c/code>, and escaping;\u003c/li>\n\u003cli>a file under an excluded folder cannot be re-included.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Rule files are read even though hidden files are not listed. When a rule file changes, that subtree is checked again.\u003c/li>\n\u003cli>Only \u003ccode>.gitignore\u003c/code> counts, not global Git excludes or \u003ccode>.ignore\u003c/code> files. A setting turns this off; it is on by default (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-033\u003c/a>).\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Stored per entry:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>a stable ID;\u003c/li>\n\u003cli>which folder it belongs to;\u003c/li>\n\u003cli>its path relative to that folder;\u003c/li>\n\u003cli>its name, kind and change details.\u003c/li>\n\u003c/ul>\n\u003cp>Same-named files in different places stay distinct.\u003c/p>\n\u003cp>\u003cstrong>Keeping it current with FSEvents:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Watching starts before the first crawl, so changes during the crawl are not lost.\u003c/li>\n\u003cli>The last event ID is saved only after the changes it covers are stored, so a crash replays safely.\u003c/li>\n\u003cli>Rescans are triggered by:\u003cul>\n\u003cli>\u003ccode>MustScanSubDirs\u003c/code>;\u003c/li>\n\u003cli>dropped events (\u003ccode>UserDropped\u003c/code>, \u003ccode>KernelDropped\u003c/code>);\u003c/li>\n\u003cli>root moves and removals (watched with \u003ccode>WatchRoot\u003c/code>);\u003c/li>\n\u003cli>\u003ccode>RootChanged\u003c/code> and \u003ccode>EventIdsWrapped\u003c/code> (full rescan);\u003c/li>\n\u003cli>lost event history and failed streams;\u003c/li>\n\u003cli>a change of folders, depth or rules.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\"Could not read\" is not \"empty\". A denied or unavailable folder keeps its old entries, marked unavailable, until it can be read again. A folder the user removes leaves search results at once.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Rebuild:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>The searcher sees either the old index or the new one, never a mix.\u003c/li>\n\u003cli>Usage history and config are kept.\u003c/li>\n\u003cli>Searching stays responsive while it runs.\u003c/li>\n\u003cli>Event backlogs and crawl work are bounded.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Tests (headless, in temporary folders):\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>rename and delete;\u003c/li>\n\u003cli>changes during the first crawl;\u003c/li>\n\u003cli>crash and replay;\u003c/li>\n\u003cli>injected dropped events;\u003c/li>\n\u003cli>a moved or removed folder;\u003c/li>\n\u003cli>permission failure;\u003c/li>\n\u003cli>a change of rules.\u003c/li>\n\u003c/ul>\n\u003cp>Timings and memory are also measured while searching during a rebuild.\u003c/p>\n\u003ch3 id=\"m4-the-launcher-panel\">M4. The launcher panel\u003c/h3>\n\u003cul>\n\u003cli>\u003cp>Variation A layout with C rows (\u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-023\u003c/a>, \u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-024\u003c/a>): fixed size, 9 visible rows, ⌘1–9 for the visible rows.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>↑ and ↓ scroll through all 50 results, so results past the ninth stay reachable. The hints follow the visible rows.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Rows:\u003c/strong> compare a custom Core Text list (fast in the spike) with manually laid-out table cells. Both must support:\u003c/p>\n\u003cul>\n\u003cli>keyboard and mouse selection, VoiceOver, truncation and highlighting.\u003c/li>\n\u003c/ul>\n\u003cp>Choose by measured results with equal behaviour.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Publishing:\u003c/strong> start with immediate typing and asynchronous publishing of complete results. Measure whether a short wait gives a better result.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Warm-up:\u003c/strong> draw at launch without taking focus. Check that the first real hotkey press is fast.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Keys:\u003c/strong> ↑ ↓, Return (open), ⌘Return (reveal), ⌘C (copy path), ⌘1–9, Esc (\u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-016\u003c/a>).\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>States:\u003c/strong> empty, loading, error and \"no results\", plus the footer showing the selected item's keys.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Behaves correctly over full-screen apps and in other Spaces.\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"m5-settings-menu-bar-and-first-run\">M5. Settings, menu bar and first run\u003c/h3>\n\u003cp>\u003cstrong>Settings, toolbar tabs\u003c/strong> (\u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-025\u003c/a>). All of these work against the M1 config:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>General:\u003c/strong>\u003cul>\n\u003cli>hotkey recording, with the Spotlight conflict notice; a failed new hotkey keeps the old one;\u003c/li>\n\u003cli>launch at login (\u003ccode>SMAppService\u003c/code>, showing its real state);\u003c/li>\n\u003cli>menu bar icon on or off.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Search:\u003c/strong> prefixes, search engine, URL template.\u003c/li>\n\u003cli>\u003cstrong>Folders:\u003c/strong>\u003cul>\n\u003cli>folders with per-folder depth and + / −;\u003c/li>\n\u003cli>the \u003ccode>.gitignore\u003c/code> switch (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-033\u003c/a>);\u003c/li>\n\u003cli>index status and Rebuild.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Menu bar menu:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Open (showing the configured hotkey), Settings, Quit (\u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-026\u003c/a>).\u003c/li>\n\u003cli>With the icon hidden (\u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-021\u003c/a>), Settings and Quit stay reachable: ⌘, and ⌘Q in the panel, and opening the app again shows Settings.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>First run\u003c/strong> (\u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-027\u003c/a>):\u003c/p>\n\u003cul>\n\u003cli>Two steps with live status: free up ⌘Space, with a button that opens Keyboard Shortcuts; and folder access.\u003c/li>\n\u003cli>Buttons: Choose Folders… and Done.\u003c/li>\n\u003cli>Partly granted, denied or cancelled access is a normal state, and the launcher still works.\u003c/li>\n\u003cli>Folder access is stored apart from the hand-editable paths.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"m6-performance-qualification\">M6. Performance qualification\u003c/h3>\n\u003cp>\u003cstrong>Measurement harness,\u003c/strong> corrected from the spike:\u003c/p>\n\u003cul>\n\u003cli>each result set carries a generation marker that the detector checks;\u003c/li>\n\u003cli>every observation window has an end;\u003c/li>\n\u003cli>key presses are timed independently of results;\u003c/li>\n\u003cli>logging is thread-safe, with per-event records kept;\u003c/li>\n\u003cli>Core Animation commits happen naturally, not forced.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Runs on the built app:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>cold and warm hotkey presses from another app;\u003c/li>\n\u003cli>typing names, paths and Unicode;\u003c/li>\n\u003cli>searching during a rebuild and during file changes;\u003c/li>\n\u003cli>at the display's real refresh rates.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Reporting:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Apparate's own timings (dispatch, search, commit) separately from on-screen timings.\u003c/li>\n\u003cli>Steady memory after typing, the peak during indexing, and any helper processes.\u003c/li>\n\u003cli>Idle CPU and wake-ups over at least 60 quiet seconds.\u003c/li>\n\u003c/ul>\n\u003cp>These are judged against DEC-008, kept as goals by \u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-028\u003c/a>. The results then go back to the user.\u003c/p>\n\u003ch3 id=\"m7-release-0-1-0\">M7. Release 0.1.0\u003c/h3>\n\u003cul>\n\u003cli>App icon from the reworked direction (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-035\u003c/a>), refined, plus a menu bar glyph. \u003ccode>make-icon.sh\u003c/code> as in Klip.\u003c/li>\n\u003cli>README with install and update steps, and the MIT licence (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-034\u003c/a>).\u003c/li>\n\u003cli>A clean install check:\u003cul>\n\u003cli>version and minimum macOS are consistent;\u003c/li>\n\u003cli>the signature and designated requirement are verified;\u003c/li>\n\u003cli>existing config and index survive an upgrade;\u003c/li>\n\u003cli>no personal data is in the zip.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>A zip on GitHub Releases (\u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-014\u003c/a>, \u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-015\u003c/a>). Creating the GitHub repository and publishing need the user's go-ahead at that point.\u003c/li>\n\u003cli>Before the repository is made public, check the wiki and \u003ccode>docs/design/\u003c/code> for personal details. Research pages, prototypes and screenshots name apps installed on this Mac and folders under \u003ccode>~/Projects\u003c/code>. The user decides what stays.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"records\">Records\u003c/h2>\n\u003cp>Following jstack conventions:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/features/index\">feature map\u003c/a>, with verification recipes;\u003c/li>\n\u003cli>runs in \u003ccode>verification/runs/\u003c/code>, with evidence in \u003ccode>evidence/\u003c/code>;\u003c/li>\n\u003cli>build guides in \u003ca href=\"#/build/index\">\u003ccode>build/\u003c/code>\u003c/a>, one per milestone;\u003c/li>\n\u003cli>this page tracks progress (below).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"progress\">Progress\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Milestone\u003c/th>\n\u003cth>Guide\u003c/th>\n\u003cth>Built\u003c/th>\n\u003cth>Reviewed\u003c/th>\n\u003cth>Commit\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>M1 Foundation, matching and ranking\u003c/td>\n\u003ctd>\u003ca href=\"#/build/m1-foundation\">written\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#/verification/runs/2026-11-18T154000Z-m1\">yes\u003c/a>\u003c/td>\n\u003ctd>\u003ca href=\"#/build/m1-foundation~review\">passed\u003c/a>; \u003ca href=\"#/verification/runs/2026-11-18T154000Z-m1~post-review-fix\">fix verified\u003c/a>\u003c/td>\n\u003ctd>waiting for git\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M2 Apps, settings, actions, first panel\u003c/td>\n\u003ctd>draft\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M3 File index\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M4 Launcher panel\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M5 Settings, menu bar, first run\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M6 Performance qualification\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>M7 Release 0.1.0\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"risks\">Risks\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Budgets:\u003c/strong> the spike's display times were above the DEC-008 limits, but its harness was too rough for a verdict. The corrected M6 harness measures it, and the user revisits the budgets with those results (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-028\u003c/a>).\u003c/li>\n\u003cli>\u003cstrong>Settings anchors:\u003c/strong> in the spike, 10 of 57 settings anchors did not reach their item and 4 reached only the right sheet. In the one tested sequence where System Settings already showed a sheet, later links did not navigate. \u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-029\u003c/a> accepts this: Apparate opens links directly and adds no recovery action.\u003c/li>\n\u003cli>\u003cstrong>Folder permissions:\u003c/strong> the first prompts for Desktop, Documents and Downloads, and whether grants survive rebuilds of this app, are tested early (M2–M3). The fixed signing identity is meant to help, but signing alone does not grant access.\u003c/li>\n\u003cli>\u003cstrong>Hotkey:\u003c/strong> ⌘Space only works after the user frees it from Spotlight. First run guides this, and a failed hotkey must be visible.\u003c/li>\n\u003c/ul>\n","backlinks":["index","build/index","build/m1-foundation","features/index","features/search","decisions"]},{"id":"requirements","title":"Requirements","section":"Planning","order":0,"metadata":{"status":"Accepted"},"metadataHtml":"\u003cspan>Status: Accepted\u003c/span> \u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Requirements\nsection: Planning\nupdated: 2026-11-18\nstatus: Accepted\n---\n# Requirements\n\nStated by the user on 2026-11-18. Apparate is a minimal Spotlight replacement for macOS, in the spirit of Raycast and Alfred. The motivation is that Spotlight is too slow.\n\n| ID | Requirement | Notes |\n| --- | --- | --- |\n| REQ-001 | Launch apps. | |\n| REQ-002 | Fuzzy matching, including acronyms. | Example: `VSC` launches Visual Studio Code. |\n| REQ-003 | Open files and folders in selected directories. | The user chooses which directories are searched. |\n| REQ-004 | Open System Settings items, including sub-items. | Example: Spotlight's \"Keyboard layouts\" result, which opens a specific section of Keyboard settings. |\n| REQ-005 | Prefix-controlled commands, configurable in settings. | Example: `'` searches only files and folders; `.` searches only settings items. |\n| REQ-006 | Very fast: almost no delay and no shifting of results. | Results should not jump around as they arrive. |\n| REQ-007 | Minimal resource and performance footprint. | Memory, CPU and energy use while idle and while searching. |\n\nAdded from the user's notes in the round-1 form, 2026-11-18:\n\n| ID | Requirement | Notes |\n| --- | --- | --- |\n| REQ-008 | Users can add folders to index and set a maximum folder depth. | Beyond the default folders in [DEC-005](decisions.md). |\n| REQ-009 | Web search, opened in the default browser. | Trigger and engine are open. |\n| REQ-010 | System commands: Lock, Sleep, Restart, Show Trash. | |\n\nThese are requirements, not implementation or verification claims. Accepted design choices are in [decisions](decisions.md).\n\nThe user also asked for research on how existing launchers achieve their speed and index files ([research](index.md#research)), and for suggestions for additional features.\n","toc":[],"titleAnchor":"requirements","links":["decisions","decisions","index"],"attachments":[],"html":"\u003cp>Stated by the user on 2026-11-18. Apparate is a minimal Spotlight replacement for macOS, in the spirit of Raycast and Alfred. The motivation is that Spotlight is too slow.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>ID\u003c/th>\n\u003cth>Requirement\u003c/th>\n\u003cth>Notes\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>REQ-001\u003c/td>\n\u003ctd>Launch apps.\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REQ-002\u003c/td>\n\u003ctd>Fuzzy matching, including acronyms.\u003c/td>\n\u003ctd>Example: \u003ccode>VSC\u003c/code> launches Visual Studio Code.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>REQ-003\u003c/td>\n\u003ctd>Open files and folders in selected directories.\u003c/td>\n\u003c
