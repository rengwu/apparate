 excludes ParsedQuery construction, queue delay, discovery and UI. The benchmark consumes row/highlight/score checksums outside the timing. No build or test jobs ran concurrently with the final measurements.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Items\u003c/th>\n\u003cth>Mode\u003c/th>\n\u003cth>Samples\u003c/th>\n\u003cth>Median ms\u003c/th>\n\u003cth>p95 ms\u003c/th>\n\u003cth>Maximum ms\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>20,000\u003c/td>\n\u003ctd>names\u003c/td>\n\u003ctd>300\u003c/td>\n\u003ctd>0.442\u003c/td>\n\u003ctd>0.596\u003c/td>\n\u003ctd>1.442\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>20,000\u003c/td>\n\u003ctd>paths\u003c/td>\n\u003ctd>189\u003c/td>\n\u003ctd>1.705\u003c/td>\n\u003ctd>2.658\u003c/td>\n\u003ctd>5.555\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>200,000\u003c/td>\n\u003ctd>names\u003c/td>\n\u003ctd>300\u003c/td>\n\u003ctd>2.788\u003c/td>\n\u003ctd>3.516\u003c/td>\n\u003ctd>5.015\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>200,000\u003c/td>\n\u003ctd>paths\u003c/td>\n\u003ctd>189\u003c/td>\n\u003ctd>4.755\u003c/td>\n\u003ctd>11.427\u003c/td>\n\u003ctd>18.261\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Items\u003c/th>\n\u003cth>Fixture generation ms\u003c/th>\n\u003cth>SearchIndex build ms\u003c/th>\n\u003cth>Baseline MiB\u003c/th>\n\u003cth>After build MiB\u003c/th>\n\u003cth>After searches MiB\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>20,000\u003c/td>\n\u003ctd>30.11\u003c/td>\n\u003ctd>61.69\u003c/td>\n\u003ctd>1.81\u003c/td>\n\u003ctd>14.19\u003c/td>\n\u003ctd>14.84\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>200,000\u003c/td>\n\u003ctd>286.68\u003c/td>\n\u003ctd>630.73\u003c/td>\n\u003ctd>1.81\u003c/td>\n\u003ctd>119.08\u003c/td>\n\u003ctd>56.00\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Memory is \u003ccode>phys_footprint\u003c/code> for the benchmark process, not a peak-allocation measurement. The 200k post-build reading is higher than the 100 MiB provisional app goal; the later search-phase reading is lower. Both are retained here. Preparation/rebuild overlap and the actual app's memory still need M3/M6 measurement.\u003c/p>\n\u003cp>The path workload deliberately includes costly and sparse cases. At 200k:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Query\u003c/th>\n\u003cth>Samples\u003c/th>\n\u003cth>Median ms\u003c/th>\n\u003cth>Maximum ms\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>project/\u003c/code>\u003c/td>\n\u003ctd>12\u003c/td>\n\u003ctd>10.044\u003c/td>\n\u003ctd>10.378\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sources/\u003c/code>\u003c/td>\n\u003ctd>6\u003c/td>\n\u003ctd>5.137\u003c/td>\n\u003ctd>5.322\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>p/s\u003c/code>\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3.843\u003c/td>\n\u003ctd>4.005\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>s/r\u003c/code>\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>3.736\u003c/td>\n\u003ctd>3.743\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>zzqv/\u003c/code>\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>8.945\u003c/td>\n\u003ctd>9.071\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>project/test\u003c/code>\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>18.045\u003c/td>\n\u003ctd>18.261\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Name-query list: \u003ccode>code\u003c/code>, \u003ccode>terminal\u003c/code>, \u003ccode>calendar\u003c/code>, \u003ccode>calculator\u003c/code>, \u003ccode>readme\u003c/code>, \u003ccode>report\u003c/code>, \u003ccode>network\u003c/code>, \u003ccode>project\u003c/code>, \u003ccode>sources\u003c/code>, \u003ccode>settings\u003c/code>, \u003ccode>archive\u003c/code>, \u003ccode>notes\u003c/code>, \u003ccode>cafe\u003c/code>, \u003ccode>strasse\u003c/code>, \u003ccode>東京\u003c/code>, \u003ccode>zzqv\u003c/code>.\u003c/p>\n\u003cp>Path-query list: \u003ccode>project/sources\u003c/code>, \u003ccode>project/tests\u003c/code>, \u003ccode>projects/readme\u003c/code>, \u003ccode>workspace/report\u003c/code>, \u003ccode>sources/network\u003c/code>, \u003ccode>docs/notes\u003c/code>, \u003ccode>archive/cafe\u003c/code>, \u003ccode>project/\u003c/code>, \u003ccode>sources/\u003c/code>, \u003ccode>p/s\u003c/code>, \u003ccode>s/r\u003c/code>, \u003ccode>zzqv/\u003c/code>, \u003ccode>project//sources\u003c/code>. Only prefixes that already contain a slash enter the path timing table, including trailing slashes typed before the final segment.\u003c/p>\n\u003cp>Corpus hashes:\u003c/p>\n\u003cul>\n\u003cli>20k: \u003ccode>7ac619d313a7456ec01a575985e5bdeb3253f4d577c8fd396a353190a4f759a6\u003c/code>.\u003c/li>\n\u003cli>200k: \u003ccode>56fb7726eb4e13632f181e3601cf78807455c25be65422eff4646e5e6b309b75\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"tuning-evidence-and-remaining-limits\">Tuning evidence and remaining limits\u003c/h2>\n\u003cp>The initial single-threaded 200k baseline (one repetition per prefix) measured name p95 \u003cstrong>50.924 ms\u003c/strong> and path p95 \u003cstrong>267.044 ms\u003c/strong>. Its \u003ca href=\"evidence/2026-11-18T154000Z-m1/baseline-200k.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 21d714c3f4c0d0a7aa9769e1bf9a901913fdfba8b19678e77971cdbf0ffb56fd\">raw samples\u003c/a> and \u003ca href=\"evidence/2026-11-18T154000Z-m1/baseline-source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 67de74c8c1b03d61520262727b41bd54e788280cae170d8e8138af2726b4a434\">input fingerprint\u003c/a> are retained as development evidence, not as the final build result. The full earlier source snapshot was not archived; the final source manifest is the reproducible handoff identity.\u003c/p>\n\u003cp>The final implementation skips candidates whose best possible tier/kind cannot enter the heap, uses the finite closed-form score for an optimal consecutive prefix, and caches repeated ancestor-chain scores for each query. It does not add parallel scoring. The exhaustive-alignment and bounded-versus-exhaustive tests guard those optimizations.\u003c/p>\n\u003cp>Final name p95 at 200k is below the guide's 8 ms core diagnostic target; path p95 remains above it. That path result and the immediate post-build footprint are review points. They do not justify an end-to-end app pass or an automatic switch to parallel work. The benchmark is synthetic, does not control other activity on the machine, and has no UI/discovery/action work.\u003c/p>\n\u003cp>Outside the selected M1 scope, therefore \u003cstrong>not tested here\u003c/strong>: real app/settings discovery, folder crawling and rebuilds, permission prompts, opening items/URLs, system actions, hotkey, panel rendering, visible latency, idle CPU, launch-at-login and upgrades. These remain later milestone work. Independent review passed with the packaging fix recorded below; no commit has been made.\u003c/p>\n\u003ch2 id=\"post-review-fix\">Post-review fix\u003c/h2>\n\u003cp>2026-11-18 16:01 UTC — applied Claude's requested packaging fix: \u003ccode>build.sh\u003c/code> now removes the old \u003ccode>build/Apparate.app\u003c/code> after a successful compile and before assembling its contents.\u003c/p>\n\u003cp>Created a synthetic stale resource in the existing bundle, ran \u003ccode>./build.sh\u003c/code>, and confirmed that the resource was absent afterward. Strict signature verification, the fixed designated requirement, arm64 architecture, version/minimum-OS/accessory metadata, system-library dependencies and the bundled fzy notice all passed. See the \u003ca href=\"evidence/2026-11-18T154000Z-m1/post-review-build.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 5890eeb2dc629fee9cef04362f99b50aeb693e0e89c0586c81cd0a0115106989\">rebuild log\u003c/a> and \u003ca href=\"evidence/2026-11-18T154000Z-m1/post-review-bundle-checks.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 6936614a8e106fb9ec3ba896eb80bdbac285facaba64bfc293f4fbcbd1c3fd0d\">bundle checks\u003c/a>. The rebuilt app also passed the \u003ca href=\"evidence/2026-11-18T154000Z-m1/post-review-app-smoke.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 19ee1b341a21dbc517fa6d18e3d67d9fe8a5750c8a6c408f4d3fddbec7b68629\">isolated startup check\u003c/a>; its owned process and temporary APPARATE_HOME were cleaned up.\u003c/p>\n\u003cp>Only \u003ccode>build.sh\u003c/code> changed among the recorded source/build/test inputs. The \u003ca href=\"evidence/2026-11-18T154000Z-m1/post-review-source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 5cc7eb8a21e1abc358c55c86a48021ae1b1e33cade22a8762911ca7f8afc65fc\">post-review source manifest\u003c/a> has SHA-256 \u003ccode>5cc7eb8a21e1abc358c55c86a48021ae1b1e33cade22a8762911ca7f8afc65fc\u003c/code>. Core/test sources and the release test binary are unchanged, so the earlier correctness and benchmark evidence is retained without another run. The app was relinked; its new binary hash is recorded in the bundle checks and startup was rechecked. The earlier fingerprint check's assumption of an identical app binary was therefore not retained as a requirement.\u003c/p>\n\u003cp>\u003cstrong>Post-review result: Passed.\u003c/strong> Claude's requested fix is verified. Commit remains on hold; no git command was run.\u003c/p>\n","backlinks":["index","build/m1-foundation","features/config","features/search","plan","verification/setup"]},{"id":"verification/setup","title":"Verification setup","section":"Verification","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Verification setup\nsection: Verification\nupdated: 2026-11-18\n---\n# Verification setup\n\nRun these commands from the Apparate project root. M1 needs macOS 27 on arm64, Swift 6.4.2 Command Line Tools, Python 3 for the app-stub smoke helper, and Node.js 22+ for the wiki. No package downloads, account, network service or full Xcode installation are needed. The tests use an executable harness because XCTest and Swift Testing are unavailable in the checked Command Line Tools environment.\n\n## Build and identity\n\n```sh\nswift --version\nsw_vers\n./build.sh\ncodesign --verify --deep --strict build/Apparate.app\ncodesign -d -r- build/Apparate.app\n```\n\nThe bundle must identify as `local.apparate`, version `0.1.0`, minimum system `27.0`, arm64 only, with `LSUIElement` true and designated requirement `identifier \"local.apparate\"`. `build.sh` validates VERSION, builds release arm64, removes the old bundle before assembly, includes the fzy notice, signs ad hoc and verifies the bundle. It does not install or launch it.\n\nThere is no git revision for the initial M1 handoff. The [run](runs/2026-11-18T154000Z-m1.md) links a SHA-256 manifest of every package, build, source and test input. Verify it before treating the recorded outcome as evidence for a checkout:\n\n```sh\npython3 - \u003c\u003c'PY'\nimport hashlib, json\nfrom pathlib import Path\nmanifest = json.loads(Path('docs/wiki/evidence/2026-11-18T154000Z-m1/post-review-source-manifest.json').read_text())\nchanged = [name for name, expected in manifest.items()\n           if not Path(name).is_file() or hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected]\nassert not changed, 'Inputs differ: ' + ', '.join(changed)\nprint('Source manifest matches')\nPY\n```\n\n## Correctness and isolation\n\n```sh\nswift run ApparateCoreTests\nswift build -c release --product ApparateCoreTests\napparate_bin=\"$(swift build -c release --show-bin-path)\"\n\"$apparate_bin/ApparateCoreTests\"\npython3 Tests/smoke-app.py\n```\n\nThe harness prints `PASS`/`FAIL` for each group, a final count, and exits nonzero on failure. Fixtures include only synthetic paths and public app names. Every persistence scenario creates a UUID temporary directory and removes it after checking results. It never discovers apps, crawls folders, opens URLs, invokes system actions or reads real launcher data.\n\nThe smoke helper starts only the built bundle executable, with its own temporary `APPARATE_HOME`. Readiness means the process remains alive and version-1 `config.json` appears there. It checks defaults, file contents and the created-file list; it stops only its own process and removes only its own directory. It prints a small JSON receipt without temporary paths or account names. No UI is implemented in this stub. Never run the app against its default data folder for M1 verification.\n\nThe config-watch scenario uses real file operations and awaits the store's observed state for up to three seconds. It checks in-place writes, atomic saves, rearming, deletion/recreation, invalid-file recovery and notification settling. The generation tests hold the worker or owner with explicit semaphores/fences; they do not depend on a lucky typing delay.\n\n## Release measurements\n\nRun after the release build, without concurrent build/test jobs. Each size gets a fresh process:\n\n```sh\napparate_bin=\"$(swift build -c release --show-bin-path)\"\n\"$apparate_bin/ApparateCoreTests\" --benchmark 20000 --rounds 3 > /private/tmp/apparate-m1-20k.json\n\"$apparate_bin/ApparateCoreTests\" --benchmark 200000 --rounds 3 > /private/tmp/apparate-m1-200k.json\n```\n\nBenchmark corpus version 1 uses seed `4170706172617465` (hex), 120 synthetic apps, 120 synthetic settings and a mix of folders/files under 900 synthetic project names. Names include ASCII, accents, expansions, CJK and emoji. Directory chains repeat; names and IDs remain unique. The JSON includes the corpus SHA-256, full query lists and every timed keystroke. It times complete top-50 selection and displayed-character highlights; result checksums are consumed after timing. It excludes `ParsedQuery` construction, coordinator queue delay, discovery, actions and UI. Internal query folding and matching are included. There are five warmup searches and three repetitions per typed prefix.\n\nPath samples start when the first slash is typed, including trailing slash, common short segments, repeated separators and no-hit paths. Names and paths are summarized separately with median, p95 and maximum. `preparation_ms` is SearchIndex construction only; fixture generation is separate. `phys_footprint` is reported at process baseline, immediately after construction, and after searching. It is process physical footprint, not a Swift allocation count or peak-memory measurement.\n\nKeep the complete JSON in the run's evidence directory, together with sanitized build/test output and a source manifest. Do not claim an end-to-end latency pass from these core-only measurements.\n\n## Records and cleanup\n\nThe current run lives under `verification/runs/`; linked evidence is under `evidence/\u003crun-id>/`. The test and smoke helpers clean their temporary data automatically. Preserve the bundle, sources and evidence for review. No state-changing git command is part of this procedure; commit only after the independent milestone review and repository authorization.\n\nAfter editing wiki pages or evidence:\n\n```sh\nnode \"$JSTACK/skills/verify-change/scripts/check-reports.mjs\" docs/wiki\nnode docs/wiki/_build.mjs\nnode docs/wiki/_build.mjs --check\n```\n\nSet `JSTACK` to the reader's own jstack checkout for the metadata checker; it is local tooling, not a product dependency. Wiki checks establish document structure, not product correctness.\n","toc":[{"id":"build-and-identity","title":"Build and identity","depth":2},{"id":"correctness-and-isolation","title":"Correctness and isolation","depth":2},{"id":"release-measurements","title":"Release measurements","depth":2},{"id":"records-and-cleanup","title":"Records and cleanup","depth":2}],"titleAnchor":"verification-setup","links":["verification/runs/2026-11-18T154000Z-m1"],"attachments":[],"html":"\u003cp>Run these commands from the Apparate project root. M1 needs macOS 27 on arm64, Swift 6.4.2 Command Line Tools, Python 3 for the app-stub smoke helper, and Node.js 22+ for the wiki. No package downloads, account, network service or full Xcode installation are needed. The tests use an executable harness because XCTest and Swift Testing are unavailable in the checked Command Line Tools environment.\u003c/p>\n\u003ch2 id=\"build-and-identity\">Build and identity\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sh\">swift --version\nsw_vers\n./build.sh\ncodesign --verify --deep --strict build/Apparate.app\ncodesign -d -r- build/Apparate.app\n\u003c/code>\u003c/pre>\n\u003cp>The bundle must identify as \u003ccode>local.apparate\u003c/code>, version \u003ccode>0.1.0\u003c/code>, minimum system \u003ccode>27.0\u003c/code>, arm64 only, with \u003ccode>LSUIElement\u003c/code> true and designated requirement \u003ccode>identifier \"local.apparate\"\u003c/code>. \u003ccode>build.sh\u003c/code> validates VERSION, builds release arm64, removes the old bundle before assembly, includes the fzy notice, signs ad hoc and verifies the bundle. It does not install or launch it.\u003c/p>\n\u003cp>There is no git revision for the initial M1 handoff. The \u003ca href=\"#/verification/runs/2026-11-18T154000Z-m1\">run\u003c/a> links a SHA-256 manifest of every package, build, source and test input. Verify it before treating the recorded outcome as evidence for a checkout:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">python3 - &lt;&lt;'PY'\nimport hashlib, json\nfrom pathlib import Path\nmanifest = json.loads(Path('docs/wiki/evidence/2026-11-18T154000Z-m1/post-review-source-manifest.json').read_text())\nchanged = [name for name, expected in manifest.items()\n           if not Path(name).is_file() or hashlib.sha256(Path(name).read_bytes()).hexdigest() != expected]\nassert not changed, 'Inputs differ: ' + ', '.join(changed)\nprint('Source manifest matches')\nPY\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"correctness-and-isolation\">Correctness and isolation\u003c/h2>\n\u003cpre>\u003ccode class=\"language-sh\">swift run ApparateCoreTests\nswift build -c release --product ApparateCoreTests\napparate_bin=\"$(swift build -c release --show-bin-path)\"\n\"$apparate_bin/ApparateCoreTests\"\npython3 Tests/smoke-app.py\n\u003c/code>\u003c/pre>\n\u003cp>The harness prints \u003ccode>PASS\u003c/code>/\u003ccode>FAIL\u003c/code> for each group, a final count, and exits nonzero on failure. Fixtures include only synthetic paths and public app names. Every persistence scenario creates a UUID temporary directory and removes it after checking results. It never discovers apps, crawls folders, opens URLs, invokes system actions or reads real launcher data.\u003c/p>\n\u003cp>The smoke helper starts only the built bundle executable, with its own temporary \u003ccode>APPARATE_HOME\u003c/code>. Readiness means the process remains alive and version-1 \u003ccode>config.json\u003c/code> appears there. It checks defaults, file contents and the created-file list; it stops only its own process and removes only its own directory. It prints a small JSON receipt without temporary paths or account names. No UI is implemented in this stub. Never run the app against its default data folder for M1 verification.\u003c/p>\n\u003cp>The config-watch scenario uses real file operations and awaits the store's observed state for up to three seconds. It checks in-place writes, atomic saves, rearming, deletion/recreation, invalid-file recovery and notification settling. The generation tests hold the worker or owner with explicit semaphores/fences; they do not depend on a lucky typing delay.\u003c/p>\n\u003ch2 id=\"release-measurements\">Release measurements\u003c/h2>\n\u003cp>Run after the release build, without concurrent build/test jobs. Each size gets a fresh process:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">apparate_bin=\"$(swift build -c release --show-bin-path)\"\n\"$apparate_bin/ApparateCoreTests\" --benchmark 20000 --rounds 3 &gt; /private/tmp/apparate-m1-20k.json\n\"$apparate_bin/ApparateCoreTests\" --benchmark 200000 --rounds 3 &gt; /private/tmp/apparate-m1-200k.json\n\u003c/code>\u003c/pre>\n\u003cp>Benchmark corpus version 1 uses seed \u003ccode>4170706172617465\u003c/code> (hex), 120 synthetic apps, 120 synthetic settings and a mix of folders/files under 900 synthetic project names. Names include ASCII, accents, expansions, CJK and emoji. Directory chains repeat; names and IDs remain unique. The JSON includes the corpus SHA-256, full query lists and every timed keystroke. It times complete top-50 selection and displayed-character highlights; result checksums are consumed after timing. It excludes \u003ccode>ParsedQuery\u003c/code> construction, coordinator queue delay, discovery, actions and UI. Internal query folding and matching are included. There are five warmup searches and three repetitions per typed prefix.\u003c/p>\n\u003cp>Path samples start when the first slash is typed, including trailing slash, common short segments, repeated separators and no-hit paths. Names and paths are summarized separately with median, p95 and maximum. \u003ccode>preparation_ms\u003c/code> is SearchIndex construction only; fixture generation is separate. \u003ccode>phys_footprint\u003c/code> is reported at process baseline, immediately after construction, and after searching. It is process physical footprint, not a Swift allocation count or peak-memory measurement.\u003c/p>\n\u003cp>Keep the complete JSON in the run's evidence directory, together with sanitized build/test output and a source manifest. Do not claim an end-to-end latency pass from these core-only measurements.\u003c/p>\n\u003ch2 id=\"records-and-cleanup\">Records and cleanup\u003c/h2>\n\u003cp>The current run lives under \u003ccode>verification/runs/\u003c/code>; linked evidence is under \u003ccode>evidence/&lt;run-id&gt;/\u003c/code>. The test and smoke helpers clean their temporary data automatically. Preserve the bundle, sources and evidence for review. No state-changing git command is part of this procedure; commit only after the independent milestone review and repository authorization.\u003c/p>\n\u003cp>After editing wiki pages or evidence:\u003c/p>\n\u003cpre>\u003ccode class=\"language-sh\">node \"$JSTACK/skills/verify-change/scripts/check-reports.mjs\" docs/wiki\nnode docs/wiki/_build.mjs\nnode docs/wiki/_build.mjs --check\n\u003c/code>\u003c/pre>\n\u003cp>Set \u003ccode>JSTACK\u003c/code> to the reader's own jstack checkout for the metadata checker; it is local tooling, not a product dependency. Wiki checks establish document structure, not product correctness.\u003c/p>\n","backlinks":["index","features/config","features/index","features/search","verification/runs/2026-11-18T154000Z-m1"]}],"sections":["Overview","Build","Features","Planning","Research","Spikes","Verification"]}</script>
<script>(() => {
  'use strict';
  const {title:wikiTitle,pages,sections} = JSON.parse(document.getElementById('wiki-data').textContent);
  const byId = new Map(pages.map(p=>[p.id,p]));
  const $ = id => document.getElementById(id);
  const colorScheme = matchMedia('(prefers-color-scheme: dark)');
  const colorInputs = document.querySelectorAll('input[name="color"]');
  function setColor(preference) {
    if (!['automatic', 'light', 'dark'].includes(preference)) preference = 'automatic';
    document.documentElement.dataset.colorPreference = preference;
    document.documentElement.dataset.theme = preference === 'automatic' ? (colorScheme.matches ? 'dark' : 'light') : preference;
    colorInputs.forEach(input => { input.checked = input.value === preference; });
  }
  setColor(document.documentElement.dataset.colorPreference);
  colorInputs.forEach(input => input.addEventListener('change', () => {
    setColor(input.value);
    try { localStorage.setItem('planning-wiki-color', input.value); } catch {}
  }));
  colorScheme.addEventListener('change', () => setColor(document.documentElement.dataset.colorPreference));
  window.addEventListener('storage', event => {
    if (event.key === 'planning-wiki-color' || event.key === null) setColor(event.newValue);
  });
  document.addEventListener('click', event => {
    if (!$('appearance').contains(event.target)) $('appearance').open = false;
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape' && $('appearance').open) {
      $('appearance').open = false;
      $('appearance').querySelector('summary').focus();
    }
  });
  let current = null;
  const link = (label,href) => { const a=document.createElement('a'); a.textContent=label; a.href=href; return a; };
  const route = id => '#/'+id.split('/').map(s=>encodeURIComponent(s).replace(/~/g,'%7E')).join('/');
  for (const section of sections) {
    const group=document.createElement('div');group.className='nav-group';
    const label=document.createElement('div');label.className='nav-group-label';label.textContent=section;group.append(label);
    pages.filter(p=>p.section===section).forEach(p=>{const a=link(p.id==='index'?'Main page':p.title,route(p.id));a.dataset.page=p.id;group.append(a);});
    $('navigation').append(group);
  }
  if (matchMedia('(max-width: 700px)').matches) $('navigation-details').open=false;
  function mode(source) {
    $('article-view').hidden=source;
    $('source-view').hidden=!source;
    $('read-tab').classList.toggle('selected',!source);
    $('source-tab').classList.toggle('selected',source);
    $('read-tab').setAttribute('aria-pressed',String(!source));
    $('source-tab').setAttribute('aria-pressed',String(source));
    $('contents').hidden=source || !current?.toc.length;
  }
  function markText(text,query) {
    const fragment=document.createDocumentFragment();
    const lower=text.toLowerCase(), needle=query.toLowerCase();
    let start=0, at;
    while (needle && (at=lower.indexOf(needle,start))!==-1) {
      fragment.append(document.createTextNode(text.slice(start,at)));
      const mark=document.createElement('mark');mark.textContent=text.slice(at,at+query.length);fragment.append(mark);start=at+query.length;
    }
    fragment.append(document.createTextNode(text.slice(start)));return fragment;
  }
  function search(query) {
    current=null;
    $('search').value=query;
    $('page-title').textContent='Search results';
    $('page-meta').hidden=true;document.querySelector('.toolbar').hidden=true;
    $('article-view').hidden=true;$('source-view').hidden=true;$('search-results').hidden=false;$('toc').replaceChildren();
    $('contents').hidden=true;
    const terms=query.toLowerCase().split(/\s+/).filter(Boolean);
    const matches=terms.length?pages.filter(p=>terms.every(t=>(p.title+' '+p.source).toLowerCase().includes(t))).sort((a,b)=>Number(b.title.toLowerCase().includes(query.toLowerCase()))-Number(a.title.toLowerCase().includes(query.toLowerCase()))):[];
    $('result-count').textContent=terms.length?`${matches.length} ${matches.length===1?'article':'articles'} matching “${query}”${matches.length?'':'. Try fewer words or a broader term.'}`:'Enter a word or phrase to search all articles.';
    $('results').replaceChildren();
    for (const p of matches) {
      const card=document.createElement('div');card.className='result';
      const small=document.createElement('small');small.textContent=p.section;
      const h=document.createElement('h2'),a=link('',route(p.id));a.append(markText(p.title,query));h.append(a);
      const excerpt=document.createElement('p');
      const plain=p.source.replace(/^---\n[\s\S]*?\n---\n/,'').replace(/[#*`|]/g,'').replace(/\[([^\]]+)\]\([^)]+\)/g,'$1').replace(/\s+/g,' ');
      const position=plain.toLowerCase().indexOf(terms[0]);const start=Math.max(0,position-65);
      excerpt.append(markText((start?'…':'')+plain.slice(start,start+240)+(plain.length>start+240?'…':''),query));
      card.append(small,h,excerpt);$('results').append(card);
    }
    document.title='Search — '+wikiTitle;
  }
  function render() {
    const rawHash=location.hash.slice(1);
    document.querySelectorAll('[aria-current=page]').forEach(a=>a.removeAttribute('aria-current'));
    if(rawHash.startsWith('/search?')) {search(new URLSearchParams(rawHash.slice(8)).get('q')||'');window.scrollTo(0,0);return;}
    let id='index',anchor='';
    try {
      const parts=(rawHash.startsWith('/')?rawHash.slice(1):'index').split('~');
      id=decodeURIComponent(parts[0]);anchor=decodeURIComponent(parts[1]||'');
    } catch {id='__invalid_route__';}

    const p=byId.get(id||'index');
    $('search-results').hidden=true;document.querySelector('.toolbar').hidden=!p;$('page-meta').hidden=!p;
    current=p||null;mode(false);
    if(!p){
      $('page-title').textContent='Page not found';
      $('article').replaceChildren(link('Return to the main page',route('index')));$('toc').replaceChildren();$('backlinks').hidden=true;document.title='Page not found — '+wikiTitle;return;
    }
    $('search').value='';$('page-title').textContent=p.title;
    $('page-meta').innerHTML=p.metadataHtml;
    $('page-meta').hidden=!p.metadataHtml;
    $('article').innerHTML=p.html;
    $('source-text').textContent=p.source;$('source-path').textContent=p.id+'.md';
    $('toc').replaceChildren();
    p.toc.forEach(h=>{const a=link(h.title,route(p.id)+'~'+h.id);if(h.depth>2)a.className='nested';$('toc').append(a);});
    $('backlink-list').replaceChildren();$('backlinks').hidden=!p.backlinks.length;
    p.backlinks.forEach(id=>$('backlink-list').append(link(byId.get(id).title,route(id))));
    document.querySelectorAll('[data-page]').forEach(a=>{if(a.dataset.page===p.id)a.setAttribute('aria-current','page');});
    document.title=p.id==='index'?wikiTitle:p.title+' — '+wikiTitle;
    if(anchor)requestAnimationFrame(()=>{if(anchor===p.titleAnchor)$('page-title').scrollIntoView();else document.getElementById(anchor)?.scrollIntoView();});else window.scrollTo(0,0);
  }
  $('search-form').addEventListener('submit',e=>{e.preventDefault();const hash='/search?q='+encodeURIComponent($('search').value.trim());if(location.hash==='#'+hash)render();else location.hash=hash;});
  $('read-tab').addEventListener('click',()=>mode(false));$('source-tab').addEventListener('click',()=>mode(true));
  $('print').addEventListener('click',()=>{mode(false);window.print();});
  document.querySelector('.skip').addEventListener('click',e=>{e.preventDefault();const target=$('search-results').hidden?$('article'):$('main');target.focus();target.scrollIntoView();});
  $('download').addEventListener('click',()=>{
    if(!current)return;const url=URL.createObjectURL(new Blob([current.source],{type:'text/markdown;charset=utf-8'}));
    const a=link('',url);a.download=current.id.split('/').pop()+'.md';document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
  document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!e.metaKey&&!e.ctrlKey&&!e.altKey){e.preventDefault();$('search').focus();}});
  document.addEventListener('click',e=>{const a=e.target.closest('a');if(a?.getAttribute('href')?.startsWith('#/')&&matchMedia('(max-width: 700px)').matches)$('navigation-details').open=false;});
  window.addEventListener('hashchange',render);
  render();
})();
</script>
