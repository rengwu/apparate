research on how existing launchers achieve their speed and index files (\u003ca href=\"#/index~research\">research\u003c/a>), and for suggestions for additional features.\u003c/p>\n","backlinks":["index","build/m1-foundation","decisions","plan","research/alignment","research/codex/report","spikes/2026-11-18-settings-deep-links"]},{"id":"research/alignment","title":"Research alignment","section":"Research","order":0,"metadata":{"status":"Agreed by Claude and Codex"},"metadataHtml":"\u003cspan>Status: Agreed by Claude and Codex\u003c/span> \u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Research alignment\nsection: Research\nupdated: 2026-11-18\nstatus: Agreed by Claude and Codex\n---\n# Research alignment\n\nClaude and Codex researched the whole topic independently, as the user asked, and then reviewed each other's work. This page records where the two reports agree, where they differed and how each difference was resolved, and which decisions belong to the user. Codex reviewed two drafts and approved this version on 2026-11-18 (\"ALIGNMENT OK\"). Its approval covers the research alignment only; the performance budgets and settings navigation are not yet demonstrated.\n\n- [Claude research report](claude/report.md) and its [benchmark](claude/benchmark.md)\n- [Codex research report](codex/report.md), with its [source review](codex/open-source-launchers.md), [fuzzy matching analysis](codex/fuzzy-matching.md) and [benchmark](codex/benchmark.md)\n\n## How the comparison was done\n\n1. Both agents worked from the same brief: the user's [requirements](../requirements.md), jstack conventions, and shared machine facts (hardware, toolchain, app count, the location of the settings `.searchTerms` files).\n2. The task was first split between the agents. About ten minutes in, the user asked for independent, full-scope research instead. Both agents expanded their work to the full outline and carried their earlier research forward.\n3. Before that change, the agents had exchanged a few findings:\n   - Codex sent Claude: Sol's 1,000-row cap, Raycast's documented ranking order, and Alfred's initials matching.\n   - Claude sent Codex: Raycast 2.0's own indexer and memory figures, Alfred's reliance on Spotlight, LaunchBar's rule-based index, and a pointer to Tinycast.\n\n   Agreement on those points is not fully independent. Each agent re-verified them in primary sources.\n4. Neither agent read the other's report until both were marked done. Codex then reviewed Claude's report (nine corrections). Claude reviewed Codex's report and applied the corrections it accepted, marked inline in [its corrections section](claude/report.md#corrections-after-review). Codex keeps its report as its independent baseline. Its only later additions are two post-comparison verifications, each labelled as such: the legacy settings count and the Keyboard pane's icon metadata.\n\n## Agreed conclusions\n\nThese are shared conclusions after comparison. Some rest on findings exchanged early (disclosed above), and some were adopted after review. The evidence is in each report.\n\n| Topic | Shared conclusion |\n| --- | --- |\n| Stack | Swift + AppKit for the launcher panel and list; SwiftUI acceptable for the settings window. A web runtime adds memory with no benefit for a macOS-only app. |\n| Window | Create one non-activating `NSPanel` at launch, keep it alive, and show or hide it. Never build UI on the hotkey path. |\n| Hotkey | Carbon `RegisterEventHotKey`; no Accessibility permission for the basic launcher. |\n| Process | One process to start. Add a helper process, mmap snapshots or bulk syscalls only if measurement shows a need. |\n| Apps | Scan the standard application folders, watch them for changes, and keep localized and alternate names. Nothing is discovered per keystroke. |\n| Files | Own filename-only index for user-selected roots. Default exclusions for dependency, VCS and build folders. FSEvents with a persisted checkpoint and explicit recovery (`MustScanSubDirs`, wrapped IDs, root changes). Spotlight stays optional, for a later content search. |\n| Settings | Read panes and sub-items from `Info.plist` and `.searchTerms` files in both ExtensionKit extensions and legacy `.prefPane` bundles (42 files / 691 English entries on macOS 27). Cache per OS build and locale. Opening a sub-item by URL anchor and extracting each pane's icon are both **unverified**; fall back to the pane and a generic icon. |\n| Matching | fzy-style scorer over prepared, folded names, with a 64-bit character mask and a subsequence pre-check. Select the top K; never fully sort. `VSC` must work without an alias. |\n| Ranking | Tiers first: exact/alias, prefix, word-start/acronym, then general fuzzy. Learned usage changes order only within comparable match quality. Ties break deterministically. |\n| Result stability | Search one consistent snapshot, publish one complete list per query, drop obsolete query generations, fixed row geometry, keep the selected item by stable ID. |\n| Scope of the first version | Name/path search only, no file contents. Defer clipboard history, window management, AI, extensions and sync. |\n| Commercial launchers | Raycast 2.0 has its own file indexer (v1 used Spotlight). Alfred relies on the Spotlight index. LaunchBar scans rule-defined folders. |\n\n## Differences and how they were resolved\n\n| # | Topic | Claude | Codex | Resolution |\n| --- | --- | --- | --- | --- |\n| 1 | Why Spotlight is slow | Per-keystroke daemon queries and async result merging (stated as fact) | Not profiled; don't assign a cause | **Codex's position.** Causes are inference in both reports. |\n| 2 | \"Fast launchers avoid per-keystroke IPC\" | Stated as a common factor | Counterexamples: Flow → Everything (IPC), Raycast 2.0 (several runtimes) | **Codex's position.** Reworded: predictable latency and one complete result set matter, not where the data lives. |\n| 3 | Where search runs | Synchronously on the main thread | Serial cancellable worker, generation numbers, atomic publish | **Codex's position.** Background scoring avoids doing search work on the UI thread. Locking, publication and indexing contention still need measurement. Stability comes from four parts together: atomic publication, generation guards, snapshot consistency and selected-ID handling. |\n| 4 | Sol's file matcher | fuse.js | `NSString.scoreAgainst` + alphabetical sort; MiniSearch for root search | **Codex correct.** Verified in Sol at `873ae1c`. |\n| 5 | Settings item count | 42 files / 691 entries | 41 / 688 | **Both correct** for their scope. ExtensionKit has 41 / 688; the legacy `DateAndTime.prefPane` adds 1 / 3. |\n| 6 | Directory enumeration | Cited Tinycast's `getattrlistbulk`; said the choice matters little at this scale | Start with `FileManager.enumerator`; `getattrlistbulk` only if measured as a bottleneck | **Codex's position** (simplest first). Claude agrees. |\n| 7 | Index persistence | Compact snapshot file + last event ID | SQLite records + immutable in-memory search arrays | **Codex's position.** Usage history needs durable storage anyway, so one engine (system SQLite, no dependency) serves both. Revisit if measured. |\n| 8 | Performance budgets | Hotkey ≤ 16 ms, query ≤ 8 ms at 20k, idle ≤ 40 MB at 20k | Hotkey p95 ≤ 33 ms, query p95 ≤ 16 ms at 20k / ≤ 33 ms at 200k, ≤ 60 MiB at 20k / ≤ 100 MiB at 200k | **Proposed:** Claude's numbers as targets, Codex's as acceptance limits, with Codex's boundaries. Hotkey latency is warm hotkey to presented frame, at p95. Query latency is input to stable displayed results, at p95, not scorer time. Memory is `phys_footprint` in MiB, including helper processes. Nothing has been achieved yet; there is no prototype. Raised with the user. |\n| 9 | Benchmark numbers | 200k names, 1 thread, **including** top-50 selection: 1.303 ms = mean over keystrokes of each keystroke's best of 7 runs; 5.216 ms = the maximum of those per-keystroke minima | 200k names, 1 thread, **excluding** top-K selection: 3.941 ms = median of eleven query medians; 0.2–6.3 ms = range of query medians. Full paths: 43.9 ms median of query medians, up to 80.8 ms (a query median) | **Compatible, not comparable.** Neither figure is an observed worst case or p95 latency. Corpora, queries and statistics differ. Combined lesson: match names first. Full-path scoring at 200k does not fit a frame, so path search needs its own mode (Codex proposes typing `/`). |\n| 10 | Configuration | Config file first, settings window later | Small settings window backed by versioned JSON. REQ-005 already says prefixes are \"configurable in settings\". | **Codex's position is the requirement.** v1 has versioned JSON plus a small native settings window. Starting with a file only would be a scope change, so the user decides whether to defer the window. |\n| 11 | Default result mix | Kind priority apps > settings > folders > files, because `term` ranked two files above Terminal | Tiers plus bounded usage; result mix is a user decision | **Combined:** tiers first, kind priority within a tier; the default mix is a **user decision**. |\n| 12 | Feature priority | Calculator, quicklinks, running-app and system commands in priority 1 | Calculator and quicklinks \"next\"; index status, exclusions editor and ranking reset first | **Open: user decision.** Both put aliases and file actions first. |\n| 13 | Frecency formula | Tinycast's: +100 per open, 10-day half-life | Bounded log term, 30-day half-life, small weight | **Implementation detail.** Tune against golden examples during the build. |\n| 14 | Settings icons | Content-type icons from `ISGraphicIconConfiguration` (as Tinycast does) | The extension's `IconName` resource, with fallback | **Unverified.** Test both in the settings spike. |\n| 15 | TCC and signing | Ad-hoc signed rebuilds lose grants (stated as fact in the summary) | Unverified; add `NSOpenPanel` / security-scoped bookmarks | **Codex's position.** Test directly during development. |\n\n## Findings only one report had\n\n**Only Codex** (adopted into the recommendation):\n\n- Enter must open the item the user can see selected, never an item that ranked into that row after a later update.\n- Unicode, CJK and IME composition need a non-ASCII matching path; both benchmarks fold ASCII only.\n- Licences: Tinycast is AGPL-3.0 and Albert is source-available with restrictions. Learn from their designs; don't copy code.\n- Incremental narrowing must filter the previous complete match set, never the visible top K.\n- Dataless iCloud files can trigger downloads if read; the crawler must not touch file contents.\n- plocate-style trigram prefilters would reject acronym queries such as `vsc`.\n\n**Only Claude:**\n\n- A minimal hidden AppKit shell holding 23k names measured **18 MB `phys_footprint`** (as reported by `footprint`), with 0% CPU. It had no production index structures, icon cache, settings UI or active drawing. For context, Raycast's May 2026 figures are 200–450 MB, vendor-reported after usage, not a controlled comparison.\n- The tested `mdfind` query did not find \"Keyboard layouts\", while `.searchTerms` provides a catalog that can be read directly. Whether settings items exist in other Spotlight stores was not established. Neither Tinycast nor Sol offers sub-items, so this is a gap Apparate can fill.\n- Fully sorting all hits made one-letter queries the slowest keystroke; bounded top-K fixed it.\n- Raycast's File Search manual describes its defaults: home folder + `/Applications`, name-only, honours `.gitignore`/`.ignore`, filters `node_modules` and caches.\n- ⌘Space conflicts with Spotlight until its shortcut is disabled.\n\n## Joint recommendation\n\nSwift 6 + AppKit agent app (no Dock icon), one process:\n\n- **Panel:** a non-activating `NSPanel` built at launch, with a search field and a fixed-row-height list.\n- **Hotkey:** Carbon `RegisterEventHotKey`.\n- **Sources:** apps from the application folders; settings panes and sub-items from `.searchTerms` in ExtensionKit extensions and legacy `.prefPane` bundles; files and folders from user-selected roots. Files are indexed by name only, persisted in SQLite, and kept current with FSEvents.\n- **Query path:**\n  1. Parse the configurable prefix (`'` files, `.` settings).\n  2. A serial worker matches the scope with an fzy-style scorer, mask and pre-check.\n  3. Results are ranked by tier, then kind and learned usage, and the top K is selected.\n  4. The complete list is published once per current query generation.\n- **Path search** gets its own mode instead of scoring every full path.\n- **Config:** versioned JSON plus a small native settings window (REQ-005). Starting with the file only would need an explicit scope change (decision 2).\n\nBefore building the product, run two short spikes:\n\n1. **Settings deep links:** for each `.searchTerms` group key, check whether `x-apple.systempreferences:\u003cpane id>?\u003ckey>` opens the right section, and which icon source works.\n2. **Panel latency and memory:** measure hotkey-to-first-frame, keystroke-to-results, and `phys_footprint` on a minimal build.\n\n## Decisions for the user\n\n1. **Default result mix:** what an unprefixed query searches, and in what order.\n2. **Settings window:** keep it in v1 as REQ-005 states, or defer it and start with the JSON file.\n3. **Hotkey:** take over ⌘Space, or use another chord.\n4. **File roots:** which folders are indexed by default, and whether `.gitignore` is respected.\n5. **v1 features** beyond the core: see differences 11 and 12.\n6. **Performance budgets:** accept the targets and limits in difference 8.\n7. **Minimum macOS version:** settings data, available APIs and testing scope depend on it (raised in Codex's risks).\n8. **Distribution:** personal use, or public (Developer ID signing and notarization).\n9. **Next step:** the spikes above, an implementation plan, or more research.\n","toc":[{"id":"how-the-comparison-was-done","title":"How the comparison was done","depth":2},{"id":"agreed-conclusions","title":"Agreed conclusions","depth":2},{"id":"differences-and-how-they-were-resolved","title":"Differences and how they were resolved","depth":2},{"id":"findings-only-one-report-had","title":"Findings only one report had","depth":2},{"id":"joint-recommendation","title":"Joint recommendation","depth":2},{"id":"decisions-for-the-user","title":"Decisions for the user","depth":2}],"titleAnchor":"research-alignment","links":["research/claude/report","research/claude/benchmark","research/codex/report","research/codex/open-source-launchers","research/codex/fuzzy-matching","research/codex/benchmark","requirements","research/claude/report"],"attachments":[],"html":"\u003cp>Claude and Codex researched the whole topic independently, as the user asked, and then reviewed each other's work. This page records where the two reports agree, where they differed and how each difference was resolved, and which decisions belong to the user. Codex reviewed two drafts and approved this version on 2026-11-18 (\"ALIGNMENT OK\"). Its approval covers the research alignment only; the performance budgets and settings navigation are not yet demonstrated.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/research/claude/report\">Claude research report\u003c/a> and its \u003ca href=\"#/research/claude/benchmark\">benchmark\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"#/research/codex/report\">Codex research report\u003c/a>, with its \u003ca href=\"#/research/codex/open-source-launchers\">source review\u003c/a>, \u003ca href=\"#/research/codex/fuzzy-matching\">fuzzy matching analysis\u003c/a> and \u003ca href=\"#/research/codex/benchmark\">benchmark\u003c/a>\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"how-the-comparison-was-done\">How the comparison was done\u003c/h2>\n\u003col>\n\u003cli>\u003cp>Both agents worked from the same brief: the user's \u003ca href=\"#/requirements\">requirements\u003c/a>, jstack conventions, and shared machine facts (hardware, toolchain, app count, the location of the settings \u003ccode>.searchTerms\u003c/code> files).\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>The task was first split between the agents. About ten minutes in, the user asked for independent, full-scope research instead. Both agents expanded their work to the full outline and carried their earlier research forward.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Before that change, the agents had exchanged a few findings:\u003c/p>\n\u003cul>\n\u003cli>Codex sent Claude: Sol's 1,000-row cap, Raycast's documented ranking order, and Alfred's initials matching.\u003c/li>\n\u003cli>Claude sent Codex: Raycast 2.0's own indexer and memory figures, Alfred's reliance on Spotlight, LaunchBar's rule-based index, and a pointer to Tinycast.\u003c/li>\n\u003c/ul>\n\u003cp>Agreement on those points is not fully independent. Each agent re-verified them in primary sources.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Neither agent read the other's report until both were marked done. Codex then reviewed Claude's report (nine corrections). Claude reviewed Codex's report and applied the corrections it accepted, marked inline in \u003ca href=\"#/research/claude/report~corrections-after-review\">its corrections section\u003c/a>. Codex keeps its report as its independent baseline. Its only later additions are two post-comparison verifications, each labelled as such: the legacy settings count and the Keyboard pane's icon metadata.\u003c/p>\n\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"agreed-conclusions\">Agreed conclusions\u003c/h2>\n\u003cp>These are shared conclusions after comparison. Some rest on findings exchanged early (disclosed above), and some were adopted after review. The evidence is in each report.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Topic\u003c/th>\n\u003cth>Shared conclusion\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Stack\u003c/td>\n\u003ctd>Swift + AppKit for the launcher panel and list; SwiftUI acceptable for the settings window. A web runtime adds memory with no benefit for a macOS-only app.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Window\u003c/td>\n\u003ctd>Create one non-activating \u003ccode>NSPanel\u003c/code> at launch, keep it alive, and show or hide it. Never build UI on the hotkey path.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Hotkey\u003c/td>\n\u003ctd>Carbon \u003ccode>RegisterEventHotKey\u003c/code>; no Accessibility permission for the basic launcher.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Process\u003c/td>\n\u003ctd>One process to start. Add a helper process, mmap snapshots or bulk syscalls only if measurement shows a need.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Apps\u003c/td>\n\u003ctd>Scan the standard application folders, watch them for changes, and keep localized and alternate names. Nothing is discovered per keystroke.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Files\u003c/td>\n\u003ctd>Own filename-only index for user-selected roots. Default exclusions for dependency, VCS and build folders. FSEvents with a persisted checkpoint and explicit recovery (\u003ccode>MustScanSubDirs\u003c/code>, wrapped IDs, root changes). Spotlight stays optional, for a later content search.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Settings\u003c/td>\n\u003ctd>Read panes and sub-items from \u003ccode>Info.plist\u003c/code> and \u003ccode>.searchTerms\u003c/code> files in both ExtensionKit extensions and legacy \u003ccode>.prefPane\u003c/code> bundles (42 files / 691 English entries on macOS 27). Cache per OS build and locale. Opening a sub-item by URL anchor and extracting each pane's icon are both \u003cstrong>unverified\u003c/strong>; fall back to the pane and a generic icon.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Matching\u003c/td>\n\u003ctd>fzy-style scorer over prepared, folded names, with a 64-bit character mask and a subsequence pre-check. Select the top K; never fully sort. \u003ccode>VSC\u003c/code> must work without an alias.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ranking\u003c/td>\n\u003ctd>Tiers first: exact/alias, prefix, word-start/acronym, then general fuzzy. Learned usage changes order only within comparable match quality. Ties break deterministically.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Result stability\u003c/td>\n\u003ctd>Search one consistent snapshot, publish one complete list per query, drop obsolete query generations, fixed row geometry, keep the selected item by stable ID.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scope of the first version\u003c/td>\n\u003ctd>Name/path search only, no file contents. Defer clipboard history, window management, AI, extensions and sync.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Commercial launchers\u003c/td>\n\u003ctd>Raycast 2.0 has its own file indexer (v1 used Spotlight). Alfred relies on the Spotlight index. LaunchBar scans rule-defined folders.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"differences-and-how-they-were-resolved\">Differences and how they were resolved\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Topic\u003c/th>\n\u003cth>Claude\u003c/th>\n\u003cth>Codex\u003c/th>\n\u003cth>Resolution\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>Why Spotlight is slow\u003c/td>\n\u003ctd>Per-keystroke daemon queries and async result merging (stated as fact)\u003c/td>\n\u003ctd>Not profiled; don't assign a cause\u003c/td>\n\u003ctd>\u003cstrong>Codex's position.\u003c/strong> Causes are inference in both reports.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>\"Fast launchers avoid per-keystroke IPC\"\u003c/td>\n\u003ctd>Stated as a common factor\u003c/td>\n\u003ctd>Counterexamples: Flow → Everything (IPC), Raycast 2.0 (several runtimes)\u003c/td>\n\u003ctd>\u003cstrong>Codex's position.\u003c/strong> Reworded: predictable latency and one complete result set matter, not where the data lives.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>Where search runs\u003c/td>\n\u003ctd>Synchronously on the main thread\u003c/td>\n\u003ctd>Serial cancellable worker, generation numbers, atomic publish\u003c/td>\n\u003ctd>\u003cstrong>Codex's position.\u003c/strong> Background scoring avoids doing search work on the UI thread. Locking, publication and indexing contention still need measurement. Stability comes from four parts together: atomic publication, generation guards, snapshot consistency and selected-ID handling.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Sol's file matcher\u003c/td>\n\u003ctd>fuse.js\u003c/td>\n\u003ctd>\u003ccode>NSString.scoreAgainst\u003c/code> + alphabetical sort; MiniSearch for root search\u003c/td>\n\u003ctd>\u003cstrong>Codex correct.\u003c/strong> Verified in Sol at \u003ccode>873ae1c\u003c/code>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>Settings item count\u003c/td>\n\u003ctd>42 files / 691 entries\u003c/td>\n\u003ctd>41 / 688\u003c/td>\n\u003ctd>\u003cstrong>Both correct\u003c/strong> for their scope. ExtensionKit has 41 / 688; the legacy \u003ccode>DateAndTime.prefPane\u003c/code> adds 1 / 3.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>Directory enumeration\u003c/td>\n\u003ctd>Cited Tinycast's \u003ccode>getattrlistbulk\u003c/code>; said the choice matters little at this scale\u003c/td>\n\u003ctd>Start with \u003ccode>FileManager.enumerator\u003c/code>; \u003ccode>getattrlistbulk\u003c/code> only if measured as a bottleneck\u003c/td>\n\u003ctd>\u003cstrong>Codex's position\u003c/strong> (simplest first). Claude agrees.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>Index persistence\u003c/td>\n\u003ctd>Compact snapshot file + last event ID\u003c/td>\n\u003ctd>SQLite records + immutable in-memory search arrays\u003c/td>\n\u003ctd>\u003cstrong>Codex's position.\u003c/strong> Usage history needs durable storage anyway, so one engine (system SQLite, no dependency) serves both. Revisit if measured.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>Performance budgets\u003c/td>\n\u003ctd>Hotkey ≤ 16 ms, query ≤ 8 ms at 20k, idle ≤ 40 MB at 20k\u003c/td>\n\u003ctd>Hotkey p95 ≤ 33 ms, query p95 ≤ 16 ms at 20k / ≤ 33 ms at 200k, ≤ 60 MiB at 20k / ≤ 100 MiB at 200k\u003c/td>\n\u003ctd>\u003cstrong>Proposed:\u003c/strong> Claude's numbers as targets, Codex's as acceptance limits, with Codex's boundaries. Hotkey latency is warm hotkey to presented frame, at p95. Query latency is input to stable displayed results, at p95, not scorer time. Memory is \u003ccode>phys_footprint\u003c/code> in MiB, including helper processes. Nothing has been achieved yet; there is no prototype. Raised with the user.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9\u003c/td>\n\u003ctd>Benchmark numbers\u003c/td>\n\u003ctd>200k names, 1 thread, \u003cstrong>including\u003c/strong> top-50 selection: 1.303 ms = mean over keystrokes of each keystroke's best of 7 runs; 5.216 ms = the maximum of those per-keystroke minima\u003c/td>\n\u003ctd>200k names, 1 thread, \u003cstrong>excluding\u003c/strong> top-K selection: 3.941 ms = median of eleven query medians; 0.2–6.3 ms = range of query medians. Full paths: 43.9 ms median of query medians, up to 80.8 ms (a query median)\u003c/td>\n\u003ctd>\u003cstrong>Compatible, not comparable.\u003c/strong> Neither figure is an observed worst case or p95 latency. Corpora, queries and statistics differ. Combined lesson: match names first. Full-path scoring at 200k does not fit a frame, so path search needs its own mode (Codex proposes typing \u003ccode>/\u003c/code>).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>10\u003c/td>\n\u003ctd>Configuration\u003c/td>\n\u003ctd>Config file first, settings window later\u003c/td>\n\u003ctd>Small settings window backed by versioned JSON. REQ-005 already says prefixes are \"configurable in settings\".\u003c/td>\n\u003ctd>\u003cstrong>Codex's position is the requirement.\u003c/strong> v1 has versioned JSON plus a small native settings window. Starting with a file only would be a scope change, so the user decides whether to defer the window.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>11\u003c/td>\n\u003ctd>Default result mix\u003c/td>\n\u003ctd>Kind priority apps &gt; settings &gt; folders &gt; files, because \u003ccode>term\u003c/code> ranked two files above Terminal\u003c/td>\n\u003ctd>Tiers plus bounded usage; result mix is a user decision\u003c/td>\n\u003ctd>\u003cstrong>Combined:\u003c/strong> tiers first, kind priority within a tier; the default mix is a \u003cstrong>user decision\u003c/strong>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>12\u003c/td>\n\u003ctd>Feature priority\u003c/td>\n\u003ctd>Calculator, quicklinks, running-app and system commands in priority 1\u003c/td>\n\u003ctd>Calculator and quicklinks \"next\"; index status, exclusions editor and ranking reset first\u003c/td>\n\u003ctd>\u003cstrong>Open: user decision.\u003c/strong> Both put aliases and file actions first.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>13\u003c/td>\n\u003ctd>Frecency formula\u003c/td>\n\u003ctd>Tinycast's: +100 per open, 10-day half-life\u003c/td>\n\u003ctd>Bounded log term, 30-day half-life, small weight\u003c/td>\n\u003ctd>\u003cstrong>Implementation detail.\u003c/strong> Tune against golden examples during the build.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>14\u003c/td>\n\u003ctd>Settings icons\u003c/td>\n\u003ctd>Content-type icons from \u003ccode>ISGraphicIconConfiguration\u003c/code> (as Tinycast does)\u003c/td>\n\u003ctd>The extension's \u003ccode>IconName\u003c/code> resource, with fallback\u003c/td>\n\u003ctd>\u003cstrong>Unverified.\u003c/strong> Test both in the settings spike.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>15\u003c/td>\n\u003ctd>TCC and signing\u003c/td>\n\u003ctd>Ad-hoc signed rebuilds lose grants (stated as fact in the summary)\u003c/td>\n\u003ctd>Unverified; add \u003ccode>NSOpenPanel\u003c/code> / security-scoped bookmarks\u003c/td>\n\u003ctd>\u003cstrong>Codex's position.\u003c/strong> Test directly during development.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"findings-only-one-report-had\">Findings only one report had\u003c/h2>\n\u003cp>\u003cstrong>Only Codex\u003c/strong> (adopted into the recommendation):\u003c/p>\n\u003cul>\n\u003cli>Enter must open the item the user can see selected, never an item that ranked into that row after a later update.\u003c/li>\n\u003cli>Unicode, CJK and IME composition need a non-ASCII matching path; both benchmarks fold ASCII only.\u003c/li>\n\u003cli>Licences: Tinycast is AGPL-3.0 and Albert is source-available with restrictions. Learn from their designs; don't copy code.\u003c/li>\n\u003cli>Incremental narrowing must filter the previous complete match set, never the visible top K.\u003c/li>\n\u003cli>Dataless iCloud files can trigger downloads if read; the crawler must not touch file contents.\u003c/li>\n\u003cli>plocate-style trigram prefilters would reject acronym queries such as \u003ccode>vsc\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Only Claude:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>A minimal hidden AppKit shell holding 23k names measured \u003cstrong>18 MB \u003ccode>phys_footprint\u003c/code>\u003c/strong> (as reported by \u003ccode>footprint\u003c/code>), with 0% CPU. It had no production index structures, icon cache, settings UI or active drawing. For context, Raycast's May 2026 figures are 200–450 MB, vendor-reported after usage, not a controlled comparison.\u003c/li>\n\u003cli>The tested \u003ccode>mdfind\u003c/code> query did not find \"Keyboard layouts\", while \u003ccode>.searchTerms\u003c/code> provides a catalog that can be read directly. Whether settings items exist in other Spotlight stores was not established. Neither Tinycast nor Sol offers sub-items, so this is a gap Apparate can fill.\u003c/li>\n\u003cli>Fully sorting all hits made one-letter queries the slowest keystroke; bounded top-K fixed it.\u003c/li>\n\u003cli>Raycast's File Search manual describes its defaults: home folder + \u003ccode>/Applications\u003c/code>, name-only, honours \u003ccode>.gitignore\u003c/code>/\u003ccode>.ignore\u003c/code>, filters \u003ccode>node_modules\u003c/code> and caches.\u003c/li>\n\u003cli>⌘Space conflicts with Spotlight until its shortcut is disabled.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"joint-recommendation\">Joint recommendation\u003c/h2>\n\u003cp>Swift 6 + AppKit agent app (no Dock icon), one process:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Panel:\u003c/strong> a non-activating \u003ccode>NSPanel\u003c/code> built at launch, with a search field and a fixed-row-height list.\u003c/li>\n\u003cli>\u003cstrong>Hotkey:\u003c/strong> Carbon \u003ccode>RegisterEventHotKey\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Sources:\u003c/strong> apps from the application folders; settings panes and sub-items from \u003ccode>.searchTerms\u003c/code> in ExtensionKit extensions and legacy \u003ccode>.prefPane\u003c/code> bundles; files and folders from user-selected roots. Files are indexed by name only, persisted in SQLite, and kept current with FSEvents.\u003c/li>\n\u003cli>\u003cstrong>Query path:\u003c/strong>\u003col>\n\u003cli>Parse the configurable prefix (\u003ccode>'\u003c/code> files, \u003ccode>.\u003c/code> settings).\u003c/li>\n\u003cli>A serial worker matches the scope with an fzy-style scorer, mask and pre-check.\u003c/li>\n\u003cli>Results are ranked by tier, then kind and learned usage, and the top K is selected.\u003c/li>\n\u003cli>The complete list is published once per current query generation.\u003c/li>\n\u003c/ol>\n\u003c/li>\n\u003cli>\u003cstrong>Path search\u003c/strong> gets its own mode instead of scoring every full path.\u003c/li>\n\u003cli>\u003cstrong>Config:\u003c/strong> versioned JSON plus a small native settings window (REQ-005). Starting with the file only would need an explicit scope change (decision 2).\u003c/li>\n\u003c/ul>\n\u003cp>Before building the product, run two short spikes:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Settings deep links:\u003c/strong> for each \u003ccode>.searchTerms\u003c/code> group key, check whether \u003ccode>x-apple.systempreferences:&lt;pane id&gt;?&lt;key&gt;\u003c/code> opens the right section, and which icon source works.\u003c/li>\n\u003cli>\u003cstrong>Panel latency and memory:\u003c/strong> measure hotkey-to-first-frame, keystroke-to-results, and \u003ccode>phys_footprint\u003c/code> on a minimal build.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"decisions-for-the-user\">Decisions for the user\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Default result mix:\u003c/strong> what an unprefixed query searches, and in what order.\u003c/li>\n\u003cli>\u003cstrong>Settings window:\u003c/strong> keep it in v1 as REQ-005 states, or defer it and start with the JSON file.\u003c/li>\n\u003cli>\u003cstrong>Hotkey:\u003c/strong> take over ⌘Space, or use another chord.\u003c/li>\n\u003cli>\u003cstrong>File roots:\u003c/strong> which folders are indexed by default, and whether \u003ccode>.gitignore\u003c/code> is respected.\u003c/li>\n\u003cli>\u003cstrong>v1 features\u003c/strong> beyond the core: see differences 11 and 12.\u003c/li>\n\u003cli>\u003cstrong>Performance budgets:\u003c/strong> accept the targets and limits in difference 8.\u003c/li>\n\u003cli>\u003cstrong>Minimum macOS version:\u003c/strong> settings data, available APIs and testing scope depend on it (raised in Codex's risks).\u003c/li>\n\u003cli>\u003cstrong>Distribution:\u003c/strong> personal use, or public (Developer ID signing and notarization).\u003c/li>\n\u003cli>\u003cstrong>Next step:\u003c/strong> the spikes above, an implementation plan, or more research.\u003c/li>\n\u003c/ol>\n","backlinks":["index","decisions","spikes/2026-11-18-settings-deep-links","spikes/2026-11-18-ui-design"]},{"id":"research/claude/benchmark","title":"Claude matching benchmark","section":"Research","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Claude matching benchmark\nsection: Research\nupdated: 2026-11-18\n---\n# Claude matching benchmark\n\nMeasured on 2026-11-18 on this machine: Apple M1 Pro (10 cores), 16 GB, macOS 27.0, Swift 6.4.2, `swiftc -O`. Part of [Claude's research report](report.md).\n\n## Method\n\n- **Candidates:** 336 app names (from `mdfind` for application bundles), 688 System Settings item titles (from `.searchTerms`), and 22,089 real file and folder names from a pruned walk of the home folder (Library, hidden folders, `node_modules`, `.git`, `target`, `.build`, `DerivedData`, `.venv`, `__pycache__` and `.app` bundles skipped). For 200k, file names are repeated with a numeric suffix.\n- **Storage:** all candidates folded once into one flat byte buffer, with a per-byte boundary class and a 64-bit character bitmask per candidate. Nothing is allocated per keystroke except the hit list.\n- **Scorer:** fzy's dynamic-programming scorer (consecutive bonus 1.0; word start 0.8; camel hump 0.7; after dot 0.6; small gap penalties). A greedy subsequence check runs first.\n- **Queries:** every prefix of `vsc`, `visual`, `keyboard la`, `readme`, `apparate`, `pjapp`, `sysset`, `dl`, as if typed. Each keystroke runs 7 times; the best run is kept. The time includes selecting the top 50 results.\n- **Variants:** with and without the bitmask prefilter; 1 thread or all 10 cores (`DispatchQueue.concurrentPerform`); \"incremental\" re-searches only the previous keystroke's hits.\n\n## Results\n\nBounded top-50 selection, re-run after review with a checksum over the selected IDs (so the selection cannot be optimised away). \"Slowest\" is the maximum over keystrokes of each keystroke's best of 7 runs. It is not an observed worst case or p95.\n\n| Candidates | Variant | Mean per keystroke | Slowest keystroke |\n| --- | --- | --- | --- |\n| 1,024 | bitmask, 1 thread | 0.014 ms | 0.060 ms |\n| 20,000 | no prefilter, 1 thread | 0.325 ms | 0.572 ms |\n| 20,000 | bitmask, 1 thread | 0.125 ms | 0.487 ms |\n| 20,000 | bitmask, 10 threads | 0.077 ms | 0.165 ms |\n| 200,000 | no prefilter, 1 thread | 3.481 ms | 6.167 ms |\n| 200,000 | bitmask, 1 thread | 1.303 ms | 5.216 ms |\n| 200,000 | bitmask, 10 threads | 0.293 ms | 0.992 ms |\n| 200,000 | bitmask + incremental, 1 thread | 0.954 ms | 4.793 ms |\n\nThe run before the checksum gave the same figures within noise. \"Incremental\" re-searches the complete hit set of the previous keystroke, never only the visible top K.\n\nThe first version fully sorted every hit. A one-letter query matches most candidates, so its worst keystroke at 200k was 12.5 ms (1 thread). Bounded top-K selection cut that to about 5.2 ms. Building the 200k corpus took 44 ms.\n\nConclusions:\n\n- A frame is 8.3 ms at 120 Hz. Everything at 20k candidates fits in a fraction of a frame on one thread. At 200k, splitting across cores keeps the worst keystroke near 1 ms.\n- Only names were scored. Codex's benchmark measured full paths at 200k at about 44 ms median (up to 81 ms), so matching must be name-first, with a separate path mode. The two benchmarks use different corpora, queries and statistics, so their numbers should not be merged into one table.\n- The bitmask prefilter roughly halves the cost. Incremental narrowing helps less than expected once the prefilter exists.\n- Never fully sort hits; select the top K.\n\n## Ranking observations\n\nTop results at 20k candidates, raw fzy score only (no kind tiers, no usage history):\n\n| Query | Top results |\n| --- | --- |\n| `vsc` | Visual Studio Code (app), variable_star.c (file), Move screen image (setting) |\n| `keyboard la` | Keyboard layouts (setting) |\n| `sysset` | System Settings (app), Lock System Settings (setting) |\n| `term` | termios (file), termius (file), **Terminal (app) third** |\n| `safa` | Safari (app), schemafault.test (file) |\n\nAcronym and word-start matching works with fzy's bonuses alone. The `term` case shows that a raw string score is not enough. Results need tiers (exact/alias, prefix, word-start, fuzzy), a kind priority (apps before files by default), and usage history.\n\n## Idle memory of a minimal shell\n\nA hidden AppKit agent app (`NSPanel` with `.nonactivatingPanel`, an `NSTextField`, an `NSTableView`) holding all 23,112 names in memory: **18 MB `phys_footprint`, 0.0% CPU** (`footprint -p`). Raycast reports ~200–300 MB for v1 and ~350–450 MB for v2 using the same metric ([Raycast blog](https://www.raycast.com/blog/a-technical-deep-dive-into-the-new-raycast)). Icons, the settings UI and the file index will add to the 18 MB.\n\n## Source\n\nBuild with `swiftc -O bench.swift -o bench`, run with `./bench apps.txt settings.txt files.txt` (one name per line).\n\n```swift\n// Per-keystroke fuzzy matching benchmark for Apparate research.\n// fzy-style DP scorer over pre-folded byte buffers, with optional\n// character-bitmask prefilter, incremental narrowing, and multi-core split.\n// Build: swiftc -O bench.swift -o bench   Run: ./bench apps.txt settings.txt files.txt\nimport Foundation\nimport Dispatch\n\n// ---------- Candidate storage (flat, built once per index change) ----------\nstruct Corpus {\n    var lower: [UInt8] = []      // folded bytes, all candidates back to back\n    var cls: [UInt8] = []        // per-byte boundary class for bonuses\n    var start: [Int32] = []      // offset of candidate i\n    var len: [UInt16] = []\n    var mask: [UInt64] = []      // which of a-z0-9 etc. occur\n    var names: [String] = []\n    var kind: [UInt8] = []       // 0 app, 1 setting, 2 file\n    var count: Int { start.count }\n\n    mutating func add(_ s: String, kind k: UInt8) {\n        let raw = Array(s.utf8.prefix(255))\n        start.append(Int32(lower.count)); len.append(UInt16(raw.count))\n        var m: UInt64 = 0\n        var prev: UInt8 = 0x2F // treat start as after slash\n        for b in raw {\n            let l = (b >= 65 && b \u003c= 90) ? b + 32 : b\n            lower.append(l)\n            // classes: 1 after separator (\"word\"), 2 camel hump, 3 after dot, 0 none\n            var c: UInt8 = 0\n            if prev == 0x2F || prev == 0x20 || prev == 0x2D || prev == 0x5F { c = 1 }\n            else if prev == 0x2E { c = 3 }\n            else if (b >= 65 && b \u003c= 90) && (prev >= 97 && prev \u003c= 122) { c = 2 }\n            cls.append(c)\n            m |= bit(l)\n            prev = b\n        }\n        mask.append(m); names.append(s); kind.append(k)\n    }\n}\n\n@inline(__always) func bit(_ b: UInt8) -> UInt64 {\n    if b >= 97 && b \u003c= 122 { return 1 \u003c\u003c UInt64(b - 97) }\n    if b >= 48 && b \u003c= 57 { return 1 \u003c\u003c UInt64(26 + b - 48) }\n    return 1 \u003c\u003c 63\n}\n\n// ---------- fzy scoring constants ----------\nlet gapLeading: Float = -0.005, gapTrailing: Float = -0.005, gapInner: Float = -0.01\nlet matchConsecutive: Float = 1.0\nlet bonusFor: [Float] = [0, 0.8, 0.7, 0.6]   // none, word, camel, dot\n\n// Scratch buffers per worker to avoid allocation per candidate.\nfinal class Scratch {\n    var D = [Float](repeating: 0, count: 256 * 32)\n    var M = [Float](repeating: 0, count: 256 * 32)\n}\n\n@inline(__always)\nfunc isSubsequence(_ q: UnsafeBufferPointer\u003cUInt8>, _ t: UnsafeBufferPointer\u003cUInt8>) -> Bool {\n    var j = 0\n    for c in q {\n        while j \u003c t.count && t[j] != c { j += 1 }\n        if j == t.count { return false }\n        j += 1\n    }\n    return true\n}\n\nfunc score(_ q: UnsafeBufferPointer\u003cUInt8>, _ t: UnsafeBufferPointer\u003cUInt8>, _ cls: UnsafeBufferPointer\u003cUInt8>, _ s: Scratch) -> Float {\n    let n = q.count, m = t.count\n    if n == m { return Float.infinity }        // exact (subsequence of equal length)\n    if m > 255 || n > 32 { return -Float.infinity }\n    return s.D.withUnsafeMutableBufferPointer { D in\n        s.M.withUnsafeMutableBufferPointer { M in\n            for i in 0..\u003cn {\n                var prevScore = -Float.infinity\n                let gap = (i == n - 1) ? gapTrailing : gapInner\n                for j in 0..\u003cm {\n                    let idx = i * 256 + j\n                    if q[i] == t[j] {\n                        var sc = -Float.infinity\n                        let bonus = bonusFor[Int(cls[j])]\n                        if i == 0 {\n                            sc = Float(j) * gapLeading + bonus\n                        } else if j > 0 {\n                            let pm = M[(i - 1) * 256 + j - 1], pd = D[(i - 1) * 256 + j - 1]\n                            sc = max(pm + bonus, pd + matchConsecutive)\n                        }\n                        D[idx] = sc\n                        prevScore = max(sc, prevScore + gap)\n                        M[idx] = prevScore\n                    } else {\n                        D[idx] = -Float.infinity\n                        prevScore = prevScore + gap\n                        M[idx] = prevScore\n                    }\n                }\n            }\n            return M[(n - 1) * 256 + m - 1]\n        }\n    }\n}\n\nstruct Hit { var idx: Int32; var score: Float }\n\n// Search a list of candidate indices; returns all hits (subsequence matches) with scores.\nfunc search(_ c: Corpus, query: [UInt8], within: [Int32]?, prefilter: Bool, threads: Int) -> [Hit] {\n    var qm: UInt64 = 0\n    for b in query { qm |= bit(b) }\n    let total = within?.count ?? c.count\n    let chunks = max(1, threads)\n    var parts = [[Hit]](repeating: [], count: chunks)\n    c.lower.withUnsafeBufferPointer { L in\n        c.cls.withUnsafeBufferPointer { C in\n            query.withUnsafeBufferPointer { Q in\n                parts.withUnsafeMutableBufferPointer { P in\n                    DispatchQueue.concurrentPerform(iterations: chunks) { k in\n                        let s = Scratch()\n                        var out: [Hit] = []\n                        let lo = total * k / chunks, hi = total * (k + 1) / chunks\n                        for x in lo..\u003chi {\n                            let i = within.map { Int($0[x]) } ?? x\n                            if prefilter && (c.mask[i] & qm) != qm { continue }\n                            let st = Int(c.start[i]), ln = Int(c.len[i])\n                            let T = UnsafeBufferPointer(rebasing: L[st..\u003cst + ln])\n                            if !isSubsequence(Q, T) { continue }\n                            let sc = score(Q, T, UnsafeBufferPointer(rebasing: C[st..\u003cst + ln]), s)\n                            out.append(Hit(idx: Int32(i), score: sc))\n                        }\n                        P[k] = out\n                    }\n                }\n            }\n        }\n    }\n    return parts.flatMap { $0 }\n}\n\nfunc better(_ a: Hit, _ b: Hit, _ c: Corpus) -> Bool {\n    if a.score != b.score { return a.score > b.score }\n    let la = c.len[Int(a.idx)], lb = c.len[Int(b.idx)]\n    if la != lb { return la \u003c lb }\n    return a.idx \u003c b.idx\n}\n// Bounded selection: keeps only the best k, so a 1-letter query never sorts every hit.\nfunc topK(_ hits: [Hit], _ k: Int, _ c: Corpus) -> [Hit] {\n    var best: [Hit] = []\n    best.reserveCapacity(k + 1)\n    for h in hits {\n        if best.count == k, !better(h, best[k - 1], c) { continue }\n        var i = best.count\n        while i > 0 && better(h, best[i - 1], c) { i -= 1 }\n        best.insert(h, at: i)\n        if best.count > k { best.removeLast() }\n    }\n    return best\n}\n\nfunc now() -> UInt64 { DispatchTime.now().uptimeNanoseconds }\n\n// ---------- Load corpus ----------\nlet args = CommandLine.arguments\nfunc lines(_ p: String) -> [String] {\n    (try? String(contentsOfFile: p, encoding: .utf8))?.split(separator: \"\\n\").map(String.init) ?? []\n}\nlet apps = lines(args[1]), settings = lines(args[2]), files = lines(args[3])\n\nfunc buildCorpus(fileTarget: Int) -> Corpus {\n    var c = Corpus()\n    for a in apps { c.add(a, kind: 0) }\n    for s in settings { c.add(s, kind: 1) }\n    var i = 0\n    while c.count \u003c fileTarget {\n        let f = files[i % files.count]\n        // pad by suffixing a copy number so strings are distinct but realistic\n        c.add(i \u003c files.count ? f : \"\\(f) \\(i / files.count)\", kind: 2)\n        i += 1\n    }\n    return c\n}\n\nvar checksum: Int = 0\nlet typing = [\"vsc\", \"visual\", \"keyboard la\", \"readme\", \"apparate\", \"pjapp\", \"sysset\", \"dl\"]\nlet cores = ProcessInfo.processInfo.activeProcessorCount\n\nfor target in [1_000, 20_000, 200_000] {\n    let t0 = now()\n    let c = buildCorpus(fileTarget: target)\n    let buildMs = Double(now() - t0) / 1e6\n    print(\"\\n=== N = \\(c.count) candidates (corpus build \\(String(format: \"%.1f\", buildMs)) ms, \\(c.lower.count / 1024) KiB text) ===\")\n    for (label, pre, thr, incremental) in [(\"naive 1 thread\", false, 1, false),\n                                           (\"bitmask 1 thread\", true, 1, false),\n                                           (\"bitmask \\(cores) threads\", true, cores, false),\n                                           (\"bitmask + incremental, 1 thread\", true, 1, true)] {\n        var worst = 0.0, sum = 0.0, n = 0\n        for word in typing {\n            var prevHits: [Int32]? = nil\n            for p in 1...word.count {\n                let q = Array(word.utf8.prefix(p)).map { ($0 >= 65 && $0 \u003c= 90) ? $0 + 32 : $0 }\n                var best = Double.infinity\n                var hits: [Hit] = []\n                for _ in 0..\u003c7 {\n                    let t = now()\n                    hits = search(c, query: q, within: incremental ? prevHits : nil, prefilter: pre, threads: thr)\n                    for h in topK(hits, 50, c) { checksum &+= Int(h.idx) }\n                    best = min(best, Double(now() - t) / 1e6)\n                }\n                if incremental { prevHits = hits.map { $0.idx } }\n                worst = max(worst, best); sum += best; n += 1\n            }\n        }\n        print(String(format: \"  %-34@ mean %7.3f ms/keystroke, max of per-keystroke best-of-7 %7.3f ms\", label as NSString, sum / Double(n), worst))\n    }\n    if target == 20_000 {\n        for word in [\"vsc\", \"keyboard la\", \"sysset\", \"term\", \"safa\"] {\n            let q = Array(word.utf8)\n            let top = topK(search(c, query: q, within: nil, prefilter: true, threads: 1), 4, c)\n            let shown = top.map { \"\\(c.names[Int($0.idx)]) [\\([\"app\",\"setting\",\"file\"][Int(c.kind[Int($0.idx)])])]\" }\n            print(\"  top for '\\(word)': \" + shown.joined(separator: \" | \"))\n        }\n    }\n}\nprint(\"checksum \\(checksum)\")\n```\n","toc":[{"id":"method","title":"Method","depth":2},{"id":"results","title":"Results","depth":2},{"id":"ranking-observations","title":"Ranking observations","depth":2},{"id":"idle-memory-of-a-minimal-shell","title":"Idle memory of a minimal shell","depth":2},{"id":"source","title":"Source","depth":2}],"titleAnchor":"claude-matching-benchmark","links":["research/claude/report"],"attachments":[],"html":"\u003cp>Measured on 2026-11-18 on this machine: Apple M1 Pro (10 cores), 16 GB, macOS 27.0, Swift 6.4.2, \u003ccode>swiftc -O\u003c/code>. Part of \u003ca href=\"#/research/claude/report\">Claude's research report\u003c/a>.\u003c/p>\n\u003ch2 id=\"method\">Method\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Candidates:\u003c/strong> 336 app names (from \u003ccode>mdfind\u003c/code> for application bundles), 688 System Settings item titles (from \u003ccode>.searchTerms\u003c/code>), and 22,089 real file and folder names from a pruned walk of the home folder (Library, hidden folders, \u003ccode>node_modules\u003c/code>, \u003ccode>.git\u003c/code>, \u003ccode>target\u003c/code>, \u003ccode>.build\u003c/code>, \u003ccode>DerivedData\u003c/code>, \u003ccode>.venv\u003c/code>, \u003ccode>__pycache__\u003c/code> and \u003ccode>.app\u003 td>0.325 ms\u003c/td>\n\u003ctd>0.572 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>20,000\u003c/td>\n\u003ctd>bitmask, 1 thread\u003c/td>\n\u003ctd>0.125 ms\u003c/td>\n\u003ctd>0.487 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>20,000\u003c/td>\n\u003ctd>bitmask, 10 threads\u003c/td>\n\u003ctd>0.077 ms\u003c/td>\n\u003ctd>0.165 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>200,000\u003c/td>\n\u003ctd>no prefilter, 1 thread\u003c/td>\n\u003ctd>3.481 ms\u003c/td>\n\u003ctd>6.167 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>200,000\u003c/td>\n\u003ctd>bitmask, 1 thread\u003c/td>\n\u003ctd>1.303 ms\u003c/td>\n\u003ctd>5.216 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>200,000\u003c/td>\n\u003ctd>bitmask, 10 threads\u003c/td>\n\u003ctd>0.293 ms\u003c/td>\n\u003ctd>0.992 ms\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>200,000\u003c/td>\n\u003ctd>bitmask + incremental, 1 thread\u003c/td>\n\u003ctd>0.954 ms\u003c/td>\n\u003ctd>4.793 ms\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The run before the checksum gave the same figures within noise. \"Incremental\" re-searches the complete hit set of the previous keystroke, never only the visible top K.\u003c/p>\n\u003cp>The first version fully sorted every hit. A one-letter query matches most candidates, so its worst keystroke at 200k was 12.5 ms (1 thread). Bounded top-K selection cut that to about 5.2 ms. Building the 200k corpus took 44 ms.\u003c/p>\n\u003cp>Conclusions:\u003c/p>\n\u003cul>\n\u003cli>A frame is 8.3 ms at 120 Hz. Everything at 20k candidates fits in a fraction of a frame on one thread. At 200k, splitting across cores keeps the worst keystroke near 1 ms.\u003c/li>\n\u003cli>Only names were scored. Codex's benchmark measured full paths at 200k at about 44 ms median (up to 81 ms), so matching must be name-first, with a separate path mode. The two benchmarks use different corpora, queries and statistics, so their numbers should not be merged into one table.\u003c/li>\n\u003cli>The bitmask prefilter roughly halves the cost. Incremental narrowing helps less than expected once the prefilter exists.\u003c/li>\n\u003cli>Never fully sort hits; select the top K.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"ranking-observations\">Ranking observations\u003c/h2>\n\u003cp>Top results at 20k candidates, raw fzy score only (no kind tiers, no usage history):\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Query\u003c/th>\n\u003cth>Top results\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ccode>vsc\u003c/code>\u003c/td>\n\u003ctd>Visual Studio Code (app), variable_star.c (file), Move screen image (setting)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>keyboard la\u003c/code>\u003c/td>\n\u003ctd>Keyboard layouts (setting)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>sysset\u003c/code>\u003c/td>\n\u003ctd>System Settings (app), Lock System Settings (setting)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>term\u003c/code>\u003c/td>\n\u003ctd>termios (file), termius (file), \u003cstrong>Terminal (app) third\u003c/strong>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ccode>safa\u003c/code>\u003c/td>\n\u003ctd>Safari (app), schemafault.test (file)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Acronym and word-start matching works with fzy's bonuses alone. The \u003ccode>term\u003c/code> case shows that a raw string score is not enough. Results need tiers (exact/alias, prefix, word-start, fuzzy), a kind priority (apps before files by default), and usage history.\u003c/p>\n\u003ch2 id=\"idle-memory-of-a-minimal-shell\">Idle memory of a minimal shell\u003c/h2>\n\u003cp>A hidden AppKit agent app (\u003ccode>NSPanel\u003c/code> with \u003ccode>.nonactivatingPanel\u003c/code>, an \u003ccode>NSTextField\u003c/code>, an \u003ccode>NSTableView\u003c/code>) holding all 23,112 names in memory: \u003cstrong>18 MB \u003ccode>phys_footprint\u003c/code>, 0.0% CPU\u003c/strong> (\u003ccode>footprint -p\u003c/code>). Raycast reports ~200–300 MB for v1 and ~350–450 MB for v2 using the same metric (\u003ca href=\"https://www.raycast.com/blog/a-technical-deep-dive-into-the-new-raycast\" rel=\"noreferrer\">Raycast blog\u003c/a>). Icons, the settings UI and the file index will add to the 18 MB.\u003c/p>\n\u003ch2 id=\"source\">Source\u003c/h2>\n\u003cp>Build with \u003ccode>swiftc -O bench.swift -o bench\u003c/code>, run with \u003ccode>./bench apps.txt settings.txt files.txt\u003c/code> (one name per line).\u003c/p>\n\u003cpre>\u003ccode class=\"language-swift\">// Per-keystroke fuzzy matching benchmark for Apparate research.\n// fzy-style DP scorer over pre-folded byte buffers, with optional\n// character-bitmask prefilter, incremental narrowing, and multi-core split.\n// Build: swiftc -O bench.swift -o bench   Run: ./bench apps.txt settings.txt files.txt\nimport Foundation\nimport Dispatch\n\n// ---------- Candidate storage (flat, built once per index change) ----------\nstruct Corpus {\n    var lower: [UInt8] = []      // folded bytes, all candidates back to back\n    var cls: [UInt8] = []        // per-byte boundary class for bonuses\n    var start: [Int32] = []      // offset of candidate i\n    var len: [UInt16] = []\n    var mask: [UInt64] = []      // which of a-z0-9 etc. occur\n    var names: [String] = []\n    var kind: [UInt8] = []       // 0 app, 1 setting, 2 file\n    var count: Int { start.count }\n\n    mutating func add(_ s: String, kind k: UInt8) {\n        let raw = Array(s.utf8.prefix(255))\n        start.append(Int32(lower.count)); len.append(UInt16(raw.count))\n        var m: UInt64 = 0\n        var prev: UInt8 = 0x2F // treat start as after slash\n        for b in raw {\n            let l = (b &gt;= 65 &amp;&amp; b &lt;= 90) ? b + 32 : b\n            lower.append(l)\n            // classes: 1 after separator (\"word\"), 2 camel hump, 3 after dot, 0 none\n            var c: UInt8 = 0\n            if prev == 0x2F || prev == 0x20 || prev == 0x2D || prev == 0x5F { c = 1 }\n            else if prev == 0x2E { c = 3 }\n            else if (b &gt;= 65 &amp;&amp; b &lt;= 90) &amp;&amp; (prev &gt;= 97 &amp;&amp; prev &lt;= 122) { c = 2 }\n            cls.append(c)\n            m |= bit(l)\n            prev = b\n        }\n        mask.append(m); names.append(s); kind.append(k)\n    }\n}\n\n@inline(__always) func bit(_ b: UInt8) -&gt; UInt64 {\n    if b &gt;= 97 &amp;&amp; b &lt;= 122 { return 1 &lt;&lt; UInt64(b - 97) }\n    if b &gt;= 48 &amp;&amp; b &lt;= 57 { return 1 &lt;&lt; UInt64(26 + b - 48) }\n    return 1 &lt;&lt; 63\n}\n\n// ---------- fzy scoring constants ----------\nlet gapLeading: Float = -0.005, gapTrailing: Float = -0.005, gapInner: Float = -0.01\nlet matchConsecutive: Float = 1.0\nlet bonusFor: [Float] = [0, 0.8, 0.7, 0.6]   // none, word, camel, dot\n\n// Scratch buffers per worker to avoid allocation per candidate.\nfinal class Scratch {\n    var D = [Float](repeating: 0, count: 256 * 32)\n    var M = [Float](repeating: 0, count: 256 * 32)\n}\n\n@inline(__always)\nfunc isSubsequence(_ q: UnsafeBufferPointer&lt;UInt8&gt;, _ t: UnsafeBufferPointer&lt;UInt8&gt;) -&gt; Bool {\n    var j = 0\n    for c in q {\n        while j &lt; t.count &amp;&amp; t[j] != c { j += 1 }\n        if j == t.count { return false }\n        j += 1\n    }\n    return true\n}\n\nfunc score(_ q: UnsafeBufferPointer&lt;UInt8&gt;, _ t: UnsafeBufferPointer&lt;UInt8&gt;, _ cls: UnsafeBufferPointer&lt;UInt8&gt;, _ s: Scratch) -&gt; Float {\n    let n = q.count, m = t.count\n    if n == m { return Float.infinity }        // exact (subsequence of equal length)\n    if m &gt; 255 || n &gt; 32 { return -Float.infinity }\n    return s.D.withUnsafeMutableBufferPointer { D in\n        s.M.withUnsafeMutableBufferPointer { M in\n            for i in 0..&lt;n {\n                var prevScore = -Float.infinity\n                let gap = (i == n - 1) ? gapTrailing : gapInner\n                for j in 0..&lt;m {\n                    let idx = i * 256 + j\n                    if q[i] == t[j] {\n                        var sc = -Float.infinity\n                        let bonus = bonusFor[Int(cls[j])]\n                        if i == 0 {\n                            sc = Float(j) * gapLeading + bonus\n                        } else if j &gt; 0 {\n                            let pm = M[(i - 1) * 256 + j - 1], pd = D[(i - 1) * 256 + j - 1]\n                            sc = max(pm + bonus, pd + matchConsecutive)\n                        }\n                        D[idx] = sc\n                        prevScore = max(sc, prevScore + gap)\n                        M[idx] = prevScore\n                    } else {\n                        D[idx] = -Float.infinity\n                        prevScore = prevScore + gap\n                        M[idx] = prevScore\n                    }\n                }\n            }\n            return M[(n - 1) * 256 + m - 1]\n        }\n    }\n}\n\nstruct Hit { var idx: Int32; var score: Float }\n\n// Search a list of candidate indices; returns all hits (subsequence matches) with scores.\nfunc search(_ c: Corpus, query: [UInt8], within: [Int32]?, prefilter: Bool, threads: Int) -&gt; [Hit] {\n    var qm: UInt64 = 0\n    for b in query { qm |= bit(b) }\n    let total = within?.count ?? c.count\n    let chunks = max(1, threads)\n    var parts = [[Hit]](repeating: [], count: chunks)\n    c.lower.withUnsafeBufferPointer { L in\n        c.cls.withUnsafeBufferPointer { C in\n            query.withUnsafeBufferPointer { Q in\n                parts.withUnsafeMutableBufferPointer { P in\n                    DispatchQueue.concurrentPerform(iterations: chunks) { k in\n                        let s = Scratch()\n                        var out: [Hit] = []\n                        let lo = total * k / chunks, hi = total * (k + 1) / chunks\n                        for x in lo..&lt;hi {\n                            let i = within.map { Int($0[x]) } ?? x\n                            if prefilter &amp;&amp; (c.mask[i] &amp; qm) != qm { continue }\n                            let st = Int(c.start[i]), ln = Int(c.len[i])\n                            let T = UnsafeBufferPointer(rebasing: L[st..&lt;st + ln])\n                            if !isSubsequence(Q, T) { continue }\n                            let sc = score(Q, T, UnsafeBufferPointer(rebasing: C[st..&lt;st + ln]), s)\n                            out.append(Hit(idx: Int32(i), score: sc))\n                        }\n                        P[k] = out\n                    }\n                }\n            }\n        }\n    }\n    return parts.flatMap { $0 }\n}\n\nfunc better(_ a: Hit, _ b: Hit, _ c: Corpus) -&gt; Bool {\n    if a.score != b.score { return a.score &gt; b.score }\n    let la = c.len[Int(a.idx)], lb = c.len[Int(b.idx)]\n    if la != lb { return la &lt; lb }\n    return a.idx &lt; b.idx\n}\n// Bounded selection: keeps only the best k, so a 1-letter query never sorts every hit.\nfunc topK(_ hits: [Hit], _ k: Int, _ c: Corpus) -&gt; [Hit] {\n    var best: [Hit] = []\n    best.reserveCapacity(k + 1)\n    for h in hits {\n        if best.count == k, !better(h, best[k - 1], c) { continue }\n        var i = best.count\n        while i &gt; 0 &amp;&amp; better(h, best[i - 1], c) { i -= 1 }\n        best.insert(h, at: i)\n        if best.count &gt; k { best.removeLast() }\n    }\n    return best\n}\n\nfunc now() -&gt; UInt64 { DispatchTime.now().uptimeNanoseconds }\n\n// ---------- Load corpus ----------\nlet args = CommandLine.arguments\nfunc lines(_ p: String) -&gt; [String] {\n    (try? String(contentsOfFile: p, encoding: .utf8))?.split(separator: \"\\n\").map(String.init) ?? []\n}\nlet apps = lines(args[1]), settings = lines(args[2]), files = lines(args[3])\n\nfunc buildCorpus(fileTarget: Int) -&gt; Corpus {\n    var c = Corpus()\n    for a in apps { c.add(a, kind: 0) }\n    for s in settings { c.add(s, kind: 1) }\n    var i = 0\n    while c.count &lt; fileTarget {\n        let f = files[i % files.count]\n        // pad by suffixing a copy number so strings are distinct but realistic\n        c.add(i &lt; files.count ? f : \"\\(f) \\(i / files.count)\", kind: 2)\n        i += 1\n    }\n    return c\n}\n\nvar checksum: Int = 0\nlet typing = [\"vsc\", \"visual\", \"keyboard la\", \"readme\", \"apparate\", \"pjapp\", \"sysset\", \"dl\"]\nlet cores = ProcessInfo.processInfo.activeProcessorCount\n\nfor target in [1_000, 20_000, 200_000] {\n    let t0 = now()\n    let c = buildCorpus(fileTarget: target)\n    let buildMs = Double(now() - t0) / 1e6\n    print(\"\\n=== N = \\(c.count) candidates (corpus build \\(String(format: \"%.1f\", buildMs)) ms, \\(c.lower.count / 1024) KiB text) ===\")\n    for (label, pre, thr, incremental) in [(\"naive 1 thread\", false, 1, false),\n                                           (\"bitmask 1 thread\", true, 1, false),\n                                           (\"bitmask \\(cores) threads\", true, cores, false),\n                                           (\"bitmask + incremental, 1 thread\", true, 1, true)] {\n        var worst = 0.0, sum = 0.0, n = 0\n        for word in typing {\n            var prevHits: [Int32]? = nil\n            for p in 1...word.count {\n                let q = Array(word.utf8.prefix(p)).map { ($0 &gt;= 65 &amp;&amp; $0 &lt;= 90) ? $0 + 32 : $0 }\n                var best = Double.infinity\n                var hits: [Hit] = []\n                for _ in 0..&lt;7 {\n                    let t = now()\n                    hits = search(c, query: q, within: incremental ? prevHits : nil, prefilter: pre, threads: thr)\n                    for h in topK(hits, 50, c) { checksum &amp;+= Int(h.idx) }\n                    best = min(best, Double(now() - t) / 1e6)\n                }\n                if incremental { prevHits = hits.map { $0.idx } }\n                worst = max(worst, best); sum += best; n += 1\n            }\n        }\n        print(String(format: \"  %-34@ mean %7.3f ms/keystroke, max of per-keystroke best-of-7 %7.3f ms\", label as NSString, sum / Double(n), worst))\n    }\n    if target == 20_000 {\n        for word in [\"vsc\", \"keyboard la\", \"sysset\", \"term\", \"safa\"] {\n            let q = Array(word.utf8)\n            let top = topK(search(c, query: q, within: nil, prefilter: true, threads: 1), 4, c)\n            let shown = top.map { \"\\(c.names[Int($0.idx)]) [\\([\"app\",\"setting\",\"file\"][Int(c.kind[Int($0.idx)])])]\" }\n            print(\"  top for '\\(word)': \" + shown.joined(separator: \" | \"))\n        }\n    }\n}\nprint(\"checksum \\(checksum)\")\n\u003c/code>\u003c/pre>\n","backlinks":["index","build/m1-foundation","plan","research/alignment","research/claude/report","spikes/2026-11-18-panel-latency"]},{"id":"research/claude/report","title":"Claude research report","section":"Research","order":0,"metadata":{"author":"Claude (Claude Code, Opus 5.5)"},"metadataHtml":"\u003cspan>Author: Claude (Claude Code, Opus 5.5)\u003c/span> \u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Claude research report\nsection: Research\nupdated: 2026-11-18\nauthor: Claude (Claude Code, Opus 5.5)\n---\n# Claude research report\n\nClaude's independent research for Apparate, written in parallel with Codex's report. The two are compared in the alignment page. Confidence labels: **verified** means read in source code or official docs, or measured on this machine. **Unverified** means a secondary source or inference.\n\nSupporting page: [matching benchmark](benchmark.md) (method, numbers, and source).\n\n## Summary\n\n- **Our own scorer is cheap; Spotlight was not measured.** A Swift fzy-style scorer matches ~20k names in about 0.13 ms per keystroke on this Mac (verified, measured). That does not measure Spotlight's matching, and Spotlight's pipeline was not profiled. Suspected causes are the per-keystroke query to a system daemon and the merge of results that arrive asynchronously from several providers. That is **inference** (corrected after review; the first version stated it as fact).\n- **The fast launchers prepare what they search before the user types, and keep the window alive.** How they get results varies. Alfred queries the Spotlight index for files (verified, Alfred docs). Flow Launcher calls Everything over IPC. Raycast 2.0 moved file search off Spotlight to its own Rust indexer that follows \"file system events\" (verified, Raycast blog, May 2026; that it uses the FSEvents API specifically is inference). LaunchBar keeps its own rule-based index (verified, docs). Tinycast builds a memory-mapped index with `getattrlistbulk` and FSEvents (verified, source). Cross-process calls are not slow in themselves; what matters is predictable latency and publishing one complete result set (corrected after review).\n- **Apparate's data is small.** 336 app bundles, 688 settings items, and ~22k files and folders in the home folder outside Library (verified, measured). That fits in a few MB of memory, and a full scan takes well under a second.\n- **System Settings sub-items come from `.searchTerms` plists** inside each settings extension. On macOS 27, in English, the ExtensionKit extensions hold 41 files with 688 entries. One legacy `DateAndTime.prefPane` file adds 3 more, for 42/691 (verified, on disk; scope clarified after review). The tested `mdfind` query did not find them, and none of the open-source launchers reviewed (Sol, Tinycast) reads them. Opening a specific sub-item via URL anchor is **unverified** and needs a prototype spike.\n- **Recommended stack:** a single-process Swift + AppKit agent app with a pre-built, hidden, non-activating `NSPanel`. Use a Carbon global hotkey, an in-memory index, and an fzy-style scorer with a bitmask prefilter and tiered ranking with frecency. A minimal shell of this kind measured 18 MB idle (verified, measured), against Raycast's 200–450 MB.\n- **\"No shifting results\" is a design rule, not an optimisation.** All local sources are computed in one synchronous pass before drawing. Nothing is appended after the first draw. Ties break deterministically, rows have a fixed height, and icons are pre-cached with same-size placeholders.\n- **Main risks:** deep-link anchors for settings sub-items; privacy prompts (TCC) for Desktop, Documents and Downloads; replacing ⌘Space requires disabling Spotlight's shortcut. Building without full Xcode works (Swift 6.4 Command Line Tools). It is commonly reported, but not tested here, that ad-hoc signed rebuilds lose their TCC grants.\n\n## How existing launchers are fast\n\n| Launcher | Stack | Why it feels fast | Footprint |\n| --- | --- | --- | --- |\n| Raycast v1 | Swift + AppKit, custom list rows; avoided SwiftUI \"for performance and control\" | Native rendering, own keyboard handling, windows kept in memory | ~200–300 MB (Raycast blog) |\n| Raycast 2.0 (2026) | AppKit shell + WKWebView (React) + Node backend + Rust core | Windows shown at `alphaValue = 0`, render forced in `requestAnimationFrame`, then revealed; WebKit occlusion throttling disabled; emoji font pre-warmed | ~350–450 MB (Raycast blog, `phys_footprint`) |\n| Alfred | Native Objective-C/Cocoa (secondary sources) | Small native app; apps and preferences in default results; files via the Spotlight metadata index | Vendor/secondary claims of 20–50 MB, unverified |\n| LaunchBar | Native | Own index built from user-defined indexing rules; abbreviation learning | Not found |\n| Spotlight (macOS 26/27) | System UI + `mds`/`corespotlightd` | Same index as everything else; now also actions, Quick Keys, clipboard history | User reports of slowness and lag on 26.x (Six Colors, Apple Community; unverified as to cause) |\n| Tinycast (open source, AGPL) | Swift 6, SwiftUI inside AppKit `NSPanel`s, no dependencies | Folds text once per index change, never per keystroke; ranking cached per query; file crawl in a helper process | Not measured; codebase is ~182k lines of Swift despite the name |\n| Sol (open source) | React Native macOS UI + Swift native modules | Persistent non-activating `NSPanel`; app list in memory | Not measured |\n| Quicksilver (open source, still maintained) | Objective-C | \"Catalog\" of sources rescanned periodically; `QSSense` abbreviation scorer (origin of many launcher scorers) | Not measured |\n| Ueli, Kunkun | Electron / Tauri + web UI | fuzzysort or fuse.js in JS | Larger web-runtime baseline (not measured) |\n| Flow Launcher (Windows) | C#/WPF | Delegates file search to Everything over IPC; own acronym matcher | Not measured |\n\nCommon factors in the fast ones (verified across the sources above):\n\n1. **The window already exists.** Sol, Tinycast and Raycast keep the launcher window alive and only order it front. Sol and Tinycast use `NSPanel` with `.nonactivatingPanel` (verified, source). The launcher can take keyboard focus without activating its app, so the hotkey-to-visible path skips app activation.\n2. **The search set is in-process memory.** Apps, commands and settings are lists in memory. Text is folded once when the list changes (Tinycast: \"Folded once per index change, never per keystroke\").\n3. **Results come from a source with predictable latency.** For most, that is in-process memory. Flow Launcher's file results come from Everything over IPC, which shows a cross-process call can be fast (corrected after review). Alfred's file results depend on Spotlight's health; its own troubleshooting docs say it can find only what Spotlight has indexed.\n4. **Ranking is cached and learned.** Tinycast caches ranking per query and learns per-term usage. Raycast documents the order: exact alias > alias prefix > title fuzzy score > subtitle/keyword > frecency.\n\nWhy Spotlight is slow and shifts (partly **inference**): every keystroke is a query to a system daemon, and results stream in from several providers (files, apps, settings, suggestions, actions) that finish at different times. Since macOS 26 it also does more work per query (App Intents actions, Quick Keys, clipboard). The user reports cited above describe waits when launching apps; I found no Apple statement of cause.\n\n## How they index apps and files\n\n**Apps**\n\n- Scan the standard folders and watch them with FSEvents: `/Applications`, `/System/Applications` (+ `Utilities`), `~/Applications`, `/System/Library/CoreServices/Applications`, plus fixed extras such as `Finder.app` (Sol, verified source). Sol scans to depth 4 and keeps an ignore list. Tinycast re-scans on every open and notes that \"LaunchServices can trail a deletion by seconds.\"\n- An alternative is a one-time `mdfind kMDItemContentType == \"com.apple.application-bundle\"` for apps outside those folders. It returned 336 unique names in 66 ms here, but it includes helper apps buried in Application Support that need filtering (verified, measured).\n- Names: use the localized display name, plus alternate names (`CFBundleAlternateNames`, Spotlight keywords). Raycast documents `iCal` → Calendar; Tinycast ranks alternate titles like the name.\n\n**Files**\n\n| Approach | Used by | Pros | Cons |\n| --- | --- | --- | --- |\n| Query Spotlight (`MDQuery`/`NSMetadataQuery`) per keystroke | Alfred, Raycast v1, Ueli (apps, via `mdfind`) | No index to maintain; content search possible | 66–153 ms per query here (`mdfind`, includes process start); results async; only finds what Spotlight indexed; inherits Spotlight's problems |\n| Own name index + file system events | Raycast 2.0 (Rust, separate process; FSEvents API not named), Tinycast, Sol (SQLite) | Synchronous, predictable, works when Spotlight is broken; scope and ignore rules under our control | Must handle crawl, permissions, persistence, change replay |\n| Own rule-based index, rebuilt on schedule | LaunchBar, Quicksilver | Simple | Stale between rebuilds |\n| Reference designs (other OSes) | Everything (NTFS MFT + USN journal), plocate (trigram posting lists) | Everything: ~250k files in ~5 s and ~35 MB RAM; 1M files ~100 MB (voidtools FAQ). plocate: 27M files searched in 8 ms (plocate site) | Not macOS; Apparate's scale (~10⁴–10⁵) doesn't need trigram indexes |\n\nNotable implementation details (verified, source):\n\n- **Tinycast:** crawls with `getattrlistbulk` (\"one call lists hundreds of entries with their mtime, so nothing is stat'd\"). The crawl runs in a separate helper process \"so its memory leaves when that process exits.\" The index is memory-mapped \"so searches answer even while a rebuild runs.\" FSEvents replays from the snapshot's own event ID, and it rebuilds on `RootChanged` or `EventIdsWrapped`. Searches run in parallel across cores, and changes are applied as an overlay until a rebuild is cheaper.\n- **Sol:** stores files in SQLite, but its search query is `SELECT path, name, is_folder FROM files LIMIT 1000`. It then scores with `NSString.scoreAgainst` (threshold 0.5) and sorts alphabetically. Only the first 1,000 rows are ever matched, so it is not a correct full-corpus design. (Corrected after review: the first version said fuse.js. Sol's root app/command search uses MiniSearch in `src/stores/ui.store.tsx`.)\n- **Raycast 2.0:** name-only by default, with `.gitignore`/`.ignore`/`.rayignore` support, built-in noise filters (`node_modules`, caches), and default scope = home folder + `/Applications`. Content search is delegated to the OS index (verified, manual).\n\n## macOS platform\n\n**File indexing primitives**\n\n- **FSEvents** (verified, Apple docs and Tinycast source): use `kFSEventStreamCreateFlagFileEvents` for per-file events. Persist the last event ID, and on next launch pass it as `sinceWhen` to replay changes made while the app was not running (the macOS analogue of Everything's USN journal). Handle `MustScanSubDirs`, `RootChanged`, and `EventIdsWrapped` by rescanning.\n- **Directory enumeration:** Apple's Jim Luther (filesystem-dev, 2019) said `readdir` is fastest for names only and `getattrlistbulk` wins when attributes are needed. Tempelmann's 2019 tests favour `fts` on APFS. Tinycast uses `getattrlistbulk`. A pruned walk of this home folder (22k entries) took 0.6 s with `find`. That is cold-path work done once, so the choice matters little at this scale (measured).\n- **Spotlight queries:** `NSMetadataQuery`/`MDQuery` are fine for occasional or optional searches (file contents, \"search whole disk\"), not for the per-keystroke path.\n\n**Privacy (TCC)** (verified, Raycast manual and Tinycast source; behaviour well documented): a non-sandboxed app reading Desktop, Documents, Downloads, iCloud Drive, removable or network volumes gets a per-folder consent prompt. Full Disk Access covers all of them and can be revoked at any time without notice. Tinycast re-checks it for that reason. Let the user pick roots with `NSOpenPanel`; a sandboxed build would also need security-scoped bookmarks (added after review). Folder consent and sandbox access are separate mechanisms. TCC ties grants to the app's code signature; it is commonly reported, not tested here, that ad-hoc signed rebuilds lose their grants. A stable self-signed certificate for development avoids the question. Also avoid reading dataless iCloud files, which can trigger downloads (Codex's point).\n\n**Global hotkey:** Carbon `RegisterEventHotKey` needs no permission prompt and is what Tinycast's `HotKeyCenter` uses (verified, source). `CGEventTap` (used by Sol) needs Accessibility/Input Monitoring permission and is only required for things like double-tap modifiers or hyper keys. ⌘Space works only after the user disables Spotlight's shortcut in Keyboard settings.\n\n**Window strategy:** create the `NSPanel` at launch with `.nonactivatingPanel` and `canBecomeKey = true`. Pin it across Spaces (`.canJoinAllSpaces`, `.fullScreenAuxiliary`) at `.floating` level and hide it on `windowDidResignKey` (Sol, verified source). Showing it is then `makeKeyAndOrderFront`. Run as an agent app (`LSUIElement`, accessory activation policy) with no Dock icon.\n\n**Icons:** `NSWorkspace.icon(forFile:)` for apps and files; cache by path and modification date (Tinycast keys app icons on bundle icon changes). Settings panes have icons declared as `ISGraphicIconConfiguration` / content types such as `com.apple.graphic-icon.keyboard`. Tinycast loads these as content-type icons, i.e. `NSWorkspace.icon(for: UTType)` (verified, source).\n\n**Launching:** `NSWorkspace.openApplication(at:configuration:)` for apps, and `NSWorkspace.open(_:)` for files, folders and `x-apple.systempreferences:` URLs.\n\n**Toolchain on this machine:** Swift 6.4.2 with Command Line Tools only, no Xcode (verified). SwiftPM can build the executable. The `.app` bundle (Info.plist with `LSUIElement`) and code signing are a small script.\n\n## System Settings items\n\n**Data source (verified, on disk):**\n\n- Settings panes are ExtensionKit extensions in `/System/Library/ExtensionKit/Extensions/*.appex` whose `Info.plist` has `EXAppExtensionAttributes.EXExtensionPointIdentifier = com.apple.Settings.extension.ui` (52 on this Mac). Legacy `.prefPane` bundles still exist in `/System/Library/PreferencePanes` (40) and in `/Library/PreferencePanes` for third-party panes.\n- Each pane names its search file in `SettingsExtensionAttributes.searchTermsFileName`. The file is `Contents/Resources/\u003clang>.lproj/\u003cname>.searchTerms`, an XML plist with this layout: group key (e.g. `InputSources`) → `localizableStrings` → entries with `title` (\"Keyboard layouts\") and `index` (comma-separated keywords, e.g. \"QWERTY, AZERTY, Dvorak, …\").\n- 42 English files and 691 entries on macOS 27.0. This is exactly what Spotlight shows as settings sub-items in the user's screenshot.\n- The same `Info.plist` has the pane's bundle ID (`com.apple.Keyboard-Settings.extension`), its legacy ID (`com.apple.preference.keyboard`), `allowsXAppleSystemPreferencesURLScheme`, and its icon configuration.\n- `mdfind 'kMDItemDisplayName == \"Keyboard layouts\"'` returns nothing. That shows the metadata query does not expose this item; it
