)//len(base)))[:200000]\n# JSON avoids newline/tab ambiguity in real filenames.\ndata = json.dumps(corpus, ensure_ascii=False).encode()\nPath(__file__).with_name('candidates.json').write_bytes(data)\nprint(json.dumps({'apps':len(apps),'paths':len(paths),'unique_base':len(base),'N':len(corpus),'mean_utf8_bytes':sum(len(x.encode()) for x in corpus)/len(corpus),'max_utf8_bytes':max(len(x.encode()) for x in corpus),'sha256':hashlib.sha256(data).hexdigest()}))\n\u003c/code>\u003c/pre>\n\u003ch3 id=\"bench-swift\">bench.swift\u003c/h3>\n\u003cp>The DP recurrence and bonus categories follow the \u003ca href=\"https://github.com/jhawthorn/fzy/blob/34b88869d022e861da4846c4463aea3ddfb3ff30/src/match.c\" rel=\"noreferrer\">fzy source\u003c/a>, implemented here as an intentionally small Swift experiment. It does not reproduce every fzy option or Unicode behaviour.\u003c/p>\n\u003cpre>\u003ccode class=\"language-swift\">import Foundation\nimport Dispatch\n\nstruct Candidate { let offset: Int; let count: Int; let mask: UInt64 }\n@inline(__always) func lower(_ b: UInt8) -&gt; UInt8 { b &gt;= 65 &amp;&amp; b &lt;= 90 ? b + 32 : b }\n@inline(__always) func bit(_ b: UInt8) -&gt; UInt64 { 1 &lt;&lt; UInt64(b &amp; 63) }\nvar bytes = [UInt8](), bonuses = [Double](), candidates = [Candidate]()\nlet input = try Data(contentsOf: URL(fileURLWithPath: CommandLine.arguments[1]))\nlet names = try JSONDecoder().decode([String].self, from: input)\nfor name in names {\n    let raw = Array(name.utf8), offset = bytes.count\n    var mask: UInt64 = 0\n    for j in raw.indices {\n        let b = lower(raw[j]), previous: UInt8 = j == 0 ? 47 : raw[j-1]\n        bytes.append(b); mask |= bit(b)\n        let bonus: Double\n        if previous == 47 { bonus = 0.9 }\n        else if previous == 32 || previous == 45 || previous == 95 { bonus = 0.8 }\n        else if previous &gt;= 97 &amp;&amp; previous &lt;= 122 &amp;&amp; raw[j] &gt;= 65 &amp;&amp; raw[j] &lt;= 90 { bonus = 0.7 }\n        else if previous == 46 { bonus = 0.6 }\n        else { bonus = 0 }\n        bonuses.append(bonus)\n    }\n    candidates.append(Candidate(offset: offset, count: raw.count, mask: mask))\n}\nlet width = max(1, candidates.map(\\.count).max()!)\n// Score only; reuse four rows, no allocation or match-position traceback per candidate.\nlet rows = UnsafeMutablePointer&lt;Double&gt;.allocate(capacity: width * 4)\nrows.initialize(repeating: 0, count: width * 4)\ndefer { rows.deinitialize(count: width * 4); rows.deallocate() }\nlet neg = -Double.infinity\n@inline(__always) func score(_ text: UnsafePointer&lt;UInt8&gt;, _ bonus: UnsafePointer&lt;Double&gt;,\n                            _ n: Int, _ query: [UInt8]) -&gt; Double {\n    let m = query.count\n    if m == 0 || m &gt; n { return neg }\n    var q = 0\n    for j in 0..&lt;n {\n        if text[j] == query[q] { q += 1; if q == m { break } }\n    }\n    if q != m { return neg } // Exact ordered-subsequence prefilter in BOTH modes.\n    if m == n { return 1_000_000 }\n    var pd = rows, pm = rows + width, cd = rows + width * 2, cm = rows + width * 3\n    for i in 0..&lt;m {\n        var best = neg\n        let gap = i == m - 1 ? -0.005 : -0.01\n        for j in 0..&lt;n {\n            var d = neg\n            if text[j] == query[i] {\n                if i == 0 { d = Double(j) * -0.005 + bonus[j] }\n                else if j &gt; 0 { d = max(pm[j-1] + bonus[j], pd[j-1] + 1.0) }\n            }\n            cd[j] = d; best = max(d, best + gap); cm[j] = best\n        }\n        swap(&amp;pd, &amp;cd); swap(&amp;pm, &amp;cm)\n    }\n    return pm[n-1]\n}\nstruct Result { let elapsed: Double; let checksum: Double; let matches: Int; let rejected: Int }\n@inline(never) func run(_ count: Int, _ query: [UInt8], _ useMask: Bool) -&gt; Result {\n    var mask: UInt64 = 0\n    for b in query { mask |= bit(b) }\n    let start = DispatchTime.now().uptimeNanoseconds\n    var checksum = 0.0, matches = 0, rejected = 0\n    bytes.withUnsafeBufferPointer { bp in\n        bonuses.withUnsafeBufferPointer { sp in\n            for i in 0..&lt;count {\n                let c = candidates[i]\n                if useMask &amp;&amp; (c.mask &amp; mask) != mask { rejected += 1; continue }\n                let value = score(bp.baseAddress! + c.offset, sp.baseAddress! + c.offset, c.count, query)\n                if value.isFinite { checksum += value; matches += 1 }\n            }\n        }\n    }\n    return Result(elapsed: Double(DispatchTime.now().uptimeNanoseconds - start)/1e6,\n                  checksum: checksum, matches: matches, rejected: rejected)\n}\n// Correctness checks are outside the timer.\nfunc testScore(_ name: String, _ query: String) -&gt; Double {\n    let raw = Array(name.utf8), text = raw.map(lower)\n    let bonus = raw.indices.map { j -&gt; Double in\n        let p: UInt8 = j == 0 ? 47 : raw[j-1]\n        if p == 47 { return 0.9 }\n        if p == 32 || p == 45 || p == 95 { return 0.8 }\n        if p &gt;= 97 &amp;&amp; p &lt;= 122 &amp;&amp; raw[j] &gt;= 65 &amp;&amp; raw[j] &lt;= 90 { return 0.7 }\n        return p == 46 ? 0.6 : 0\n    }\n    return text.withUnsafeBufferPointer { t in bonus.withUnsafeBufferPointer { b in\n        score(t.baseAddress!, b.baseAddress!, text.count, Array(query.utf8).map(lower))\n    }}\n}\nprecondition(testScore(\"Visual Studio Code\", \"VSC\").isFinite)\nprecondition(testScore(\"Visual Studio Code\", \"VSC\") &gt; testScore(\"avbsxc\", \"vsc\"))\nprecondition(!testScore(\"Visual Studio Code\", \"csv\").isFinite)\nprint(\"N,query,plain_ms,mask_ms,plain_p95_ms,mask_p95_ms,matches,mask_rejected_pct\")\nlet queries = [\"v\", \"vs\", \"vsc\", \"s\", \"sw\", \"swi\", \"src\", \"read\", \"readme\", \"app\", \"zqxj\"]\nvar sink = 0.0\nfor n in [1000, 20000, 200000] {\n    for query in queries {\n        let q = Array(query.utf8).map(lower)\n        var times = [[Double](), [Double]()]\n        var last = [Result]()\n        for round in 0..&lt;11 {\n            var pair = [Result?](repeating:nil, count:2)\n            for mode in (round % 2 == 0 ? [0,1] : [1,0]) {\n                let result = run(n, q, mode == 1); pair[mode] = result\n                if round &gt;= 2 { times[mode].append(result.elapsed) }\n                sink += result.checksum\n            }\n            precondition(pair[0]!.matches == pair[1]!.matches)\n            precondition(pair[0]!.checksum == pair[1]!.checksum)\n            last = pair.map { $0! }\n        }\n        times[0].sort(); times[1].sort()\n        print(String(format: \"%d,%@,%.3f,%.3f,%.3f,%.3f,%d,%.1f\", n, query,\n                     times[0][4], times[1][4], times[0][8], times[1][8], last[0].matches,\n                     100.0 * Double(last[1].rejected)/Double(n)))\n    }\n}\nfputs(\"checksum=\\(sink)\\n\", stderr)\n\u003c/code>\u003c/pre>\n\u003cp>See \u003ca href=\"#/research/codex/fuzzy-matching\">fuzzy matching\u003c/a> for the proposed production ranking and Unicode requirements, and the \u003ca href=\"#/research/codex/report\">report\u003c/a> for budgets and architecture.\u003c/p>\n","backlinks":["index","build/m1-foundation","research/alignment","research/codex/fuzzy-matching","research/codex/open-source-launchers","research/codex/report"]},{"id":"research/codex/fuzzy-matching","title":"Fuzzy matching analysis","section":"Research","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Fuzzy matching analysis\nsection: Research\nupdated: 2026-11-18\n---\n# Fuzzy matching analysis\n\nSupporting analysis for the [report](report.md). The [benchmark](benchmark.md) contains local measurements and complete reproduction code.\n\n## What must match\n\n`VSC` must match **V**isual **S**tudio **C**ode without a manually configured alias. This is ordered-subsequence matching with word-boundary bonuses; ordinary edit-distance matching is a different problem. Case-insensitive matching should remain the default even when the user types an uppercase acronym. Preserve boundaries from the original string before folding case.\n\nThe ranking contract should put exact and prefix matches ahead of scattered matches, recognize word initials and camel-case humps, and use history without letting an unrelated frequently used item dominate. No single scorer provides asynchronous result stability: that belongs to the query/UI pipeline.\n\n## Algorithm comparison\n\nIn this table, `m` is query length and `n` is candidate length. **Verified—source** except where marked otherwise. These are algorithm properties, not head-to-head timing results.\n\n| Algorithm | Mechanics and cost | Fit for Apparate |\n| --- | --- | --- |\n| fzf v1 | Forward subsequence scan, then backward tightening. O(n), but only considers the first discovered occurrence; may miss a better later alignment. | Good bounded fallback for huge candidates. Weak default when match quality matters. |\n| fzf v2 | Modified Smith–Waterman-style DP; boundary/camel-case/consecutive bonuses and affine-like gap penalties. O(n) rejection; O(mn) matching; matrix allocation/slab limits lead to v1 fallback. | Strong reference for launcher-quality matching, but copy neither its terminal UI nor all allocations. |\n| fzy | Ordered-subsequence precheck; DP tracks best score and best score ending at each position. Consecutive, slash, word-start, camel-case, and dot bonuses; leading/internal/trailing gap penalties. O(mn), score-only rolling rows O(n). | Small, understandable Swift implementation; best first implementation here. Original C code has a 1,024-character cap, which should not become a silent path-search cap. |\n| nucleo | Rust matcher used by Helix; fzf-like scoring with improved DP, narrowed rolling rows, aggressive ASCII prefilters, reusable buffers, Unicode preprocessing, and greedy fallback for long inputs. High-level picker also handles parallel work/snapshots. | Best optimization reference; using it directly adds Rust/FFI/build integration. Benchmark the Swift version before choosing that cost. |\n| SkimMatcherV2 | Rust DP with separate match/skip states, configurable bonuses and gap penalties, cached buffers, cheap subsequence check, and size-limited fallback. | Useful scoring tests/reference. Current skim contains several engines, so “skim” alone is not a precise algorithm/version. |\n| Sublime Text | Official docs confirm fuzzy navigation/completion, but proprietary scoring source is unavailable. The often-cited `lib_fts` is an independent approximation with recursion limits and bonuses for adjacent, separator, and camel-case matches. | Behavioural inspiration. Do not call `lib_fts` Sublime's source or assume exact parity. |\n| VS Code `fuzzyScore` | DP with subsequence precheck and feasible-position bounds; rewards prefix/boundaries/case, penalizes gaps, records traceback. Defaults reject a weak first match; callers can relax this. Current function clamps inputs to 128 UTF-16 units and uses shared tables. | Useful relevance cases; a direct long-path port would silently lose coverage. Use worker-local buffers and a deliberate length strategy. |\n\nSource paths: [fzf algo.go](https://github.com/junegunn/fzf/blob/4499615fe9c06c0651aa5650e5d0d0a5face99a8/src/algo/algo.go); [fzy match.c](https://github.com/jhawthorn/fzy/blob/34b88869d022e861da4846c4463aea3ddfb3ff30/src/match.c), [fzy limits](https://github.com/jhawthorn/fzy/blob/34b88869d022e861da4846c4463aea3ddfb3ff30/src/match.h), [fzy algorithm](https://github.com/jhawthorn/fzy/blob/34b88869d022e861da4846c4463aea3ddfb3ff30/ALGORITHM.md); [nucleo design](https://github.com/helix-editor/nucleo/blob/8c16d47cdfa9607d3e44df5f81c635c6f43c65ee/README.md), [nucleo matcher](https://github.com/helix-editor/nucleo/blob/8c16d47cdfa9607d3e44df5f81c635c6f43c65ee/matcher/src/lib.rs); [SkimMatcherV2](https://github.com/skim-rs/skim/blob/daa87145159c161f6202d97b1ea76b40b003c704/src/fuzzy_matcher/skim.rs), [skim engine selection](https://github.com/skim-rs/skim/blob/daa87145159c161f6202d97b1ea76b40b003c704/src/engine/fuzzy.rs); [Sublime documentation](https://www.sublimetext.com/docs/indexing.html), [independent lib_fts implementation](https://github.com/forrestthewoods/lib_fts/blob/d541eb49b289a03320fb62150b8fd01364e22403/code/fts_fuzzy_match.h); [VS Code filters.ts](https://github.com/microsoft/vscode/blob/6e57ff527892780e13d38b3ef961d8377f8ed34a/src/vs/base/common/filters.ts).\n\nNucleo publishes a Linux-kernel microbenchmark and a deliberately unscientific large-list demonstration. Those are **author-reported**, with a different machine/workload; they do not establish a fixed multiplier over current fzf/skim on this Mac. No head-to-head local comparison was run.\n\n## Alfred and Raycast\n\n**Verified—official docs.** Alfred supports matching application capital letters (`gc` for Google Chrome) or a broader fuzzy mode starting at word boundaries. Its closed source does not establish a particular DP formula. [Alfred default results](https://www.alfredapp.com/help/features/default-results/).\n\nRaycast documents exact alias, alias prefix, title fuzzy score, subtitle/keywords, then frecency as root-search priorities, and learns selections associated with a query. Root-search sensitivity is configurable. This confirms product behaviour, not its proprietary scoring implementation or a proven `VSC` case on this machine. [Raycast search bar](https://manual.raycast.com/search-bar), [aliases](https://manual.raycast.com/command-aliases-and-hotkeys).\n\n## Recommended ranking contract\n\n**Recommendation—not implemented.** Parse the configurable mode prefix first. Then evaluate only that mode's candidates.\n\n1. Exact explicit alias or exact displayed name.\n2. Display-name prefix.\n3. Word-prefix/acronym alignment, including `VSC`, `gc`, and camel-case humps.\n4. Other contiguous display-name matches.\n5. General subsequence matches.\n6. Secondary keywords/path matches, with lower priority than comparable title matches.\n\nWithin a tier, combine normalized text quality with a **bounded** usage term, then deterministic folded name and stable ID. One candidate formula is `text + λ × min(1, log1p(decayedUses)/log1p(20))`, with a small λ calibrated on examples. Decay uses a fixed half-life, initially 30 days; successful launches add one. This formula/half-life is a proposal, not copied behaviour from Alfred/Raycast. Learn query-specific preferences as well as general usage, with a reset action. Capture one history/time snapshot per query so results do not drift while visible.\n\nSeparate alias and title sub-priorities if users require aliases always to win. Basename matches should normally outrank matches solely in a parent folder. If the query contains `/`, switch to path-oriented matching; document that syntax rather than sometimes hiding path matches behind a result cap.\n\nA strict tier system intentionally chooses predictability over a single global fuzzy score. Confirm the order with golden examples, including duplicate app names, Calculator/Calendar, `VSC`, `code`, accented names, non-Latin names, and filename extensions.\n\n## Prevent results from jumping\n\n- Search a consistent index generation; compute top results before publishing one batch for a keystroke. Stable sorting cannot fix different providers publishing partial lists at unrelated times.\n- Cancel obsolete work and check a monotonically increasing query ID before publication. Do not let a result for `v` overwrite `vsc`.\n- When the user moves selection, track the selected stable ID through updates. Enter must activate the displayed selection, not a newly ranked unseen item.\n- Keep row height, icon space, and list geometry stable. Replace placeholders without moving text.\n- Deterministic ordering for the same query/snapshot is required; unchanged ordering across different queries is not. Better evidence as the user types should be allowed to change ranking.\n- Appending query characters permits filtering the prior **complete match set**. Filtering only the previously shown top 10 can lose newly relevant matches. Backspace, mode/root changes, normalization changes, and index updates invalidate that optimization.\n\n## Recommendation after measurement\n\nUse a score-only fzy-like DP in Swift, prepared basename/name buffers, a cheap 64-bit character mask, ordered-subsequence rejection, and reused scratch rows. Compute highlight positions only for displayed results. Use a Unicode-aware path for non-ASCII input with a mapping back to original display graphemes; the benchmark's byte folding is not sufficient for production.\n\nAt 200,000 candidates, the measured basename+mask workload took 0.20–6.31 ms per query; full-path+mask took 0.47–80.82 ms. Search fields and workload selectivity matter more here than the mere choice of a fuzzy algorithm. These numbers exclude sorting, top-K selection, IPC, drawing, icon loading, and index refresh. See the [full method and results](benchmark.md).\n\nKeep the small app/settings corpus independent of file search, use bounded top-K selection, and add path narrowing when necessary. Do not put a contiguous-trigram requirement in front of an acronym scorer: `vsc` is not a substring of “Visual Studio Code”. Do not use a broad two-stage top-K shortlist unless its recall is proven; a fast prefilter must not discard the correct match.\n","toc":[{"id":"what-must-match","title":"What must match","depth":2},{"id":"algorithm-comparison","title":"Algorithm comparison","depth":2},{"id":"alfred-and-raycast","title":"Alfred and Raycast","depth":2},{"id":"recommended-ranking-contract","title":"Recommended ranking contract","depth":2},{"id":"prevent-results-from-jumping","title":"Prevent results from jumping","depth":2},{"id":"recommendation-after-measurement","title":"Recommendation after measurement","depth":2}],"titleAnchor":"fuzzy-matching-analysis","links":["research/codex/report","research/codex/benchmark","research/codex/benchmark"],"attachments":[],"html":"\u003cp>Supporting analysis for the \u003ca href=\"#/research/codex/report\">report\u003c/a>. The \u003ca href=\"#/research/codex/benchmark\">benchmark\u003c/a> contains local measurements and complete reproduction code.\u003c/p>\n\u003ch2 id=\"what-must-match\">What must match\u003c/h2>\n\u003cp>\u003ccode>VSC\u003c/code> must match \u003cstrong>V\u003c/strong>isual \u003cstrong>S\u003c/strong>tudio \u003cstrong>C\u003c/strong>ode without a manually configured alias. This is ordered-subsequence matching with word-boundary bonuses; ordinary edit-distance matching is a different problem. Case-insensitive matching should remain the default even when the user types an uppercase acronym. Preserve boundaries from the original string before folding case.\u003c/p>\n\u003cp>The ranking contract should put exact and prefix matches ahead of scattered matches, recognize word initials and camel-case humps, and use history without letting an unrelated frequently used item dominate. No single scorer provides asynchronous result stability: that belongs to the query/UI pipeline.\u003c/p>\n\u003ch2 id=\"algorithm-comparison\">Algorithm comparison\u003c/h2>\n\u003cp>In this table, \u003ccode>m\u003c/code> is query length and \u003ccode>n\u003c/code> is candidate length. \u003cstrong>Verified—source\u003c/strong> except where marked otherwise. These are algorithm properties, not head-to-head timing results.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Algorithm\u003c/th>\n\u003cth>Mechanics and cost\u003c/th>\n\u003cth>Fit for Apparate\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>fzf v1\u003c/td>\n\u003ctd>Forward subsequence scan, then backward tightening. O(n), but only considers the first discovered occurrence; may miss a better later alignment.\u003c/td>\n\u003ctd>Good bounded fallback for huge candidates. Weak default when match quality matters.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fzf v2\u003c/td>\n\u003ctd>Modified Smith–Waterman-style DP; boundary/camel-case/consecutive bonuses and affine-like gap penalties. O(n) rejection; O(mn) matching; matrix allocation/slab limits lead to v1 fallback.\u003c/td>\n\u003ctd>Strong reference for launcher-quality matching, but copy neither its terminal UI nor all allocations.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>fzy\u003c/td>\n\u003ctd>Ordered-subsequence precheck; DP tracks best score and best score ending at each position. Consecutive, slash, word-start, camel-case, and dot bonuses; leading/internal/trailing gap penalties. O(mn), score-only rolling rows O(n).\u003c/td>\n\u003ctd>Small, understandable Swift implementation; best first implementation here. Original C code has a 1,024-character cap, which should not become a silent path-search cap.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>nucleo\u003c/td>\n\u003ctd>Rust matcher used by Helix; fzf-like scoring with improved DP, narrowed rolling rows, aggressive ASCII prefilters, reusable buffers, Unicode preprocessing, and greedy fallback for long inputs. High-level picker also handles parallel work/snapshots.\u003c/td>\n\u003ctd>Best optimization reference; using it directly adds Rust/FFI/build integration. Benchmark the Swift version before choosing that cost.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>SkimMatcherV2\u003c/td>\n\u003ctd>Rust DP with separate match/skip states, configurable bonuses and gap penalties, cached buffers, cheap subsequence check, and size-limited fallback.\u003c/td>\n\u003ctd>Useful scoring tests/reference. Current skim contains several engines, so “skim” alone is not a precise algorithm/version.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Sublime Text\u003c/td>\n\u003ctd>Official docs confirm fuzzy navigation/completion, but proprietary scoring source is unavailable. The often-cited \u003ccode>lib_fts\u003c/code> is an independent approximation with recursion limits and bonuses for adjacent, separator, and camel-case matches.\u003c/td>\n\u003ctd>Behavioural inspiration. Do not call \u003ccode>lib_fts\u003c/code> Sublime's source or assume exact parity.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>VS Code \u003ccode>fuzzyScore\u003c/code>\u003c/td>\n\u003ctd>DP with subsequence precheck and feasible-position bounds; rewards prefix/boundaries/case, penalizes gaps, records traceback. Defaults reject a weak first match; callers can relax this. Current function clamps inputs to 128 UTF-16 units and uses shared tables.\u003c/td>\n\u003ctd>Useful relevance cases; a direct long-path port would silently lose coverage. Use worker-local buffers and a deliberate length strategy.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Source paths: \u003ca href=\"https://github.com/junegunn/fzf/blob/4499615fe9c06c0651aa5650e5d0d0a5face99a8/src/algo/algo.go\" rel=\"noreferrer\">fzf algo.go\u003c/a>; \u003ca href=\"https://github.com/jhawthorn/fzy/blob/34b88869d022e861da4846c4463aea3ddfb3ff30/src/match.c\" rel=\"noreferrer\">fzy match.c\u003c/a>, \u003ca href=\"https://github.com/jhawthorn/fzy/blob/34b88869d022e861da4846c4463aea3ddfb3ff30/src/match.h\" rel=\"noreferrer\">fzy limits\u003c/a>, \u003ca href=\"https://github.com/jhawthorn/fzy/blob/34b88869d022e861da4846c4463aea3ddfb3ff30/ALGORITHM.md\" rel=\"noreferrer\">fzy algorithm\u003c/a>; \u003ca href=\"https://github.com/helix-editor/nucleo/blob/8c16d47cdfa9607d3e44df5f81c635c6f43c65ee/README.md\" rel=\"noreferrer\">nucleo design\u003c/a>, \u003ca href=\"https://github.com/helix-editor/nucleo/blob/8c16d47cdfa9607d3e44df5f81c635c6f43c65ee/matcher/src/lib.rs\" rel=\"noreferrer\">nucleo matcher\u003c/a>; \u003ca href=\"https://github.com/skim-rs/skim/blob/daa87145159c161f6202d97b1ea76b40b003c704/src/fuzzy_matcher/skim.rs\" rel=\"noreferrer\">SkimMatcherV2\u003c/a>, \u003ca href=\"https://github.com/skim-rs/skim/blob/daa87145159c161f6202d97b1ea76b40b003c704/src/engine/fuzzy.rs\" rel=\"noreferrer\">skim engine selection\u003c/a>; \u003ca href=\"https://www.sublimetext.com/docs/indexing.html\" rel=\"noreferrer\">Sublime documentation\u003c/a>, \u003ca href=\"https://github.com/forrestthewoods/lib_fts/blob/d541eb49b289a03320fb62150b8fd01364e22403/code/fts_fuzzy_match.h\" rel=\"noreferrer\">independent lib_fts implementation\u003c/a>; \u003ca href=\"https://github.com/microsoft/vscode/blob/6e57ff527892780e13d38b3ef961d8377f8ed34a/src/vs/base/common/filters.ts\" rel=\"noreferrer\">VS Code filters.ts\u003c/a>.\u003c/p>\n\u003cp>Nucleo publishes a Linux-kernel microbenchmark and a deliberately unscientific large-list demonstration. Those are \u003cstrong>author-reported\u003c/strong>, with a different machine/workload; they do not establish a fixed multiplier over current fzf/skim on this Mac. No head-to-head local comparison was run.\u003c/p>\n\u003ch2 id=\"alfred-and-raycast\">Alfred and Raycast\u003c/h2>\n\u003cp>\u003cstrong>Verified—official docs.\u003c/strong> Alfred supports matching application capital letters (\u003ccode>gc\u003c/code> for Google Chrome) or a broader fuzzy mode starting at word boundaries. Its closed source does not establish a particular DP formula. \u003ca href=\"https://www.alfredapp.com/help/features/default-results/\" rel=\"noreferrer\">Alfred default results\u003c/a>.\u003c/p>\n\u003cp>Raycast documents exact alias, alias prefix, title fuzzy score, subtitle/keywords, then frecency as root-search priorities, and learns selections associated with a query. Root-search sensitivity is configurable. This confirms product behaviour, not its proprietary scoring implementation or a proven \u003ccode>VSC\u003c/code> case on this machine. \u003ca href=\"https://manual.raycast.com/search-bar\" rel=\"noreferrer\">Raycast search bar\u003c/a>, \u003ca href=\"https://manual.raycast.com/command-aliases-and-hotkeys\" rel=\"noreferrer\">aliases\u003c/a>.\u003c/p>\n\u003ch2 id=\"recommended-ranking-contract\">Recommended ranking contract\u003c/h2>\n\u003cp>\u003cstrong>Recommendation—not implemented.\u003c/strong> Parse the configurable mode prefix first. Then evaluate only that mode's candidates.\u003c/p>\n\u003col>\n\u003cli>Exact explicit alias or exact displayed name.\u003c/li>\n\u003cli>Display-name prefix.\u003c/li>\n\u003cli>Word-prefix/acronym alignment, including \u003ccode>VSC\u003c/code>, \u003ccode>gc\u003c/code>, and camel-case humps.\u003c/li>\n\u003cli>Other contiguous display-name matches.\u003c/li>\n\u003cli>General subsequence matches.\u003c/li>\n\u003cli>Secondary keywords/path matches, with lower priority than comparable title matches.\u003c/li>\n\u003c/ol>\n\u003cp>Within a tier, combine normalized text quality with a \u003cstrong>bounded\u003c/strong> usage term, then deterministic folded name and stable ID. One candidate formula is \u003ccode>text + λ × min(1, log1p(decayedUses)/log1p(20))\u003c/code>, with a small λ calibrated on examples. Decay uses a fixed half-life, initially 30 days; successful launches add one. This formula/half-life is a proposal, not copied behaviour from Alfred/Raycast. Learn query-specific preferences as well as general usage, with a reset action. Capture one history/time snapshot per query so results do not drift while visible.\u003c/p>\n\u003cp>Separate alias and title sub-priorities if users require aliases always to win. Basename matches should normally outrank matches solely in a parent folder. If the query contains \u003ccode>/\u003c/code>, switch to path-oriented matching; document that syntax rather than sometimes hiding path matches behind a result cap.\u003c/p>\n\u003cp>A strict tier system intentionally chooses predictability over a single global fuzzy score. Confirm the order with golden examples, including duplicate app names, Calculator/Calendar, \u003ccode>VSC\u003c/code>, \u003ccode>code\u003c/code>, accented names, non-Latin names, and filename extensions.\u003c/p>\n\u003ch2 id=\"prevent-results-from-jumping\">Prevent results from jumping\u003c/h2>\n\u003cul>\n\u003cli>Search a consistent index generation; compute top results before publishing one batch for a keystroke. Stable sorting cannot fix different providers publishing partial lists at unrelated times.\u003c/li>\n\u003cli>Cancel obsolete work and check a monotonically increasing query ID before publication. Do not let a result for \u003ccode>v\u003c/code> overwrite \u003ccode>vsc\u003c/code>.\u003c/li>\n\u003cli>When the user moves selection, track the selected stable ID through updates. Enter must activate the displayed selection, not a newly ranked unseen item.\u003c/li>\n\u003cli>Keep row height, icon space, and list geometry stable. Replace placeholders without moving text.\u003c/li>\n\u003cli>Deterministic ordering for the same query/snapshot is required; unchanged ordering across different queries is not. Better evidence as the user types should be allowed to change ranking.\u003c/li>\n\u003cli>Appending query characters permits filtering the prior \u003cstrong>complete match set\u003c/strong>. Filtering only the previously shown top 10 can lose newly relevant matches. Backspace, mode/root changes, normalization changes, and index updates invalidate that optimization.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"recommendation-after-measurement\">Recommendation after measurement\u003c/h2>\n\u003cp>Use a score-only fzy-like DP in Swift, prepared basename/name buffers, a cheap 64-bit character mask, ordered-subsequence rejection, and reused scratch rows. Compute highlight positions only for displayed results. Use a Unicode-aware path for non-ASCII input with a mapping back to original display graphemes; the benchmark's byte folding is not sufficient for production.\u003c/p>\n\u003cp>At 200,000 candidates, the measured basename+mask workload took 0.20–6.31 ms per query; full-path+mask took 0.47–80.82 ms. Search fields and workload selectivity matter more here than the mere choice of a fuzzy algorithm. These numbers exclude sorting, top-K selection, IPC, drawing, icon loading, and index refresh. See the \u003ca href=\"#/research/codex/benchmark\">full method and results\u003c/a>.\u003c/p>\n\u003cp>Keep the small app/settings corpus independent of file search, use bounded top-K selection, and add path narrowing when necessary. Do not put a contiguous-trigram requirement in front of an acronym scorer: \u003ccode>vsc\u003c/code> is not a substring of “Visual Studio Code”. Do not use a broad two-stage top-K shortlist unless its recall is proven; a fast prefilter must not discard the correct match.\u003c/p>\n","backlinks":["index","build/m1-foundation","research/alignment","research/codex/benchmark","research/codex/report"]},{"id":"research/codex/open-source-launchers","title":"Open-source launcher source review","section":"Research","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Open-source launcher source review\nsection: Research\nupdated: 2026-11-18\n---\n# Open-source launcher source review\n\nSupporting evidence for the [Codex research report](report.md). **Verified—source** means inspected source at the linked commit, not a running-app performance test. Repositories were shallow-cloned outside the project. No launcher was installed or built.\n\n## Scope and freshness\n\n| Project | Inspected HEAD date | Toolkit | Status at inspection |\n| --- | --- | --- | --- |\n| Sol | 2026-11-10 | TypeScript/React Native macOS, Swift/Objective-C native bridge | Active |\n| Tinycast | 2026-11-18 | SwiftUI + AppKit | Active; AGPL-3.0 |\n| Quicksilver | 2026-10-30 | Objective-C/Cocoa | Active; useful mature native reference |\n| Albert | 2026-10-27 | C++/Qt | Active; **source-available**, not an unrestricted reuse candidate |\n| Ueli | 2026-11-16 | TypeScript/React/Electron | Active |\n| Kunkun | 2026-11-17 | Rust/Tauri + TypeScript/Svelte | Active |\n| Flow Launcher | 2026-11-15 | C#/.NET/WPF | Active; inspected development branch |\n| Loungy | 2025-10-05 | Rust/GPUI | Archived; replaced by Kunkun in the detailed comparison |\n| FSearch | 2026-11-16 | C/GTK/GLib | Active; current development source |\n| plocate | 2026-09-06 | C++/CLI | Official upstream inspected |\n\n“Active” means recent source activity, not a maintenance guarantee. Albert's current license limits redistribution, including Apple-targeted binaries. Consult the actual [license](https://github.com/albertlauncher/albert/blob/c703546832dd8e7c961b74895d43b8d0cdadf7c8/LICENSE) before any reuse. Loungy's [README](https://github.com/MatthiasGrandl/Loungy/blob/303e7d2c46db13c49f8c7ca30762e5ee0ac582d2/README.md) confirms GPUI and discontinued development: it is not a Tauri example. Cerebro and Script Kit were not audited; this sample already covers native, Electron, Tauri, Qt, and Windows index integration.\n\n## Native macOS references\n\n### Sol\n\n**Verified—source.** Apps are found by walking system, local, and user application directories, with alias handling and selected fixed locations. Metadata supplies localized names; this is not a Spotlight query for every keystroke. App-folder FSEvents trigger refreshes, with a 10-second stream latency and another debounce. [ApplicationSearcher.swift](https://github.com/ospfranco/sol/blob/873ae1c28b153f190a57a56a5ad2bea2159611f8/macos/sol-macOS/lib/ApplicationSearcher.swift)\n\nFiles use a private SQLite table containing path, name, folder flag, and parent path. A directory walk builds it; a separate FSEvents stream updates paths with 500 ms latency. These are update batching parameters, **not measured search latencies**. The current search executes `SELECT path, name, is_folder FROM files LIMIT 1000`, applies `NSString.scoreAgainst`, then sorts by name. That cap precedes matching and can exclude valid results anywhere beyond the first 1,000 rows. Serial `queue.sync` search can also wait behind indexing. [FileSearchIndex.swift](https://github.com/ospfranco/sol/blob/873ae1c28b153f190a57a56a5ad2bea2159611f8/macos/sol-macOS/lib/FileSearchIndex.swift), [FileSearchIndexer.swift](https://github.com/ospfranco/sol/blob/873ae1c28b153f190a57a56a5ad2bea2159611f8/macos/sol-macOS/lib/FileSearchIndexer.swift)\n\nRoot commands/apps live in JavaScript arrays and a MiniSearch index. Sorting uses relevance tiers, whether an item was selected, text score, selection timestamp/count, and name. The retained AppKit `NSPanel` uses React Native content and `isReleasedWhenClosed = false`; showing calls `makeKeyAndOrderFront`. [ui.store.tsx](https://github.com/ospfranco/sol/blob/873ae1c28b153f190a57a56a5ad2bea2159611f8/src/stores/ui.store.tsx), [Panel.swift](https://github.com/ospfranco/sol/blob/873ae1c28b153f190a57a56a5ad2bea2159611f8/macos/sol-macOS/views/Panel.swift), [PanelManager.swift](https://github.com/ospfranco/sol/blob/873ae1c28b153f190a57a56a5ad2bea2159611f8/macos/sol-macOS/managers/PanelManager.swift)\n\n**Take:** resident window, prebuilt app corpus, background refresh, relevance tiers. **Do not copy:** pre-match row truncation or sharing the search queue with long scans. RAM and hotkey latency: unmeasured.\n\n### Tinycast\n\n**Verified—source.** The strongest directly relevant native reference. App discovery walks configured scopes, resolves paths, reads bundle/localized names, distinguishes duplicate installations, and prepares searchable fields before publishing the array. Its app catalog rescans on each open and on scope edits; unchanged entries avoid republishing. [AppIndex.swift](https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/Launcher/Service/AppIndex.swift), [SearchScopes.swift](https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/Launcher/Model/SearchScopes.swift)\n\nFiles use their own index. `getattrlistbulk` batches directory metadata. The snapshot is a read-only memory-mapped binary with interned names, name masks, compact integer arrays, directory bitmaps, and hierarchy offsets; full paths can be reconstructed. In-memory additions and tombstones cover changes until rebuild. A helper builds snapshots, and FSEvents replay starts from an event ID taken before the crawl. Root changes/wrapped IDs cause rebuilding; subtree flags drive rescanning. [FileIndexCrawler.swift](https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/FileSearch/Service/FileIndexCrawler.swift), [FileIndexSnapshot.swift](https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/FileSearch/Service/FileIndexSnapshot.swift), [FileIndex.swift](https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/FileSearch/Service/FileIndex.swift), [FileIndexer.swift](https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/FileSearch/Service/FileIndexer.swift), [FileIndexHelper.swift](https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/FileSearch/Helper/FileIndexHelper.swift)\n\nApp matching prepares folded UTF-16 and camel-case boundaries, then computes an alignment. Ranking explicitly combines aliases, fields, usage, and deterministic ties. File search has a separate prepared byte/token matcher and a 64-bit name mask; it is not the same algorithm as app fuzzy matching. Native `NSPanel`/`NSHostingView` content is retained between uses; Carbon hotkey registration is separate from optional event taps. [LauncherMatch.swift](https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/Launcher/Model/LauncherMatch.swift), [LauncherOrder.swift](https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/Launcher/Model/LauncherOrder.swift), [FileSearchQuery.swift](https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/FileSearch/Model/FileSearchQuery.swift), [PalettePanel.swift](https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Palette/PalettePanel.swift), [HotKeyCenter.swift](https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/HotKeys/Service/HotKeyCenter.swift)\n\n**Take:** compact names/hierarchy, immutable snapshots, explicit update recovery, prepared strings. Its snapshot comment that clean mapped pages “never count as app memory” should not become an Apparate claim: mapped pages still consume resident/cache resources when accessed. Idle RAM and latency were not measured. The current app also has a much broader scope than its original minimal-launcher description.\n\n### Quicksilver\n\n**Verified—source.** Cocoa application source calls an `NSWorkspace` category that uses private `_LSCopyAllApplicationURLs`. This is evidence of one implementation, not a public-API recommendation. Its catalog stores arrays of objects and per-entry `.qsindex` files; file-system sources scan selected folders with configurable watch behavior and index validity checks. [NSWorkspace extensions](https://github.com/quicksilver/Quicksilver/blob/12d754357c538fd15dfa874970df99d378229f6d/Quicksilver/Code-QuickStepFoundation/NSWorkspace_BLTRExtensions.m), [QSCatalogEntry.m](https://github.com/quicksilver/Quicksilver/blob/12d754357c538fd15dfa874970df99d378229f6d/Quicksilver/Code-QuickStepCore/QSCatalogEntry.m), [QSFileSystemObjectSource.m](https://github.com/quicksilver/Quicksilver/blob/12d754357c538fd15dfa874970df99d378229f6d/Quicksilver/PlugIns-Main/QSCorePlugIn/Code/QSFileSystemObjectSource.m)\n\nThe default ranker normalizes strings, computes abbreviation scores, and layers explicit/learned query mnemonics and usage counts. Its window controller loads the window and subsequently shows/orders it out. Watcher backend and exhaustive catalog refresh triggers were not audited. [QSStringRanker.m](https://github.com/quicksilver/Quicksilver/blob/12d754357c538fd15dfa874970df99d378229f6d/Quicksilver/Code-QuickStepCore/QSStringRanker.m), [QSObjectRanker.m](https://github.com/quicksilver/Quicksilver/blob/12d754357c538fd15dfa874970df99d378229f6d/Quicksilver/Code-QuickStepCore/QSObjectRanker.m), [QSInterfaceController.m](https://github.com/quicksilver/Quicksilver/blob/12d754357c538fd15dfa874970df99d378229f6d/Quicksilver/Code-QuickStepInterface/QSInterfaceController.m)\n\n**Take:** learn query-to-item intent, cache a limited catalog, preserve stable IDs. Memory and latency: unmeasured.\n\n## Cross-platform references\n\n### Albert\n\n**Verified—source.** macOS application plugin walks known app roots and uses `QFileSystemWatcher`; Linux uses desktop-entry discovery. Files have a private directory tree persisted as JSON, selected-root/depth/exclusion policies, optional directory watches, and periodic rescan timers. This is not Spotlight-backed file search. [mac/plugin.cpp](https://github.com/albertlauncher/albert-plugin-applications/blob/2c4738009b91f8ceb4cf25b2de04490b3691fa76/src/mac/plugin.cpp), [xdg/plugin.cpp](https://github.com/albertlauncher/albert-plugin-applications/blob/2c4738009b91f8ceb4cf25b2de04490b3691fa76/src/xdg/plugin.cpp), [fsindexnodes.h](https://github.com/albertlauncher/albert-plugin-files/blob/74435c5f60858f65ff3d3c6cf9a01a45940caf3a/src/fsindexnodes.h), [fsindexpath.cpp](https://github.com/albertlauncher/albert-plugin-files/blob/74435c5f60858f65ff3d3c6cf9a01a45940caf3a/src/fsindexpath.cpp)\n\nSearch keeps flat item/string arrays, a word-to-occurrence inverted index, and a bigram map; Levenshtein-based fuzzy word matching is different from fzf-style subsequences. SQLite stores activations; ranking derives decayed usage weights by activation order. The Qt frontend owns a window and toggles visibility. [itemindex.cpp](https://github.com/albertlauncher/albert/blob/c703546832dd8e7c961b74895d43b8d0cdadf7c8/src/util/itemindex.cpp), [usagedatabase.cpp](https://github.com/albertlauncher/albert/blob/c703546832dd8e7c961b74895d43b8d0cdadf7c8/src/query/usagedatabase.cpp), [frontend plugin.cpp](https://github.com/albertlauncher/albert-plugin-widgetsboxmodel/blob/d7476bf16747e058af62e153d0327e53d1bc0761/src/plugin.cpp)\n\n**Take:** root-specific index policy and measured need before introducing an inverted index. Do not assume an edit-distance word matcher guarantees `VSC`. Performance: unmeasured. The archived monolithic plugins repository was superseded by dedicated plugin repositories; those were inspected here.\n\n### Ueli\n\n**Verified—source.** macOS apps come from `mdfind`, filtered to configured folders and excluding nested `.app` paths. “Simple File Search” independently enumerates chosen folders into `SearchResultItem[]`, resolving types/icons during collection. The rescan orchestrator defaults to 300 seconds when enabled; no FSEvents watcher was identified in these paths. [MacOsApplicationRepository.ts](https://github.com/oliverschwendener/ueli/blob/94104292d82b95dfa9300a432dd2ad45d41c2e28/src/main/Extensions/ApplicationSearch/macOS/MacOsApplicationRepository.ts), [SimpleFileSearchExtension.ts](https://github.com/oliverschwendener/ueli/blob/94104292d82b95dfa9300a432dd2ad45d41c2e28/src/main/Extensions/SimpleFileSearch/SimpleFileSearchExtension.ts), [RescanOrchestrator.ts](https://github.com/oliverschwendener/ueli/blob/94104292d82b95dfa9300a432dd2ad45d41c2e28/src/main/Core/RescanOrchestrator/RescanOrchestrator.ts)\n\nThe renderer searches arrays with selectable fuzzysort/Fuse.js, then groups favorites and instant results. This reviewed sort is not verified frecency. Electron creates one search `BrowserWindow`, then toggles it. [fuzzySortFilter.ts](https://github.com/oliverschwendener/ueli/blob/94104292d82b95dfa9300a432dd2ad45d41c2e28/src/common/Core/Search/fuzzySortFilter.ts), [getSearchResult.ts](https://github.com/oliverschwendener/ueli/blob/94104292d82b95dfa9300a432dd2ad45d41c2e28/src/renderer/Core/Search/Helpers/getSearchResult.ts), [SearchWindowModule.ts](https://github.com/oliverschwendener/ueli/blob/94104292d82b95dfa9300a432dd2ad45d41c2e28/src/main/Core/SearchWindow/SearchWindowModule.ts)\n\n**Take:** collect outside the query path. Avoid eager per-file icon work and polling as the sole update mechanism. Memory and latency: unmeasured.\n\n### Kunkun\n\n**Verified—source.** The Rust `applications-rs` library maintains `Arc\u003cMutex\u003cVec\u003cApp>>>`; its macOS path combines application discovery with filesystem search and Spotlight helpers. Tauri exposes explicit synchronous/background refresh commands. Frontend app arrays are fed to Fuse.js. [common.rs](https://github.com/HuakunShen/applications-rs/blob/04306329f02afb31a8cfc4cd67ce1f8d11d9c4b1/src/common.rs), [mac.rs](https://github.com/HuakunShen/applications-rs/blob/04306329f02afb31a8cfc4cd67ce1f8d11d9c4b1/src/platforms/mac.rs), [macOS utilities](https://github.com/HuakunShen/applications-rs/blob/04306329f02afb31a8cfc4cd67ce1f8d11d9c4b1/src/utils/mac.rs), [apps.rs](https://github.com/kunkunsh/kunkun/blob/d4383c5edfb6c7700f34fb5fba1e4202aefb7902/packages/tauri-plugins/jarvis/src/commands/apps.rs), [apps.ts](https://github.com/kunkunsh/kunkun/blob/d4383c5edfb6c7700f34fb5fba1e4202aefb7902/apps/desktop/src/lib/stores/apps.ts)\n\nThe reviewed file-search command builds a `rust_search::SearchBuilder` for supplied locations and collects results. It does not maintain a persistent file index in that command. Tauri keeps the main WebView window and toggles show/hide. No automatic file watcher or frecency formula was established in these inspected paths; extensions may behave differently. [file_search.rs](https://github.com/kunkunsh/kunkun/blob/d4383c5edfb6c7700f34fb5fba1e4202aefb7902/packages/tauri-plugins/jarvis/src/commands/file_search.rs), [desktop lib.rs](https://github.com/kunkunsh/kunkun/blob/d4383c5edfb6c7700f34fb5fba1e4202aefb7902/apps/desktop/src-tauri/src/lib.rs)\n\n**Take:** native APIs behind a small interface. Tauri's use of a system WebView does not itself establish low memory or keystroke latency. Both are unmeasured.\n\n## Windows references\n\n**Verified—source.** Flow Launcher caches Win32/UWP program lists. Win32 discovery includes Start Menu, registry, PATH, and configured sources, with `FileSystemWatcher` updates. Its matcher has acronym handling plus fuzzy scoring, and the main result pipeline adds selected-count and plugin-priority scores. WPF window visibility is toggled while the application stays alive. [Program/Main.cs](https://github.com/Flow-Launcher/Flow.Launcher/blob/58b799721a343811d8c42046cb2b4d63de1b3da6/Plugins/Flow.Launcher.Plugin.Program/Main.cs), [Win32.cs](https://github.com/Flow-Launcher/Flow.Launcher/blob/58b799721a343811d8c42046cb2b4d63de1b3da6/Plugins/Flow.Launcher.Plugin.Program/Programs/Win32.cs), [StringMatcher.cs](https://github.com/Flow-Launcher/Flow.Launcher/blob/58b799721a343811d8c42046cb2b4d63de1b3da6/Flow.Launcher.Infrastructure/StringMatcher.cs), [MainViewModel.cs](https://github.com/Flow-Launcher/Flow.Launcher/blob/58b799721a343811d8c42046cb2b4d63de1b3da6/Flow.Launcher/ViewModel/MainViewModel.cs)\n\nIts Explorer plugin delegates to either Windows Search or Everything. Everything has SDK/IPC adapters, a result cap, full-path options, and optional run-count sorting. Flow does not build Everything's filesystem index. [EverythingSearchManager.cs](https://github.com/Flow-Launcher/Flow.Launcher/blob/58b799721a343811d8c42046cb2b4d63de1b3da6/Plugins/Flow.Launcher.Plugin.Explorer/Search/Everything/EverythingSearchManager.cs), [WindowsIndexSearchManager.cs](https://github.com/Flow-Launcher/Flow.Launcher/blob/58b799721a343811d8c42046cb2b4d63de1b3da6/Plugins/Flow.Launcher.Plugin.Explorer/Search/WindowsIndex/WindowsIndexSearchManager.cs)\n\n**Verified—official docs.** PowerToys Run's built-in file provider uses the Windows Search Index service; Everything is a separate integration, not proof that Run privately indexes every file. Its docs expose input smoothing and different plugin delays—potential sources of delayed results. [PowerToys Run](https://learn.microsoft.com/windows/powertoys/run). Neither launcher's memory nor latency was measured here.\n\n## File engines\n\n| Engine | Verified design | Matching/ranking and relevance to Apparate |\n| --- | --- | --- |\n| Everything | Closed source. Official docs: resident filename/path database, NTFS USN Journal updates; optional metadata costs memory. Folder indexing is a slower alternative with monitoring and rescans. | Search/filter and selectable sort/run history, not a verified fzy-style scorer. Windows NTFS machinery is not portable to APFS. Keep the narrow metadata scope and resident index idea. |\n| plocate | C++; `updatedb` scan/reuse; trigram posting lists select compressed filename blocks, Zstd decompresses candidates, optional Linux `io_uring` feeds reads. | Substring/glob/regex filtering, not acronym fuzzy ranking or frecency. Contiguous trigram intersections are unsafe as a required filter for `VSC` → Visual Studio Code. No resident launcher window. |\n| FSearch | C/GTK; own scanned database, parent/name entries, sorted chunked arrays per property, parallel search workers. Current source includes inotify/fanotify monitoring and rescan recovery. | Filename/path substring/regex/query functions and column sorting; no learned launcher frecency established. Useful cache locality and result-view design; GUI is not a hotkey palette. |\n\nSources: [Everything index](https://www.voidtools.com/support/everything/indexes/), [Everything FAQ](https://www.voidtools.com/faq/), [folder indexing](https://www.voidtools.com/support/everything/folder_indexing/); [plocate upstream](https://git.sesse.net/?p=plocate;a=tree;h=cc0423b00042f51b648d0fb7cdadffc62c0b0daf), files `database-builder.cpp`, `plocate.cpp`, `updatedb.cpp`, `README`; [FSearch index store](https://github.com/cboxdoerfer/fsearch/blob/74295de2f4a576c41b8df70957934c77ae255363/src/fsearch_database_index_store.c), [scan](https://github.com/cboxdoerfer/fsearch/blob/74295de2f4a576c41b8df70957934c77ae255363/src/fsearch_database_scan.c), [inotify](https://github.com/cboxdoerfer/fsearch/blob/74295de2f4a576c41b8df70957934c77ae255363/src/fsearch_folder_monitor_inotify.c), [fanotify](https://github.com/cboxdoerfer/fsearch/blob/74295de2f4a576c41b8df70957934c77ae255363/src/fsearch_folder_monitor_fanotify.c), [query matchers](https://github.com/cboxdoerfer/fsearch/blob/74295de2f4a576c41b8df70957934c77ae255363/src/fsearch_query_matchers.c).\n\n**Published figures, not local measurements:** Everything's current FAQ gives about 35 MB RAM and five seconds initial indexing for approximately 250,000 Windows 11 entries, and about one minute for one million entries. Hardware/settings are not specified sufficiently for comparison. There are no comparable locally measured numbers for the audited launchers. Apparate's [matching benchmark](benchmark.md) measures a scorer, not these products.\n\n## What Apparate should take from this\n\n1. Keep one native panel and prepared app/settings records alive; no discovery, subprocess, or icon extraction per keystroke.\n2. Own a filename-only index for user-selected roots; batch filesystem changes and recover from missed events.\n3. Match basenames first; keep compact parent/name storage and load only visible icons.\n4. Separate index mutation from immutable search snapshots; discard obsolete query generations.\n5. Rank exact/prefix/acronym tiers before bounded learned preferences, with stable IDs and deterministic ties.\n6. Measure at 20k and 200k entries before adding helper processes, mmap formats, or more indexes.\n","toc":[{"id":"scope-and-freshness","title":"Scope and freshness","depth":2},{"id":"native-macos-references","title":"Native macOS references","depth":2},{"id":"sol","title":"Sol","depth":3},{"id":"tinycast","title":"Tinycast","depth":3},{"id":"quicksilver","title":"Quicksilver","depth":3},{"id":"cross-platform-references","title":"Cross-platform references","depth":2},{"id":"albert","title":"Albert","depth":3},{"id":"ueli","title":"Ueli","depth":3},{"id":"kunkun","title":"Kunkun","depth":3},{"id":"windows-references","title":"Windows references","depth":2},{"id":"file-engines","title":"File engines","depth":2},{"id":"what-apparate-should-take-from-this","title":"What Apparate should take from this","depth":2}],"titleAnchor":"open-source-launcher-source-review","links":["research/codex/report","research/codex/benchmark"],"attachments":[],"html":"\u003cp>Supporting evidence for the \u003ca href=\"#/research/codex/report\">Codex research report\u003c/a>. \u003cstrong>Verified—source\u003c/strong> means inspected source at the linked commit, not a running-app performance test. Repositories were shallow-cloned outside the project. No launcher was installed or built.\u003c/p>\n\u003ch2 id=\"scope-and-freshness\">Scope and freshness\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Project\u003c/th>\n\u003cth>Inspected HEAD date\u003c/th>\n\u003cth>Toolkit\u003c/th>\n\u003cth>Status at inspection\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Sol\u003c/td>\n\u003ctd>2026-11-10\u003c/td>\n\u003ctd>TypeScript/React Native macOS, Swift/Objective-C native bridge\u003c/td>\n\u003ctd>Active\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tinycast\u003c/td>\n\u003ctd>2026-11-18\u003c/td>\n\u003ctd>SwiftUI + AppKit\u003c/td>\n\u003ctd>Active; AGPL-3.0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Quicksilver\u003c/td>\n\u003ctd>2026-10-30\u003c/td>\n\u003ctd>Objective-C/Cocoa\u003c/td>\n\u003ctd>Active; useful mature native reference\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Albert\u003c/td>\n\u003ctd>2026-10-27\u003c/td>\n\u003ctd>C++/Qt\u003c/td>\n\u003ctd>Active; \u003cstrong>source-available\u003c/strong>, not an unrestricted reuse candidate\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ueli\u003c/td>\n\u003ctd>2026-11-16\u003c/td>\n\u003ctd>TypeScript/React/Electron\u003c/td>\n\u003ctd>Active\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Kunkun\u003c/td>\n\u003ctd>2026-11-17\u003c/td>\n\u003ctd>Rust/Tauri + TypeScript/Svelte\u003c/td>\n\u003ctd>Active\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Flow Launcher\u003c/td>\n\u003ctd>2026-11-15\u003c/td>\n\u003ctd>C#/.NET/WPF\u003c/td>\n\u003ctd>Active; inspected development branch\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Loungy\u003c/td>\n\u003ctd>2025-10-05\u003c/td>\n\u003ctd>Rust/GPUI\u003c/td>\n\u003ctd>Archived; replaced by Kunkun in the detailed comparison\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FSearch\u003c/td>\n\u003ctd>2026-11-16\u003c/td>\n\u003ctd>C/GTK/GLib\u003c/td>\n\u003ctd>Active; current development source\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>plocate\u003c/td>\n\u003ctd>2026-09-06\u003c/td>\n\u003ctd>C++/CLI\u003c/td>\n\u003ctd>Official upstream inspected\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>“Active” means recent source activity, not a maintenance guarantee. Albert's current license limits redistribution, including Apple-targeted binaries. Consult the actual \u003ca href=\"https://github.com/albertlauncher/albert/blob/c703546832dd8e7c961b74895d43b8d0cdadf7c8/LICENSE\" rel=\"noreferrer\">license\u003c/a> before any reuse. Loungy's \u003ca href=\"https://github.com/MatthiasGrandl/Loungy/blob/303e7d2c46db13c49f8c7ca30762e5ee0ac582d2/README.md\" rel=\"noreferrer\">README\u003c/a> confirms GPUI and discontinued development: it is not a Tauri example. Cerebro and Script Kit were not audited; this sample already covers native, Electron, Tauri, Qt, and Windows index integration.\u003c/p>\n\u003ch2 id=\"native-macos-references\">Native macOS references\u003c/h2>\n\u003ch3 id=\"sol\">Sol\u003c/h3>\n\u003cp>\u003cstrong>Verified—source.\u003c/strong> Apps are found by walking system, local, and user application directories, with alias handling and selected fixed locations. Metadata supplies localized names; this is not a Spotlight query for every keystroke. App-folder FSEvents trigger refreshes, with a 10-second stream latency and another debounce. \u003ca href=\"https://github.com/ospfranco/sol/blob/873ae1c28b153f190a57a56a5ad2bea2159611f8/macos/sol-macOS/lib/ApplicationSearcher.swift\" rel=\"noreferrer\">ApplicationSearcher.swift\u003c/a>\u003c/p>\n\u003cp>Files use a private SQLite table containing path, name, folder flag, and parent path. A directory walk builds it; a separate FSEvents stream updates paths with 500 ms latency. These are update batching parameters, \u003cstrong>not measured search latencies\u003c/strong>. The current search executes \u003ccode>SELECT path, name, is_folder FROM files LIMIT 1000\u003c/code>, applies \u003ccode>NSString.scoreAgainst\u003c/code>, then sorts by name. That cap precedes matching and can exclude valid results anywhere beyond the first 1,000 rows. Serial \u003ccode>queue.sync\u003c/code> search can also wait behind indexing. \u003ca href=\"https://github.com/ospfranco/sol/blob/873ae1c28b153f190a57a56a5ad2bea2159611f8/macos/sol-macOS/lib/FileSearchIndex.swift\" rel=\"noreferrer\">FileSearchIndex.swift\u003c/a>, \u003ca href=\"https://github.com/ospfranco/sol/blob/873ae1c28b153f190a57a56a5ad2bea2159611f8/macos/sol-macOS/lib/FileSearchIndexer.swift\" rel=\"noreferrer\">FileSearchIndexer.swift\u003c/a>\u003c/p>\n\u003cp>Root commands/apps live in JavaScript arrays and a MiniSearch index. Sorting uses relevance tiers, whether an item was selected, text score, selection timestamp/count, and name. The retained AppKit \u003ccode>NSPanel\u003c/code> uses React Native content and \u003ccode>isReleasedWhenClosed = false\u003c/code>; showing calls \u003ccode>makeKeyAndOrderFront\u003c/code>. \u003ca href=\"https://github.com/ospfranco/sol/blob/873ae1c28b153f190a57a56a5ad2bea2159611f8/src/stores/ui.store.tsx\" rel=\"noreferrer\">ui.store.tsx\u003c/a>, \u003ca href=\"https://github.com/ospfranco/sol/blob/873ae1c28b153f190a57a56a5ad2bea2159611f8/macos/sol-macOS/views/Panel.swift\" rel=\"noreferrer\">Panel.swift\u003c/a>, \u003ca href=\"https://github.com/ospfranco/sol/blob/873ae1c28b153f190a57a56a5ad2bea2159611f8/macos/sol-macOS/managers/PanelManager.swift\" rel=\"noreferrer\">PanelManager.swift\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Take:\u003c/strong> resident window, prebuilt app corpus, background refresh, relevance tiers. \u003cstrong>Do not copy:\u003c/strong> pre-match row truncation or sharing the search queue with long scans. RAM and hotkey latency: unmeasured.\u003c/p>\n\u003ch3 id=\"tinycast\">Tinycast\u003c/h3>\n\u003cp>\u003cstrong>Verified—source.\u003c/strong> The strongest directly relevant native reference. App discovery walks configured scopes, resolves paths, reads bundle/localized names, distinguishes duplicate installations, and prepares searchable fields before publishing the array. Its app catalog rescans on each open and on scope edits; unchanged entries avoid republishing. \u003ca href=\"https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/Launcher/Service/AppIndex.swift\" rel=\"noreferrer\">AppIndex.swift\u003c/a>, \u003ca href=\"https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/Launcher/Model/SearchScopes.swift\" rel=\"noreferrer\">SearchScopes.swift\u003c/a>\u003c/p>\n\u003cp>Files use their own index. \u003ccode>getattrlistbulk\u003c/code> batches directory metadata. The snapshot is a read-only memory-mapped binary with interned names, name masks, compact integer arrays, directory bitmaps, and hierarchy offsets; full paths can be reconstructed. In-memory additions and tombstones cover changes until rebuild. A helper builds snapshots, and FSEvents replay starts from an event ID taken before the crawl. Root changes/wrapped IDs cause rebuilding; subtree flags drive rescanning. \u003ca href=\"https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/FileSearch/Service/FileIndexCrawler.swift\" rel=\"noreferrer\">FileIndexCrawler.swift\u003c/a>, \u003ca href=\"https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/FileSearch/Service/FileIndexSnapshot.swift\" rel=\"noreferrer\">FileIndexSnapshot.swift\u003c/a>, \u003ca href=\"https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/FileSearch/Service/FileIndex.swift\" rel=\"noreferrer\">FileIndex.swift\u003c/a>, \u003ca href=\"https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/FileSearch/Service/FileIndexer.swift\" rel=\"noreferrer\">FileIndexer.swift\u003c/a>, \u003ca href=\"https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/FileSearch/Helper/FileIndexHelper.swift\" rel=\"noreferrer\">FileIndexHelper.swift\u003c/a>\u003c/p>\n\u003cp>App matching prepares folded UTF-16 and camel-case boundaries, then computes an alignment. Ranking explicitly combines aliases, fields, usage, and deterministic ties. File search has a separate prepared byte/token matcher and a 64-bit name mask; it is not the same algorithm as app fuzzy matching. Native \u003ccode>NSPanel\u003c/code>/\u003ccode>NSHostingView\u003c/code> content is retained between uses; Carbon hotkey registration is separate from optional event taps. \u003ca href=\"https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/Launcher/Model/LauncherMatch.swift\" rel=\"noreferrer\">LauncherMatch.swift\u003c/a>, \u003ca href=\"https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/Launcher/Model/LauncherOrder.swift\" rel=\"noreferrer\">LauncherOrder.swift\u003c/a>, \u003ca href=\"https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/FileSearch/Model/FileSearchQuery.swift\" rel=\"noreferrer\">FileSearchQuery.swift\u003c/a>, \u003ca href=\"https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Palette/PalettePanel.swift\" rel=\"noreferrer\">PalettePanel.swift\u003c/a>, \u003ca href=\"https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/HotKeys/Service/HotKeyCenter.swift\" rel=\"noreferrer\">HotKeyCenter.swift\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Take:\u003c/strong> compact names/hierarchy, immutable snapshots, explicit update recovery, prepared strings. Its snapshot comment that clean mapped pages “never count as app memory” should not become an Apparate claim: mapped pages still consume resident/cache resources when accessed. Idle RAM and latency were not measured. The current app also has a much broader scope than its original minimal-launcher description.\u003c/p>\n\u003ch3 id=\"quicksilver\">Quicksilver\u003c/h3>\n\u003cp>\u003cstrong>Verified—source.\u003c/strong> Cocoa application source calls an \u003ccode>NSWorkspace\u003c/code> category that uses private \u003ccode>_LSCopyAllApplicationURLs\u003c/code>. This is evidence of one implementation, not a public-API recommendation. Its catalog stores arrays of objects and per-entry \u003ccode>.qsindex\u003c/code> files; file-system sources scan selected folders with configurable watch behavior and index validity checks. \u003ca href=\"https://github.com/quicksilver/Quicksilver/blob/12d754357c538fd15dfa874970df99d378229f6d/Quicksilver/Code-QuickStepFoundation/NSWorkspace_BLTRExtensions.m\" rel=\"noreferrer\">NSWorkspace extensions\u003c/a>, \u003ca href=\"https://github.com/quicksilver/Quicksilver/blob/12d754357c538fd15dfa874970df99d378229f6d/Quicksilver/Code-QuickStepCore/QSCatalogEntry.m\" rel=\"noreferrer\">QSCatalogEntry.m\u003c/a>, \u003ca href=\"https://github.com/quicksilver/Quicksilver/blob/12d754357c538fd15dfa874970df99d378229f6d/Quicksilver/PlugIns-Main/QSCorePlugIn/Code/QSFileSystemObjectSource.m\" rel=\"noreferrer\">QSFileSystemObjectSource.m\u003c/a>\u003c/p>\n\u003cp>The default ranker normalizes strings, computes abbreviation scores, and layers explicit/learned query mnemonics and usage counts. Its window controller loads the window and subsequently shows/orders it out. Watcher backend and exhaustive catalog refresh triggers were not audited. \u003ca href=\"https://github.com/quicksilver/Quicksilver/blob/12d754357c538fd15dfa874970df99d378229f6d/Quicksilver/Code-QuickStepCore/QSStringRanker.m\" rel=\"noreferrer\">QSStringRanker.m\u003c/a>, \u003ca href=\"https://github.com/quicksilver/Quicksilver/blob/12d754357c538fd15dfa874970df99d378229f6d/Quicksilver/Code-QuickStepCore/QSObjectRanker.m\" rel=\"noreferrer\">QSObjectRanker.m\u003c/a>, \u003ca href=\"https://github.com/quicksilver/Quicksilver/blob/12d754357c538fd15dfa874970df99d378229f6d/Quicksilver/Code-QuickStepInterface/QSInterfaceController.m\" rel=\"noreferrer\">QSInterfaceController.m\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Take:\u003c/strong> learn query-to-item intent, cache a limited catalog, preserve stable IDs. Memory and latency: unmeasured.\u003c/p>\n\u003ch2 id=\"cross-platform-references\">Cross-platform references\u003c/h2>\n\u003ch3 id=\"albert\">Albert\u003c/h3>\n\u003cp>\u003cstrong>Verified—source.\u003c/strong> macOS application plugin walks known app roots and uses \u003ccode>QFileSystemWatcher\u003c/code>; Linux uses desktop-entry discovery. Files have a private directory tree persisted as JSON, selected-root/depth/exclusion policies, optional directory watches, and periodic rescan timers. This is not Spotlight-backed file search. \u003ca href=\"https://github.com/albertlauncher/albert-plugin-applications/blob/2c4738009b91f8ceb4cf25b2de04490b3691fa76/src/mac/plugin.cpp\" rel=\"noreferrer\">mac/plugin.cpp\u003c/a>, \u003ca href=\"https://github.com/albertlauncher/albert-plugin-applications/blob/2c4738009b91f8ceb4cf25b2de04490b3691fa76/src/xdg/plugin.cpp\" rel=\"noreferrer\">xdg/plugin.cpp\u003c/a>, \u003ca href=\"https://github.com/albertlauncher/albert-plugin-files/blob/74435c5f60858f65ff3d3c6cf9a01a45940caf3a/src/fsindexnodes.h\" rel=\"noreferrer\">fsindexnodes.h\u003c/a>, \u003ca href=\"https://github.com/albertlauncher/albert-plugin-files/blob/74435c5f60858f65ff3d3c6cf9a01a45940caf3a/src/fsindexpath.cpp\" rel=\"noreferrer\">fsindexpath.cpp\u003c/a>\u003c/p>\n\u003cp>Search keeps flat item/string arrays, a word-to-occurrence inverted index, and a bigram map; Levenshtein-based fuzzy word matching is different from fzf-style subsequences. SQLite stores activations; ranking derives decayed usage weights by activation order. The Qt frontend owns a window and toggles visibility. \u003ca href=\"https://github.com/albertlauncher/albert/blob/c703546832dd8e7c961b74895d43b8d0cdadf7c8/src/util/itemindex.cpp\" rel=\"noreferrer\">itemindex.cpp\u003c/a>, \u003ca href=\"https://github.com/albertlauncher/albert/blob/c703546832dd8e7c961b74895d43b8d0cdadf7c8/src/query/usagedatabase.cpp\" rel=\"noreferrer\">usagedatabase.cpp\u003c/a>, \u003ca href=\"https://github.com/albertlauncher/albert-plugin-widgetsboxmodel/blob/d7476bf16747e058af62e153d0327e53d1bc0761/src/plugin.cpp\" rel=\"noreferrer\">frontend plugin.cpp\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Take:\u003c/strong> root-specific index policy and measured need before introducing an inverted index. Do not assume an edit-distance word matcher guarantees \u003ccode>VSC\u003c/code>. Performance: unmeasured. The archived monolithic plugins repository was superseded by dedicated plugin repositories; those were inspected here.\u003c/p>\n\u003ch3 id=\"ueli\">Ueli\u003c/h3>\n\u003cp>\u003cstrong>Verified—source.\u003c/strong> macOS apps come from \u003ccode>mdfind\u003c/code>, filtered to configured folders and excluding nested \u003ccode>.app\u003c/code> paths. “Simple File Search” independently enumerates chosen folders into \u003ccode>SearchResultItem[]\u003c/code>, resolving types/icons during collection. The rescan orchestrator defaults to 300 seconds when enabled; no FSEvents watcher was identified in these paths. \u003ca href=\"https://github.com/oliverschwendener/ueli/blob/94104292d82b95dfa9300a432dd2ad45d41c2e28/src/main/Extensions/ApplicationSearch/macOS/MacOsApplicationRepository.ts\" rel=\"noreferrer\">MacOsApplicationRepository.ts\u003c/a>, \u003ca href=\"https://github.com/oliverschwendener/ueli/blob/94104292d82b95dfa9300a432dd2ad45d41c2e28/src/main/Extensions/SimpleFileSearch/SimpleFileSearchExtension.ts\" rel=\"noreferrer\">SimpleFileSearchExtension.ts\u003c/a>, \u003ca href=\"https://github.com/oliverschwendener/ueli/blob/94104292d82b95dfa9300a432dd2ad45d41c2e28/src/main/Core/RescanOrchestrator/RescanOrchestrator.ts\" rel=\"noreferrer\">RescanOrchestrator.ts\u003c/a>\u003c/p>\n\u003cp>The renderer searches arrays with selectable fuzzysort/Fuse.js, then groups favorites and instant results. This reviewed sort is not verified frecency. Electron creates one search \u003ccode>BrowserWindow\u003c/code>, then toggles it. \u003ca href=\"https://github.com/oliverschwendener/ueli/blob/94104292d82b95dfa9300a432dd2ad45d41c2e28/src/common/Core/Search/fuzzySortFilter.ts\" rel=\"noreferrer\">fuzzySortFilter.ts\u003c/a>, \u003ca href=\"https://github.com/oliverschwendener/ueli/blob/94104292d82b95dfa9300a432dd2ad45d41c2e28/src/renderer/Core/Search/Helpers/getSearchResult.ts\" rel=\"noreferrer\">getSearchResult.ts\u003c/a>, \u003ca href=\"https://github.com/oliverschwendener/ueli/blob/94104292d82b95dfa9300a432dd2ad45d41c2e28/src/main/Core/SearchWindow/SearchWindowModule.ts\" rel=\"noreferrer\">SearchWindowModule.ts\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Take:\u003c/strong> collect outside the query path. Avoid eager per-file icon work and polling as the sole update mechanism. Memory and latency: unmeasured.\u003c/p>\n\u003ch3 id=\"kunkun\">Kunkun\u003c/h3>\n\u003cp>\u003cstrong>Verified—source.\u003c/strong> The Rust \u003ccode>applications-rs\u003c/code> library maintains \u003ccode>Arc&lt;Mutex&lt;Vec&lt;App&gt;&gt;&gt;\u003c/code>; its macOS path combines application discovery with filesystem search and Spotlight helpers. Tauri exposes explicit synchronous/background refresh commands. Frontend app arrays are fed to Fuse.js. \u003ca href=\"https://github.com/HuakunShen/applications-rs/blob/04306329f02afb31a8cfc4cd67ce1f8d11d9c4b1/src/common.rs\" rel=\"noreferrer\">common.rs\u003c/a>, \u003ca href=\"https://github.com/HuakunShen/applications-rs/blob/04306329f02afb31a8cfc4cd67ce1f8d11d9c4b1/src/platforms/mac.rs\" rel=\"noreferrer\">mac.rs\u003c/a>, \u003ca href=\"https://github.com/HuakunShen/applications-rs/blob/04306329f02afb31a8cfc4cd67ce1f8d11d9c4b1/src/utils/mac.rs\" rel=\"noreferrer\">macOS utilities\u003c/a>, \u003ca href=\"https://github.com/kunkunsh/kunkun/blob/d4383c5edfb6c7700f34fb5fba1e4202aefb7902/packages/tauri-plugins/jarvis/src/commands/apps.rs\" rel=\"noreferrer\">apps.rs\u003c/a>, \u003ca href=\"https://github.com/kunkunsh/kunkun/blob/d4383c5edfb6c7700f34fb5fba1e4202aefb7902/apps/desktop/src/lib/stores/apps.ts\" rel=\"noreferrer\">apps.ts\u003c/a>\u003c/p>\n\u003cp>The reviewed file-search command builds a \u003ccode>rust_search::SearchBuilder\u003c/code> for supplied locations and collects results. It does not maintain a persistent file index in that command. Tauri keeps the main WebView window and toggles show/hide. No automatic file watcher or frecency formula was established in these inspected paths; extensions may behave differently. \u003ca href=\"https://github.com/kunkunsh/kunkun/blob/d4383c5edfb6c7700f34fb5fba1e4202aefb7902/packages/tauri-plugins/jarvis/src/commands/file_search.rs\" rel=\"noreferrer\">file_search.rs\u003c/a>, \u003ca href=\"https://github.com/kunkunsh/kunkun/blob/d4383c5edfb6c7700f34fb5fba1e4202aefb7902/apps/desktop/src-tauri/src/lib.rs\" rel=\"noreferrer\">desktop lib.rs\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Take:\u003c/strong> native APIs behind a small interface. Tauri's use of a system WebView does not itself establish low memory or keystroke latency. Both are unmeasured.\u003c/p>\n\u003ch2 id=\"windows-references\">Windows references\u003c/h2>\n\u003cp>\u003cstrong>Verified—source.\u003c/strong> Flow Launcher caches Win32/UWP program lists. Win32 discovery includes Start Menu, registry, PATH, and configured sources, with \u003ccode>FileSystemWatcher\u003c/code> updates. Its matcher has acronym handling plus fuzzy scoring, and the main result pipeline adds selected-count and plugin-priority scores. WPF window visibility is toggled while the application stays alive. \u003ca href=\"https://github.com/Flow-Launcher/Flow.Launcher/blob/58b799721a343811d8c42046cb2b4d63de1b3da6/Plugins/Flow.Launcher.Plugin.Program/Main.cs\" rel=\"noreferrer\">Program/Main.cs\u003c/a>, \u003ca href=\"https://github.com/Flow-Launcher/Flow.Launcher/blob/58b799721a343811d8c42046cb2b4d63de1b3da6/Plugins/Flow.Launcher.Plugin.Program/Programs/Win32.cs\" rel=\"noreferrer\">Win32.cs\u003c/a>, \u003ca href=\"https://github.com/Flow-Launcher/Flow.Launcher/blob/58b799721a343811d8c42046cb2b4d63de1b3da6/Flow.Launcher.Infrastructure/StringMatcher.cs\" rel=\"noreferrer\">StringMatcher.cs\u003c/a>, \u003ca href=\"https://github.com/Flow-Launcher/Flow.Launcher/blob/58b799721a343811d8c42046cb2b4d63de1b3da6/Flow.Launcher/ViewModel/MainViewModel.cs\" rel=\"noreferrer\">MainViewModel.cs\u003c/a>\u003c/p>\n\u003cp>Its Explorer plugin delegates to either Windows Search or Everything. Everything has SDK/IPC adapters, a result cap, full-path options, and optional run-count sorting. Flow does not build Everything's filesystem index. \u003ca href=\"https://github.com/Flow-Launcher/Flow.Launcher/blob/58b799721a343811d8c42046cb2b4d63de1b3da6/Plugins/Flow.Launcher.Plugin.Explorer/Search/Everything/EverythingSearchManager.cs\" rel=\"noreferrer\">EverythingSearchManager.cs\u003c/a>, \u003ca href=\"https://github.com/Flow-Launcher/Flow.Launcher/blob/58b799721a343811d8c42046cb2b4d63de1b3da6/Plugins/Flow.Launcher.Plugin.Explorer/Search/WindowsIndex/WindowsIndexSearchManager.cs\" rel=\"noreferrer\">WindowsIndexSearchManager.cs\u003c/a>\u003c/p>\n\u003cp>\u003cstrong>Verified—official docs.\u003c/strong> PowerToys Run's built-in file provider uses the Windows Search Index service; Everything is a separate integration, not proof that Run privately indexes every file. Its docs expose input smoothing and different plugin delays—potential sources of delayed results. \u003ca href=\"https://learn.microsoft.com/windows/powertoys/run\" rel=\"noreferrer\">PowerToys Run\u003c/a>. Neither launcher's memory nor latency was measured here.\u003c/p>\n\u003ch2 id=\"file-engines\">File engines\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Engine\u003c/th>\n\u003cth>Verified design\u003c/th>\n\u003cth>Matching/ranking and relevance to Apparate\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Everything\u003c/td>\n\u003ctd>Closed source. Official docs: resident filename/path database, NTFS USN Journal updates; optional metadata costs memory. Folder indexing is a slower alternative with monitoring and rescans.\u003c/td>\n\u003ctd>Search/filter and selectable sort/run history, not a verified fzy-style scorer. Windows NTFS machinery is not portable to APFS. Keep the narrow metadata scope and resident index idea.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>plocate\u003c/td>\n\u003ctd>C++; \u003ccode>updatedb\u003c/code> scan/reuse; trigram posting lists select compressed filename blocks, Zstd decompresses candidates, optional Linux \u003ccode>io_uring\u003c/code> feeds reads.\u003c/td>\n\u003ctd>Substring/glob/regex filtering, not acronym fuzzy ranking or frecency. Contiguous trigram intersections are unsafe as a required filter for \u003ccode>VSC\u003c/code> → Visual Studio Code. No resident launcher window.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>FSearch\u003c/td>\n\u003ctd>C/GTK; own scanned database, parent/name entries, sorted chunked arrays per property, parallel search workers. Current source includes inotify/fanotify monitoring and rescan recovery.\u003c/td>\n\u003ctd>Filename/path substring/regex/query functions and column sorting; no learned launcher frecency established. Useful cache locality and result-view design; GUI is not a hotkey palette.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Sources: \u003ca href=\"https://www.voidtools.com/support/everything/indexes/\" rel=\"noreferrer\">Everything index\u003c/a>, \u003ca href=\"https://www.voidtools.com/faq/\" rel=\"noreferrer\">Everything FAQ\u003c/a>, \u003ca href=\"https://www.voidtools.com/support/everything/folder_indexing/\" rel=\"noreferrer\">folder indexing\u003c/a>; \u003ca href=\"https://git.sesse.net/?p=plocate;a=tree;h=cc0423b00042f51b648d0fb7cdadffc62c0b0daf\" rel=\"noreferrer\">plocate upstream\u003c/a>, files \u003ccode>database-builder.cpp\u003c/code>, \u003ccode>plocate.cpp\u003c/code>, \u003ccode>updatedb.cpp\u003c/code>, \u003ccode>README\u003c/code>; \u003ca href=\"https://github.com/cboxdoerfer/fsearch/blob/74295de2f4a576c41b8df70957934c77ae255363/src/fsearch_database_index_store.c\" rel=\"noreferrer\">FSearch index store\u003c/a>, \u003ca href=\"https://github.com/cboxdoerfer/fsearch/blob/74295de2f4a576c41b8df70957934c77ae255363/src/fsearch_database_scan.c\" rel=\"noreferrer\">scan\u003c/a>, \u003ca href=\"https://github.com/cboxdoerfer/fsearch/blob/74295de2f4a576c41b8df70957934c77ae255363/src/fsearch_folder_monitor_inotify.c\" rel=\"noreferrer\">inotify\u003c/a>, \u003ca href=\"https://github.com/cboxdoerfer/fsearch/blob/74295de2f4a576c41b8df70957934c77ae255363/src/fsearch_folder_monitor_fanotify.c\" rel=\"noreferrer\">fanotify\u003c/a>, \u003ca href=\"https://github.com/cboxdoerfer/fsearch/blob/74295de2f4a576c41b8df70957934c77ae255363/src/fsearch_query_matchers.c\" rel=\"noreferrer\">query matchers\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Published figures, not local measurements:\u003c/strong> Everything's current FAQ gives about 35 MB RAM and five seconds initial indexing for approximately 250,000 Windows 11 entries, and about one minute for one million entries. Hardware/settings are not specified sufficiently for comparison. There are no comparable locally measured numbers for the audited launchers. Apparate's \u003ca href=\"#/research/codex/benchmark\">matching benchmark\u003c/a> measures a scorer, not these products.\u003c/p>\n\u003ch2 id=\"what-apparate-should-take-from-this\">What Apparate should take from this\u003c/h2>\n\u003col>\n\u003cli>Keep one native panel and prepared app/settings records alive; no discovery, subprocess, or icon extraction per keystroke.\u003c/li>\n\u003cli>Own a filename-only index for user-selected roots; batch filesystem changes and recover from missed events.\u003c/li>\n\u003cli>Match basenames first; keep compact parent/name storage and load only visible icons.\u003c/li>\n\u003cli>Separate index mutation from immutable search snapshots; discard obsolete query generations.\u003c/li>\n\u003cli>Rank exact/prefix/acronym tiers before bounded learned preferences, with stable IDs and deterministic ties.\u003c/li>\n\u003cli>Measure at 20k and 200k entries before adding helper processes, mmap formats, or more indexes.\u003c/li>\n\u003c/ol>\n","backlinks":["index","research/alignment","research/codex/report"]},{"id":"research/codex/report","title":"Codex research report","section":"Research","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Codex research report\nsection: Research\nupdated: 2026-11-18\n---\n# Codex research report\n\nIndependent research for Apparate's [requirements](../../requirements.md), completed 2026-11-18. This report covers the full brief. Claude's independent report was not read before writing it. Earlier shared pointers were checked against primary sources. No product code or packages were added to the project.\n\n**Evidence labels:** **Verified—source/docs** means inspected source or official documentation; **Measured** means executed here; **Recommendation** is a proposed de
