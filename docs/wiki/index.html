sign; **Unverified** identifies a remaining gap. Source evidence establishes implementation, not end-to-end performance.\n\nSupporting pages: [launcher source review](open-source-launchers.md), [fuzzy matching](fuzzy-matching.md), [Swift benchmark and reproduction code](benchmark.md).\n\n## Summary\n\n- **Recommendation:** Swift with an AppKit `NSPanel`, native search field/list, and SwiftUI settings. Keep one small window resident. A cross-platform web runtime adds little value for this macOS-only scope.\n- **Recommendation:** maintain a private filename/path index for selected folders, with cached app and settings catalogs. Keep Spotlight available for optional metadata/content search later.\n- **Verified—source:** fast launchers commonly prepare catalogs before typing and retain their search window. Native and web-based launchers both do this; toolkit alone does not establish speed.\n- **Verified—docs:** Raycast v1 used Spotlight file search; v2 introduced a separate Rust file indexer. Alfred still uses macOS metadata plus an application cache. LaunchBar scans configured indexing rules.\n- **Measured:** at 200k candidates, a simple Swift basename scorer with a character mask took 0.20–6.31 ms across eleven queries. Scoring entire paths took 0.47–80.82 ms. Field choice and selectivity are decisive.\n- **Recommendation:** fzy-like matching with explicit acronym/word-start tiers, bounded usage learning, deterministic ties, and one publication per query generation. This directly addresses `VSC` and result jumping.\n- **Verified locally:** “Keyboard layouts” exists in Keyboard's `.searchTerms` metadata under `InputSources`. **Unverified:** the proposed deep link's actual destination and universal anchor support.\n- **Recommendation:** name/path indexing only, visible-row icon loading, one process initially, and no permanent polling. Treat memory and perceived latency budgets below as targets awaiting an app prototype.\n\n## How existing launchers are fast\n\n**Raycast — verified official architecture, author-reported memory.** v1 used Swift/AppKit with a Node extension backend. v2 uses native shells, system WebViews, React/TypeScript, Node, and Rust. It keeps its main WebView ready by controlling visibility/throttling and pre-rendering the expanded layout. Its new file indexer runs separately, scans directly, and follows filesystem events; Windows uses a dedicated NTFS MFT scanner. The May 2026 article reports roughly 200–300 MB for v1 versus 350–450 MB for v2 after usage, not a controlled benchmark. Later releases changed performance, so these are historical figures, not measurements of today's build. The article does not disclose the private index's complete data structure or prove macOS uses a particular FSEvents API. [Raycast technical deep dive](https://www.raycast.com/blog/a-technical-deep-dive-into-the-new-raycast), [current changelog](https://www.raycast.com/changelog).\n\n**Alfred — verified docs.** Restricting default result scope avoids unnecessary noise/work; broad file search is explicitly invoked. Applications are cached separately and can be reloaded. File search depends on the system metadata index and its exclusions/health. Faster UI than Spotlight does not imply a separate disk index. Exact matcher, memory layout, window class, and comparable latency/RAM figures remain unverified. [Alfred indexing troubleshooting](https://www.alfredapp.com/help/troubleshooting/indexing/).\n\n**LaunchBar — verified docs.** Indexing rules decide which apps, folders, and other sources are searched; file rules scan chosen directories with depth/package controls. Updates can happen at launch or periodically, with additional rule-specific behaviours. That bounded catalog supports abbreviation search. Exact structures, filesystem watcher backend, and measured latency/memory were not established. [Indexing rules](https://www.obdev.at/resources/launchbar/help/IndexingRules.html), [files and folders](https://www.obdev.at/resources/launchbar/help/FilesAndFolders.html), [index update settings](https://help.obdev.at/resources/launchbar/help/IndexWindow.html).\n\n**Spotlight 26/27 — verified product docs, internal performance unverified.** Tahoe expanded Spotlight into app/file/action/clipboard browsing with App Intents actions. Current macOS 27 help also describes broader search and Siri interaction. Neither source specifies the scoring implementation or explains the user's experienced delay. It is not sound to blame all delay on metadata indexing without measuring UI, query, and provider timing separately. [Apple's Tahoe announcement](https://www.apple.com/newsroom/2025/06/macos-tahoe-26-makes-the-mac-more-capable-productive-and-intelligent-than-ever/), [macOS 27 Spotlight guide](https://support.apple.com/guide/mac-help/find-what-you-need-with-spotlight-mchlp1008/27/mac/27).\n\n**Open-source/source-available — verified source.** Sol and Tinycast retain `NSPanel` instances. Quicksilver retains Cocoa UI and a catalog. Ueli retains an Electron `BrowserWindow`; Kunkun retains a Tauri WebView; Albert toggles a retained Qt window; Flow retains WPF UI and cached program lists. Their relevant implementations, ranking, update triggers, and limitations are detailed in the [source review](open-source-launchers.md). No claim that one is faster than another is based on local launch timing.\n\nTinycast is particularly useful for compact filename snapshots and recovery from filesystem changes. Sol is a cautionary example: its current file search limits to 1,000 rows **before matching**. Albert's current restrictive license also means available source must not be mistaken for freely reusable macOS product code.\n\n## How they index apps and files\n\n| Approach | Verified examples | Implication for Apparate |\n| --- | --- | --- |\n| OS metadata index | Alfred files, Raycast v1 files, Ueli macOS app discovery; Kunkun's macOS app discovery starts with `mdfind` and adds configured filesystem paths | Minimal private indexing effort, but coverage/freshness follows the OS index. A UI can cache and rank results independently. |\n| Private bounded catalog | LaunchBar folder rules, Quicksilver catalog, Albert file trees, Ueli Simple File Search | Good fit for selected roots; background scans need explicit update and recovery policies. |\n| Private event-updated filename index | Sol SQLite/FSEvents; Tinycast binary snapshot + changes; Raycast v2 private index | Search can be independent of Spotlight. Correctness requires handling missed events, moves, permissions, and cold starts. |\n| External service | Flow's Everything or Windows Search provider; PowerToys Run's built-in Windows Search provider | A launcher may inherit speed and memory cost from another process. Count the whole system when comparing. |\n\nThe [source review](open-source-launchers.md) provides pinned paths for each row.\n\n**Reference engines:** Everything documents a resident filename/path database and NTFS USN updates; its folder indexing follows a different scan/monitor/rescan path. plocate uses trigram posting lists and compressed filename blocks, updated by scans. FSearch's current development source uses private entries, sorted chunked arrays, worker searches, and Linux filesystem monitors. These are useful storage designs, not interchangeable fuzzy engines. A contiguous-trigram prefilter would reject valid acronym queries. NTFS MFT/USN techniques do not transfer directly to APFS. [Engine evidence](open-source-launchers.md#file-engines).\n\n**Recommendation:** own the narrow index the requirements need. Keep name, parent/root identity, type, stable ID, normalized search text, and a character mask. Do not index file contents. Start with SQLite persistence plus an immutable in-memory search representation; use compact parent/name storage as corpus size grows. FTS5 token matching alone does not satisfy arbitrary subsequences or `VSC`.\n\n## macOS platform\n\n**Metadata queries — verified docs.** `NSMetadataQuery` is the Foundation interface to Spotlight metadata; `MDQuery` is its lower-level counterpart. Queries gather asynchronously, can be scoped to selected locations, and can remain live. Batch notifications require explicit result-generation handling. A launcher need not spawn `mdfind` for every keystroke. Use a long-lived query to enrich a background catalog if needed; direct filenames should remain searchable when Spotlight excludes a selected root. [Apple metadata query guide](https://developer.apple.com/library/archive/documentation/Carbon/Conceptual/SpotlightQuery/Concepts/QueryingMetadata.html).\n\n**Enumeration — verified docs/source.** Start with `FileManager.enumerator(at:includingPropertiesForKeys:options:errorHandler:)`, request only necessary properties, and skip descendants for excluded directories/packages. Define symlink and mount traversal deliberately. `getattrlistbulk` is a lower-level optimization used by Tinycast; it increases implementation complexity and is unnecessary until enumeration is measured as a bottleneck. Cloud/dataless files can cause unexpected materialization; keep filesystem work off the main thread and avoid content reads. [FileManager enumeration](https://developer.apple.com/documentation/foundation/filemanager/enumerator(at:includingpropertiesforkeys:options:errorhandler:)), [Apple dataless-file guidance](https://developer.apple.com/documentation/technotes/tn3150-getting-ready-for-data-less-files), [Tinycast crawler](open-source-launchers.md#tinycast).\n\n**Change tracking — verified docs; recovery policy recommended.** FSEvents provides batched change hints, not an infallible journal of every file operation. Capture the stream/checkpoint before the initial scan and reconcile events that occur during it. Rescan affected subtrees for `MustScanSubDirs`; dropped events, wrapped IDs, root movement, or invalid checkpoints require a broader reconciliation. Persist checkpoints only with the corresponding durable index state. Revalidate on wake, remount, policy changes, and occasional integrity sweeps. Coalesce build-tool churn and keep UI refresh separate. [Apple FSEvents guide](https://developer.apple.com/library/archive/documentation/Darwin/Conceptual/FSEvents_ProgGuide/UsingtheFSEventsFramework/UsingtheFSEventsFramework.html).\n\n**Permissions — verified docs.** TCC still applies outside App Sandbox. Desktop, Documents, Downloads, iCloud Drive, and network locations may require consent. Let users select roots through `NSOpenPanel`; if sandboxed, use read-only security-scoped bookmarks and balance access calls, including stale-bookmark repair. Selected-folder access does not override every other protection. Full Disk Access should not be a default requirement for a selected-folder launcher. Accessibility is not a prerequisite for simply opening apps/files; optional UI automation/window features have different needs. [Apple file-access privacy](https://support.apple.com/en-ie/guide/security-pdf/secddd1d86a6/web), [sandbox file access](https://developer.apple.com/documentation/security/accessing-files-from-the-macos-app-sandbox).\n\n**Hotkey/window — recommendation backed by inspected native implementations.** Use Carbon `RegisterEventHotKey` for a normal configurable global shortcut, handle registration failure/conflicts, and keep the search field on the main thread. Global `NSEvent` keyboard monitoring has Accessibility requirements and is not equivalent to exclusive hotkey registration. Do not request that permission for the basic launcher. Test keyboard layouts, IME composition, Spaces/fullscreen, multiple displays, and focus restoration. [Tinycast hotkey source](https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/HotKeys/Service/HotKeyCenter.swift), [Apple event monitor documentation](https://developer.apple.com/library/archive/documentation/Cocoa/Conceptual/EventOverview/MonitoringEvents/MonitoringEvents.html). A retained nonactivating `NSPanel` that can become key is the proposed shell; exact activation/Space behaviour remains to be prototyped.\n\n**Icons/opening — verified APIs; caching recommended.** `NSWorkspace.icon(forFile:)` supplies file/app icons and is callable off the main thread. Cache small rendered images by identity/change stamp, request only visible rows plus a small prefetch, and use generic type icons immediately. Launch apps using `NSWorkspace.openApplication(at:configuration:)`; open files/folders with the workspace URL APIs. Do not construct shell command strings from paths. Surface launch errors and revalidate stale entries. [Icons](https://developer.apple.com/documentation/appkit/nsworkspace/icon(forfile:)), [app launch](https://developer.apple.com/documentation/appkit/nsworkspace/openapplication(at:configuration:completionhandler:)).\n\n## System Settings items\n\n**Verified locally.** The machine contains:\n\n```text\n/System/Library/ExtensionKit/Extensions/KeyboardSettings.appex/\n  Contents/Info.plist\n  Contents/Resources/en.lproj/Keyboard.searchTerms\n```\n\nThe bundle ID is `com.apple.Keyboard-Settings.extension`. Under `EXAppExtensionAttributes.SettingsExtensionAttributes`, the plist names `searchTermsFileName: Keyboard`, `IconName: icon`, `allowsXAppleSystemPreferencesURLScheme: true`, and the legacy identifier `com.apple.preference.keyboard`.\n\nThe `.searchTerms` plist groups `localizableStrings` under anchor keys. `InputSources` contains title `Keyboard layouts` and keywords such as QWERTY, Dvorak, languages, and typing. My direct `en.lproj` pass found 41 files/688 entries; that is a specific scan scope, not a guarantee of total settings coverage. The earlier shared inventory reported 42/691. **Post-comparison verification:** an additional legacy file, `/System/Library/PreferencePanes/DateAndTime.prefPane/Contents/Resources/en.lproj/DateAndTimePref.searchTerms`, contains three entries. That reconciles 42/691 across ExtensionKit plus legacy panes; 41/688 remains correct for the original ExtensionKit-only pass.\n\n**Recommendation:** read these data resources without loading extension code. Respect the user's preferred language with explicit fallback; cache by OS build and locale. Preserve title, synonyms, owning pane, anchor, and provenance. Deduplicate duplicate localized records and provide stable IDs. Index title/acronym separately from lower-weight keywords.\n\n**Unverified navigation candidate:**\n\n```text\nx-apple.systempreferences:com.apple.Keyboard-Settings.extension?InputSources\n```\n\nBundle metadata supports participation in this URL scheme; it does **not** establish that every group key opens a working anchor on every macOS version. A direct UI navigation test could not be completed because the browser host was unavailable. App inspection succeeded, but no deep-link destination was verified. Test known anchors on each supported OS; fall back to the parent pane when a route is unsupported. API success only proves dispatch, not that the correct sub-item opened. These resources and anchors are an observed system convention, not a documented stable public catalog API.\n\n**Icons:** the extension's `IconName` points to its resource/asset name. Try that bundle resource with a cached fallback to its workspace icon or a generic settings symbol. **Post-comparison verification:** Keyboard also declares `CFBundleIcons.ISGraphicIconConfiguration.ISTypeIdentifier = com.apple.graphic-icon.keyboard`; a content-type icon is another useful route. Correct icon extraction across all panes is unverified. Do not embed a permanent hand-maintained copy of hundreds of current English strings; use a small compatibility map only where testing proves it necessary.\n\nReproduce the metadata inspection without changing settings:\n\n```python\nfrom pathlib import Path\nimport plistlib\nbundle = Path('/System/Library/ExtensionKit/Extensions/KeyboardSettings.appex')\ninfo = plistlib.loads((bundle/'Contents/Info.plist').read_bytes())\nattrs = info['EXAppExtensionAttributes']['SettingsExtensionAttributes']\nterms = bundle/'Contents/Resources/en.lproj'/f\"{attrs['searchTermsFileName']}.searchTerms\"\nprint(info['CFBundleIdentifier'], attrs)\nprint(plistlib.loads(terms.read_bytes())['InputSources'])\n```\n\n## Fuzzy matching and ranking\n\n**Verified—source comparison:** fzf v1 is a fast greedy scan; fzf v2, fzy, nucleo, SkimMatcherV2, and VS Code's `fuzzyScore` use richer alignments. fzy is the simplest suitable Swift starting point; nucleo provides stronger optimization/Unicode examples. Sublime's exact implementation is proprietary; public approximations must be labelled as such. Alfred documents initial-letter matching; Raycast documents fuzzy titles, aliases, and usage learning. [Full comparison and sources](fuzzy-matching.md).\n\n**Recommendation:** preserve original word/camel-case boundaries, fold for comparison, and use exact → prefix → word/acronym → substring → general subsequence tiers. Limit history's influence within comparable match quality. `VSC` must work without manual aliases. Make non-ASCII matching/grapheme highlighting explicit; the experiment's ASCII path is insufficient for production.\n\n**Measured:** median of eleven query medians, milliseconds:\n\n| Candidates | Full paths + mask | Basenames + mask |\n| --- | --- | --- |\n| 1,000 | 0.216 | 0.011 |\n| 20,000 | 4.492 | 0.266 |\n| 200,000 | 43.863 | 3.941 |\n\nAcross queries at 200k, basename+mask ranged from 0.201 to 6.312 ms; full paths ranged from 0.474 to 80.823 ms. The corpus repeats 13,746 real names/paths to reach 200k, and measurement excludes sorting/UI/indexing. The harness's high allocation footprint is disclosed separately; it is not a production memory estimate. [Benchmark method, per-query values, and source](benchmark.md).\n\n**Result stability:** search a consistent snapshot, publish a complete ranked batch, and drop obsolete generations. Keep row geometry fixed and selected IDs stable once the user navigates. History updates after successful actions, not while a query remains visible. Re-ranking across *different* queries is legitimate; late results shifting a fixed query or Enter target are not. Never incrementally filter only the previous visible top-K.\n\n## Recommended architecture\n\n**Proposal, not an accepted implementation decision.** One Swift executable with a retained AppKit palette; SwiftUI is suitable for settings. Swift is already available and directly supports the required platform APIs. Go/Rust can implement a fast index, but introduce bridging/build/runtime choices that this scope has not justified. Use Rust/nucleo later only if a measured Swift bottleneck remains after field selection and allocation fixes.\n\n| Component | Proposed design |\n| --- | --- |\n| UI | `NSPanel`, native search field and reusable list rows; fixed icon slots and list geometry. Construct once; hide between uses. |\n| Query | Parse user-configurable `'` file/folder and `.` settings prefixes before matching. Unprefixed input searches apps/settings/files in one snapshot. Escape/literal-prefix behaviour must be specified. |\n| Apps | Scan standard app roots and explicitly included app directories; skip bundle internals, resolve aliases carefully, retain localized/alternate names. Use filesystem/workspace changes to refresh; optional metadata enrichment stays off the query path. |\n| Settings | Small versioned locale-aware catalog from system extension metadata, with tested routes and parent fallbacks. |\n| Files | User-selected roots only; default exclusions for dependency/VCS/build trees; persistent SQLite records and compact immutable search arrays. Separate basename and path search fields. |\n| Concurrency | One process initially. UI on main actor; bounded utility indexing queue; serial cancellable search worker with reusable scratch. Swap complete snapshots atomically. No disk work under the query lock. |\n| Updates | Batched FSEvents, subtree reconciliation, durable checkpoint/recovery, and clear index status. Bound old snapshots and pending change buffers during large rebuilds. |\n| Search | Prepared normalized names/boundaries, 64-bit mask, subsequence check, fzy-like score, top-K heap/selection, stable tie-break. Path-aware narrowing for `/` queries; no arbitrary pre-match cap. |\n| Config/history | Versioned Codable JSON for prefixes, roots, exclusions, aliases, and UI preferences; opaque bookmarks persisted separately. SQLite for index and bounded local usage records. Atomic config saves; explicit reset/rebuild actions. |\n| Launch | Typed app/file/settings actions using workspace APIs, with error handling. Cache only the icon working set. |\n\n**Proposed budgets, all unverified until an app exists:**\n\n| Metric | Initial target on this M1 Pro |\n| --- | --- |\n| Warm hotkey to first presented frame | p95 ≤33 ms; inspect 60/120 Hz separately |\n| Query to stable displayed results | p95 ≤16 ms for ordinary app/settings and 20k-name searches; ≤33 ms at 200k names |\n| File-index event freshness | Usually within 1–2 seconds after a local change; correctness recovery may take longer |\n| Idle CPU/energy | No continuous scan/polling; near-zero CPU when no files change |\n| Warm memory footprint | Aim ≤60 MiB at 20k files and ≤100 MiB at 200k, with bounded icon cache; measure footprint and total child-process cost |\n\nThese are engineering targets, not forecasts guaranteed by the microbenchmark. Cold start, first indexing, Unicode/path searches, remote/cloud roots, UI drawing, and sorting must be measured separately. An approximate compact-index calculation—names plus parent IDs, flags, masks and records in tens of MB at 200k—supports prototyping, but does not establish the AppKit application's footprint.\n\nStart with correctness at the actual ~13k selected-project scale. Add mmap snapshots, compacted name interning, bulk syscalls, parallel scoring, or a crash-isolated index helper only when measurements show the simpler design misses a requirement. Keep filename indexing independently replaceable so those changes do not alter the UI contract.\n\n## Additional feature suggestions\n\n| Priority | Feature | Reason |\n| --- | --- | --- |\n| First | Explicit aliases and pinning | Predictable shortcuts for ambiguous names; low resource cost. |\n| First | Reveal in Finder, copy path, open with | Natural actions on existing results; minimal added indexing. |\n| First | Index status, excluded-folder editor, rebuild/reset ranking | Makes missing/stale results diagnosable. |\n| Next | Calculator and unit conversion | High utility, no filesystem expansion; keep it local and optional. |\n| Next | Recent files and configurable quick links | Uses existing IDs/history; avoid a second catalog. |\n| Later | Quick Look on demand | Useful verification before opening; load only when requested. |\n| Later | Explicit Shortcuts/script actions | Powerful, but require action semantics and clear permissions. |\n| Defer | Clipboard history, global menu search, window management | Add data retention, background work, or Accessibility requirements beyond the core request. |\n| Defer | AI, cloud sync, extension store | Large runtime/product scope; no requirement justifies them yet. |\n\n## Risks and open questions\n\n- **Needs user choice:** default hotkey and Spotlight conflict, minimum macOS version, direct distribution versus App Store, default result mix, selected roots/exclusions, basename versus implicit full-path search, and whether hidden/package/cloud/network content is included. These should be resolved after comparing the two reports.\n- **Settings compatibility:** test the actual “Keyboard layouts” route, not merely URL opening, and test ExtensionKit plus legacy-pane coverage. Some anchors may be dynamic, gated by hardware, or obsolete.\n- **Index correctness:** renames/moves, symlinks, permission revocation, root removal, event loss, crash recovery, mount identity, and incomplete cloud directories need adversarial tests. A full scan and persistent journal are different responsibilities.\n- **Matching quality:** Unicode case/diacritics, CJK names, IME composition, duplicate installs, acronym conflicts, and history reset require acceptance examples. A copied VS Code 128-unit limit would break long paths.\n- **Memory/perceived speed:** big icon sets, duplicated string buffers, overlapping snapshots, and indexing contention can dominate a fast scorer. Test slow filesystem providers and active build churn with UI frame timing.\n- **Source reuse:** Tinycast is AGPL; Albert has a restrictive custom license; nucleo is MPL and fzf/fzy are MIT in inspected repositories. Read upstream licenses before choosing code reuse. This report recommends designs, not importing those projects wholesale.\n- **Evidence gaps:** no controlled Raycast/Alfred/LaunchBar/Spotlight latency/RAM comparison, no built Apparate UI, no universal settings-anchor verification, and no cross-algorithm local benchmark. Do not present proposed budgets as achieved performance.\n\n## Sources\n\nThe report links claims directly to official docs and pinned source. The [source review](open-source-launchers.md) records repository dates, source paths, indexing, matching, and window strategies; [matching analysis](fuzzy-matching.md) cites exact algorithms; [benchmark](benchmark.md) contains the executed Swift/Python source and measured results.\n\nPrimary platform references are Apple's metadata/FSEvents guides, FileManager/NSWorkspace documentation, App Sandbox and TCC guidance, and locally inspected system plists. Commercial-product evidence comes from Raycast's engineering article/manual, Alfred help, Objective Development's LaunchBar help, and Apple Spotlight documentation. Closed-source internals not disclosed by those sources remain unverified.\n","toc":[{"id":"summary","title":"Summary","depth":2},{"id":"how-existing-launchers-are-fast","title":"How existing launchers are fast","depth":2},{"id":"how-they-index-apps-and-files","title":"How they index apps and files","depth":2},{"id":"macos-platform","title":"macOS platform","depth":2},{"id":"system-settings-items","title":"System Settings items","depth":2},{"id":"fuzzy-matching-and-ranking","title":"Fuzzy matching and ranking","depth":2},{"id":"recommended-architecture","title":"Recommended architecture","depth":2},{"id":"additional-feature-suggestions","title":"Additional feature suggestions","depth":2},{"id":"risks-and-open-questions","title":"Risks and open questions","depth":2},{"id":"sources","title":"Sources","depth":2}],"titleAnchor":"codex-research-report","links":["requirements","research/codex/open-source-launchers","research/codex/fuzzy-matching","research/codex/benchmark","research/codex/open-source-launchers","research/codex/open-source-launchers","research/codex/open-source-launchers","research/codex/open-source-launchers","research/codex/fuzzy-matching","research/codex/benchmark","research/codex/open-source-launchers","research/codex/fuzzy-matching","research/codex/benchmark"],"attachments":[],"html":"\u003cp>Independent research for Apparate's \u003ca href=\"#/requirements\">requirements\u003c/a>, completed 2026-11-18. This report covers the full brief. Claude's independent report was not read before writing it. Earlier shared pointers were checked against primary sources. No product code or packages were added to the project.\u003c/p>\n\u003cp>\u003cstrong>Evidence labels:\u003c/strong> \u003cstrong>Verified—source/docs\u003c/strong> means inspected source or official documentation; \u003cstrong>Measured\u003c/strong> means executed here; \u003cstrong>Recommendation\u003c/strong> is a proposed design; \u003cstrong>Unverified\u003c/strong> identifies a remaining gap. Source evidence establishes implementation, not end-to-end performance.\u003c/p>\n\u003cp>Supporting pages: \u003ca href=\"#/research/codex/open-source-launchers\">launcher source review\u003c/a>, \u003ca href=\"#/research/codex/fuzzy-matching\">fuzzy matching\u003c/a>, \u003ca href=\"#/research/codex/benchmark\">Swift benchmark and reproduction code\u003c/a>.\u003c/p>\n\u003ch2 id=\"summary\">Summary\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Recommendation:\u003c/strong> Swift with an AppKit \u003ccode>NSPanel\u003c/code>, native search field/list, and SwiftUI settings. Keep one small window resident. A cross-platform web runtime adds little value for this macOS-only scope.\u003c/li>\n\u003cli>\u003cstrong>Recommendation:\u003c/strong> maintain a private filename/path index for selected folders, with cached app and settings catalogs. Keep Spotlight available for optional metadata/content search later.\u003c/li>\n\u003cli>\u003cstrong>Verified—source:\u003c/strong> fast launchers commonly prepare catalogs before typing and retain their search window. Native and web-based launchers both do this; toolkit alone does not establish speed.\u003c/li>\n\u003cli>\u003cstrong>Verified—docs:\u003c/strong> Raycast v1 used Spotlight file search; v2 introduced a separate Rust file indexer. Alfred still uses macOS metadata plus an application cache. LaunchBar scans configured indexing rules.\u003c/li>\n\u003cli>\u003cstrong>Measured:\u003c/strong> at 200k candidates, a simple Swift basename scorer with a character mask took 0.20–6.31 ms across eleven queries. Scoring entire paths took 0.47–80.82 ms. Field choice and selectivity are decisive.\u003c/li>\n\u003cli>\u003cstrong>Recommendation:\u003c/strong> fzy-like matching with explicit acronym/word-start tiers, bounded usage learning, deterministic ties, and one publication per query generation. This directly addresses \u003ccode>VSC\u003c/code> and result jumping.\u003c/li>\n\u003cli>\u003cstrong>Verified locally:\u003c/strong> “Keyboard layouts” exists in Keyboard's \u003ccode>.searchTerms\u003c/code> metadata under \u003ccode>InputSources\u003c/code>. \u003cstrong>Unverified:\u003c/strong> the proposed deep link's actual destination and universal anchor support.\u003c/li>\n\u003cli>\u003cstrong>Recommendation:\u003c/strong> name/path indexing only, visible-row icon loading, one process initially, and no permanent polling. Treat memory and perceived latency budgets below as targets awaiting an app prototype.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"how-existing-launchers-are-fast\">How existing launchers are fast\u003c/h2>\n\u003cp>\u003cstrong>Raycast — verified official architecture, author-reported memory.\u003c/strong> v1 used Swift/AppKit with a Node extension backend. v2 uses native shells, system WebViews, React/TypeScript, Node, and Rust. It keeps its main WebView ready by controlling visibility/throttling and pre-rendering the expanded layout. Its new file indexer runs separately, scans directly, and follows filesystem events; Windows uses a dedicated NTFS MFT scanner. The May 2026 article reports roughly 200–300 MB for v1 versus 350–450 MB for v2 after usage, not a controlled benchmark. Later releases changed performance, so these are historical figures, not measurements of today's build. The article does not disclose the private index's complete data structure or prove macOS uses a particular FSEvents API. \u003ca href=\"https://www.raycast.com/blog/a-technical-deep-dive-into-the-new-raycast\" rel=\"noreferrer\">Raycast technical deep dive\u003c/a>, \u003ca href=\"https://www.raycast.com/changelog\" rel=\"noreferrer\">current changelog\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Alfred — verified docs.\u003c/strong> Restricting default result scope avoids unnecessary noise/work; broad file search is explicitly invoked. Applications are cached separately and can be reloaded. File search depends on the system metadata index and its exclusions/health. Faster UI than Spotlight does not imply a separate disk index. Exact matcher, memory layout, window class, and comparable latency/RAM figures remain unverified. \u003ca href=\"https://www.alfredapp.com/help/troubleshooting/indexing/\" rel=\"noreferrer\">Alfred indexing troubleshooting\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>LaunchBar — verified docs.\u003c/strong> Indexing rules decide which apps, folders, and other sources are searched; file rules scan chosen directories with depth/package controls. Updates can happen at launch or periodically, with additional rule-specific behaviours. That bounded catalog supports abbreviation search. Exact structures, filesystem watcher backend, and measured latency/memory were not established. \u003ca href=\"https://www.obdev.at/resources/launchbar/help/IndexingRules.html\" rel=\"noreferrer\">Indexing rules\u003c/a>, \u003ca href=\"https://www.obdev.at/resources/launchbar/help/FilesAndFolders.html\" rel=\"noreferrer\">files and folders\u003c/a>, \u003ca href=\"https://help.obdev.at/resources/launchbar/help/IndexWindow.html\" rel=\"noreferrer\">index update settings\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Spotlight 26/27 — verified product docs, internal performance unverified.\u003c/strong> Tahoe expanded Spotlight into app/file/action/clipboard browsing with App Intents actions. Current macOS 27 help also describes broader search and Siri interaction. Neither source specifies the scoring implementation or explains the user's experienced delay. It is not sound to blame all delay on metadata indexing without measuring UI, query, and provider timing separately. \u003ca href=\"https://www.apple.com/newsroom/2025/06/macos-tahoe-26-makes-the-mac-more-capable-productive-and-intelligent-than-ever/\" rel=\"noreferrer\">Apple's Tahoe announcement\u003c/a>, \u003ca href=\"https://support.apple.com/guide/mac-help/find-what-you-need-with-spotlight-mchlp1008/27/mac/27\" rel=\"noreferrer\">macOS 27 Spotlight guide\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Open-source/source-available — verified source.\u003c/strong> Sol and Tinycast retain \u003ccode>NSPanel\u003c/code> instances. Quicksilver retains Cocoa UI and a catalog. Ueli retains an Electron \u003ccode>BrowserWindow\u003c/code>; Kunkun retains a Tauri WebView; Albert toggles a retained Qt window; Flow retains WPF UI and cached program lists. Their relevant implementations, ranking, update triggers, and limitations are detailed in the \u003ca href=\"#/research/codex/open-source-launchers\">source review\u003c/a>. No claim that one is faster than another is based on local launch timing.\u003c/p>\n\u003cp>Tinycast is particularly useful for compact filename snapshots and recovery from filesystem changes. Sol is a cautionary example: its current file search limits to 1,000 rows \u003cstrong>before matching\u003c/strong>. Albert's current restrictive license also means available source must not be mistaken for freely reusable macOS product code.\u003c/p>\n\u003ch2 id=\"how-they-index-apps-and-files\">How they index apps and files\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Approach\u003c/th>\n\u003cth>Verified examples\u003c/th>\n\u003cth>Implication for Apparate\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>OS metadata index\u003c/td>\n\u003ctd>Alfred files, Raycast v1 files, Ueli macOS app discovery; Kunkun's macOS app discovery starts with \u003ccode>mdfind\u003c/code> and adds configured filesystem paths\u003c/td>\n\u003ctd>Minimal private indexing effort, but coverage/freshness follows the OS index. A UI can cache and rank results independently.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Private bounded catalog\u003c/td>\n\u003ctd>LaunchBar folder rules, Quicksilver catalog, Albert file trees, Ueli Simple File Search\u003c/td>\n\u003ctd>Good fit for selected roots; background scans need explicit update and recovery policies.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Private event-updated filename index\u003c/td>\n\u003ctd>Sol SQLite/FSEvents; Tinycast binary snapshot + changes; Raycast v2 private index\u003c/td>\n\u003ctd>Search can be independent of Spotlight. Correctness requires handling missed events, moves, permissions, and cold starts.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>External service\u003c/td>\n\u003ctd>Flow's Everything or Windows Search provider; PowerToys Run's built-in Windows Search provider\u003c/td>\n\u003ctd>A launcher may inherit speed and memory cost from another process. Count the whole system when comparing.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>The \u003ca href=\"#/research/codex/open-source-launchers\">source review\u003c/a> provides pinned paths for each row.\u003c/p>\n\u003cp>\u003cstrong>Reference engines:\u003c/strong> Everything documents a resident filename/path database and NTFS USN updates; its folder indexing follows a different scan/monitor/rescan path. plocate uses trigram posting lists and compressed filename blocks, updated by scans. FSearch's current development source uses private entries, sorted chunked arrays, worker searches, and Linux filesystem monitors. These are useful storage designs, not interchangeable fuzzy engines. A contiguous-trigram prefilter would reject valid acronym queries. NTFS MFT/USN techniques do not transfer directly to APFS. \u003ca href=\"#/research/codex/open-source-launchers~file-engines\">Engine evidence\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Recommendation:\u003c/strong> own the narrow index the requirements need. Keep name, parent/root identity, type, stable ID, normalized search text, and a character mask. Do not index file contents. Start with SQLite persistence plus an immutable in-memory search representation; use compact parent/name storage as corpus size grows. FTS5 token matching alone does not satisfy arbitrary subsequences or \u003ccode>VSC\u003c/code>.\u003c/p>\n\u003ch2 id=\"macos-platform\">macOS platform\u003c/h2>\n\u003cp>\u003cstrong>Metadata queries — verified docs.\u003c/strong> \u003ccode>NSMetadataQuery\u003c/code> is the Foundation interface to Spotlight metadata; \u003ccode>MDQuery\u003c/code> is its lower-level counterpart. Queries gather asynchronously, can be scoped to selected locations, and can remain live. Batch notifications require explicit result-generation handling. A launcher need not spawn \u003ccode>mdfind\u003c/code> for every keystroke. Use a long-lived query to enrich a background catalog if needed; direct filenames should remain searchable when Spotlight excludes a selected root. \u003ca href=\"https://developer.apple.com/library/archive/documentation/Carbon/Conceptual/SpotlightQuery/Concepts/QueryingMetadata.html\" rel=\"noreferrer\">Apple metadata query guide\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Enumeration — verified docs/source.\u003c/strong> Start with \u003ccode>FileManager.enumerator(at:includingPropertiesForKeys:options:errorHandler:)\u003c/code>, request only necessary properties, and skip descendants for excluded directories/packages. Define symlink and mount traversal deliberately. \u003ccode>getattrlistbulk\u003c/code> is a lower-level optimization used by Tinycast; it increases implementation complexity and is unnecessary until enumeration is measured as a bottleneck. Cloud/dataless files can cause unexpected materialization; keep filesystem work off the main thread and avoid content reads. \u003ca href=\"https://developer.apple.com/documentation/foundation/filemanager/enumerator(at:includingpropertiesforkeys:options:errorhandler:)\" rel=\"noreferrer\">FileManager enumeration\u003c/a>, \u003ca href=\"https://developer.apple.com/documentation/technotes/tn3150-getting-ready-for-data-less-files\" rel=\"noreferrer\">Apple dataless-file guidance\u003c/a>, \u003ca href=\"#/research/codex/open-source-launchers~tinycast\">Tinycast crawler\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Change tracking — verified docs; recovery policy recommended.\u003c/strong> FSEvents provides batched change hints, not an infallible journal of every file operation. Capture the stream/checkpoint before the initial scan and reconcile events that occur during it. Rescan affected subtrees for \u003ccode>MustScanSubDirs\u003c/code>; dropped events, wrapped IDs, root movement, or invalid checkpoints require a broader reconciliation. Persist checkpoints only with the corresponding durable index state. Revalidate on wake, remount, policy changes, and occasional integrity sweeps. Coalesce build-tool churn and keep UI refresh separate. \u003ca href=\"https://developer.apple.com/library/archive/documentation/Darwin/Conceptual/FSEvents_ProgGuide/UsingtheFSEventsFramework/UsingtheFSEventsFramework.html\" rel=\"noreferrer\">Apple FSEvents guide\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Permissions — verified docs.\u003c/strong> TCC still applies outside App Sandbox. Desktop, Documents, Downloads, iCloud Drive, and network locations may require consent. Let users select roots through \u003ccode>NSOpenPanel\u003c/code>; if sandboxed, use read-only security-scoped bookmarks and balance access calls, including stale-bookmark repair. Selected-folder access does not override every other protection. Full Disk Access should not be a default requirement for a selected-folder launcher. Accessibility is not a prerequisite for simply opening apps/files; optional UI automation/window features have different needs. \u003ca href=\"https://support.apple.com/en-ie/guide/security-pdf/secddd1d86a6/web\" rel=\"noreferrer\">Apple file-access privacy\u003c/a>, \u003ca href=\"https://developer.apple.com/documentation/security/accessing-files-from-the-macos-app-sandbox\" rel=\"noreferrer\">sandbox file access\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Hotkey/window — recommendation backed by inspected native implementations.\u003c/strong> Use Carbon \u003ccode>RegisterEventHotKey\u003c/code> for a normal configurable global shortcut, handle registration failure/conflicts, and keep the search field on the main thread. Global \u003ccode>NSEvent\u003c/code> keyboard monitoring has Accessibility requirements and is not equivalent to exclusive hotkey registration. Do not request that permission for the basic launcher. Test keyboard layouts, IME composition, Spaces/fullscreen, multiple displays, and focus restoration. \u003ca href=\"https://github.com/abue-ammar/tinycast/blob/99d1d17abfe591775f824a36981380e709278171/Tinycast/Features/HotKeys/Service/HotKeyCenter.swift\" rel=\"noreferrer\">Tinycast hotkey source\u003c/a>, \u003ca href=\"https://developer.apple.com/library/archive/documentation/Cocoa/Conceptual/EventOverview/MonitoringEvents/MonitoringEvents.html\" rel=\"noreferrer\">Apple event monitor documentation\u003c/a>. A retained nonactivating \u003ccode>NSPanel\u003c/code> that can become key is the proposed shell; exact activation/Space behaviour remains to be prototyped.\u003c/p>\n\u003cp>\u003cstrong>Icons/opening — verified APIs; caching recommended.\u003c/strong> \u003ccode>NSWorkspace.icon(forFile:)\u003c/code> supplies file/app icons and is callable off the main thread. Cache small rendered images by identity/change stamp, request only visible rows plus a small prefetch, and use generic type icons immediately. Launch apps using \u003ccode>NSWorkspace.openApplication(at:configuration:)\u003c/code>; open files/folders with the workspace URL APIs. Do not construct shell command strings from paths. Surface launch errors and revalidate stale entries. \u003ca href=\"https://developer.apple.com/documentation/appkit/nsworkspace/icon(forfile:)\" rel=\"noreferrer\">Icons\u003c/a>, \u003ca href=\"https://developer.apple.com/documentation/appkit/nsworkspace/openapplication(at:configuration:completionhandler:)\" rel=\"noreferrer\">app launch\u003c/a>.\u003c/p>\n\u003ch2 id=\"system-settings-items\">System Settings items\u003c/h2>\n\u003cp>\u003cstrong>Verified locally.\u003c/strong> The machine contains:\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">/System/Library/ExtensionKit/Extensions/KeyboardSettings.appex/\n  Contents/Info.plist\n  Contents/Resources/en.lproj/Keyboard.searchTerms\n\u003c/code>\u003c/pre>\n\u003cp>The bundle ID is \u003ccode>com.apple.Keyboard-Settings.extension\u003c/code>. Under \u003ccode>EXAppExtensionAttributes.SettingsExtensionAttributes\u003c/code>, the plist names \u003ccode>searchTermsFileName: Keyboard\u003c/code>, \u003ccode>IconName: icon\u003c/code>, \u003ccode>allowsXAppleSystemPreferencesURLScheme: true\u003c/code>, and the legacy identifier \u003ccode>com.apple.preference.keyboard\u003c/code>.\u003c/p>\n\u003cp>The \u003ccode>.searchTerms\u003c/code> plist groups \u003ccode>localizableStrings\u003c/code> under anchor keys. \u003ccode>InputSources\u003c/code> contains title \u003ccode>Keyboard layouts\u003c/code> and keywords such as QWERTY, Dvorak, languages, and typing. My direct \u003ccode>en.lproj\u003c/code> pass found 41 files/688 entries; that is a specific scan scope, not a guarantee of total settings coverage. The earlier shared inventory reported 42/691. \u003cstrong>Post-comparison verification:\u003c/strong> an additional legacy file, \u003ccode>/System/Library/PreferencePanes/DateAndTime.prefPane/Contents/Resources/en.lproj/DateAndTimePref.searchTerms\u003c/code>, contains three entries. That reconciles 42/691 across ExtensionKit plus legacy panes; 41/688 remains correct for the original ExtensionKit-only pass.\u003c/p>\n\u003cp>\u003cstrong>Recommendation:\u003c/strong> read these data resources without loading extension code. Respect the user's preferred language with explicit fallback; cache by OS build and locale. Preserve title, synonyms, owning pane, anchor, and provenance. Deduplicate duplicate localized records and provide stable IDs. Index title/acronym separately from lower-weight keywords.\u003c/p>\n\u003cp>\u003cstrong>Unverified navigation candidate:\u003c/strong>\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">x-apple.systempreferences:com.apple.Keyboard-Settings.extension?InputSources\n\u003c/code>\u003c/pre>\n\u003cp>Bundle metadata supports participation in this URL scheme; it does \u003cstrong>not\u003c/strong> establish that every group key opens a working anchor on every macOS version. A direct UI navigation test could not be completed because the browser host was unavailable. App inspection succeeded, but no deep-link destination was verified. Test known anchors on each supported OS; fall back to the parent pane when a route is unsupported. API success only proves dispatch, not that the correct sub-item opened. These resources and anchors are an observed system convention, not a documented stable public catalog API.\u003c/p>\n\u003cp>\u003cstrong>Icons:\u003c/strong> the extension's \u003ccode>IconName\u003c/code> points to its resource/asset name. Try that bundle resource with a cached fallback to its workspace icon or a generic settings symbol. \u003cstrong>Post-comparison verification:\u003c/strong> Keyboard also declares \u003ccode>CFBundleIcons.ISGraphicIconConfiguration.ISTypeIdentifier = com.apple.graphic-icon.keyboard\u003c/code>; a content-type icon is another useful route. Correct icon extraction across all panes is unverified. Do not embed a permanent hand-maintained copy of hundreds of current English strings; use a small compatibility map only where testing proves it necessary.\u003c/p>\n\u003cp>Reproduce the metadata inspection without changing settings:\u003c/p>\n\u003cpre>\u003ccode class=\"language-python\">from pathlib import Path\nimport plistlib\nbundle = Path('/System/Library/ExtensionKit/Extensions/KeyboardSettings.appex')\ninfo = plistlib.loads((bundle/'Contents/Info.plist').read_bytes())\nattrs = info['EXAppExtensionAttributes']['SettingsExtensionAttributes']\nterms = bundle/'Contents/Resources/en.lproj'/f\"{attrs['searchTermsFileName']}.searchTerms\"\nprint(info['CFBundleIdentifier'], attrs)\nprint(plistlib.loads(terms.read_bytes())['InputSources'])\n\u003c/code>\u003c/pre>\n\u003ch2 id=\"fuzzy-matching-and-ranking\">Fuzzy matching and ranking\u003c/h2>\n\u003cp>\u003cstrong>Verified—source comparison:\u003c/strong> fzf v1 is a fast greedy scan; fzf v2, fzy, nucleo, SkimMatcherV2, and VS Code's \u003ccode>fuzzyScore\u003c/code> use richer alignments. fzy is the simplest suitable Swift starting point; nucleo provides stronger optimization/Unicode examples. Sublime's exact implementation is proprietary; public approximations must be labelled as such. Alfred documents initial-letter matching; Raycast documents fuzzy titles, aliases, and usage learning. \u003ca href=\"#/research/codex/fuzzy-matching\">Full comparison and sources\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Recommendation:\u003c/strong> preserve original word/camel-case boundaries, fold for comparison, and use exact → prefix → word/acronym → substring → general subsequence tiers. Limit history's influence within comparable match quality. \u003ccode>VSC\u003c/code> must work without manual aliases. Make non-ASCII matching/grapheme highlighting explicit; the experiment's ASCII path is insufficient for production.\u003c/p>\n\u003cp>\u003cstrong>Measured:\u003c/strong> median of eleven query medians, milliseconds:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Candidates\u003c/th>\n\u003cth>Full paths + mask\u003c/th>\n\u003cth>Basenames + mask\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1,000\u003c/td>\n\u003ctd>0.216\u003c/td>\n\u003ctd>0.011\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>20,000\u003c/td>\n\u003ctd>4.492\u003c/td>\n\u003ctd>0.266\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>200,000\u003c/td>\n\u003ctd>43.863\u003c/td>\n\u003ctd>3.941\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Across queries at 200k, basename+mask ranged from 0.201 to 6.312 ms; full paths ranged from 0.474 to 80.823 ms. The corpus repeats 13,746 real names/paths to reach 200k, and measurement excludes sorting/UI/indexing. The harness's high allocation footprint is disclosed separately; it is not a production memory estimate. \u003ca href=\"#/research/codex/benchmark\">Benchmark method, per-query values, and source\u003c/a>.\u003c/p>\n\u003cp>\u003cstrong>Result stability:\u003c/strong> search a consistent snapshot, publish a complete ranked batch, and drop obsolete generations. Keep row geometry fixed and selected IDs stable once the user navigates. History updates after successful actions, not while a query remains visible. Re-ranking across \u003cem>different\u003c/em> queries is legitimate; late results shifting a fixed query or Enter target are not. Never incrementally filter only the previous visible top-K.\u003c/p>\n\u003ch2 id=\"recommended-architecture\">Recommended architecture\u003c/h2>\n\u003cp>\u003cstrong>Proposal, not an accepted implementation decision.\u003c/strong> One Swift executable with a retained AppKit palette; SwiftUI is suitable for settings. Swift is already available and directly supports the required platform APIs. Go/Rust can implement a fast index, but introduce bridging/build/runtime choices that this scope has not justified. Use Rust/nucleo later only if a measured Swift bottleneck remains after field selection and allocation fixes.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Component\u003c/th>\n\u003cth>Proposed design\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>UI\u003c/td>\n\u003ctd>\u003ccode>NSPanel\u003c/code>, native search field and reusable list rows; fixed icon slots and list geometry. Construct once; hide between uses.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Query\u003c/td>\n\u003ctd>Parse user-configurable \u003ccode>'\u003c/code> file/folder and \u003ccode>.\u003c/code> settings prefixes before matching. Unprefixed input searches apps/settings/files in one snapshot. Escape/literal-prefix behaviour must be specified.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Apps\u003c/td>\n\u003ctd>Scan standard app roots and explicitly included app directories; skip bundle internals, resolve aliases carefully, retain localized/alternate names. Use filesystem/workspace changes to refresh; optional metadata enrichment stays off the query path.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Settings\u003c/td>\n\u003ctd>Small versioned locale-aware catalog from system extension metadata, with tested routes and parent fallbacks.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Files\u003c/td>\n\u003ctd>User-selected roots only; default exclusions for dependency/VCS/build trees; persistent SQLite records and compact immutable search arrays. Separate basename and path search fields.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Concurrency\u003c/td>\n\u003ctd>One process initially. UI on main actor; bounded utility indexing queue; serial cancellable search worker with reusable scratch. Swap complete snapshots atomically. No disk work under the query lock.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Updates\u003c/td>\n\u003ctd>Batched FSEvents, subtree reconciliation, durable checkpoint/recovery, and clear index status. Bound old snapshots and pending change buffers during large rebuilds.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Search\u003c/td>\n\u003ctd>Prepared normalized names/boundaries, 64-bit mask, subsequence check, fzy-like score, top-K heap/selection, stable tie-break. Path-aware narrowing for \u003ccode>/\u003c/code> queries; no arbitrary pre-match cap.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Config/history\u003c/td>\n\u003ctd>Versioned Codable JSON for prefixes, roots, exclusions, aliases, and UI preferences; opaque bookmarks persisted separately. SQLite for index and bounded local usage records. Atomic config saves; explicit reset/rebuild actions.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Launch\u003c/td>\n\u003ctd>Typed app/file/settings actions using workspace APIs, with error handling. Cache only the icon working set.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>\u003cstrong>Proposed budgets, all unverified until an app exists:\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Metric\u003c/th>\n\u003cth>Initial target on this M1 Pro\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Warm hotkey to first presented frame\u003c/td>\n\u003ctd>p95 ≤33 ms; inspect 60/120 Hz separately\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Query to stable displayed results\u003c/td>\n\u003ctd>p95 ≤16 ms for ordinary app/settings and 20k-name searches; ≤33 ms at 200k names\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>File-index event freshness\u003c/td>\n\u003ctd>Usually within 1–2 seconds after a local change; correctness recovery may take longer\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Idle CPU/energy\u003c/td>\n\u003ctd>No continuous scan/polling; near-zero CPU when no files change\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Warm memory footprint\u003c/td>\n\u003ctd>Aim ≤60 MiB at 20k files and ≤100 MiB at 200k, with bounded icon cache; measure footprint and total child-process cost\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>These are engineering targets, not forecasts guaranteed by the microbenchmark. Cold start, first indexing, Unicode/path searches, remote/cloud roots, UI drawing, and sorting must be measured separately. An approximate compact-index calculation—names plus parent IDs, flags, masks and records in tens of MB at 200k—supports prototyping, but does not establish the AppKit application's footprint.\u003c/p>\n\u003cp>Start with correctness at the actual ~13k selected-project scale. Add mmap snapshots, compacted name interning, bulk syscalls, parallel scoring, or a crash-isolated index helper only when measurements show the simpler design misses a requirement. Keep filename indexing independently replaceable so those changes do not alter the UI contract.\u003c/p>\n\u003ch2 id=\"additional-feature-suggestions\">Additional feature suggestions\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Priority\u003c/th>\n\u003cth>Feature\u003c/th>\n\u003cth>Reason\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>First\u003c/td>\n\u003ctd>Explicit aliases and pinning\u003c/td>\n\u003ctd>Predictable shortcuts for ambiguous names; low resource cost.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>First\u003c/td>\n\u003ctd>Reveal in Finder, copy path, open with\u003c/td>\n\u003ctd>Natural actions on existing results; minimal added indexing.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>First\u003c/td>\n\u003ctd>Index status, excluded-folder editor, rebuild/reset ranking\u003c/td>\n\u003ctd>Makes missing/stale results diagnosable.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Next\u003c/td>\n\u003ctd>Calculator and unit conversion\u003c/td>\n\u003ctd>High utility, no filesystem expansion; keep it local and optional.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Next\u003c/td>\n\u003ctd>Recent files and configurable quick links\u003c/td>\n\u003ctd>Uses existing IDs/history; avoid a second catalog.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Later\u003c/td>\n\u003ctd>Quick Look on demand\u003c/td>\n\u003ctd>Useful verification before opening; load only when requested.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Later\u003c/td>\n\u003ctd>Explicit Shortcuts/script actions\u003c/td>\n\u003ctd>Powerful, but require action semantics and clear permissions.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Defer\u003c/td>\n\u003ctd>Clipboard history, global menu search, window management\u003c/td>\n\u003ctd>Add data retention, background work, or Accessibility requirements beyond the core request.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Defer\u003c/td>\n\u003ctd>AI, cloud sync, extension store\u003c/td>\n\u003ctd>Large runtime/product scope; no requirement justifies them yet.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"risks-and-open-questions\">Risks and open questions\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Needs user choice:\u003c/strong> default hotkey and Spotlight conflict, minimum macOS version, direct distribution versus App Store, default result mix, selected roots/exclusions, basename versus implicit full-path search, and whether hidden/package/cloud/network content is included. These should be resolved after comparing the two reports.\u003c/li>\n\u003cli>\u003cstrong>Settings compatibility:\u003c/strong> test the actual “Keyboard layouts” route, not merely URL opening, and test ExtensionKit plus legacy-pane coverage. Some anchors may be dynamic, gated by hardware, or obsolete.\u003c/li>\n\u003cli>\u003cstrong>Index correctness:\u003c/strong> renames/moves, symlinks, permission revocation, root removal, event loss, crash recovery, mount identity, and incomplete cloud directories need adversarial tests. A full scan and persistent journal are different responsibilities.\u003c/li>\n\u003cli>\u003cstrong>Matching quality:\u003c/strong> Unicode case/diacritics, CJK names, IME composition, duplicate installs, acronym conflicts, and history reset require acceptance examples. A copied VS Code 128-unit limit would break long paths.\u003c/li>\n\u003cli>\u003cstrong>Memory/perceived speed:\u003c/strong> big icon sets, duplicated string buffers, overlapping snapshots, and indexing contention can dominate a fast scorer. Test slow filesystem providers and active build churn with UI frame timing.\u003c/li>\n\u003cli>\u003cstrong>Source reuse:\u003c/strong> Tinycast is AGPL; Albert has a restrictive custom license; nucleo is MPL and fzf/fzy are MIT in inspected repositories. Read upstream licenses before choosing code reuse. This report recommends designs, not importing those projects wholesale.\u003c/li>\n\u003cli>\u003cstrong>Evidence gaps:\u003c/strong> no controlled Raycast/Alfred/LaunchBar/Spotlight latency/RAM comparison, no built Apparate UI, no universal settings-anchor verification, and no cross-algorithm local benchmark. Do not present proposed budgets as achieved performance.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"sources\">Sources\u003c/h2>\n\u003cp>The report links claims directly to official docs and pinned source. The \u003ca href=\"#/research/codex/open-source-launchers\">source review\u003c/a> records repository dates, source paths, indexing, matching, and window strategies; \u003ca href=\"#/research/codex/fuzzy-matching\">matching analysis\u003c/a> cites exact algorithms; \u003ca href=\"#/research/codex/benchmark\">benchmark\u003c/a> contains the executed Swift/Python source and measured results.\u003c/p>\n\u003cp>Primary platform references are Apple's metadata/FSEvents guides, FileManager/NSWorkspace documentation, App Sandbox and TCC guidance, and locally inspected system plists. Commercial-product evidence comes from Raycast's engineering article/manual, Alfred help, Objective Development's LaunchBar help, and Apple Spotlight documentation. Closed-source internals not disclosed by those sources remain unverified.\u003c/p>\n","backlinks":["index","research/alignment","research/codex/benchmark","research/codex/fuzzy-matching","research/codex/open-source-launchers"]},{"id":"spikes/2026-11-18-panel-latency","title":"Panel latency spike","section":"Spikes","order":0,"metadata":{"status":"Complete"},"metadataHtml":"\u003cspan>Status: Complete\u003c/span> \u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Panel latency spike\nsection: Spikes\nupdated: 2026-11-18\nstatus: Complete\n---\n# Panel latency spike\n\nRun by Claude on 2026-11-18, after the user asked to move the next steps forward. Codex reviewed it the same day. Its corrections are applied below, and the [known flaws](#known-flaws-in-the-harness) section lists its findings about the method. The code is a throwaway test program, not product code.\n\n## Question\n\nCan the agreed design ([DEC-013](../decisions.md#round-2-2026-11-18)) meet the performance budgets ([DEC-008](../decisions.md#round-1-2026-11-18))? If not, what stands in the way?\n\n## Answer\n\nThe numbers below are indicative, not pass or fail, because the harness has known flaws.\n\n- **Memory and idle CPU:** well inside the budgets in this harness. The harness has no SQLite, FSEvents, real paths or settings UI, and its readings are end points, not peaks.\n- **Search:** small in this workload. 20k items took 0.3 / 1.7 ms (median / p95). 200k items on 4 threads took 2.4 / 10.2 ms, with a maximum of 14 ms.\n- **Time to screen:** no variant met the display budgets in this harness. An empty panel measured the same way took 33 ms median and 44 ms p95 to appear. That suggests the \"hotkey → first frame ≤ 33 ms p95\" limit may be hard to meet for any AppKit panel, but one run of an imperfect harness is not a proven floor.\n- **Drawing:** in this spike's table-view rows built with Auto Layout, layout and drawing took about 23 ms median per update. Nine rows drawn directly with Core Text took 1–2 ms.\n\n## What was built\n\n- A non-activating panel built at launch: 640 × 334 pt, 9 rows of 28 pt, search field and footer, as in [DEC-023](../decisions.md#round-3-ui-design-spike-2026-11-18).\n- An index of real names: the apps and settings items on this Mac plus about 22,000 file and folder names from `~/Projects`, repeated to reach 200,000. The kinds and locations are synthetic, and matching folds ASCII only.\n- Search on a serial background queue with generation IDs. The scorer is the one from the [research benchmark](../research/claude/benchmark.md), with match tiers and kind order added. It keeps the best 50.\n- Typing through the panel's real text field: key events go through the field editor (55 of 55 keys arrived).\n\n## Method\n\n- MacBook Pro M1 Pro, macOS 27.0, built-in 120 Hz display.\n- The panel was shown and hidden 30 times. Then 10 words (55 keys) were typed, and finally a burst of 12 keys.\n- The driver waited for each key's results, up to 200 ms, before pausing 220 ms (or 60 ms) and sending the next key. So keys were not evenly spaced, and the burst did not really overlap searches.\n- **In-app time:** from the start of the show or the key event to the end of an explicit `CATransaction.flush`. Forcing the flush is part of the experiment; an app would normally let the run loop commit.\n- **On-screen time:** ScreenCaptureKit recorded the panel's screen area.\n  - The figure is the WindowServer display time of the first captured frame with enough changed pixels. For results, it is the last such frame before the next key.\n  - This is not the moment light leaves the display. The capture rate was requested, not guaranteed.\n- **Memory:** `phys_footprint`. **Idle CPU:** CPU time used over 5 s with the panel hidden.\n- **Not measured:**\n  - the time from a physical key press to the hotkey callback;\n  - crawling, SQLite and FSEvents.\n\n## Results\n\n20,000 items unless noted. Times in ms, written as median / p95. Each row is a single run, with n = 30 shows and 55 keys. With n = 55, p95 is the 52nd of 55 sorted values.\n\n| Variant | Show → committed | Show → on screen | Key → letter and results committed | Key → results on screen |\n| --- | --- | --- | --- | --- |\n| Empty panel, for comparison | 12.0 / 19.3 | 33.0 / 44.3 | — | — |\n| Table view with Auto Layout rows | 13.7 / 21.2 | 33.5 / 50.2 | 41.8 / 55.7 | 56.8 / 72.5 |\n| 9 rows drawn directly | 16.4 / 20.0 | 40.4 / 59.2 | 21.6 / 31.7 | 35.1 / 69.6 |\n| … plus Core Text, and the field waits up to 4 ms for search | 14.8 / 21.5 | 33.7 / 49.3 | 17.8 / 26.3 | 32.3 / 46.7 |\n| Same, without screen recording | 15.9 / 20.4 | not recorded | 10.4 / 16.3 | not recorded |\n| Same, opaque background instead of vibrancy | 14.0 / 20.2 | 35.7 / 57.7 | 12.2 / 22.0 | 26.0 / 38.8 |\n| Same, keys 60 ms apart | — | — | 11.2 / 19.9 | 24.9 / 39.0 |\n| Same, 200,000 items | 13.5 / 20.3 | 34.4 / 58.8 | 15.1 / 27.6 | 28.5 / 49.2 |\n\nNotes:\n\n- Show results vary by about 10 ms between runs.\n- The \"results on screen\" maximums of 250–390 ms come from the harness. After the last word, its detection window included the field being cleared.\n- The variant with Core Text and the 4 ms wait changed two things at once, so it does not show what the wait alone did. Its typed letter reached the screen later (32 ms median) than in the drawn-rows run with neither change (24.5 ms), in single runs.\n- The best variant without recording was 16.3 ms p95 from key to commit, just above the 16 ms limit. That is in-app time only.\n- Screen recording slowed the app. The same variant took 10.4 ms median without it and 17.8 ms with it, in separate single runs.\n\nMedians per stage for the best variant without recording. The stages have different sample sets: 55 keys, 67 searches and 78 updates. They do not add up to a total.\n\n| Stage | Median / p95, ms |\n| --- | --- |\n| Ordering the panel front (`makeKeyAndOrderFront`) | 13.6 / 15.9 |\n| Key event → text-change callback | 1.2 / 2.1 |\n| Search, 20k items | 0.3 / 1.7 |\n| Building the 9 rows | 1.3 / 2.3 |\n| Layout and draw | 1.3 / 2.0 |\n| Forced Core Animation commit | 5.2 / 10.0 |\n\nMemory (`phys_footprint`, MiB):\n\n| Items | Index loaded, panel built | After 30 shows, before typing | End of run, after typing |\n| --- | --- | --- | --- |\n| 20,000 | 14 | 19–21 | 29 (no recording) |\n| 200,000 | 45 | 42 | 51 (includes recording buffers) |\n\nIdle CPU with the panel hidden was 0.025% over 5 s, without recording.\n\nThe first show after launch took 42–49 ms to commit, against about 15 ms when warm. In the very first run, it took 216 ms; see the [first-run report](../attachments/2026-11-18-panel-latency/run-20k-first-run.txt).\n\n## Known flaws in the harness\n\nFound by Codex's review. A later, authorized run must fix these before any result is treated as a verdict.\n\n- **Detection:** the pixel-change detector does not check which result generation, text or selection is on screen. Missed detections were dropped instead of counted, and the show window had no upper bound.\n- **Data races:** the generation counter and the stage-timer dictionary were shared between threads without synchronization.\n- **Forced commits:** an explicit flush on every update is not how the app would normally run.\n- **Uneven keys:** keys were sent after results arrived, not at fixed times, so stale-result handling under overlap was not tested.\n- **Warm-up:** the spike's warm-up showed the panel and took keyboard focus for 300 ms. A hidden warm-up was not tested.\n- **Records:** there are no per-event records, so the percentiles and outliers cannot be audited.\n\n## What this means for the build\n\n1. **Budgets.** The user kept DEC-008 as provisional end-to-end goals, to be measured properly in M6 and then revisited ([DEC-028](../decisions.md#round-4-2026-11-18)). Codex had recommended this, and Claude agreed.\n2. **Rows.** A custom Core Text list is a candidate, not a decision. It must keep keyboard and mouse selection, VoiceOver, and results past the ninth. In M4 it is compared with manually laid-out table cells.\n3. **Publishing results.** Publish one complete result set per query generation. Never show partial sources or stale results, and keep the selection on the same item. The typed letter shows immediately; waiting on the main thread is not adopted, and can be tested in M4.\n4. **Warm-up.** Find a warm-up that does not take focus, and check that it helps.\n5. **Vibrancy.** In single runs it cost about 5 ms per key against an opaque background. Revisit it if the budgets are missed.\n\n## Evidence\n\n- Source, SHA-256 `9e241ec3…94ad`: [spike source](../attachments/2026-11-18-panel-latency/spike.swift.txt).\n  - It is the final revision and has all variants behind flags.\n  - Earlier runs used earlier revisions with the same code paths for their flags.\n  - The [first-run source](../attachments/2026-11-18-panel-latency/spike-first-run.swift.txt) adds stage timers that the first run did not have; the exact first-run source was not kept.\n- Run reports:\n  - [Table view](../attachments/2026-11-18-panel-latency/run-20k-table.txt)\n  - [Drawn rows](../attachments/2026-11-18-panel-latency/run-20k-fast.txt)\n  - [Core Text and wait](../attachments/2026-11-18-panel-latency/run-20k-fast-ct-sync.txt), and [without recording](../attachments/2026-11-18-panel-latency/run-20k-best-nocapture.txt)\n  - [Opaque background](../attachments/2026-11-18-panel-latency/run-20k-fast-ct-sync-opaque.txt)\n  - [Keys 60 ms apart](../attachments/2026-11-18-panel-latency/run-20k-fast-ct-sync-i60.txt)\n  - [200,000 items](../attachments/2026-11-18-panel-latency/run-200k-fast-ct-sync.txt)\n  - [Empty panel](../attachments/2026-11-18-panel-latency/run-20k-minimal.txt)\n  - [First run](../attachments/2026-11-18-panel-latency/run-20k-first-run.txt)\n\n## Limits\n\n- One machine, single runs per variant.\n- Key events were posted inside the app, so the path from keyboard hardware to the app is not included.\n- See [known flaws](#known-flaws-in-the-harness).\n","toc":[{"id":"question","title":"Question","depth":2},{"id":"answer","title":"Answer","depth":2},{"id":"what-was-built","title":"What was built","depth":2},{"id":"method","title":"Method","depth":2},{"id":"results","title":"Results","depth":2},{"id":"known-flaws-in-the-harness","title":"Known flaws in the harness","depth":2},{"id":"what-this-means-for-the-build","title":"What this means for the build","depth":2},{"id":"evidence","title":"Evidence","depth":2},{"id":"limits","title":"Limits","depth":2}],"titleAnchor":"panel-latency-spike","links":["spikes/2026-11-18-panel-latency","decisions","decisions","decisions","research/claude/benchmark","decisions","spikes/2026-11-18-panel-latency"],"attachments":[{"path":"attachments/2026-11-18-panel-latency/run-20k-first-run.txt","sha256":"c1289200ab9569aaf199aca6810c2a83672b164a5d6d61b1558c7d978ded1b72"},{"path":"attachments/2026-11-18-panel-latency/spike.swift.txt","sha256":"9e241ec32e2049cce32551812cca899fd7e98a8829f91a34e65cf93a9d4d94ad"},{"path":"attachments/2026-11-18-panel-latency/spike-first-run.swift.txt","sha256":"7e2c40865a11a776d0326281267848ff0cba133a5bc04230e7d04cd7f8b46ee8"},{"path":"attachments/2026-11-18-panel-latency/run-20k-table.txt","sha256":"7ed43abcf5fb2bf4a5b15446766235fc6797acff785f5c4f4d8cb5c4308daae9"},{"path":"attachments/2026-11-18-panel-latency/run-20k-fast.txt","sha256":"c63a5f8dc1248a875bf01574294e0c9e8eb600c956e557924277e298f85af0dc"},{"path":"attachments/2026-11-18-panel-latency/run-20k-fast-ct-sync.txt","sha256":"56f7fae8d14ac37f28177f7cecc38a89fd288270da5bbe56da2aeade65f07184"},{"path":"attachments/2026-11-18-panel-latency/run-20k-best-nocapture.txt","sha256":"72020eb373277b054d1b31c4c7dfaba38573c31cf6f071e71cb8c20ca636e615"},{"path":"attachments/2026-11-18-panel-latency/run-20k-fast-ct-sync-opaque.txt","sha256":"303863a513a39c00de710c3266c5990845d70ef69ee2627cd7c732d2f1fa0612"},{"path":"attachments/2026-11-18-panel-latency/run-20k-fast-ct-sync-i60.txt","sha256":"3ce6c81a6d78e3ca4306e0ff01b84807d76930996e259ddd6f6c0aa2ab4e79ec"},{"path":"attachments/2026-11-18-panel-latency/run-200k-fast-ct-sync.txt","sha256":"9063a4e7a3edb82a06e6ff0053ff776ac91a1eb84d33e6d2c6ba854529fa3bc4"},{"path":"attachments/2026-11-18-panel-latency/run-20k-minimal.txt","sha256":"29c0fcad4517749b8390239153f015c421c0ad0c9d329b9c534e99427f507b92"}],"html":"\u003cp>Run by Claude on 2026-11-18, after the user asked to move the next steps forward. Codex reviewed it the same day. Its corrections are applied below, and the \u003ca href=\"#/spikes/2026-11-18-panel-latency~known-flaws-in-the-harness\">known flaws\u003c/a> section lists its findings about the method. The code is a throwaway test program, not product code.\u003c/p>\n\u003ch2 id=\"question\">Question\u003c/h2>\n\u003cp>Can the agreed design (\u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-013\u003c/a>) meet the performance budgets (\u003ca href=\"#/decisions~round-1-2026-11-18\">DEC-008\u003c/a>)? If not, what stands in the way?\u003c/p>\n\u003ch2 id=\"answer\">Answer\u003c/h2>\n\u003cp>The numbers below are indicative, not pass or fail, because the harness has known flaws.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Memory and idle CPU:\u003c/strong> well inside the budgets in this harness. The harness has no SQLite, FSEvents, real paths or settings UI, and its readings are end points, not peaks.\u003c/li>\n\u003cli>\u003cstrong>Search:\u003c/strong> small in this workload. 20k items took 0.3 / 1.7 ms (median / p95). 200k items on 4 threads took 2.4 / 10.2 ms, with a maximum of 14 ms.\u003c/li>\n\u003cli>\u003cstrong>Time to screen:\u003c/strong> no variant met the display budgets in this harness. An empty panel measured the same way took 33 ms median and 44 ms p95 to appear. That suggests the \"hotkey → first frame ≤ 33 ms p95\" limit may be hard to meet for any AppKit panel, but one run of an imperfect harness is not a proven floor.\u003c/li>\n\u003cli>\u003cstrong>Drawing:\u003c/strong> in this spike's table-view rows built with Auto Layout, layout and drawing took about 23 ms median per update. Nine rows drawn directly with Core Text took 1–2 ms.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"what-was-built\">What was built\u003c/h2>\n\u003cul>\n\u003cli>A non-activating panel built at launch: 640 × 334 pt, 9 rows of 28 pt, search field and footer, as in \u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-023\u003c/a>.\u003c/li>\n\u003cli>An index of real names: the apps and settings items on this Mac plus about 22,000 file and folder names from \u003ccode>~/Projects\u003c/code>, repeated to reach 200,000. The kinds and locations are synthetic, and matching folds ASCII only.\u003c/li>\n\u003cli>Search on a serial background queue with generation IDs. The scorer is the one from the \u003ca href=\"#/research/claude/benchmark\">research benchmark\u003c/a>, with match tiers and kind order added. It keeps the best 50.\u003c/li>\n\u003cli>Typing through the panel's real text field: key events go through the field editor (55 of 55 keys arrived).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"method\">Method\u003c/h2>\n\u003cul>\n\u003cli>MacBook Pro M1 Pro, macOS 27.0, built-in 120 Hz display.\u003c/li>\n\u003cli>The panel was shown and hidden 30 times. Then 10 words (55 keys) were typed, and finally a burst of 12 keys.\u003c/li>\n\u003cli>The driver waited for each key's results, up to 200 ms, before pausing 220 ms (or 60 ms) and sending the next key. So keys were not evenly spaced, and the burst did not really overlap searches.\u003c/li>\n\u003cli>\u003cstrong>In-app time:\u003c/strong> from the start of the show or the key event to the end of an explicit \u003ccode>CATransaction.flush\u003c/code>. Forcing the flush is part of the experiment; an app would normally let the run loop commit.\u003c/li>\n\u003cli>\u003cstrong>On-screen time:\u003c/strong> ScreenCaptureKit recorded the panel's screen area.\u003cul>\n\u003cli>The figure is the WindowServer display time of the first captured frame with enough changed pixels. For results, it is the last such frame before the next key.\u003c/li>\n\u003cli>This is not the moment light leaves the display. The capture rate was requested, not guaranteed.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Memory:\u003c/strong> \u003ccode>phys_footprint\u003c/code>. \u003cstrong>Idle CPU:\u003c/strong> CPU time used over 5 s with the panel hidden.\u003c/li>\n\u003cli>\u003cstrong>Not measured:\u003c/strong>\u003cul>\n\u003cli>the time from a physical key press to the hotkey callback;\u003c/li>\n\u003cli>crawling, SQLite and FSEvents.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"results\">Results\u003c/h2>\n\u003cp>20,000 items unless noted. Times in ms, written as median / p95. Each row is a single run, with n = 30 shows and 55 keys. With n = 55, p95 is the 52nd of 55 sorted values.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Variant\u003c/th>\n\u003cth>Show → committed\u003c/th>\n\u003cth>Show → on screen\u003c/th>\n\u003cth>Key → letter and results committed\u003c/th>\n\u003cth>Key → results on screen\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Empty panel, for comparison\u003c/td>\n\u003ctd>12.0 / 19.3\u003c/td>\n\u003ctd>33.0 / 44.3\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Table view with Auto Layout rows\u003c/td>\n\u003ctd>13.7 / 21.2\u003c/td>\n\u003ctd>33.5 / 50.2\u003c/td>\n\u003ctd>41.8 / 55.7\u003c/td>\n\u003ctd>56.8 / 72.5\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>9 rows drawn directly\u003c/td>\n\u003ctd>16.4 / 20.0\u003c/td>\n\u003ctd>40.4 / 59.2\u003c/td>\n\u003ctd>21.6 / 31.7\u003c/td>\n\u003ctd>35.1 / 69.6\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>… plus Core Text, and the field waits up to 4 ms for search\u003c/td>\n\u003ctd>14.8 / 21.5\u003c/td>\n\u003ctd>33.7 / 49.3\u003c/td>\n\u003ctd>17.8 / 26.3\u003c/td>\n\u003ctd>32.3 / 46.7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Same, without screen recording\u003c/td>\n\u003ctd>15.9 / 20.4\u003c/td>\n\u003ctd>not recorded\u003c/td>\n\u003ctd>10.4 / 16.3\u003c/td>\n\u003ctd>not recorded\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Same, opaque background instead of vibrancy\u003c/td>\n\u003ctd>14.0 / 20.2\u003c/td>\n\u003ctd>35.7 / 57.7\u003c/td>\n\u003ctd>12.2 / 22.0\u003c/td>\n\u003ctd>26.0 / 38.8\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Same, keys 60 ms apart\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>11.2 / 19.9\u003c/td>\n\u003ctd>24.9 / 39.0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Same, 200,000 items\u003c/td>\n\u003ctd>13.5 / 20.3\u003c/td>\n\u003ctd>34.4 / 58.8\u003c/td>\n\u003ctd>15.1 / 27.6\u003c/td>\n\u003ctd>28.5 / 49.2\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Notes:\u003c/p>\n\u003cul>\n\u003cli>Show results vary by about 10 ms between runs.\u003c/li>\n\u003cli>The \"results on screen\" maximums of 250–390 ms come from the harness. After the last word, its detection window included the field being cleared.\u003c/li>\n\u003cli>The variant with Core Text and the 4 ms wait changed two things at once, so it does not show what the wait alone did. Its typed letter reached the screen later (32 ms median) than in the drawn-rows run with neither change (24.5 ms), in single runs.\u003c/li>\n\u003cli>The best variant without reco
