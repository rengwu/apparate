<script type="application/json" id="wiki-data">{"title":"Apparate","pages":[{"id":"index","title":"Apparate","section":"Overview","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Apparate\nupdated: 2026-11-18\n---\n# Apparate\n\nA minimal, very fast launcher for macOS. Planning notes, research, decisions, and open questions.\n\n## Planning\n\n- [Requirements](requirements.md) — what the user asked for.\n- [Decisions](decisions.md) — accepted choices from rounds 1–4, the performance budgets, and what is still open.\n- [Implementation plan](plan.md) — approved milestones from foundation to release 0.1.0, how the build runs, and progress.\n\n## Build\n\n- [Build guides](build/index.md) — Claude's guide for each milestone, which Codex builds from.\n- [M1 guide](build/m1-foundation.md) — foundation, config, matching and ranking.\n\n## Features and verification\n\n- [Feature map](features/index.md) — search and config behavior, entry points and recipes.\n- [Verification setup](verification/setup.md) — isolated builds, tests and measurements.\n- [M1 verification](verification/runs/2026-11-18T154000Z-m1.md) — outcomes and evidence for the foundation build.\n\n## Research\n\nClaude and Codex researched the whole topic independently, at the user's request, and then compared conclusions.\n\n- [Claude research report](research/claude/report.md) — with its [matching benchmark](research/claude/benchmark.md).\n- [Codex research report](research/codex/report.md) — with its [source review](research/codex/open-source-launchers.md), [fuzzy matching analysis](research/codex/fuzzy-matching.md) and [benchmark](research/codex/benchmark.md).\n- [Research alignment](research/alignment.md) — what both reports agree on, how differences were resolved, and the decisions left for the user.\n\n## Spikes\n\n- [UI design spike](spikes/2026-11-18-ui-design.md) — interactive variations of the five interfaces, and verified settings names and icons.\n- [Settings deep-link spike](spikes/2026-11-18-settings-deep-links.md) — do settings links open the exact item? Mostly yes; the pane always opens.\n- [Panel latency spike](spikes/2026-11-18-panel-latency.md) — measured show, keystroke, memory and idle CPU against the budgets.\n","toc":[{"id":"planning","title":"Planning","depth":2},{"id":"build","title":"Build","depth":2},{"id":"features-and-verification","title":"Features and verification","depth":2},{"id":"research","title":"Research","depth":2},{"id":"spikes","title":"Spikes","depth":2}],"titleAnchor":"apparate","links":["requirements","decisions","plan","build/index","build/m1-foundation","features/index","verification/setup","verification/runs/2026-11-18T154000Z-m1","research/claude/report","research/claude/benchmark","research/codex/report","research/codex/open-source-launchers","research/codex/fuzzy-matching","research/codex/benchmark","research/alignment","spikes/2026-11-18-ui-design","spikes/2026-11-18-settings-deep-links","spikes/2026-11-18-panel-latency"],"attachments":[],"html":"\u003cp>A minimal, very fast launcher for macOS. Planning notes, research, decisions, and open questions.\u003c/p>\n\u003ch2 id=\"planning\">Planning\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/requirements\">Requirements\u003c/a> — what the user asked for.\u003c/li>\n\u003cli>\u003ca href=\"#/decisions\">Decisions\u003c/a> — accepted choices from rounds 1–4, the performance budgets, and what is still open.\u003c/li>\n\u003cli>\u003ca href=\"#/plan\">Implementation plan\u003c/a> — approved milestones from foundation to release 0.1.0, how the build runs, and progress.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"build\">Build\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/build/index\">Build guides\u003c/a> — Claude's guide for each milestone, which Codex builds from.\u003c/li>\n\u003cli>\u003ca href=\"#/build/m1-foundation\">M1 guide\u003c/a> — foundation, config, matching and ranking.\u  budgets.\u003c/li>\n\u003c/ul>\n","backlinks":["requirements"]},{"id":"build/index","title":"Build","section":"Build","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-19\u003c/span>","updated":"2026-11-19","summary":"","source":"---\ntitle: Build\nsection: Build\nupdated: 2026-11-19\n---\n# Build\n\nBuild guides, one per milestone of the [implementation plan](../plan.md). Claude writes each guide before the milestone starts. Codex builds from it, and can push back on any part ([DEC-036](../decisions.md#round-4-2026-11-18)).\n\n| Milestone | Guide | Status |\n| --- | --- | --- |\n| M1 Foundation, matching and ranking | [M1 guide](m1-foundation.md) | Reviewed: passed; fix verified; commit waits for git |\n\n## How a guide is used\n\n1. Codex reads the guide and the pages it links, then replies with any pushback before writing code. Pushback names the guide section, says what should change, and why.\n2. Claude answers. If either still disagrees after that exchange, Claude asks the user in a grill-form with both positions attributed. Parts of the milestone that do not depend on the answer go ahead.\n3. Codex builds, runs the checks in the guide, and records a verification run in `verification/runs/`.\n4. Claude reviews the diff and the run. Codex fixes what the review finds.\n5. After the review passes, Codex makes the milestone's single commit ([DEC-037](../decisions.md#round-4-2026-11-18)).\n\n## Rules for every milestone\n\n- **Lean.** Follow jstack's `rule-lean` (`~/Projects/jstack/skills/rule-lean/SKILL.md`), which the user cited in [DEC-029](../decisions.md#round-4-2026-11-18). Build what the milestone needs, and nothing for later milestones.\n- **Plain UI.** Follow jstack's `rule-plain-ui` (`~/Projects/jstack/skills/rule-plain-ui/SKILL.md`): every label and element needs a reason to exist.\n- **No third-party packages.** System frameworks and `libsqlite3` only.\n- **Core stays headless.** `ApparateCore` never imports AppKit. Its tests never open URLs, run system commands, or touch the user's real data.\n- **Private data stays out of records.** Verification runs and evidence must not contain the user's account name, file names from their folders, or other personal details. Timings and counts are fine.\n- **Records.** Feature and verification records follow the jstack contract (`~/Projects/jstack/references/stack-contract.md`). Rebuild the wiki with `node docs/wiki/_build.mjs`, then check it with `node docs/wiki/_build.mjs --check`.\n- **Commits.** One per milestone, made after the review passes. Subject `M\u003cn>: \u003cmilestone name>`, then a short body listing what was built and how it was verified. Never push.\n","toc":[{"id":"how-a-guide-is-used","title":"How a guide is used","depth":2},{"id":"rules-for-every-milestone","title":"Rules for every milestone","depth":2}],"titleAnchor":"build","links":["plan","decisions","build/m1-foundation","decisions","decisions"],"attachments":[],"html":"\u003cp>Build guides, one per milestone of the \u003ca href=\"#/plan\">implementation plan\u003c/a>. Claude writes each guide before the milestone starts. Codex builds from it, and can push back on any part (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-036\u003c/a>).\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Milestone\u003c/th>\n\u003cth>Guide\u003c/th>\n\u003cth>Status\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>M1 Foundation, matching and ranking\u003c/td>\n\u003ctd>\u003ca href=\"#/build/m1-foundation\">M1 guide\u003c/a>\u003c/td>\n\u003ctd>Reviewed: passed; fix verified; commit waits for git\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"how-a-guide-is-used\">How a guide is used\u003c/h2>\n\u003col>\n\u003cli>Codex reads the guide and the pages it links, then replies with any pushback before writing code. Pushback names the guide section, says what should change, and why.\u003c/li>\n\u003cli>Claude answers. If either still disagrees after that exchange, Claude asks the user in a grill-form with both positions attributed. Parts of the milestone that do not depend on the answer go ahead.\u003c/li>\n\u003cli>Codex builds, runs the checks in the guide, and records a verification run in \u003ccode>verification/runs/\u003c/code>.\u003c/li>\n\u003cli>Claude reviews the diff and the run. Codex fixes what the review finds.\u003c/li>\n\u003cli>After the review passes, Codex makes the milestone's single commit (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-037\u003c/a>).\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"rules-for-every-milestone\">Rules for every milestone\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Lean.\u003c/strong> Follow jstack's \u003ccode>rule-lean\u003c/code> (\u003ccode>~/Projects/jstack/skills/rule-lean/SKILL.md\u003c/code>), which the user cited in \u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-029\u003c/a>. Build what the milestone needs, and nothing for later milestones.\u003c/li>\n\u003cli>\u003cstrong>Plain UI.\u003c/strong> Follow jstack's \u003ccode>rule-plain-ui\u003c/code> (\u003ccode>~/Projects/jstack/skills/rule-plain-ui/SKILL.md\u003c/code>): every label and element needs a reason to exist.\u003c/li>\n\u003cli>\u003cstrong>No third-party packages.\u003c/strong> System frameworks and \u003ccode>libsqlite3\u003c/code> only.\u003c/li>\n\u003cli>\u003cstrong>Core stays headless.\u003c/strong> \u003ccode>ApparateCore\u003c/code> never imports AppKit. Its tests never open URLs, run system commands, or touch the user's real data.\u003c/li>\n\u003cli>\u003cstrong>Private data stays out of records.\u003c/strong> Verification runs and evidence must not contain the user's account name, file names from their folders, or other personal details. Timings and counts are fine.\u003c/li>\n\u003cli>\u003cstrong>Records.\u003c/strong> Feature and verification records follow the jstack contract (\u003ccode>~/Projects/jstack/references/stack-contract.md\u003c/code>). Rebuild the wiki with \u003ccode>node docs/wiki/_build.mjs\u003c/code>, then check it with \u003ccode>node docs/wiki/_build.mjs --check\u003c/code>.\u003c/li>\n\u003cli>\u003cstrong>Commits.\u003c/strong> One per milestone, made after the review passes. Subject \u003ccode>M&lt;n&gt;: &lt;milestone name&gt;\u003c/code>, then a short body listing what was built and how it was verified. Never push.\u003c/li>\n\u003c/ul>\n","backlinks":["index","plan"]},{"id":"build/m1-foundation","title":"M1 guide — Foundation, matching and ranking","section":"Build","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: M1 guide — Foundation, matching and ranking\nsection: Build\nupdated: 2026-11-18\n---\n# M1 guide — Foundation, matching and ranking\n\nWritten by Claude for Codex, who builds M1 ([DEC-036](../decisions.md#round-4-2026-11-18)). The scope comes from [M1 in the plan](../plan.md#m1-foundation-matching-and-ranking). This guide adds the detail, the order of work, and references. Where it proposes something the user has not decided, it says so under [Proposals to confirm](#proposals-to-confirm). Codex's pushback of 2026-11-18 is folded in; see [Pushback and answers](#pushback-and-answers).\n\n## Goal\n\nA headless core that can take a typed query and return the right results, in the right order, fast. No real data sources yet: M1 works on items given to it. The app target only proves that the bundle builds, signs and finds its data folder.\n\nM1 is done when:\n\n- `./build.sh` builds a signed `build/Apparate.app`.\n- `swift run ApparateCoreTests` passes, covering every test listed [below](#11-tests).\n- A verification run with search timings and memory at 20,000 and 200,000 items is recorded in the wiki.\n- Claude's review has passed, and the milestone is one commit.\n\n## Decisions that apply\n\n| Decision | What it means for M1 |\n| --- | --- |\n| [DEC-001](../decisions.md#round-1-2026-11-18) | A query without a prefix searches apps, settings, folders and files. System commands are included too ([REQ-010](../requirements.md)). |\n| [DEC-002](../decisions.md#round-1-2026-11-18) | Equal matches rank apps > settings > folders > files. Usage reorders only within a tier. |\n| [DEC-003](../decisions.md#round-1-2026-11-18) | Settings are saved to an editable, versioned JSON file. |\n| [DEC-005](../decisions.md#round-1-2026-11-18), [DEC-020](../decisions.md#round-2-2026-11-18) | Default folders `~/Projects`, `~/Desktop`, `~/Documents`, `~/Downloads`, each with depth 10. |\n| [DEC-004](../decisions.md#round-1-2026-11-18) | Default hotkey ⌘Space, stored in the config. |\n| [DEC-016](../decisions.md#round-2-2026-11-18) | No user aliases or pinned results. |\n| [DEC-017](../decisions.md#round-2-2026-11-18), [DEC-018](../decisions.md#round-2-2026-11-18) | The web fallback row appears when nothing local matches. The default search URL is `https://duckduckgo.com/?q={query}`, as in the [settings design](#visual-references). |\n| [DEC-021](../decisions.md#round-2-2026-11-18) | The menu bar icon can be hidden: a config switch, on by default. |\n| [DEC-028](../decisions.md#round-4-2026-11-18) | The DEC-008 budgets are goals. Measure search time from M1 on. |\n| [DEC-030](../decisions.md#round-4-2026-11-18), [DEC-032](../decisions.md#round-4-2026-11-18) | Default prefixes are `'` files and folders, `.` settings and `?` web. DEC-032 (no others) is provisional: round 5 asks again. Keep the defaults in one place so one can be added cheaply. |\n| [DEC-031](../decisions.md#round-4-2026-11-18) | A query containing `/` searches full paths. |\n| [DEC-033](../decisions.md#round-4-2026-11-18) | A config switch for `.gitignore` handling, on by default. M3 uses it. |\n| [DEC-010](../decisions.md#round-1-2026-11-18), [DEC-013](../decisions.md#round-2-2026-11-18), [DEC-014](../decisions.md#round-2-2026-11-18) | macOS 27, SwiftPM plus `build.sh`, ad-hoc signed with a fixed designated requirement. |\n\n## Order of work\n\n### 1. Package and build\n\nCopy Klip's layout ([references](#non-visual-references)), with these changes:\n\n- `// swift-tools-version: 6.4` and `platforms: [.macOS(.v27)]`. Checked on this Mac: `.v27` needs tools version 6.4, and Swift 6.4.2 builds it. Swift 6 language mode is on, so the compiler rejects most data races in safe Swift. The latency spike had two races in shared state, so this is worth its friction. Unsafe pointers, the SQLite C boundary and anything marked `@unchecked Sendable` still need clear ownership.\n- Targets: `ApparateCore` (library, links `sqlite3`), `Apparate` (executable), `ApparateCoreTests` (executable, Klip's harness).\n- `VERSION` holds `0.1.0`.\n- `build.sh` builds **arm64 only**: no x86_64 slice, no `lipo`. The Info.plist has `CFBundleIdentifier` `local.apparate`, `LSMinimumSystemVersion` `27.0` and `LSUIElement` true. Sign with `--requirements '=designated => identifier \"local.apparate\"'`, then verify. Leave out the icon lines until M7.\n- `.gitignore`: `.build/`, `build/`, `.swiftpm/`, `.DS_Store`.\n\n### 2. App stub\n\n`main.swift` and a small `AppDelegate`, as in Klip:\n\n- the accessory activation policy;\n- the data folder: `APPARATE_HOME` if set and not empty, else `~/Library/Application Support/Apparate/`;\n- it loads the config, which writes the defaults on first launch, and logs any config error.\n\nNothing else. `APPARATE_SHOW`, the hotkey and the panel come in M2.\n\n### 3. Config\n\n`config.json` in the data folder. Proposed version 1, with defaults:\n\n```json\n{\n  \"version\": 1,\n  \"hotKey\": { \"keyCode\": 49, \"modifiers\": 256, \"display\": \"⌘Space\" },\n  \"showMenuBarIcon\": true,\n  \"prefixes\": { \"files\": \"'\", \"settings\": \".\", \"web\": \"?\" },\n  \"searchURL\": \"https://duckduckgo.com/?q={query}\",\n  \"folders\": [\n    { \"path\": \"~/Projects\", \"depth\": 10 },\n    { \"path\": \"~/Desktop\", \"depth\": 10 },\n    { \"path\": \"~/Documents\", \"depth\": 10 },\n    { \"path\": \"~/Downloads\", \"depth\": 10 }\n  ],\n  \"respectGitignore\": true\n}\n```\n\n- **Not in the config:** launch at login. `SMAppService` holds that state, and M5 shows it. The search engine menu in settings is a set of presets that fill `searchURL`; only the URL is stored.\n- **Missing keys** take their defaults, as in Klip's `AppConfig`. Unknown keys are ignored.\n- **Missing file:** write the defaults, so the user can find and edit it.\n- **Invalid file:** keep the last valid config, report the errors, and never overwrite the broken file. At launch, \"last valid\" means the defaults. The whole file is accepted or rejected. A partly applied config would be harder to understand.\n  - JSON that does not parse, or has a wrong type, reports that one error.\n  - A file that parses reports all its value errors together.\n  - When a broken file is fixed, its error clears, even if the fixed config equals the current one.\n- **Newer version:** if `version` is higher than the app knows, treat the file as invalid and never write over it.\n- **Migration:** version 1 is the only version, so there is no migration code yet. The version check above is the whole mechanism until a version 2 exists.\n- **Saving:** pretty-printed with sorted keys, written atomically.\n- **Reloading:** dispatch sources, not polling. Watch the file for writes, and the data folder for the file being replaced or deleted; re-arm the file watch after a replacement. A watch on the folder alone misses in-place edits, and a watch on the file alone misses atomic saves. On a change, read the file again. If the decoded config equals the current one, do nothing. That also covers the app's own saves.\n\nDefined errors, each with a message the M5 settings window can show as is:\n\n- a prefix that is empty, more than one character, or a letter, digit, whitespace or control character, `/` or `~` (see [proposals](#proposals-to-confirm));\n- two scopes with the same prefix;\n- a prefix for an unknown scope;\n- a folder path that is not absolute after `~` is expanded, or that appears twice after lexical normalization (no disk access);\n- a depth outside 1–30;\n- a search URL that does not contain `{query}` exactly once, or that is not a complete `http` or `https` URL with a host once a sample query is put in its place;\n- JSON that does not parse, or a value of the wrong type.\n\nA folder that does not exist is not a config error. M3 reports it as unavailable.\n\n### 4. Items\n\nOne item model for every kind:\n\n| Kind | Rank | Stable ID (proposal) | Searchable text |\n| --- | --- | --- | --- |\n| app | 0 | `app:` + bundle path | display name, plus built-in alternate names |\n| command | 0 | `command:lock`, `command:sleep`, `command:restart`, `command:trash` | name |\n| setting | 1 | `setting:` + pane bundle ID + `?` + anchor + `#` + title | title, plus keywords |\n| folder | 2 | `folder:` + absolute path | name, plus path in path mode |\n| file | 3 | `file:` + absolute path | name, plus path in path mode |\n| web | — | `web` | not searched |\n\n- One anchor can carry several titles, so a settings ID includes the title. Escape or length-prefix the parts so that no two items can produce the same ID.\n- IDs are opaque: nothing parses an ID to decide how to open an item.\n- Duplicate apps at different paths are different items.\n- These formats are for M1. Whether an ID survives a rename, a move or a language change is decided with the real sources in M2 and M3; M1 promises nothing about it.\n- Commands rank like apps (plan, M2).\n- In M1, items come from test fixtures. M2 and M3 add the real sources.\n\n### 5. Query parsing\n\n1. Trim leading and trailing whitespace. Keep the spaces inside the query as typed: a web search sends them unchanged. Matching splits the text into words separately.\n2. If the first character is a configured prefix, the scope is that prefix's scope. The rest of the query, with any leading spaces trimmed, is the search text. There is no escape for searching a prefix character literally (see [pushback](#pushback-and-answers)).\n3. Otherwise the scope is everything: apps, commands, settings, folders and files.\n4. **Web scope:** the result is one web row for the text. An empty text gives no rows. An empty query is never a web search.\n5. **Fallback row:** only for a query without a prefix that matches nothing. A query with a files, settings, apps or commands prefix that matches nothing shows no rows.\n6. **Path mode:** if the scope includes files or folders and the text contains `/`, search files and folders by path ([§7](#7-path-mode)). An explicit prefix is applied first, so `?a/b` stays a web search.\n7. Return the parsed query as a value, so tests and the panel can see the scope and mode.\n\n### 6. Matching\n\nFollow the plan: names first, fzy-style, with a character mask and a subsequence check before scoring.\n\n**Prepared text,** built once per item when the snapshot is built, never per keystroke:\n\n- Fold each displayed character case-, diacritic- and width-insensitively (`String.folding(options:locale:)` with a `nil` locale). Store the folded Unicode scalars, and for each one the index of the displayed character it came from. One displayed character can fold to several scalars (`ß` → `ss`), so the map is per scalar.\n- ASCII names can take a fast path: lowercased bytes, one per character.\n- Word-boundary classes come from the **original** characters, before folding: start of name, after a space, `-`, `_`, `/` or `.`, and camel-case humps. This is how `VSC` matches Visual Studio Code without an alias.\n- A 64-bit mask: one bit each for `a`–`z` and `0`–`9`, and the remaining 28 bits for every other scalar by `scalar % 28`. The query's mask is built the same way. A candidate is skipped only if it lacks a bit the query has, so the mask can give false positives but never hide a real match. Test that property.\n\n**Scoring:**\n\n- Run the subsequence check, then fzy's dynamic-programming score: consecutive, word-start, camel-case and after-dot bonuses, and gap penalties, as in fzy's `match.c`.\n- No length limits. The benchmark's 255-byte and 32-character caps must not come along. Per-worker scratch rows grow to the longest name and query seen.\n- Highlight positions (fzy's traceback) only for results that are published, mapped back to displayed characters for the bold letters in [DEC-024](../decisions.md#round-3-ui-design-spike-2026-11-18).\n- A result records what matched: the displayed name, an alternate name or a keyword. Only a match on the displayed name gets highlights. An alternate-name or keyword match shows the title without bold letters.\n- Scores stay finite. fzy returns infinity for an exact match; here the tier carries \"exact\", and the score is a finite number, so usage and path scores still add.\n\n**Tiers,** best first. Each item takes its best tier across its name and alternate names:\n\n1. **Exact:** the folded query equals the folded name.\n2. **Prefix:** the name starts with the query.\n3. **Word:** each query word is a prefix of a name word, in order (`keyboard la` → Keyboard layouts); or the best alignment puts every query character on a word start or camel hump (`vsc`, `gc`); or the query is a prefix of any name word after the first (`code` → Visual Studio Code).\n4. **Fuzzy:** any other subsequence of the name.\n5. **Keyword:** for settings, the query, or each query word, is a prefix of one of the item's keywords. This tier ranks below every name match.\n\nThe interactive prototype ranks a match inside a word (Preview for `re`) above a match at a word start (Text replacements). That differs from these rules. This guide is the reference, not the prototype.\n\n### 7. Path mode\n\nProposed rules for [DEC-031](../decisions.md#round-4-2026-11-18):\n\n- Split the text on `/`, ignoring empty segments between separators. A leading `/` or `~/` is dropped in v1, with no anchoring. This is fuzzy path search, not lookup of an exact path.\n- A query of only separators (`/`) gives no rows, like an empty query.\n- The **last segment** matches the item's name, using the tiers above. If it is empty (`klip/`), any name matches: everything under the matched folders.\n- Each **earlier segment** must fuzzy-match a different folder in the item's path, in order. The folders need not be next to each other. The indexed folder's own name counts, so `projects/klip/sources` works.\n- **Score:** the name's score plus each segment's score, with a bonus when matched folders are adjacent.\n- **Order:** tier from the last segment, then kind, then score.\n- **Cost:** match names first, then check the parent folders only for names that passed. Never score every full path; Codex's benchmark measured 44 ms median for that at 200k. An empty last segment (`klip/`) skips the name filter, so it is the costly case: measure it, along with short common segments and segments that match nothing. Cache folder-segment work only if the measurements call for it.\n\nExamples: `klip/sources` finds `~/Projects/klip/Sources`. `sources/klip` does not. `'klip/sources` finds the same as `klip/sources`.\n\n### 8. Ranking\n\nSort key, in order:\n\n1. tier (§6);\n2. kind rank (§4);\n3. text score plus a bounded usage boost (§9);\n4. the folded name;\n5. the stable ID.\n\nThe plan lists the fuzzy score and usage as separate steps. Combining them, with usage bounded, is what DEC-002 needs (\"usage reorders only within a match tier\"), and follows Codex's [ranking contract](../research/codex/fuzzy-matching.md#recommended-ranking-contract). If usage only broke exact score ties, it would almost never apply.\n\n- Keep the best 50 with a bounded selection, not a full sort.\n- Same query and same snapshot must always give the same order.\n\n### 9. Usage history\n\nIn `index.sqlite` in the data folder, a `usage` table: item ID, decayed count, last update. Version the schema with `PRAGMA user_version`.\n\n- **On open:** count = decayed count + 1, time = now. The clock is injected so tests can move time.\n- **Decay:** the count has a half-life of 30 days. Boost = λ × min(1, log1p(count) / log1p(20)), from Codex's contract. Pick λ with the tests, starting at 0.5, and record the value used.\n- **Bounded:** keep at most 2,000 items, dropping the lowest decayed count first.\n- Recorded only after an item actually opens. M2 calls this; M1 exposes it.\n- **Snapshot:** each search reads a usage snapshot taken before the search. An open changes the next search, never the list on screen.\n- **Rebuilds:** M3 rebuilds file entries without touching this table.\n\n### 10. Search, snapshots and generations\n\n- `SearchIndex` is immutable and `Sendable`: the prepared items in flat arrays, struct-of-arrays as in the benchmark. A data change builds a new one.\n- One search runs over one index snapshot and one usage snapshot.\n- A coordinator in Core owns submission, invalidation and delivery on one executor, and runs scoring on a serial worker. Each new query, config change or snapshot starts a new generation.\n- A search checks for cancellation between chunks and stops early when stale. An atomic flag is enough for that check; the final \"still current?\" check and the delivery happen together on the owner, so a newer request cannot slip in between.\n- Only the current generation's complete result set is delivered. A result set carries its generation and parsed query.\n- Scoring is single-threaded in M1. Tune layout, allocation and filtering first. 8 ms p95 for search alone at 200,000 items is a diagnostic target, not a trigger. If the measurements still argue for parallel scoring, bring the evidence and the CPU cost to the review instead of adding it.\n\n### 11. Tests\n\nAll in `ApparateCoreTests`, each with a temporary data folder. Fixture names are made up or are well-known app names; never the user's files.\n\n**Ranking:**\n\n- `vsc` → Visual Studio Code first, with no alias.\n- `code` → Visual Studio Code (\"Code\" is its built-in name) above a file `code-review.md`.\n- `keyboard la` → Keyboard layouts first.\n- `term` → Terminal above files `terminal-notes.md` and `term.txt` (same tier; apps first).\n- `calc` → Calculator first; `cale` → Calendar first.\n- A file in the prefix tier above an app in the fuzzy tier.\n- `re` with the items in the [rows screenshot](#visual-references): Restart, Resources, README.md, Text replacements, then Preview.\n- Same tier, same kind, same score: ordered by name, then ID, every time.\n- Duplicate app names at two paths: both listed, in a stable order.\n\n**Scopes:**\n\n- `'notes` returns only files and folders; `.dns` only settings; `?swift actors` only the web row; `?` alone returns nothing.\n- A space after the prefix is ignored.\n- With a changed prefix in the config, the old character searches normally.\n- Spaces inside a web query reach the web row unchanged.\n\n**Fallback row:**\n\n- No local match, no prefix → only the web row.\n- No match with `'`, `.` or another non-web prefix → no rows.\n- An empty query → no rows.\n- A local match → no web row.\n\n**Path mode:**\n\n- `klip/sources`, `'klip/sources`, `projects/klip/sources` and `klip/` behave as in §7.\n- `sources/klip` finds nothing; `/` alone gives no rows; `klip//sources` works like `klip/sources`.\n- `?a/b` is a web search.\n\n**Unicode:**\n\n- \"Café\" stored composed and decomposed: both are found by `cafe` and `café`, and the highlight covers the right displayed letters.\n- `strasse` finds \"Straße\".\n- A CJK name is found by its own characters.\n- Names with emoji match and highlight without crashing.\n- A 300-character name and a 100-character query match, with no cap.\n- Mask property: across many random names and queries, whenever the folded query is a subsequence, the mask passes.\n\n**Usage:**\n\n- An opened item moves up within its tier and kind, but never above a better tier or a better kind.\n- With the injected clock, the count halves after 30 days, and the boost follows the formula in §9.\n- The table stays at 2,000 items or fewer.\n- Usage survives closing and reopening the database.\n\n**Config:**\n\n- Defaults are written when the file is missing.\n- Broken JSON keeps the last valid config and reports it, and the file is left alone.\n- Each defined error is raised by a small bad file.\n- A newer version is not overwritten.\n- An external edit is picked up without polling, both written in place and saved atomically. The app's own save does not cause a reload loop.\n- Fixing a broken file clears its error.\n\n**Generations:**\n\n- With an injected slow search, a burst of queries delivers only the last one's results, and never a stale set.\n- A query superseded after its scoring finished, but before delivery, is not delivered.\n\n### 12. Measurements\n\nRun in a release build and record in the verification run:\n\n- search time per keystroke at 20,000 and 200,000 items, typing a fixed list of 10–20 queries one character at a time: median, p95 and maximum;\n- the same for path-mode queries at 200,000;\n- time to build the `SearchIndex` at both sizes;\n- `phys_footprint` after building each size.\n\nUse a seeded synthetic corpus: realistic name and path lengths, repeated folder structures, ASCII and Unicode names, and queries that match many items as well as few. Record the seed, sizes, query list and a hash of the corpus so the run can be repeated. Report preparation cost separately, and include top-50 selection and highlight output in the search time. These numbers do not claim DEC-008 compliance; M6 measures the built app on real data.\n\n## Out of scope for M1\n\n- Finding apps and settings on disk, crawling folders, FSEvents, and the file entries table (M2, M3).\n- Opening anything, URL encoding for web search, system commands (M2).\n- The hotkey, panel and any visible UI (M2, M4).\n\n## Non-visual references\n\nFrom the user's apps (read-only; do not change them):\n\n- `~/Projects/klip/Package.swift`: three targets, Core linking `sqlite3`, tests as an executable.\n- `~/Projects/klip/build.sh`: bundle layout, Info.plist, signing with a fixed designated requirement, and the version check on `VERSION`.\n- `~/Projects/klip/Tests/KlipCoreTests/Harness.swift` and `main.swift`: the test harness and temporary folders.\n- `~/Projects/klip/Sources/KlipCore/AppConfig.swift`: missing keys take defaults; atomic, sorted, pretty-printed saves. Apparate adds validation and keeps the last valid config, where Klip falls back to defaults.\n- `~/Projects/klip/Sources/Klip/AppDelegate.swift`, lines 5–12: the `KLIP_HOME` data-folder pattern for `APPARATE_HOME`.\n- `~/Projects/klip/Sources/KlipCore/Store.swift`: a small SQLite wrapper without dependencies.\n\nFrom this wiki:\n\n- [Claude's benchmark source](../research/claude/benchmark.md#source): flat prepared buffers, boundary classes, mask, fzy constants. Its ASCII folding and length caps are not for production.\n- [Codex's fuzzy matching analysis](../research/codex/fuzzy-matching.md): ranking contract, preventing jumps, golden examples.\n- [Codex's benchmark](../research/codex/benchmark.md): name versus full-path cost at 200,000.\n- [Panel latency spike](../spikes/2026-11-18-panel-latency.md): the scorer with tiers and kind order, and its races.\n\nExternal:\n\n- fzy [`match.c`](https://github.com/jhawthorn/fzy/blob/34b88869d022e861da4846c4463aea3ddfb3ff30/src/match.c) and [`ALGORITHM.md`](https://github.com/jhawthorn/fzy/blob/34b88869d022e861da4846c4463aea3ddfb3ff30/ALGORITHM.md), pinned to the commit the research read.\n- Apple: `String.folding(options:locale:)`, `Synchronization.Atomic`, `DispatchSource.makeFileSystemObjectSource`, and the SQLite C API as Klip uses it.\n\n## Visual references\n\nM1 has no UI, but its output feeds these agreed designs. Ranking and highlights must produce what they show.\n\nThe launcher with `term` ([DEC-023](../decisions.md#round-3-ui-design-spike-2026-11-18)): Terminal first.\n\n![Panel A with the query term](../attachments/2026-11-18-ui-spike/chosen--panel--a-compact--term.jpg)\n\nResult rows ([DEC-024](../decisions.md#round-3-ui-design-spike-2026-11-18)): matched letters in bold, location dimmed. Highlight positions map to these displayed letters.\n\n![Rows C with the query re](../attachments/2026-11-18-ui-spike/rows--r3-inline.jpg)\n\nNo local match: the web fallback row.\n\n![Panel A with no local match](../attachments/2026-11-18-ui-spike/chosen--panel--a-compact--nomatch.jpg)\n\nThe Search tab of the settings design ([DEC-025](../decisions.md#round-3-ui-design-spike-2026-11-18)) shows the prefix table and the search URL with `{query}`.\n\n![Settings B, toolbar tabs](../attachments/2026-11-18-ui-spike/chosen--settings-window--s2-toolbar.jpg)\n\nThe interactive prototypes are in the repository at `docs/design/`. `panel-a-compact.html` runs the prototype engine: prefixes, tiers, kind order and the fallback row. It shows the intended behaviour; do not port its code.\n\n## Proposals to confirm\n\nThese are Claude's proposals, not user decisions. Codex can accept them or push back. If they still disagree after one exchange, the question goes to the user.\n\n1. The config schema and field names in §3.\n2. Prefixes are one character, and cannot be a letter, digit, space, `/` or `~`. Scopes that can take a prefix are `apps`, `settings`, `files` (files and folders), `commands` and `web`.\n3. \"Exact\" means the whole name, so `cal` does not exactly match `cal.txt`.\n4. A fifth tier for settings keywords, below all name matches.\n5. Usage: general usage only, with no per-query learning; 30-day half-life; 2,000-item bound.\n6. The path-mode rules in §7.\n7. The stable ID formats in §4.\n\n## Pushback and answers\n\nCodex's pushback on 2026-11-18 and Claude's answers. All accepted points are folded into the sections above.\n\n| # | Codex | Claude |\n| --- | --- | --- |\n| 1 | The guide's test \"boost halves after 30 days\" contradicts its formula; the count halves. Keep scores finite, since fzy's exact score is infinity. | Accepted; Claude's error. |\n| 2 | Watch the file and the folder, not the folder alone. Clear the error when a broken file is fixed. Report a parse error alone, and value errors together. Validate the whole URL with a sample query. Detect duplicate folders lexically. | Accepted. |\n| 3 | Keep spaces inside the query. The web fallback applies only to queries without a prefix. Add a backslash escape to search a prefix character literally. | Spaces and fallback accepted. **Escape not adopted:** no established need, per `rule-lean`. Names starting with `.` are hidden and never indexed, and fuzzy matching finds `'notes` or `?draft` without the leading mark. If Codex still disagrees, it goes to the user. |\n| 4 | IDs are opaque, with escaped parts. Identity across renames is decided with the real sources. | Accepted. |\n| 5 | Accepts proposals 3 and 4. Record which name matched, with no highlights for alternate names or keywords. Update the plan's ranking wording. | Accepted; the [plan](../plan.md#m1-foundation-matching-and-ranking) is updated. |\n| 6 | Accepts the path rules, with edge cases. A separator-only query lists every indexed path. Measure the costly cases. | Edge cases and measurements accepted. **A separator-only query gives no rows,** like an empty query: listing every indexed path helps nobody. |\n| 7 | Scope the Swift 6 claim. Make the final check and delivery atomic on one owner. Single-threaded scoring; parallelism only with evidence at review. | Accepted. |\n| 8 | A seeded synthetic corpus for M1 measurements. | Accepted. |\n\n## Review\n\nClaude reviewed M1 on 2026-11-18: all of `Sources/`, `Tests/`, `build.sh`, `Package.swift`, the [verification run](../verification/runs/2026-11-18T154000Z-m1.md), the feature pages and the evidence. Claude re-ran `swift run ApparateCoreTests` independently: 20 groups passed, 0 failed. The records and evidence contain no personal names or paths.\n\n**Result: passed, with one fix.**\n\n| # | Finding | Action |\n| --- | --- | --- |\n| 1 | `build.sh` writes into an existing `build/Apparate.app` without clearing it, so a file removed from the build would survive in the bundle, and later in the release zip. | **Fix now:** remove the old bundle before assembling, as Klip's `build.sh` does. |\n| 2 | `SearchIndex` throws on a duplicate ID, so one duplicate from a real source would fail the whole index. On this Mac, Safari is reachable both through `/Applications` and its system path. | M2: sources de-duplicate before building; the throw stays as a guard. |\n| 3 | Each item keeps its full ID, name and path as strings. At 200,000 items the core read 119 MiB right after building and 56 MiB after searching. | M3: store file entries compactly (folder node plus name), and derive the path and ID when needed. Measure on real data. |\n| 4 | Path segments can match folders above the indexed folder (`users/` matches everything). | M3: ancestor chains start at the indexed folder's name, as §7 intended. |\n| 5 | When an alternate name wins (`code` → \"Code\"), the displayed name shows no bold letters, even though \"Code\" in \"Visual Studio Code\" also matches. | M4: show the displayed name's highlights when the name also matches. |\n| 6 | Any change in the data folder, including SQLite's journal files when usage is recorded, re-reads `config.json`. | Accepted: the read is small and an unchanged config does nothing. |\n\nAccepted as measured: path search at 200,000 items is 11.4 ms p95 (18.3 ms maximum), above the 8 ms diagnostic target but inside the end-to-end goal of [DEC-008](../decisions.md#round-1-2026-11-18). Revisit it in M3 with real folders.\n\n## Records\n\n- **Features:** add `features/search.md` (`FEAT-search`: parsing, scopes, matching, tiers, ranking, path mode, fallback row, usage) and `features/config.md` (`FEAT-config`), with verification recipes.\n- **Setup:** add `verification/setup.md`, covering build, test and data-folder isolation.\n- **Run:** record one run for M1 with the results table, the timings from §12, and the tested revision.\n- **Progress:** update the table in the [plan](../plan.md#progress).\n","toc":[{"id":"goal","title":"Goal","depth":2},{"id":"decisions-that-apply","title":"Decisions that apply","depth":2},{"id":"order-of-work","title":"Order of work","depth":2},{"id":"1-package-and-build","title":"1. Package and build","depth":3},{"id":"2-app-stub","title":"2. App stub","depth":3},{"id":"3-config","title":"3. Config","depth":3},{"id":"4-items","title":"4. Items","depth":3},{"id":"5-query-parsing","title":"5. Query parsing","depth":3},{"id":"6-matching","title":"6. Matching","depth":3},{"id":"7-path-mode","title":"7. Path mode","depth":3},{"id":"8-ranking","title":"8. Ranking","depth":3},{"id":"9-usage-history","title":"9. Usage history","depth":3},{"id":"10-search-snapshots-and-generations","title":"10. Search, snapshots and generations","depth":3},{"id":"11-tests","title":"11. Tests","depth":3},{"id":"12-measurements","title":"12. Measurements","depth":3},{"id":"out-of-scope-for-m1","title":"Out of scope for M1","depth":2},{"id":"non-visual-references","title":"Non-visual references","depth":2},{"id":"visual-references","title":"Visual references","depth":2},{"id":"proposals-to-confirm","title":"Proposals to confirm","depth":2},{"id":"pushback-and-answers","title":"Pushback and answers","depth":2},{"id":"review","title":"Review","depth":2},{"id":"records","title":"Records","depth":2}],"titleAnchor":"m1-guide-foundation-matching-and-ranking","links":["decisions","plan","build/m1-foundation","build/m1-foundation","build/m1-foundation","decisions","requirements","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","build/m1-foundation","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","decisions","build/m1-foundation","build/m1-foundation","build/m1-foundation","build/m1-foundation","decisions","decisions","research/codex/fuzzy-matching","build/m1-foundation","research/claude/benchmark","research/codex/fuzzy-matching","research/codex/benchmark","spikes/2026-11-18-panel-latency","decisions","decisions","decisions","plan","verification/runs/2026-11-18T154000Z-m1","decisions","plan"],"attachments":[{"path":"attachments/2026-11-18-ui-spike/chosen--panel--a-compact--term.jpg","sha256":"782be0693115949976ed4e5a0b81ab6612f4f5af371da1591286d2ceb366e407"},{"path":"attachments/2026-11-18-ui-spike/rows--r3-inline.jpg","sha256":"8ecc49f1359c9f627728d7c7be3be43227d349ff0879f4485f3ac2b77584a53c"},{"path":"attachments/2026-11-18-ui-spike/chosen--panel--a-compact--nomatch.jpg","sha256":"e6bdacb7782866ffa60b86dfdd83a7e1a3f0d3357e7a6a8bc7dd78f783e6d9d5"},{"path":"attachments/2026-11-18-ui-spike/chosen--settings-window--s2-toolbar.jpg","sha256":"a32b36392d31e1bc7b8ed09a8e14be4556d67ac4b0d58ff8d255ca048a178fb1"}],"html":"\u003cp>Written by Claude for Codex, who builds M1 (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-036\u003c/a>). The scope comes from \u003ca href=\"#/plan~m1-foundation-matching-and-ranking\">M1 in the plan\u003c/a>. This guide adds the detail, the order of work, and references. Where it proposes something the user has not decided, it says so under \u003ca href=\"#/build/m1-foundation~proposals-to-confirm\">Proposals to confirm\u003c/a>. Codex's pushback of 2026-11-18 is folded in; see \u003ca href=\"#/build/m1-foundation~pushback-and-answers\">Pushback and answers\u003c/a>.\u003c/p>\n\u003ch2 id=\"goal\">Goal\u003c/h2>\n\u003cp>A headless core that can take a typed query and return the right results, in the right order, fast. No real data sources yet: M1 works on items given to it. The app target only proves that the bundle builds, signs and finds its data folder.\u003c/p>\n\u003cp>M1 is done when:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>./build.sh\u003c/code> builds a signed \u003ccode>build/Apparate.app\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>swift run ApparateCoreTests\u003c/code> passes, covering every test listed \u003ca href=\"#/build/m1-foundation~11-tests\">below\u003c/a>.\u003c/li>\n\u003cli>A verification run with search timings and memory at 20,000 and 200,000 items is recorded in the wiki.\u003c/li>\n\u003cli>Claude's review has passed, and the milestone is one commit.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"decisions-that-apply\">Decisions that apply\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Decision\u003c/th>\n\u003cth>What it means for M1\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>\u003ca href=\"#/decisions~round-1-2026-11-18\">DEC-001\u003c/a>\u003c/td>\n\u003ctd>A query without a prefix searches apps, settings, folders and files. System commands are included too (\u003ca href=\"#/requirements\">REQ-010\u003c/a>).\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/decisions~round-1-2026-11-18\">DEC-002\u003c/a>\u003c/td>\n\u003ctd>Equal matches rank apps &gt; settings &gt; folders &gt; files. Usage reorders only within a tier.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/decisions~round-1-2026-11-18\">DEC-003\u003c/a>\u003c/td>\n\u003ctd>Settings are saved to an editable, versioned JSON file.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/decisions~round-1-2026-11-18\">DEC-005\u003c/a>, \u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-020\u003c/a>\u003c/td>\n\u003ctd>Default folders \u003ccode>~/Projects\u003c/code>, \u003ccode>~/Desktop\u003c/code>, \u003ccode>~/Documents\u003c/code>, \u003ccode>~/Downloads\u003c/code>, each with depth 10.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/decisions~round-1-2026-11-18\">DEC-004\u003c/a>\u003c/td>\n\u003ctd>Default hotkey ⌘Space, stored in the config.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-016\u003c/a>\u003c/td>\n\u003ctd>No user aliases or pinned results.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-017\u003c/a>, \u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-018\u003c/a>\u003c/td>\n\u003ctd>The web fallback row appears when nothing local matches. The default search URL is \u003ccode>https://duckduckgo.com/?q={query}\u003c/code>, as in the \u003ca href=\"#/build/m1-foundation~visual-references\">settings design\u003c/a>.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-021\u003c/a>\u003c/td>\n\u003ctd>The menu bar icon can be hidden: a config switch, on by default.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-028\u003c/a>\u003c/td>\n\u003ctd>The DEC-008 budgets are goals. Measure search time from M1 on.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-030\u003c/a>, \u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-032\u003c/a>\u003c/td>\n\u003ctd>Default prefixes are \u003ccode>'\u003c/code> files and folders, \u003ccode>.\u003c/code> settings and \u003ccode>?\u003c/code> web. DEC-032 (no others) is provisional: round 5 asks again. Keep the defaults in one place so one can be added cheaply.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-031\u003c/a>\u003c/td>\n\u003ctd>A query containing \u003ccode>/\u003c/code> searches full paths.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-033\u003c/a>\u003c/td>\n\u003ctd>A config switch for \u003ccode>.gitignore\u003c/code> handling, on by default. M3 uses it.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>\u003ca href=\"#/decisions~round-1-2026-11-18\">DEC-010\u003c/a>, \u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-013\u003c/a>, \u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-014\u003c/a>\u003c/td>\n\u003ctd>macOS 27, SwiftPM plus \u003ccode>build.sh\u003c/code>, ad-hoc signed with a fixed designated requirement.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"order-of-work\">Order of work\u003c/h2>\n\u003ch3 id=\"1-package-and-build\">1. Package and build\u003c/h3>\n\u003cp>Copy Klip's layout (\u003ca href=\"#/build/m1-foundation~non-visual-references\">references\u003c/a>), with these changes:\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>// swift-tools-version: 6.4\u003c/code> and \u003ccode>platforms: [.macOS(.v27)]\u003c/code>. Checked on this Mac: \u003ccode>.v27\u003c/code> needs tools version 6.4, and Swift 6.4.2 builds it. Swift 6 language mode is on, so the compiler rejects most data races in safe Swift. The latency spike had two races in shared state, so this is worth its friction. Unsafe pointers, the SQLite C boundary and anything marked \u003ccode>@unchecked Sendable\u003c/code> still need clear ownership.\u003c/li>\n\u003cli>Targets: \u003ccode>ApparateCore\u003c/code> (library, links \u003ccode>sqlite3\u003c/code>), \u003ccode>Apparate\u003c/code> (executable), \u003ccode>ApparateCoreTests\u003c/code> (executable, Klip's harness).\u003c/li>\n\u003cli>\u003ccode>VERSION\u003c/code> holds \u003ccode>0.1.0\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>build.sh\u003c/code> builds \u003cstrong>arm64 only\u003c/strong>: no x86_64 slice, no \u003ccode>lipo\u003c/code>. The Info.plist has \u003ccode>CFBundleIdentifier\u003c/code> \u003ccode>local.apparate\u003c/code>, \u003ccode>LSMinimumSystemVersion\u003c/code> \u003ccode>27.0\u003c/code> and \u003ccode>LSUIElement\u003c/code> true. Sign with \u003ccode>--requirements '=designated =&gt; identifier \"local.apparate\"'\u003c/code>, then verify. Leave out the icon lines until M7.\u003c/li>\n\u003cli>\u003ccode>.gitignore\u003c/code>: \u003ccode>.build/\u003c/code>, \u003ccode>build/\u003c/code>, \u003ccode>.swiftpm/\u003c/code>, \u003ccode>.DS_Store\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"2-app-stub\">2. App stub\u003c/h3>\n\u003cp>\u003ccode>main.swift\u003c/code> and a small \u003ccode>AppDelegate\u003c/code>, as in Klip:\u003c/p>\n\u003cul>\n\u003cli>the accessory activation policy;\u003c/li>\n\u003cli>the data folder: \u003ccode>APPARATE_HOME\u003c/code> if set and not empty, else \u003ccode>~/Library/Application Support/Apparate/\u003c/code>;\u003c/li>\n\u003cli>it loads the config, which writes the defaults on first launch, and logs any config error.\u003c/li>\n\u003c/ul>\n\u003cp>Nothing else. \u003ccode>APPARATE_SHOW\u003c/code>, the hotkey and the panel come in M2.\u003c/p>\n\u003ch3 id=\"3-config\">3. Config\u003c/h3>\n\u003cp>\u003ccode>config.json\u003c/code> in the data folder. Proposed version 1, with defaults:\u003c/p>\n\u003cpre>\u003ccode class=\"language-json\">{\n  \"version\": 1,\n  \"hotKey\": { \"keyCode\": 49, \"modifiers\": 256, \"display\": \"⌘Space\" },\n  \"showMenuBarIcon\": true,\n  \"prefixes\": { \"files\": \"'\", \"settings\": \".\", \"web\": \"?\" },\n  \"searchURL\": \"https://duckduckgo.com/?q={query}\",\n  \"folders\": [\n    { \"path\": \"~/Projects\", \"depth\": 10 },\n    { \"path\": \"~/Desktop\", \"depth\": 10 },\n    { \"path\": \"~/Documents\", \"depth\": 10 },\n    { \"path\": \"~/Downloads\", \"depth\": 10 }\n  ],\n  \"respectGitignore\": true\n}\n\u003c/code>\u003c/pre>\n\u003cul>\n\u003cli>\u003cstrong>Not in the config:\u003c/strong> launch at login. \u003ccode>SMAppService\u003c/code> holds that state, and M5 shows it. The search engine menu in settings is a set of presets that fill \u003ccode>searchURL\u003c/code>; only the URL is stored.\u003c/li>\n\u003cli>\u003cstrong>Missing keys\u003c/strong> take their defaults, as in Klip's \u003ccode>AppConfig\u003c/code>. Unknown keys are ignored.\u003c/li>\n\u003cli>\u003cstrong>Missing file:\u003c/strong> write the defaults, so the user can find and edit it.\u003c/li>\n\u003cli>\u003cstrong>Invalid file:\u003c/strong> keep the last valid config, report the errors, and never overwrite the broken file. At launch, \"last valid\" means the defaults. The whole file is accepted or rejected. A partly applied config would be harder to understand.\u003cul>\n\u003cli>JSON that does not parse, or has a wrong type, reports that one error.\u003c/li>\n\u003cli>A file that parses reports all its value errors together.\u003c/li>\n\u003cli>When a broken file is fixed, its error clears, even if the fixed config equals the current one.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cstrong>Newer version:\u003c/strong> if \u003ccode>version\u003c/code> is higher than the app knows, treat the file as invalid and never write over it.\u003c/li>\n\u003cli>\u003cstrong>Migration:\u003c/strong> version 1 is the only version, so there is no migration code yet. The version check above is the whole mechanism until a version 2 exists.\u003c/li>\n\u003cli>\u003cstrong>Saving:\u003c/strong> pretty-printed with sorted keys, written atomically.\u003c/li>\n\u003cli>\u003cstrong>Reloading:\u003c/strong> dispatch sources, not polling. Watch the file for writes, and the data folder for the file being replaced or deleted; re-arm the file watch after a replacement. A watch on the folder alone misses in-place edits, and a watch on the file alone misses atomic saves. On a change, read the file again. If the decoded config equals the current one, do nothing. That also covers the app's own saves.\u003c/li>\n\u003c/ul>\n\u003cp>Defined errors, each with a message the M5 settings window can show as is:\u003c/p>\n\u003cul>\n\u003cli>a prefix that is empty, more than one character, or a letter, digit, whitespace or control character, \u003ccode>/\u003c/code> or \u003ccode>~\u003c/code> (see \u003ca href=\"#/build/m1-foundation~proposals-to-confirm\">proposals\u003c/a>);\u003c/li>\n\u003cli>two scopes with the same prefix;\u003c/li>\n\u003cli>a prefix for an unknown scope;\u003c/li>\n\u003cli>a folder path that is not absolute after \u003ccode>~\u003c/code> is expanded, or that appears twice after lexical normalization (no disk access);\u003c/li>\n\u003cli>a depth outside 1–30;\u003c/li>\n\u003cli>a search URL that does not contain \u003ccode>{query}\u003c/code> exactly once, or that is not a complete \u003ccode>http\u003c/code> or \u003ccode>https\u003c/code> URL with a host once a sample query is put in its place;\u003c/li>\n\u003cli>JSON that does not parse, or a value of the wrong type.\u003c/li>\n\u003c/ul>\n\u003cp>A folder that does not exist is not a config error. M3 reports it as unavailable.\u003c/p>\n\u003ch3 id=\"4-items\">4. Items\u003c/h3>\n\u003cp>One item model for every kind:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Kind\u003c/th>\n\u003cth>Rank\u003c/th>\n\u003cth>Stable ID (proposal)\u003c/th>\n\u003cth>Searchable text\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>app\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>\u003ccode>app:\u003c/code> + bundle path\u003c/td>\n\u003ctd>display name, plus built-in alternate names\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>command\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>\u003ccode>command:lock\u003c/code>, \u003ccode>command:sleep\u003c/code>, \u003ccode>command:restart\u003c/code>, \u003ccode>command:trash\u003c/code>\u003c/td>\n\u003ctd>name\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>setting\u003c/td>\n\u003ctd>1\u003c/td>\n\u003ctd>\u003ccode>setting:\u003c/code> + pane bundle ID + \u003ccode>?\u003c/code> + anchor + \u003ccode>#\u003c/code> + title\u003c/td>\n\u003ctd>title, plus keywords\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>folder\u003c/td>\n\u003ctd>2\u003c/td>\n\u003ctd>\u003ccode>folder:\u003c/code> + absolute path\u003c/td>\n\u003ctd>name, plus path in path mode\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>file\u003c/td>\n\u003ctd>3\u003c/td>\n\u003ctd>\u003ccode>file:\u003c/code> + absolute path\u003c/td>\n\u003ctd>name, plus path in path mode\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>web\u003c/td>\n\u003ctd>—\u003c/td>\n\u003ctd>\u003ccode>web\u003c/code>\u003c/td>\n\u003ctd>not searched\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cul>\n\u003cli>One anchor can carry several titles, so a settings ID includes the title. Escape or length-prefix the parts so that no two items can produce the same ID.\u003c/li>\n\u003cli>IDs are opaque: nothing parses an ID to decide how to open an item.\u003c/li>\n\u003cli>Duplicate apps at different paths are different items.\u003c/li>\n\u003cli>These formats are for M1. Whether an ID survives a rename, a move or a language change is decided with the real sources in M2 and M3; M1 promises nothing about it.\u003c/li>\n\u003cli>Commands rank like apps (plan, M2).\u003c/li>\n\u003cli>In M1, items come from test fixtures. M2 and M3 add the real sources.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"5-query-parsing\">5. Query parsing\u003c/h3>\n\u003col>\n\u003cli>Trim leading and trailing whitespace. Keep the spaces inside the query as typed: a web search sends them unchanged. Matching splits the text into words separately.\u003c/li>\n\u003cli>If the first character is a configured prefix, the scope is that prefix's scope. The rest of the query, with any leading spaces trimmed, is the search text. There is no escape for searching a prefix character literally (see \u003ca href=\"#/build/m1-foundation~pushback-and-answers\">pushback\u003c/a>).\u003c/li>\n\u003cli>Otherwise the scope is everything: apps, commands, settings, folders and files.\u003c/li>\n\u003cli>\u003cstrong>Web scope:\u003c/strong> the result is one web row for the text. An empty text gives no rows. An empty query is never a web search.\u003c/li>\n\u003cli>\u003cstrong>Fallback row:\u003c/strong> only for a query without a prefix that matches nothing. A query with a files, settings, apps or commands prefix that matches nothing shows no rows.\u003c/li>\n\u003cli>\u003cstrong>Path mode:\u003c/strong> if the scope includes files or folders and the text contains \u003ccode>/\u003c/code>, search files and folders by path (\u003ca href=\"#/build/m1-foundation~7-path-mode\">§7\u003c/a>). An explicit prefix is applied first, so \u003ccode>?a/b\u003c/code> stays a web search.\u003c/li>\n\u003cli>Return the parsed query as a value, so tests and the panel can see the scope and mode.\u003c/li>\n\u003c/ol>\n\u003ch3 id=\"6-matching\">6. Matching\u003c/h3>\n\u003cp>Follow the plan: names first, fzy-style, with a character mask and a subsequence check before scoring.\u003c/p>\n\u003cp>\u003cstrong>Prepared text,\u003c/strong> built once per item when the snapshot is built, never per keystroke:\u003c/p>\n\u003cul>\n\u003cli>Fold each displayed character case-, diacritic- and width-insensitively (\u003ccode>String.folding(options:locale:)\u003c/code> with a \u003ccode>nil\u003c/code> locale). Store the folded Unicode scalars, and for each one the index of the displayed character it came from. One displayed character can fold to several scalars (\u003ccode>ß\u003c/code> → \u003ccode>ss\u003c/code>), so the map is per scalar.\u003c/li>\n\u003cli>ASCII names can take a fast path: lowercased bytes, one per character.\u003c/li>\n\u003cli>Word-boundary classes come from the \u003cstrong>original\u003c/strong> characters, before folding: start of name, after a space, \u003ccode>-\u003c/code>, \u003ccode>_\u003c/code>, \u003ccode>/\u003c/code> or \u003ccode>.\u003c/code>, and camel-case humps. This is how \u003ccode>VSC\u003c/code> matches Visual Studio Code without an alias.\u003c/li>\n\u003cli>A 64-bit mask: one bit each for \u003ccode>a\u003c/code>–\u003ccode>z\u003c/code> and \u003ccode>0\u003c/code>–\u003ccode>9\u003c/code>, and the remaining 28 bits for every other scalar by \u003ccode>scalar % 28\u003c/code>. The query's mask is built the same way. A candidate is skipped only if it lacks a bit the query has, so the mask can give false positives but never hide a real match. Test that property.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Scoring:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Run the subsequence check, then fzy's dynamic-programming score: consecutive, word-start, camel-case and after-dot bonuses, and gap penalties, as in fzy's \u003ccode>match.c\u003c/code>.\u003c/li>\n\u003cli>No length limits. The benchmark's 255-byte and 32-character caps must not come along. Per-worker scratch rows grow to the longest name and query seen.\u003c/li>\n\u003cli>Highlight positions (fzy's traceback) only for results that are published, mapped back to displayed characters for the bold letters in \u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-024\u003c/a>.\u003c/li>\n\u003cli>A result records what matched: the displayed name, an alternate name or a keyword. Only a match on the displayed name gets highlights. An alternate-name or keyword match shows the title without bold letters.\u003c/li>\n\u003cli>Scores stay finite. fzy returns infinity for an exact match; here the tier carries \"exact\", and the score is a finite number, so usage and path scores still add.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Tiers,\u003c/strong> best first. Each item takes its best tier across its name and alternate names:\u003c/p>\n\u003col>\n\u003cli>\u003cstrong>Exact:\u003c/strong> the folded query equals the folded name.\u003c/li>\n\u003cli>\u003cstrong>Prefix:\u003c/strong> the name starts with the query.\u003c/li>\n\u003cli>\u003cstrong>Word:\u003c/strong> each query word is a prefix of a name word, in order (\u003ccode>keyboard la\u003c/code> → Keyboard layouts); or the best alignment puts every query character on a word start or camel hump (\u003ccode>vsc\u003c/code>, \u003ccode>gc\u003c/code>); or the query is a prefix of any name word after the first (\u003ccode>code\u003c/code> → Visual Studio Code).\u003c/li>\n\u003cli>\u003cstrong>Fuzzy:\u003c/strong> any other subsequence of the name.\u003c/li>\n\u003cli>\u003cstrong>Keyword:\u003c/strong> for settings, the query, or each query word, is a prefix of one of the item's keywords. This tier ranks below every name match.\u003c/li>\n\u003c/ol>\n\u003cp>The interactive prototype ranks a match inside a word (Preview for \u003ccode>re\u003c/code>) above a match at a word start (Text replacements). That differs from these rules. This guide is the reference, not the prototype.\u003c/p>\n\u003ch3 id=\"7-path-mode\">7. Path mode\u003c/h3>\n\u003cp>Proposed rules for \u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-031\u003c/a>:\u003c/p>\n\u003cul>\n\u003cli>Split the text on \u003ccode>/\u003c/code>, ignoring empty segments between separators. A leading \u003ccode>/\u003c/code> or \u003ccode>~/\u003c/code> is dropped in v1, with no anchoring. This is fuzzy path search, not lookup of an exact path.\u003c/li>\n\u003cli>A query of only separators (\u003ccode>/\u003c/code>) gives no rows, like an empty query.\u003c/li>\n\u003cli>The \u003cstrong>last segment\u003c/strong> matches the item's name, using the tiers above. If it is empty (\u003ccode>klip/\u003c/code>), any name matches: everything under the matched folders.\u003c/li>\n\u003cli>Each \u003cstrong>earlier segment\u003c/strong> must fuzzy-match a different folder in the item's path, in order. The folders need not be next to each other. The indexed folder's own name counts, so \u003ccode>projects/klip/sources\u003c/code> works.\u003c/li>\n\u003cli>\u003cstrong>Score:\u003c/strong> the name's score plus each segment's score, with a bonus when matched folders are adjacent.\u003c/li>\n\u003cli>\u003cstrong>Order:\u003c/strong> tier from the last segment, then kind, then score.\u003c/li>\n\u003cli>\u003cstrong>Cost:\u003c/strong> match names first, then check the parent folders only for names that passed. Never score every full path; Codex's benchmark measured 44 ms median for that at 200k. An empty last segment (\u003ccode>klip/\u003c/code>) skips the name filter, so it is the costly case: measure it, along with short common segments and segments that match nothing. Cache folder-segment work only if the measurements call for it.\u003c/li>\n\u003c/ul>\n\u003cp>Examples: \u003ccode>klip/sources\u003c/code> finds \u003ccode>~/Projects/klip/Sources\u003c/code>. \u003ccode>sources/klip\u003c/code> does not. \u003ccode>'klip/sources\u003c/code> finds the same as \u003ccode>klip/sources\u003c/code>.\u003c/p>\n\u003ch3 id=\"8-ranking\">8. Ranking\u003c/h3>\n\u003cp>Sort key, in order:\u003c/p>\n\u003col>\n\u003cli>tier (§6);\u003c/li>\n\u003cli>kind rank (§4);\u003c/li>\n\u003cli>text score plus a bounded usage boost (§9);\u003c/li>\n\u003cli>the folded name;\u003c/li>\n\u003cli>the stable ID.\u003c/li>\n\u003c/ol>\n\u003cp>The plan lists the fuzzy score and usage as separate steps. Combining them, with usage bounded, is what DEC-002 needs (\"usage reorders only within a match tier\"), and follows Codex's \u003ca href=\"#/research/codex/fuzzy-matching~recommended-ranking-contract\">ranking contract\u003c/a>. If usage only broke exact score ties, it would almost never apply.\u003c/p>\n\u003cul>\n\u003cli>Keep the best 50 with a bounded selection, not a full sort.\u003c/li>\n\u003cli>Same query and same snapshot must always give the same order.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"9-usage-history\">9. Usage history\u003c/h3>\n\u003cp>In \u003ccode>index.sqlite\u003c/code> in the data folder, a \u003ccode>usage\u003c/code> table: item ID, decayed count, last update. Version the schema with \u003ccode>PRAGMA user_version\u003c/code>.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>On open:\u003c/strong> count = decayed count + 1, time = now. The clock is injected so tests can move time.\u003c/li>\n\u003cli>\u003cstrong>Decay:\u003c/strong> the count has a half-life of 30 days. Boost = λ × min(1, log1p(count) / log1p(20)), from Codex's contract. Pick λ with the tests, starting at 0.5, and record the value used.\u003c/li>\n\u003cli>\u003cstrong>Bounded:\u003c/strong> keep at most 2,000 items, dropping the lowest decayed count first.\u003c/li>\n\u003cli>Recorded only after an item actually opens. M2 calls this; M1 exposes it.\u003c/li>\n\u003cli>\u003cstrong>Snapshot:\u003c/strong> each search reads a usage snapshot taken before the search. An open changes the next search, never the list on screen.\u003c/li>\n\u003cli>\u003cstrong>Rebuilds:\u003c/strong> M3 rebuilds file entries without touching this table.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"10-search-snapshots-and-generations\">10. Search, snapshots and generations\u003c/h3>\n\u003cul>\n\u003cli>\u003ccode>SearchIndex\u003c/code> is immutable and \u003ccode>Sendable\u003c/code>: the prepared items in flat arrays, struct-of-arrays as in the benchmark. A data change builds a new one.\u003c/li>\n\u003cli>One search runs over one index snapshot and one usage snapshot.\u003c/li>\n\u003cli>A coordinator in Core owns submission, invalidation and delivery on one executor, and runs scoring on a serial worker. Each new query, config change or snapshot starts a new generation.\u003c/li>\n\u003cli>A search checks for cancellation between chunks and stops early when stale. An atomic flag is enough for that check; the final \"still current?\" check and the delivery happen together on the owner, so a newer request cannot slip in between.\u003c/li>\n\u003cli>Only the current generation's complete result set is delivered. A result set carries its generation and parsed query.\u003c/li>\n\u003cli>Scoring is single-threaded in M1. Tune layout, allocation and filtering first. 8 ms p95 for search alone at 200,000 items is a diagnostic target, not a trigger. If the measurements still argue for parallel scoring, bring the evidence and the CPU cost to the review instead of adding it.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"11-tests\">11. Tests\u003c/h3>\n\u003cp>All in \u003ccode>ApparateCoreTests\u003c/code>, each with a temporary data folder. Fixture names are made up or are well-known app names; never the user's files.\u003c/p>\n\u003cp>\u003cstrong>Ranking:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>vsc\u003c/code> → Visual Studio Code first, with no alias.\u003c/li>\n\u003cli>\u003ccode>code\u003c/code> → Visual Studio Code (\"Code\" is its built-in name) above a file \u003ccode>code-review.md\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>keyboard la\u003c/code> → Keyboard layouts first.\u003c/li>\n\u003cli>\u003ccode>term\u003c/code> → Terminal above files \u003ccode>terminal-notes.md\u003c/code> and \u003ccode>term.txt\u003c/code> (same tier; apps first).\u003c/li>\n\u003cli>\u003ccode>calc\u003c/code> → Calculator first; \u003ccode>cale\u003c/code> → Calendar first.\u003c/li>\n\u003cli>A file in the prefix tier above an app in the fuzzy tier.\u003c/li>\n\u003cli>\u003ccode>re\u003c/code> with the items in the \u003ca href=\"#/build/m1-foundation~visual-references\">rows screenshot\u003c/a>: Restart, Resources, README.md, Text replacements, then Preview.\u003c/li>\n\u003cli>Same tier, same kind, same score: ordered by name, then ID, every time.\u003c/li>\n\u003cli>Duplicate app names at two paths: both listed, in a stable order.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Scopes:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>'notes\u003c/code> returns only files and folders; \u003ccode>.dns\u003c/code> only settings; \u003ccode>?swift actors\u003c/code> only the web row; \u003ccode>?\u003c/code> alone returns nothing.\u003c/li>\n\u003cli>A space after the prefix is ignored.\u003c/li>\n\u003cli>With a changed prefix in the config, the old character searches normally.\u003c/li>\n\u003cli>Spaces inside a web query reach the web row unchanged.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Fallback row:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>No local match, no prefix → only the web row.\u003c/li>\n\u003cli>No match with \u003ccode>'\u003c/code>, \u003ccode>.\u003c/code> or another non-web prefix → no rows.\u003c/li>\n\u003cli>An empty query → no rows.\u003c/li>\n\u003cli>A local match → no web row.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Path mode:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>klip/sources\u003c/code>, \u003ccode>'klip/sources\u003c/code>, \u003ccode>projects/klip/sources\u003c/code> and \u003ccode>klip/\u003c/code> behave as in §7.\u003c/li>\n\u003cli>\u003ccode>sources/klip\u003c/code> finds nothing; \u003ccode>/\u003c/code> alone gives no rows; \u003ccode>klip//sources\u003c/code> works like \u003ccode>klip/sources\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>?a/b\u003c/code> is a web search.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Unicode:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>\"Café\" stored composed and decomposed: both are found by \u003ccode>cafe\u003c/code> and \u003ccode>café\u003c/code>, and the highlight covers the right displayed letters.\u003c/li>\n\u003cli>\u003ccode>strasse\u003c/code> finds \"Straße\".\u003c/li>\n\u003cli>A CJK name is found by its own characters.\u003c/li>\n\u003cli>Names with emoji match and highlight without crashing.\u003c/li>\n\u003cli>A 300-character name and a 100-character query match, with no cap.\u003c/li>\n\u003cli>Mask property: across many random names and queries, whenever the folded query is a subsequence, the mask passes.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Usage:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>An opened item moves up within its tier and kind, but never above a better tier or a better kind.\u003c/li>\n\u003cli>With the injected clock, the count halves after 30 days, and the boost follows the formula in §9.\u003c/li>\n\u003cli>The table stays at 2,000 items or fewer.\u003c/li>\n\u003cli>Usage survives closing and reopening the database.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Config:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>Defaults are written when the file is missing.\u003c/li>\n\u003cli>Broken JSON keeps the last valid config and reports it, and the file is left alone.\u003c/li>\n\u003cli>Each defined error is raised by a small bad file.\u003c/li>\n\u003cli>A newer version is not overwritten.\u003c/li>\n\u003cli>An external edit is picked up without polling, both written in place and saved atomically. The app's own save does not cause a reload loop.\u003c/li>\n\u003cli>Fixing a broken file clears its error.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cstrong>Generations:\u003c/strong>\u003c/p>\n\u003cul>\n\u003cli>With an injected slow search, a burst of queries delivers only the last one's results, and never a stale set.\u003c/li>\n\u003cli>A query superseded after its scoring finished, but before delivery, is not delivered.\u003c/li>\n\u003c/ul>\n\u003ch3 id=\"12-measurements\">12. Measurements\u003c/h3>\n\u003cp>Run in a release build and record in the verification run:\u003c/p>\n\u003cul>\n\u003cli>search time per keystroke at 20,000 and 200,000 items, typing a fixed list of 10–20 queries one character at a time: median, p95 and maximum;\u003c/li>\n\u003cli>the same for path-mode queries at 200,000;\u003c/li>\n\u003cli>time to build the \u003ccode>SearchIndex\u003c/code> at both sizes;\u003c/li>\n\u003cli>\u003ccode>phys_footprint\u003c/code> after building each size.\u003c/li>\n\u003c/ul>\n\u003cp>Use a seeded synthetic corpus: realistic name and path lengths, repeated folder structures, ASCII and Unicode names, and queries that match many items as well as few. Record the seed, sizes, query list and a hash of the corpus so the run can be repeated. Report preparation cost separately, and include top-50 selection and highlight output in the search time. These numbers do not claim DEC-008 compliance; M6 measures the built app on real data.\u003c/p>\n\u003ch2 id=\"out-of-scope-for-m1\">Out of scope for M1\u003c/h2>\n\u003cul>\n\u003cli>Finding apps and settings on disk, crawling folders, FSEvents, and the file entries table (M2, M3).\u003c/li>\n\u003cli>Opening anything, URL encoding for web search, system commands (M2).\u003c/li>\n\u003cli>The hotkey, panel and any visible UI (M2, M4).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"non-visual-references\">Non-visual references\u003c/h2>\n\u003cp>From the user's apps (read-only; do not change them):\u003c/p>\n\u003cul>\n\u003cli>\u003ccode>~/Projects/klip/Package.swift\u003c/code>: three targets, Core linking \u003ccode>sqlite3\u003c/code>, tests as an executable.\u003c/li>\n\u003cli>\u003ccode>~/Projects/klip/build.sh\u003c/code>: bundle layout, Info.plist, signing with a fixed designated requirement, and the version check on \u003ccode>VERSION\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>~/Projects/klip/Tests/KlipCoreTests/Harness.swift\u003c/code> and \u003ccode>main.swift\u003c/code>: the test harness and temporary folders.\u003c/li>\n\u003cli>\u003ccode>~/Projects/klip/Sources/KlipCore/AppConfig.swift\u003c/code>: missing keys take defaults; atomic, sorted, pretty-printed saves. Apparate adds validation and keeps the last valid config, where Klip falls back to defaults.\u003c/li>\n\u003cli>\u003ccode>~/Projects/klip/Sources/Klip/AppDelegate.swift\u003c/code>, lines 5–12: the \u003ccode>KLIP_HOME\u003c/code> data-folder pattern for \u003ccode>APPARATE_HOME\u003c/code>.\u003c/li>\n\u003cli>\u003ccode>~/Projects/klip/Sources/KlipCore/Store.swift\u003c/code>: a small SQLite wrapper without dependencies.\u003c/li>\n\u003c/ul>\n\u003cp>From this wiki:\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/research/claude/benchmark~source\">Claude's benchmark source\u003c/a>: flat prepared buffers, boundary classes, mask, fzy constants. Its ASCII folding and length caps are not for production.\u003c/li>\n\u003cli>\u003ca href=\"#/research/codex/fuzzy-matching\">Codex's fuzzy matching analysis\u003c/a>: ranking contract, preventing jumps, golden examples.\u003c/li>\n\u003cli>\u003ca href=\"#/research/codex/benchmark\">Codex's benchmark\u003c/a>: name versus full-path cost at 200,000.\u003c/li>\n\u003cli>\u003ca href=\"#/spikes/2026-11-18-panel-latency\">Panel latency spike\u003c/a>: the scorer with tiers and kind order, and its races.\u003c/li>\n\u003c/ul>\n\u003cp>External:\u003c/p>\n\u003cul>\n\u003cli>fzy \u003ca href=\"https://github.com/jhawthorn/fzy/blob/34b88869d022e861da4846c4463aea3ddfb3ff30/src/match.c\" rel=\"noreferrer\">\u003ccode>match.c\u003c/code>\u003c/a> and \u003ca href=\"https://github.com/jhawthorn/fzy/blob/34b88869d022e861da4846c4463aea3ddfb3ff30/ALGORITHM.md\" rel=\"noreferrer\">\u003ccode>ALGORITHM.md\u003c/code>\u003c/a>, pinned to the commit the research read.\u003c/li>\n\u003cli>Apple: \u003ccode>String.folding(options:locale:)\u003c/code>, \u003ccode>Synchronization.Atomic\u003c/code>, \u003ccode>DispatchSource.makeFileSystemObjectSource\u003c/code>, and the SQLite C API as Klip uses it.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"visual-references\">Visual references\u003c/h2>\n\u003cp>M1 has no UI, but its output feeds these agreed designs. Ranking and highlights must produce what they show.\u003c/p>\n\u003cp>The launcher with \u003ccode>term\u003c/code> (\u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-023\u003c/a>): Terminal first.\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/chosen--panel--a-compact--term.jpg\" alt=\"Panel A with the query term\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>Result rows (\u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-024\u003c/a>): matched letters in bold, location dimmed. Highlight positions map to these displayed letters.\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/rows--r3-inline.jpg\" alt=\"Rows C with the query re\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>No local match: the web fallback row.\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/chosen--panel--a-compact--nomatch.jpg\" alt=\"Panel A with no local match\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>The Search tab of the settings design (\u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-025\u003c/a>) shows the prefix table and the search URL with \u003ccode>{query}\u003c/code>.\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/chosen--settings-window--s2-toolbar.jpg\" alt=\"Settings B, toolbar tabs\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>The interactive prototypes are in the repository at \u003ccode>docs/design/\u003c/code>. \u003ccode>panel-a-compact.html\u003c/code> runs the prototype engine: prefixes, tiers, kind order and the fallback row. It shows the intended behaviour; do not port its code.\u003c/p>\n\u003ch2 id=\"proposals-to-confirm\">Proposals to confirm\u003c/h2>\n\u003cp>These are Claude's proposals, not user decisions. Codex can accept them or push back. If they still disagree after one exchange, the question goes to the user.\u003c/p>\n\u003col>\n\u003cli>The config schema and field names in §3.\u003c/li>\n\u003cli>Prefixes are one character, and cannot be a letter, digit, space, \u003ccode>/\u003c/code> or \u003ccode>~\u003c/code>. Scopes that can take a prefix are \u003ccode>apps\u003c/code>, \u003ccode>settings\u003c/code>, \u003ccode>files\u003c/code> (files and folders), \u003ccode>commands\u003c/code> and \u003ccode>web\u003c/code>.\u003c/li>\n\u003cli>\"Exact\" means the whole name, so \u003ccode>cal\u003c/code> does not exactly match \u003ccode>cal.txt\u003c/code>.\u003c/li>\n\u003cli>A fifth tier for settings keywords, below all name matches.\u003c/li>\n\u003cli>Usage: general usage only, with no per-query learning; 30-day half-life; 2,000-item bound.\u003c/li>\n\u003cli>The path-mode rules in §7.\u003c/li>\n\u003cli>The stable ID formats in §4.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"pushback-and-answers\">Pushback and answers\u003c/h2>\n\u003cp>Codex's pushback on 2026-11-18 and Claude's answers. All accepted points are folded into the sections above.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Codex\u003c/th>\n\u003cth>Claude\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>The guide's test \"boost halves after 30 days\" contradicts its formula; the count halves. Keep scores finite, since fzy's exact score is infinity.\u003c/td>\n\u003ctd>Accepted;
