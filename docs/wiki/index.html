rding was 16.3 ms p95 from key to commit, just above the 16 ms limit. That is in-app time only.\u003c/li>\n\u003cli>Screen recording slowed the app. The same variant took 10.4 ms median without it and 17.8 ms with it, in separate single runs.\u003c/li>\n\u003c/ul>\n\u003cp>Medians per stage for the best variant without recording. The stages have different sample sets: 55 keys, 67 searches and 78 updates. They do not add up to a total.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Stage\u003c/th>\n\u003cth>Median / p95, ms\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Ordering the panel front (\u003ccode>makeKeyAndOrderFront\u003c/code>)\u003c/td>\n\u003ctd>13.6 / 15.9\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Key event → text-change callback\u003c/td>\n\u003ctd>1.2 / 2.1\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Search, 20k items\u003c/td>\n\u003ctd>0.3 / 1.7\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Building the 9 rows\u003c/td>\n\u003ctd>1.3 / 2.3\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Layout and draw\u003c/td>\n\u003ctd>1.3 / 2.0\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Forced Core Animation commit\u003c/td>\n\u003ctd>5.2 / 10.0\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Memory (\u003ccode>phys_footprint\u003c/code>, MiB):\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Items\u003c/th>\n\u003cth>Index loaded, panel built\u003c/th>\n\u003cth>After 30 shows, before typing\u003c/th>\n\u003cth>End of run, after typing\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>20,000\u003c/td>\n\u003ctd>14\u003c/td>\n\u003ctd>19–21\u003c/td>\n\u003ctd>29 (no recording)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>200,000\u003c/td>\n\u003ctd>45\u003c/td>\n\u003ctd>42\u003c/td>\n\u003ctd>51 (includes recording buffers)\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Idle CPU with the panel hidden was 0.025% over 5 s, without recording.\u003c/p>\n\u003cp>The first show after launch took 42–49 ms to commit, against about 15 ms when warm. In the very first run, it took 216 ms; see the \u003ca href=\"attachments/2026-11-18-panel-latency/run-20k-first-run.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: c1289200ab9569aaf199aca6810c2a83672b164a5d6d61b1558c7d978ded1b72\">first-run report\u003c/a>.\u003c/p>\n\u003ch2 id=\"known-flaws-in-the-harness\">Known flaws in the harness\u003c/h2>\n\u003cp>Found by Codex's review. A later, authorized run must fix these before any result is treated as a verdict.\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Detection:\u003c/strong> the pixel-change detector does not check which result generation, text or selection is on screen. Missed detections were dropped instead of counted, and the show window had no upper bound.\u003c/li>\n\u003cli>\u003cstrong>Data races:\u003c/strong> the generation counter and the stage-timer dictionary were shared between threads without synchronization.\u003c/li>\n\u003cli>\u003cstrong>Forced commits:\u003c/strong> an explicit flush on every update is not how the app would normally run.\u003c/li>\n\u003cli>\u003cstrong>Uneven keys:\u003c/strong> keys were sent after results arrived, not at fixed times, so stale-result handling under overlap was not tested.\u003c/li>\n\u003cli>\u003cstrong>Warm-up:\u003c/strong> the spike's warm-up showed the panel and took keyboard focus for 300 ms. A hidden warm-up was not tested.\u003c/li>\n\u003cli>\u003cstrong>Records:\u003c/strong> there are no per-event records, so the percentiles and outliers cannot be audited.\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"what-this-means-for-the-build\">What this means for the build\u003c/h2>\n\u003col>\n\u003cli>\u003cstrong>Budgets.\u003c/strong> The user kept DEC-008 as provisional end-to-end goals, to be measured properly in M6 and then revisited (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-028\u003c/a>). Codex had recommended this, and Claude agreed.\u003c/li>\n\u003cli>\u003cstrong>Rows.\u003c/strong> A custom Core Text list is a candidate, not a decision. It must keep keyboard and mouse selection, VoiceOver, and results past the ninth. In M4 it is compared with manually laid-out table cells.\u003c/li>\n\u003cli>\u003cstrong>Publishing results.\u003c/strong> Publish one complete result set per query generation. Never show partial sources or stale results, and keep the selection on the same item. The typed letter shows immediately; waiting on the main thread is not adopted, and can be tested in M4.\u003c/li>\n\u003cli>\u003cstrong>Warm-up.\u003c/strong> Find a warm-up that does not take focus, and check that it helps.\u003c/li>\n\u003cli>\u003cstrong>Vibrancy.\u003c/strong> In single runs it cost about 5 ms per key against an opaque background. Revisit it if the budgets are missed.\u003c/li>\n\u003c/ol>\n\u003ch2 id=\"evidence\">Evidence\u003c/h2>\n\u003cul>\n\u003cli>Source, SHA-256 \u003ccode>9e241ec3…94ad\u003c/code>: \u003ca href=\"attachments/2026-11-18-panel-latency/spike.swift.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 9e241ec32e2049cce32551812cca899fd7e98a8829f91a34e65cf93a9d4d94ad\">spike source\u003c/a>.\u003cul>\n\u003cli>It is the final revision and has all variants behind flags.\u003c/li>\n\u003cli>Earlier runs used earlier revisions with the same code paths for their flags.\u003c/li>\n\u003cli>The \u003ca href=\"attachments/2026-11-18-panel-latency/spike-first-run.swift.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7e2c40865a11a776d0326281267848ff0cba133a5bc04230e7d04cd7f8b46ee8\">first-run source\u003c/a> adds stage timers that the first run did not have; the exact first-run source was not kept.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>Run reports:\u003cul>\n\u003cli>\u003ca href=\"attachments/2026-11-18-panel-latency/run-20k-table.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 7ed43abcf5fb2bf4a5b15446766235fc6797acff785f5c4f4d8cb5c4308daae9\">Table view\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"attachments/2026-11-18-panel-latency/run-20k-fast.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: c63a5f8dc1248a875bf01574294e0c9e8eb600c956e557924277e298f85af0dc\">Drawn rows\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"attachments/2026-11-18-panel-latency/run-20k-fast-ct-sync.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 56f7fae8d14ac37f28177f7cecc38a89fd288270da5bbe56da2aeade65f07184\">Core Text and wait\u003c/a>, and \u003ca href=\"attachments/2026-11-18-panel-latency/run-20k-best-nocapture.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 72020eb373277b054d1b31c4c7dfaba38573c31cf6f071e71cb8c20ca636e615\">without recording\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"attachments/2026-11-18-panel-latency/run-20k-fast-ct-sync-opaque.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 303863a513a39c00de710c3266c5990845d70ef69ee2627cd7c732d2f1fa0612\">Opaque background\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"attachments/2026-11-18-panel-latency/run-20k-fast-ct-sync-i60.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 3ce6c81a6d78e3ca4306e0ff01b84807d76930996e259ddd6f6c0aa2ab4e79ec\">Keys 60 ms apart\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"attachments/2026-11-18-panel-latency/run-200k-fast-ct-sync.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 9063a4e7a3edb82a06e6ff0053ff776ac91a1eb84d33e6d2c6ba854529fa3bc4\">200,000 items\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"attachments/2026-11-18-panel-latency/run-20k-minimal.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 29c0fcad4517749b8390239153f015c421c0ad0c9d329b9c534e99427f507b92\">Empty panel\u003c/a>\u003c/li>\n\u003cli>\u003ca href=\"attachments/2026-11-18-panel-latency/run-20k-first-run.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: c1289200ab9569aaf199aca6810c2a83672b164a5d6d61b1558c7d978ded1b72\">First run\u003c/a>\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"limits\">Limits\u003c/h2>\n\u003cul>\n\u003cli>One machine, single runs per variant.\u003c/li>\n\u003cli>Key events were posted inside the app, so the path from keyboard hardware to the app is not included.\u003c/li>\n\u003cli>See \u003ca href=\"#/spikes/2026-11-18-panel-latency~known-flaws-in-the-harness\">known flaws\u003c/a>.\u003c/li>\n\u003c/ul>\n","backlinks":["index","build/m1-foundation","decisions","plan"]},{"id":"spikes/2026-11-18-settings-deep-links","title":"Settings deep-link spike","section":"Spikes","order":0,"metadata":{"status":"Complete"},"metadataHtml":"\u003cspan>Status: Complete\u003c/span> \u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Settings deep-link spike\nsection: Spikes\nupdated: 2026-11-18\nstatus: Complete\n---\n# Settings deep-link spike\n\nRun by Claude on 2026-11-18, after the user asked to move the next steps forward. Codex reviewed it the same day; its corrections are applied below.\n\n## Question\n\nApparate lists System Settings items from the system's `.searchTerms` files (see the [UI design spike](2026-11-18-ui-design.md)). Each item has a pane (an extension bundle ID) and an anchor key. Does this URL take the user to the item?\n\n```text\nx-apple.systempreferences:\u003cextension bundle ID>?\u003canchor key>\n```\n\nThe [research alignment](../research/alignment.md) left this unverified.\n\n## Answer\n\nFor most of the items tested, yes. When System Settings was not running, every link opened the right pane. When it was already showing a sheet, later links were ignored.\n\nResults with System Settings not running beforehand:\n\n| Result | Items | Examples |\n| --- | --- | --- |\n| Named control shown after navigation (sheet, subpage, tab or scroll) | 32 of 57 | Input Sources sheet (the anchor also used for Keyboard layouts), Text replacements, DNS servers (Wi‑Fi Details, DNS tab), Camera, FileVault, Night Shift, Hot Corners, Zoom |\n| Right sheet or subpage opened; named control not shown | 4 | Shortcuts (opened on its last-used category), Caps Lock switching, Power Nap, Voice (Read & Speak) |\n| Pane opened; named control already visible without navigation | 11 | Firewall, Login options, Time zone, AirPlay Receiver |\n| Pane opened; named control not reached | 10 | Screen Time (`path=` anchors), Hostname, Login Items → Extensions, Default web browser, Bluetooth keyboard setup, Dictation (only its heading visible), Touch Bar (this Mac has none) |\n| Nothing opened | 0 | |\n\nOf the 16 Keyboard anchors, 11 showed the named control. One of those is `InputSources`. The catalog uses that anchor for \"Keyboard layouts\", the user's example in [REQ-004](../requirements.md), and it opened the Input Sources sheet.\n\nThese are Claude's judgements from screenshots. One anchor can cover several catalog titles, and a sheet may show some of them but not others. The results do not extend to the 490 anchors that were not tested.\n\n## System Settings already open\n\nThe main test force-quit System Settings before each link. Real use often finds it open, so three sequences were also tried with it left running:\n\n- **No sheet showing:** later links reached Sound input, Zoom, FileVault and the Input Sources sheet. How quickly it navigated was not measured, because the driver's wait condition was already true for the old window.\n- **Input Sources sheet showing:** all 6 later links were ignored, and the window stayed on that sheet. Only this one sheet was tested.\n- **Polite quit, then open:** `NSRunningApplication.terminate()` was followed by the Night Shift link, which opened correctly in this one sequence.\n  - In the [recorded output](../attachments/2026-11-18-settings-deep-links/quitfirst-output.txt), System Settings was gone 0.08 s after the request, and a window appeared about 2.2 s after the start.\n  - `terminate()` is a request, not a guarantee. It could also interrupt something the user was doing in System Settings.\n\nCold opens took 0.89–1.85 s from the link to a titled window.\n\nSo Apparate needed a policy for when System Settings is already running. Claude and Codex differed on it:\n\n- **Quit first (Claude):** if System Settings is running, quit it, then open the link. It lands more reliably, costs about 2 s, and may interrupt the user.\n- **Open directly (Codex):** open the link as is. It is fast, and the user is never interrupted. If a sheet blocks the link, nothing happens, so Apparate offers an explicit \"close and reopen System Settings\" action.\n\nThe user chose to open directly, without the extra action ([DEC-029](../decisions.md#round-4-2026-11-18)).\n\nNo reliable way to detect an open sheet without extra permissions was found.\n\n## Method\n\n- macOS 27.0, English, on the user's Mac.\n- 57 anchors from 19 panes:\n  - every Keyboard anchor;\n  - 1–6 anchors from each other pane, including Privacy & Security, Displays, Desktop & Dock, Network, Sound, Battery, Screen Time, Sharing and Accessibility.\n- For each pane, the pane URL without an anchor was captured first as a baseline.\n- Main test, for each link:\n  - force-quit System Settings (`forceTerminate()`);\n  - open the URL;\n  - wait until a System Settings window has any title, then 2.2 s more;\n  - capture the window with `screencapture -l`.\n- The wait does not check that the requested destination appeared. The 2.2 s settle time covers that.\n- Classification: Claude compared each capture with its baseline by eye. A pixel diff was used only to spot captures that did not change. The classes were tightened after Codex's review.\n- Sources, SHA-256:\n  - [driver](../attachments/2026-11-18-settings-deep-links/drive.swift.txt) `650363a5…eac0`;\n  - [quit-first test](../attachments/2026-11-18-settings-deep-links/quitfirst.swift.txt) `b9ee6c8f…b9`.\n\n## Evidence\n\nThe Apple Account name and picture, and the user name in Users & Groups, are covered in grey. The captures also show some apps installed on this Mac. The system switched to Dark appearance partway through the run; this did not affect navigation.\n\n- [Per-item results (CSV)](../attachments/2026-11-18-settings-deep-links/results.csv)\n\nKeyboard (the first image is the baseline):\n\n![Keyboard anchors 00–05](../attachments/2026-11-18-settings-deep-links/sheet-s00.jpg)\n\n![Keyboard anchors 06–11](../attachments/2026-11-18-settings-deep-links/sheet-s01.jpg)\n\n![Keyboard anchors 12–16 and the Privacy & Security baseline](../attachments/2026-11-18-settings-deep-links/sheet-s02.jpg)\n\nOther panes:\n\n![Privacy & Security](../attachments/2026-11-18-settings-deep-links/sheet-s03.jpg)\n\n![Displays and Desktop & Dock](../attachments/2026-11-18-settings-deep-links/sheet-s04.jpg)\n\n![Desktop & Dock and Menu Bar](../attachments/2026-11-18-settings-deep-links/sheet-s05.jpg)\n\n![Menu Bar, Network and Sound](../attachments/2026-11-18-settings-deep-links/sheet-s06.jpg)\n\n![Sound and Lock Screen](../attachments/2026-11-18-settings-deep-links/sheet-s07.jpg)\n\n![Battery and Screen Time](../attachments/2026-11-18-settings-deep-links/sheet-s08.jpg)\n\n![Sharing, Users & Groups and Wallpaper](../attachments/2026-11-18-settings-deep-links/sheet-s09.jpg)\n\n![Wallpaper, Spotlight, Language & Region and Login Items](../attachments/2026-11-18-settings-deep-links/sheet-s10.jpg)\n\n![Login Items and Accessibility](../attachments/2026-11-18-settings-deep-links/sheet-s11.jpg)\n\n![Date & Time and AirDrop & Continuity](../attachments/2026-11-18-settings-deep-links/sheet-s12.jpg)\n\nSystem Settings already open:\n\n![An open sheet blocks later links](../attachments/2026-11-18-settings-deep-links/sheet-warm.jpg)\n\n![Without a sheet, later links work](../attachments/2026-11-18-settings-deep-links/sheet-warm2.jpg)\n\n![Quit first, then open](../attachments/2026-11-18-settings-deep-links/sheet-quitfirst.jpg)\n\n## Consequences for the build\n\n- Open each settings item with its pane and anchor from `.searchTerms`.\n- If the URL fails to open, report the error. A successful open call does not prove navigation happened.\n- Screen Time's `path=` anchors did not navigate. Keep them, since they still open Screen Time.\n- Settings rows show which pane they open, so a partial result is not a surprise.\n- When System Settings is already running, open the link directly ([DEC-029](../decisions.md#round-4-2026-11-18)).\n\n## Limits\n\n- One Mac, one macOS build, English only.\n- 57 of the 547 anchors were tested. Accessibility alone has 342, and 4 of them were tested.\n- \"Shown\" is Claude's judgement from screenshots, not read from the interface.\n- The already-open behaviour was tried in 3 short sequences with one kind of sheet.\n- The anchors for the legacy Date & Time pane (`DateAndTime.prefPane`) were not tested separately.\n","toc":[{"id":"question","title":"Question","depth":2},{"id":"answer","title":"Answer","depth":2},{"id":"system-settings-already-open","title":"System Settings already open","depth":2},{"id":"method","title":"Method","depth":2},{"id":"evidence","title":"Evidence","depth":2},{"id":"consequences-for-the-build","title":"Consequences for the build","depth":2},{"id":"limits","title":"Limits","depth":2}],"titleAnchor":"settings-deep-link-spike","links":["spikes/2026-11-18-ui-design","research/alignment","requirements","decisions","decisions"],"attachments":[{"path":"attachments/2026-11-18-settings-deep-links/quitfirst-output.txt","sha256":"42ef2fef5f12f3ac817b8891800af2efc0ad5416c5c8d9d8eccbe7097c2f7330"},{"path":"attachments/2026-11-18-settings-deep-links/drive.swift.txt","sha256":"650363a5e41f46b2abc967254d3d346e89072a57c7004838a0eb73402753eac0"},{"path":"attachments/2026-11-18-settings-deep-links/quitfirst.swift.txt","sha256":"b9ee6c8f0ff19078d7c18a555a82af7d338d0243a6bf669ad7f50c6b07f032b9"},{"path":"attachments/2026-11-18-settings-deep-links/results.csv","sha256":"13f3fa17dce9d5c66ee39e78904cc560485b04d9d2c278ad77a39e983e6a5e94"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-s00.jpg","sha256":"535417fee59c48c2082d6a84dc333891c9f24098a3f28ec07bac6e864c4eab2e"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-s01.jpg","sha256":"b046cb204e0554892d5555787805827b46496e92e21dcce69aa10956ccfa711b"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-s02.jpg","sha256":"81b791600e7ca4c0be5fd0f619432fe4de4de700feecfa11a24901b1af514a16"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-s03.jpg","sha256":"c84f930ce0cb0f074309ec189712d6f25bf58ba96143be24fd602d415842bf1f"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-s04.jpg","sha256":"0d57a0c5df2264b2dc0aa72149b04d4068c110326278a2937df7c570a90fa0d3"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-s05.jpg","sha256":"596bf5c356a1b73ccf2af1a3ff6d53e292ce214b39e836489aaa4e0bb20602d2"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-s06.jpg","sha256":"1fc52b80076426b84092a8801c5a90449465cab4a2f3678fde582772b0d45368"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-s07.jpg","sha256":"19e89a287de5a6c6e78879d21e43d0e4efba75fd19295e054e4bdcf14d05181b"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-s08.jpg","sha256":"503a741edced669a79769b68bd01555f471ff131f1d897a6f8ed324a71d04563"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-s09.jpg","sha256":"1097a899f2ac03a83484df7715611ca819ff6e7609279d3e5f8c8adfc84b5425"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-s10.jpg","sha256":"e05566be3d4b9bf319e38deab6177acd65455a24ef65402dc728ee586981171c"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-s11.jpg","sha256":"2574280ec1e1e922687c0d134d81abff841e6eb2208afe2d5c63b6e09527c33c"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-s12.jpg","sha256":"4d0af944990feddd9890fcd85b478e67308aad21d4bed9756b8434a3e0c728f8"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-warm.jpg","sha256":"c7a52b04c0b3452b5c66f85c55530a0d33aabc2843a23035c31f98469c8c3bb5"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-warm2.jpg","sha256":"3f2ed41758d1d5874b42f5ce20c70e6760a6a07035f54bdd8adbddbe3f9f21f5"},{"path":"attachments/2026-11-18-settings-deep-links/sheet-quitfirst.jpg","sha256":"eb1495ad8860f7c3f75ba5c01cdfbbfc6106b93ec5d9c84b523213113a494c43"}],"html":"\u003cp>Run by Claude on 2026-11-18, after the user asked to move the next steps forward. Codex reviewed it the same day; its corrections are applied below.\u003c/p>\n\u003ch2 id=\"question\">Question\u003c/h2>\n\u003cp>Apparate lists System Settings items from the system's \u003ccode>.searchTerms\u003c/code> files (see the \u003ca href=\"#/spikes/2026-11-18-ui-design\">UI design spike\u003c/a>). Each item has a pane (an extension bundle ID) and an anchor key. Does this URL take the user to the item?\u003c/p>\n\u003cpre>\u003ccode class=\"language-text\">x-apple.systempreferences:&lt;extension bundle ID&gt;?&lt;anchor key&gt;\n\u003c/code>\u003c/pre>\n\u003cp>The \u003ca href=\"#/research/alignment\">research alignment\u003c/a> left this unverified.\u003c/p>\n\u003ch2 id=\"answer\">Answer\u003c/h2>\n\u003cp>For most of the items tested, yes. When System Settings was not running, every link opened the right pane. When it was already showing a sheet, later links were ignored.\u003c/p>\n\u003cp>Results with System Settings not running beforehand:\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Result\u003c/th>\n\u003cth>Items\u003c/th>\n\u003cth>Examples\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Named control shown after navigation (sheet, subpage, tab or scroll)\u003c/td>\n\u003ctd>32 of 57\u003c/td>\n\u003ctd>Input Sources sheet (the anchor also used for Keyboard layouts), Text replacements, DNS servers (Wi‑Fi Details, DNS tab), Camera, FileVault, Night Shift, Hot Corners, Zoom\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Right sheet or subpage opened; named control not shown\u003c/td>\n\u003ctd>4\u003c/td>\n\u003ctd>Shortcuts (opened on its last-used category), Caps Lock switching, Power Nap, Voice (Read &amp; Speak)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pane opened; named control already visible without navigation\u003c/td>\n\u003ctd>11\u003c/td>\n\u003ctd>Firewall, Login options, Time zone, AirPlay Receiver\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Pane opened; named control not reached\u003c/td>\n\u003ctd>10\u003c/td>\n\u003ctd>Screen Time (\u003ccode>path=\u003c/code> anchors), Hostname, Login Items → Extensions, Default web browser, Bluetooth keyboard setup, Dictation (only its heading visible), Touch Bar (this Mac has none)\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Nothing opened\u003c/td>\n\u003ctd>0\u003c/td>\n\u003ctd>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Of the 16 Keyboard anchors, 11 showed the named control. One of those is \u003ccode>InputSources\u003c/code>. The catalog uses that anchor for \"Keyboard layouts\", the user's example in \u003ca href=\"#/requirements\">REQ-004\u003c/a>, and it opened the Input Sources sheet.\u003c/p>\n\u003cp>These are Claude's judgements from screenshots. One anchor can cover several catalog titles, and a sheet may show some of them but not others. The results do not extend to the 490 anchors that were not tested.\u003c/p>\n\u003ch2 id=\"system-settings-already-open\">System Settings already open\u003c/h2>\n\u003cp>The main test force-quit System Settings before each link. Real use often finds it open, so three sequences were also tried with it left running:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>No sheet showing:\u003c/strong> later links reached Sound input, Zoom, FileVault and the Input Sources sheet. How quickly it navigated was not measured, because the driver's wait condition was already true for the old window.\u003c/li>\n\u003cli>\u003cstrong>Input Sources sheet showing:\u003c/strong> all 6 later links were ignored, and the window stayed on that sheet. Only this one sheet was tested.\u003c/li>\n\u003cli>\u003cstrong>Polite quit, then open:\u003c/strong> \u003ccode>NSRunningApplication.terminate()\u003c/code> was followed by the Night Shift link, which opened correctly in this one sequence.\u003cul>\n\u003cli>In the \u003ca href=\"attachments/2026-11-18-settings-deep-links/quitfirst-output.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 42ef2fef5f12f3ac817b8891800af2efc0ad5416c5c8d9d8eccbe7097c2f7330\">recorded output\u003c/a>, System Settings was gone 0.08 s after the request, and a window appeared about 2.2 s after the start.\u003c/li>\n\u003cli>\u003ccode>terminate()\u003c/code> is a request, not a guarantee. It could also interrupt something the user was doing in System Settings.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003cp>Cold opens took 0.89–1.85 s from the link to a titled window.\u003c/p>\n\u003cp>So Apparate needed a policy for when System Settings is already running. Claude and Codex differed on it:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Quit first (Claude):\u003c/strong> if System Settings is running, quit it, then open the link. It lands more reliably, costs about 2 s, and may interrupt the user.\u003c/li>\n\u003cli>\u003cstrong>Open directly (Codex):\u003c/strong> open the link as is. It is fast, and the user is never interrupted. If a sheet blocks the link, nothing happens, so Apparate offers an explicit \"close and reopen System Settings\" action.\u003c/li>\n\u003c/ul>\n\u003cp>The user chose to open directly, without the extra action (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-029\u003c/a>).\u003c/p>\n\u003cp>No reliable way to detect an open sheet without extra permissions was found.\u003c/p>\n\u003ch2 id=\"method\">Method\u003c/h2>\n\u003cul>\n\u003cli>macOS 27.0, English, on the user's Mac.\u003c/li>\n\u003cli>57 anchors from 19 panes:\u003cul>\n\u003cli>every Keyboard anchor;\u003c/li>\n\u003cli>1–6 anchors from each other pane, including Privacy &amp; Security, Displays, Desktop &amp; Dock, Network, Sound, Battery, Screen Time, Sharing and Accessibility.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>For each pane, the pane URL without an anchor was captured first as a baseline.\u003c/li>\n\u003cli>Main test, for each link:\u003cul>\n\u003cli>force-quit System Settings (\u003ccode>forceTerminate()\u003c/code>);\u003c/li>\n\u003cli>open the URL;\u003c/li>\n\u003cli>wait until a System Settings window has any title, then 2.2 s more;\u003c/li>\n\u003cli>capture the window with \u003ccode>screencapture -l\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>The wait does not check that the requested destination appeared. The 2.2 s settle time covers that.\u003c/li>\n\u003cli>Classification: Claude compared each capture with its baseline by eye. A pixel diff was used only to spot captures that did not change. The classes were tightened after Codex's review.\u003c/li>\n\u003cli>Sources, SHA-256:\u003cul>\n\u003cli>\u003ca href=\"attachments/2026-11-18-settings-deep-links/drive.swift.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 650363a5e41f46b2abc967254d3d346e89072a57c7004838a0eb73402753eac0\">driver\u003c/a> \u003ccode>650363a5…eac0\u003c/code>;\u003c/li>\n\u003cli>\u003ca href=\"attachments/2026-11-18-settings-deep-links/quitfirst.swift.txt\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: b9ee6c8f0ff19078d7c18a555a82af7d338d0243a6bf669ad7f50c6b07f032b9\">quit-first test\u003c/a> \u003ccode>b9ee6c8f…b9\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"evidence\">Evidence\u003c/h2>\n\u003cp>The Apple Account name and picture, and the user name in Users &amp; Groups, are covered in grey. The captures also show some apps installed on this Mac. The system switched to Dark appearance partway through the run; this did not affect navigation.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"attachments/2026-11-18-settings-deep-links/results.csv\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 13f3fa17dce9d5c66ee39e78904cc560485b04d9d2c278ad77a39e983e6a5e94\">Per-item results (CSV)\u003c/a>\u003c/li>\n\u003c/ul>\n\u003cp>Keyboard (the first image is the baseline):\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-s00.jpg\" alt=\"Keyboard anchors 00–05\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-s01.jpg\" alt=\"Keyboard anchors 06–11\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-s02.jpg\" alt=\"Keyboard anchors 12–16 and the Privacy &amp; Security baseline\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>Other panes:\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-s03.jpg\" alt=\"Privacy &amp; Security\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-s04.jpg\" alt=\"Displays and Desktop &amp; Dock\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-s05.jpg\" alt=\"Desktop &amp; Dock and Menu Bar\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-s06.jpg\" alt=\"Menu Bar, Network and Sound\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-s07.jpg\" alt=\"Sound and Lock Screen\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-s08.jpg\" alt=\"Battery and Screen Time\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-s09.jpg\" alt=\"Sharing, Users &amp; Groups and Wallpaper\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-s10.jpg\" alt=\"Wallpaper, Spotlight, Language &amp; Region and Login Items\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-s11.jpg\" alt=\"Login Items and Accessibility\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-s12.jpg\" alt=\"Date &amp; Time and AirDrop &amp; Continuity\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>System Settings already open:\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-warm.jpg\" alt=\"An open sheet blocks later links\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-warm2.jpg\" alt=\"Without a sheet, later links work\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-settings-deep-links/sheet-quitfirst.jpg\" alt=\"Quit first, then open\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003ch2 id=\"consequences-for-the-build\">Consequences for the build\u003c/h2>\n\u003cul>\n\u003cli>Open each settings item with its pane and anchor from \u003ccode>.searchTerms\u003c/code>.\u003c/li>\n\u003cli>If the URL fails to open, report the error. A successful open call does not prove navigation happened.\u003c/li>\n\u003cli>Screen Time's \u003ccode>path=\u003c/code> anchors did not navigate. Keep them, since they still open Screen Time.\u003c/li>\n\u003cli>Settings rows show which pane they open, so a partial result is not a surprise.\u003c/li>\n\u003cli>When System Settings is already running, open the link directly (\u003ca href=\"#/decisions~round-4-2026-11-18\">DEC-029\u003c/a>).\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"limits\">Limits\u003c/h2>\n\u003cul>\n\u003cli>One Mac, one macOS build, English only.\u003c/li>\n\u003cli>57 of the 547 anchors were tested. Accessibility alone has 342, and 4 of them were tested.\u003c/li>\n\u003cli>\"Shown\" is Claude's judgement from screenshots, not read from the interface.\u003c/li>\n\u003cli>The already-open behaviour was tried in 3 short sequences with one kind of sheet.\u003c/li>\n\u003cli>The anchors for the legacy Date &amp; Time pane (\u003ccode>DateAndTime.prefPane\u003c/code>) were not tested separately.\u003c/li>\n\u003c/ul>\n","backlinks":["index","decisions","plan"]},{"id":"spikes/2026-11-18-ui-design","title":"UI design spike","section":"Spikes","order":0,"metadata":{"status":"Complete"},"metadataHtml":"\u003cspan>Status: Complete\u003c/span> \u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: UI design spike\nsection: Spikes\nupdated: 2026-11-18\nstatus: Complete\n---\n# UI design spike\n\nRun by Claude alone on 2026-11-18, as the user asked ([DEC-012](../decisions.md), [DEC-022](../decisions.md#round-2-2026-11-18)). For each of the five interfaces, 3–4 variations were shown in grill-form (round 3) for the user to choose from. The look follows the user's own apps Klip, Yacht and Portia: dark appearance, pure AppKit controls, blue selection, 28 pt rows and key hints. This page records the method and what the spike verified. The user's choices are added when the form is submitted.\n\n## Method\n\n- The previews are self-contained HTML in the grill-form, about 750 KB in total, under Fungi's 1 MiB input limit.\n- The four launcher panel variations are interactive. Each uses one shared JavaScript engine that implements the agreed behaviour:\n  - prefixes (`'` files and folders, `.` settings, `?` web);\n  - match tiers (exact, prefix, word-start/acronym, substring, subsequence, keywords), then the kind order from DEC-002;\n  - the DuckDuckGo fallback row when nothing matches, and Restart confirmation;\n  - Return, ⌘Return (reveal), ⌘C (copy path), ⌘1–9 and Esc;\n  - the selection kept on the same item across updates.\n- The sample data is 195 items:\n  - 19 apps installed on this Mac;\n  - 4 system commands;\n  - 153 real System Settings panes and items from the `.searchTerms` files;\n  - folders and files from `~/Projects`.\n  \n  Opening anything is simulated.\n- Icons are real: they were exported with `NSWorkspace` at 32 px and embedded as data URLs.\n- Before the form was shown, every variation was rendered offscreen in WebKit (`WKWebView` snapshots). The launcher variations were also rendered with typed queries. Two defects were found and fixed this way: the first-run C rows lost their layout once a step was marked done, and no row stayed selected after that.\n- The generator and screenshots are temporary research files, not product code.\n\n## Verified: settings item names and icons\n\nTwo open items from the [research alignment](../research/alignment.md) (difference 14 and the pane names) were checked on macOS 27.0:\n\n- **Names:** `Bundle(url:).localizedInfoDictionary[\"CFBundleDisplayName\"]` gives a proper name for 50 of 52 System Settings extensions. Examples: `AccessibilitySettingsExtension` → Accessibility, `WiFiSettings` → Wi‑Fi, `ControlCenterSettings` → Menu Bar. The two exceptions are the headphone pane (`HeadphoneSettingsExtension`) and the battery pane (`PowerPreferences`). They need fixed names, which are the same two overrides Tinycast hard-codes.\n- **Icons:** `NSWorkspace.icon(forFile:)` on the extension bundle returns the correct System Settings icon for 50 of 52 panes. The same two panes return a placeholder brick. The 12 panes that declare an `ISTypeIdentifier` give identical icons through `NSWorkspace.icon(for: UTType)`. So the type-identifier route adds nothing; use the bundle icon, with overrides for Battery and Headphones.\n\n![Pane icons from NSWorkspace.icon(forFile:)](../attachments/2026-11-18-ui-spike/settings-icons-from-bundle.png)\n\n![Pane icons from ISTypeIdentifier](../attachments/2026-11-18-ui-spike/settings-icons-from-type-id.png)\n\nStill unverified: whether each `.searchTerms` group key opens its section as a URL anchor. That needs System Settings opened on screen and remains for the settings deep-link spike.\n\n## Variations offered\n\n| Interface | Variations | Claude's recommendation |\n| --- | --- | --- |\n| Launcher panel | A compact, fixed size, key hints (Klip); B large Spotlight-style; C grouped by kind with an action footer; D field only until typing | A |\n| Result rows | A title + kind; B two lines; C one line with matched letters bold and dimmed location; D title only with a settings badge | C |\n| Settings window | A one scrolling page (Yacht); B toolbar tabs; C sidebar; D one compact grid (Klip) | A |\n| Menu bar menu | A Open/Settings/Quit; B index status + Rebuild; C per-folder counts; D click opens the panel | B |\n| First run | A one setup window; B three steps; C setup items in the panel; D Settings with a Finish setup section | A |\n\nScreenshots of some variations as rendered in WebKit:\n\n![Launcher A with \"keyboard la\"](../attachments/2026-11-18-ui-spike/panel--a-compact--keyboard.jpg)\n\n![Launcher C with the files prefix](../attachments/2026-11-18-ui-spike/panel--c-sections--files.jpg)\n\n![Launcher B with Restart awaiting confirmation](../attachments/2026-11-18-ui-spike/panel--b-spotlight--restart.jpg)\n\n![Launcher D with the web fallback](../attachments/2026-11-18-ui-spike/panel--d-minimal--nomatch.jpg)\n\n![Rows C](../attachments/2026-11-18-ui-spike/rows--r3-inline.jpg)\n\n![Settings A](../attachments/2026-11-18-ui-spike/settings-window--s1-single.jpg)\n\n![Settings D](../attachments/2026-11-18-ui-spike/settings-window--s4-compact.jpg)\n\n![Menu B](../attachments/2026-11-18-ui-spike/menu--m2-status.jpg)\n\n![First run A](../attachments/2026-11-18-ui-spike/first-run--f1-checklist.jpg)\n\n## User choices\n\nRound 3 (submitted 2026-11-18):\n\n- **Launcher panel:** A, compact and fixed size like Klip ([DEC-023](../decisions.md#round-3-ui-design-spike-2026-11-18)).\n- **Result rows:** C, one line with matched letters bold and location dimmed ([DEC-024](../decisions.md#round-3-ui-design-spike-2026-11-18)).\n- **Settings window, menu bar menu, first run:** not decided. The form laid option previews out in three narrow columns, which squeezed and clipped the windows. Claude's WebKit check had rendered each preview alone at 860 px, so it missed the real column width.\n\n  The user asked for these three again in a single full-width column. The jstack grill-form now stacks option previews full width (a change made outside this session). Round 3b shows the same variations as windows that fit the frame, at heights that show each whole window without scrolling. The duplicate Spotlight warning in first-run D was also removed.\n\nRound 3b (submitted 2026-11-18):\n\n- **Settings window:** B, toolbar tabs General, Search, Folders ([DEC-025](../decisions.md#round-3-ui-design-spike-2026-11-18)). Claude had recommended A.\n- **Menu bar menu:** A, Open, Settings, Quit ([DEC-026](../decisions.md#round-3-ui-design-spike-2026-11-18)). Claude had recommended B.\n- **First run:** A, one setup window with both steps ([DEC-027](../decisions.md#round-3-ui-design-spike-2026-11-18)).\n\nLesson for later spikes: check previews at the width the form actually gives them, not only in isolation.\n","toc":[{"id":"method","title":"Method","depth":2},{"id":"verified-settings-item-names-and-icons","title":"Verified: settings item names and icons","depth":2},{"id":"variations-offered","title":"Variations offered","depth":2},{"id":"user-choices","title":"User choices","depth":2}],"titleAnchor":"ui-design-spike","links":["decisions","decisions","research/alignment","decisions","decisions","decisions","decisions","decisions"],"attachments":[{"path":"attachments/2026-11-18-ui-spike/settings-icons-from-bundle.png","sha256":"c8ca6bd8a1f51b859853fcf5582a7bb1da6145e05c7e86f2430fcc87241abc28"},{"path":"attachments/2026-11-18-ui-spike/settings-icons-from-type-id.png","sha256":"73575b94a7ec86ef6e6b533b9e46208e3dc59cf714d7dcba3d06cc1e9ea27095"},{"path":"attachments/2026-11-18-ui-spike/panel--a-compact--keyboard.jpg","sha256":"8b6e9bf1b71dfc98ac18094ea4e32b58ce0e76da5462dcd123cfe7e8bd72c838"},{"path":"attachments/2026-11-18-ui-spike/panel--c-sections--files.jpg","sha256":"d95ce2741897bfacc27db5e43ad5da1220ad75a3e3b04ede021293bff1c55474"},{"path":"attachments/2026-11-18-ui-spike/panel--b-spotlight--restart.jpg","sha256":"44021cdf8f1b6875ded6c14b42b941c281ecadfa5a64573d376eb7bc68741ced"},{"path":"attachments/2026-11-18-ui-spike/panel--d-minimal--nomatch.jpg","sha256":"acf3e276e0e3ee35fc26dce6ce4dc49a5ef4c85f910ee6e92d55aa94269136e1"},{"path":"attachments/2026-11-18-ui-spike/rows--r3-inline.jpg","sha256":"8ecc49f1359c9f627728d7c7be3be43227d349ff0879f4485f3ac2b77584a53c"},{"path":"attachments/2026-11-18-ui-spike/settings-window--s1-single.jpg","sha256":"5dce79b5ef0784ef83394c087f5daf615b3cdb45ae98dca7a5abeb9ad3e41b01"},{"path":"attachments/2026-11-18-ui-spike/settings-window--s4-compact.jpg","sha256":"38b4d5fcaca176590f6fc84bcf99bf089d4c17bfcf02fad26dec75ccae6602aa"},{"path":"attachments/2026-11-18-ui-spike/menu--m2-status.jpg","sha256":"fa35b891f48762cac3db093ba0f8bd9e3755f3114be066232e2ae878ee123a04"},{"path":"attachments/2026-11-18-ui-spike/first-run--f1-checklist.jpg","sha256":"6b89173a83e61b557033b56992ac2a392fd8e45c90c8ffa891d1f6fdacef2fc1"}],"html":"\u003cp>Run by Claude alone on 2026-11-18, as the user asked (\u003ca href=\"#/decisions\">DEC-012\u003c/a>, \u003ca href=\"#/decisions~round-2-2026-11-18\">DEC-022\u003c/a>). For each of the five interfaces, 3–4 variations were shown in grill-form (round 3) for the user to choose from. The look follows the user's own apps Klip, Yacht and Portia: dark appearance, pure AppKit controls, blue selection, 28 pt rows and key hints. This page records the method and what the spike verified. The user's choices are added when the form is submitted.\u003c/p>\n\u003ch2 id=\"method\">Method\u003c/h2>\n\u003cul>\n\u003cli>\u003cp>The previews are self-contained HTML in the grill-form, about 750 KB in total, under Fungi's 1 MiB input limit.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>The four launcher panel variations are interactive. Each uses one shared JavaScript engine that implements the agreed behaviour:\u003c/p>\n\u003cul>\n\u003cli>prefixes (\u003ccode>'\u003c/code> files and folders, \u003ccode>.\u003c/code> settings, \u003ccode>?\u003c/code> web);\u003c/li>\n\u003cli>match tiers (exact, prefix, word-start/acronym, substring, subsequence, keywords), then the kind order from DEC-002;\u003c/li>\n\u003cli>the DuckDuckGo fallback row when nothing matches, and Restart confirmation;\u003c/li>\n\u003cli>Return, ⌘Return (reveal), ⌘C (copy path), ⌘1–9 and Esc;\u003c/li>\n\u003cli>the selection kept on the same item across updates.\u003c/li>\n\u003c/ul>\n\u003c/li>\n\u003cli>\u003cp>The sample data is 195 items:\u003c/p>\n\u003cul>\n\u003cli>19 apps installed on this Mac;\u003c/li>\n\u003cli>4 system commands;\u003c/li>\n\u003cli>153 real System Settings panes and items from the \u003ccode>.searchTerms\u003c/code> files;\u003c/li>\n\u003cli>folders and files from \u003ccode>~/Projects\u003c/code>.\u003c/li>\n\u003c/ul>\n\u003cp>Opening anything is simulated.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Icons are real: they were exported with \u003ccode>NSWorkspace\u003c/code> at 32 px and embedded as data URLs.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>Before the form was shown, every variation was rendered offscreen in WebKit (\u003ccode>WKWebView\u003c/code> snapshots). The launcher variations were also rendered with typed queries. Two defects were found and fixed this way: the first-run C rows lost their layout once a step was marked done, and no row stayed selected after that.\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>The generator and screenshots are temporary research files, not product code.\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003ch2 id=\"verified-settings-item-names-and-icons\">Verified: settings item names and icons\u003c/h2>\n\u003cp>Two open items from the \u003ca href=\"#/research/alignment\">research alignment\u003c/a> (difference 14 and the pane names) were checked on macOS 27.0:\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Names:\u003c/strong> \u003ccode>Bundle(url:).localizedInfoDictionary[\"CFBundleDisplayName\"]\u003c/code> gives a proper name for 50 of 52 System Settings extensions. Examples: \u003ccode>AccessibilitySettingsExtension\u003c/code> → Accessibility, \u003ccode>WiFiSettings\u003c/code> → Wi‑Fi, \u003ccode>ControlCenterSettings\u003c/code> → Menu Bar. The two exceptions are the headphone pane (\u003ccode>HeadphoneSettingsExtension\u003c/code>) and the battery pane (\u003ccode>PowerPreferences\u003c/code>). They need fixed names, which are the same two overrides Tinycast hard-codes.\u003c/li>\n\u003cli>\u003cstrong>Icons:\u003c/strong> \u003ccode>NSWorkspace.icon(forFile:)\u003c/code> on the extension bundle returns the correct System Settings icon for 50 of 52 panes. The same two panes return a placeholder brick. The 12 panes that declare an \u003ccode>ISTypeIdentifier\u003c/code> give identical icons through \u003ccode>NSWorkspace.icon(for: UTType)\u003c/code>. So the type-identifier route adds nothing; use the bundle icon, with overrides for Battery and Headphones.\u003c/li>\n\u003c/ul>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/settings-icons-from-bundle.png\" alt=\"Pane icons from NSWorkspace.icon(forFile:)\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/settings-icons-from-type-id.png\" alt=\"Pane icons from ISTypeIdentifier\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>Still unverified: whether each \u003ccode>.searchTerms\u003c/code> group key opens its section as a URL anchor. That needs System Settings opened on screen and remains for the settings deep-link spike.\u003c/p>\n\u003ch2 id=\"variations-offered\">Variations offered\u003c/h2>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Interface\u003c/th>\n\u003cth>Variations\u003c/th>\n\u003cth>Claude's recommendation\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Launcher panel\u003c/td>\n\u003ctd>A compact, fixed size, key hints (Klip); B large Spotlight-style; C grouped by kind with an action footer; D field only until typing\u003c/td>\n\u003ctd>A\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Result rows\u003c/td>\n\u003ctd>A title + kind; B two lines; C one line with matched letters bold and dimmed location; D title only with a settings badge\u003c/td>\n\u003ctd>C\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Settings window\u003c/td>\n\u003ctd>A one scrolling page (Yacht); B toolbar tabs; C sidebar; D one compact grid (Klip)\u003c/td>\n\u003ctd>A\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Menu bar menu\u003c/td>\n\u003ctd>A Open/Settings/Quit; B index status + Rebuild; C per-folder counts; D click opens the panel\u003c/td>\n\u003ctd>B\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>First run\u003c/td>\n\u003ctd>A one setup window; B three steps; C setup items in the panel; D Settings with a Finish setup section\u003c/td>\n\u003ctd>A\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Screenshots of some variations as rendered in WebKit:\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/panel--a-compact--keyboard.jpg\" alt=\"Launcher A with &quot;keyboard la&quot;\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/panel--c-sections--files.jpg\" alt=\"Launcher C with the files prefix\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/panel--b-spotlight--restart.jpg\" alt=\"Launcher B with Restart awaiting confirmation\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/panel--d-minimal--nomatch.jpg\" alt=\"Launcher D with the web fallback\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/rows--r3-inline.jpg\" alt=\"Rows C\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/settings-window--s1-single.jpg\" alt=\"Settings A\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/settings-window--s4-compact.jpg\" alt=\"Settings D\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/menu--m2-status.jpg\" alt=\"Menu B\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003cp>\u003cimg src=\"attachments/2026-11-18-ui-spike/first-run--f1-checklist.jpg\" alt=\"First run A\" loading=\"lazy\" decoding=\"async\" />\u003c/p>\n\u003ch2 id=\"user-choices\">User choices\u003c/h2>\n\u003cp>Round 3 (submitted 2026-11-18):\u003c/p>\n\u003cul>\n\u003cli>\u003cp>\u003cstrong>Launcher panel:\u003c/strong> A, compact and fixed size like Klip (\u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-023\u003c/a>).\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Result rows:\u003c/strong> C, one line with matched letters bold and location dimmed (\u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-024\u003c/a>).\u003c/p>\n\u003c/li>\n\u003cli>\u003cp>\u003cstrong>Settings window, menu bar menu, first run:\u003c/strong> not decided. The form laid option previews out in three narrow columns, which squeezed and clipped the windows. Claude's WebKit check had rendered each preview alone at 860 px, so it missed the real column width.\u003c/p>\n\u003cp>The user asked for these three again in a single full-width column. The jstack grill-form now stacks option previews full width (a change made outside this session). Round 3b shows the same variations as windows that fit the frame, at heights that show each whole window without scrolling. The duplicate Spotlight warning in first-run D was also removed.\u003c/p>\n\u003c/li>\n\u003c/ul>\n\u003cp>Round 3b (submitted 2026-11-18):\u003c/p>\n\u003cul>\n\u003cli>\u003cstrong>Settings window:\u003c/strong> B, toolbar tabs General, Search, Folders (\u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-025\u003c/a>). Claude had recommended A.\u003c/li>\n\u003cli>\u003cstrong>Menu bar menu:\u003c/strong> A, Open, Settings, Quit (\u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-026\u003c/a>). Claude had recommended B.\u003c/li>\n\u003cli>\u003cstrong>First run:\u003c/strong> A, one setup window with both steps (\u003ca href=\"#/decisions~round-3-ui-design-spike-2026-11-18\">DEC-027\u003c/a>).\u003c/li>\n\u003c/ul>\n\u003cp>Lesson for later spikes: check previews at the width the form actually gives them, not only in isolation.\u003c/p>\n","backlinks":["index","decisions","plan","spikes/2026-11-18-settings-deep-links"]},{"id":"verification/runs/2026-11-18T154000Z-m1","title":"M1 foundation verification","section":"Verification","order":0,"metadata":{"result":"Passed","status":"Reviewed; fix verified; commit on hold"},"metadataHtml":"\u003cspan>Result: Passed\u003c/span> \u003cspan>Status: Reviewed; fix verified; commit on hold\u003c/span> \u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: M1 foundation verification\nsection: Verification\nupdated: 2026-11-18\nresult: Passed\nstatus: Reviewed; fix verified; commit on hold\n---\n# M1 foundation verification\n\nRun `2026-11-18T154000Z-m1`, initial verification finalized 2026-11-18 15:52 UTC. Codex implemented and verified this build. Claude's [independent review](../../build/m1-foundation.md#review) passed with one packaging fix, now applied and verified in the [post-review note](#post-review-fix). The milestone commit remains on hold until git is set up. **Passed applies to the selected M1 scenarios below, not to the eventual launcher's end-to-end budgets.**\n\n## Scope and build\n\nThis run covers [FEAT-search](../../features/search.md), [FEAT-config](../../features/config.md), the signed app stub, and the measurements required by the [M1 guide](../../build/m1-foundation.md). The selected scenarios exercise ranking, Unicode, scopes, paths, persistence, config error/reload behavior and cancellation; these are the foundation's behavioral boundaries. [Setup](../setup.md) contains executable reproduction commands and cleanup rules.\n\n- macOS 27.0 (26A5368g), Apple M1 Pro, 16 GiB, arm64.\n- Swift 6.4.2 (swiftlang-6.4.2.1.9), Command Line Tools; Swift 6 language mode. No full Xcode or downloaded packages.\n- App version 0.1.0; release arm64; identifier `local.apparate`; minimum system 27.0; accessory bundle.\n- No git repository was initialized and no git state was changed. Initial test and benchmark inputs are in the [source manifest](../../evidence/2026-11-18T154000Z-m1/source-manifest.json). Its SHA-256 is `ded86677af7b28a8c26c8047fbe31043ec633b0cc4259be04ad741e97825bad2`.\n- Binary hashes, bundle metadata, linked system libraries and the verified designated requirement are in [bundle checks](../../evidence/2026-11-18T154000Z-m1/bundle-checks.json).\n- App startup used a test-created `APPARATE_HOME`; stateful Core tests used independent temporary folders. All those folders and the smoke process were cleaned up. Evidence and the built bundle remain available.\n\nThe build emitted linker warnings for nonexistent optional Command Line Tools Developer framework/library search paths. It linked successfully against system libraries, passed strict signature verification and ran the isolated startup check. No package dependency or missing runtime library was required. See the sanitized [build log](../../evidence/2026-11-18T154000Z-m1/build.log).\n\n## Observed results\n\nThe same 20 test groups passed in debug and release. Each group contains multiple assertions; 20 is a group count, not an assertion count.\n\n| Scenario | Expected | Observed | Result | Evidence |\n| --- | --- | --- | --- | --- |\n| Package, bundle and signature | Build release arm64; correct version/minimum OS; fixed designated requirement | `./build.sh` succeeded; `codesign --verify --deep --strict` succeeded; requirement exactly `identifier \"local.apparate\"`; no non-system runtime dependency | Passed | [Bundle checks](../../evidence/2026-11-18T154000Z-m1/bundle-checks.json), [build](../../evidence/2026-11-18T154000Z-m1/build.log) |\n| App startup/config integration | Isolated data directory receives defaults; process stays alive | Only `config.json` created under APPARATE_HOME; validated values; zero stdout/stderr; owned process and folder cleaned up | Passed | [Smoke receipt](../../evidence/2026-11-18T154000Z-m1/app-smoke.json) |\n| Golden queries and matching source | VSC, Code, keyboard la, term, calc, cale and re follow guide; alternate/keyword hits do not fabricate title highlights | Expected first rows and full five-row re order; finite scores and source metadata checked | Passed | [Release tests](../../evidence/2026-11-18T154000Z-m1/tests-release.log) |\n| Tiers, kind order, stable ties and top selection | Bounded top results equal exhaustive order, regardless of input order | Duplicate names retained by unique ID; 400-item mixed corpus checked at limits 1/5/50 across 16 queries, reversed order and usage boosts | Passed | [Release tests](../../evidence/2026-11-18T154000Z-m1/tests-release.log) |\n| Scopes, fallback and spaces | Defaults/reconfigured prefixes obey scope; only unprefixed misses fall back; internal web spaces survive | Empty and explicit misses return no rows; nonempty web/fallback rows retain exact query text | Passed | [Release tests](../../evidence/2026-11-18T154000Z-m1/tests-release.log) |\n| Ordered path matching | Root/name segments, reversed order, distinct ancestors, trailing/repeated/leading separators obey guide | Expected local rows; wrong-order unprefixed miss becomes web fallback; separator-only input gives no rows | Passed | [Release tests](../../evidence/2026-11-18T154000Z-m1/tests-release.log) |\n| Unicode, lengths and masks | Correct displayed-character offsets; no inherited caps; no mask false negatives | Composed/decomposed accents, ß, CJK, width forms, emoji, CRLF, empty name, 300-character name/100-character query; 1,200 generated inputs; all nonempty sampled subsequences survive | Passed | [Release tests](../../evidence/2026-11-18T154000Z-m1/tests-release.log) |\n| Scoring/traceback oracle | Chosen score and highlights achieve the optimal alignment | Exhaustive enumeration for 300 short names agrees with rolling DP and top-result traceback | Passed | [Release tests](../../evidence/2026-11-18T154000Z-m1/tests-release.log) |\n| Usage ranking, decay and persistence | Count halves after 30 days; formula determines boost; no tier/kind crossing; bound and reopen work | Count 20 → 10; boost follows logarithm, not halving; immutable old snapshot; reopened count and opaque IDs retained; 2,005 distinct opens leave 2,000 deterministic records | Passed | [Release tests](../../evidence/2026-11-18T154000Z-m1/tests-release.log) |\n| Config validation and preservation | Defaults/missing keys work; semantic errors collect; types/future versions rejected; bad files untouched | Defined invalid-prefix/folder/depth/URL cases rejected; null/type errors rejected; last valid values retained; newer/broken file bytes preserved even on save attempt | Passed | [Release tests](../../evidence/2026-11-18T154000Z-m1/tests-release.log) |\n| Real config watchers | In-place and atomic edits observed; replacement rearms; errors clear; own save settles | Real file writes/replacements/deletion observed without polling; same-value recovery cleared error; notification count settled | Passed | [Release tests](../../evidence/2026-11-18T154000Z-m1/tests-release.log) |\n| Generation races | Only latest complete results reach owner | Slow worker invalidated by burst; owner invalidated after worker's delivery-enqueue fence; stale callback suppressed; changed index delivered correctly | Passed | [Release tests](../../evidence/2026-11-18T154000Z-m1/tests-release.log) |\n| Debug configuration | All selected correctness groups also pass without release optimization | 20 passed, 0 failed | Passed | [Debug tests](../../evidence/2026-11-18T154000Z-m1/tests-debug.log) |\n| Release measurement capture | Reproducible seeded corpora, complete timed outputs, preparation and footprint recorded | Separate 20k/200k processes; per-keystroke records and consumed-result checksums; tables below | Passed | [20k JSON](../../evidence/2026-11-18T154000Z-m1/benchmark-20k.json), [200k JSON](../../evidence/2026-11-18T154000Z-m1/benchmark-200k.json) |\n\nDuring development, fixture assertions were corrected for extra matching rows in the re corpus, URL directory metadata, a generated combining scalar joining the scope prefix, and a standalone accent that Foundation preserves. The final implementation also treats CRLF as one displayed character. The final debug/release outputs above include the corrected fixtures and that regression case.\n\n## Release measurements\n\nSingle-threaded Core, limit 50, usage λ = 0.5, corpus version 1, seed `4170706172617465`. Five warmups; three repetitions per typed prefix. Each timing includes filtering, scoring, selection and highlight output, and excludes ParsedQuery construction, queue delay, discovery and UI. The benchmark consumes row/highlight/score checksums outside the timing. No build or test jobs ran concurrently with the final measurements.\n\n| Items | Mode | Samples | Median ms | p95 ms | Maximum ms |\n| --- | --- | --- | --- | --- | --- |\n| 20,000 | names | 300 | 0.442 | 0.596 | 1.442 |\n| 20,000 | paths | 189 | 1.705 | 2.658 | 5.555 |\n| 200,000 | names | 300 | 2.788 | 3.516 | 5.015 |\n| 200,000 | paths | 189 | 4.755 | 11.427 | 18.261 |\n\n| Items | Fixture generation ms | SearchIndex build ms | Baseline MiB | After build MiB | After searches MiB |\n| --- | --- | --- | --- | --- | --- |\n| 20,000 | 30.11 | 61.69 | 1.81 | 14.19 | 14.84 |\n| 200,000 | 286.68 | 630.73 | 1.81 | 119.08 | 56.00 |\n\nMemory is `phys_footprint` for the benchmark process, not a peak-allocation measurement. The 200k post-build reading is higher than the 100 MiB provisional app goal; the later search-phase reading is lower. Both are retained here. Preparation/rebuild overlap and the actual app's memory still need M3/M6 measurement.\n\nThe path workload deliberately includes costly and sparse cases. At 200k:\n\n| Query | Samples | Median ms | Maximum ms |\n| --- | --- | --- | --- |\n| `project/` | 12 | 10.044 | 10.378 |\n| `sources/` | 6 | 5.137 | 5.322 |\n| `p/s` | 3 | 3.843 | 4.005 |\n| `s/r` | 3 | 3.736 | 3.743 |\n| `zzqv/` | 3 | 8.945 | 9.071 |\n| `project/test` | 3 | 18.045 | 18.261 |\n\nName-query list: `code`, `terminal`, `calendar`, `calculator`, `readme`, `report`, `network`, `project`, `sources`, `settings`, `archive`, `notes`, `cafe`, `strasse`, `東京`, `zzqv`.\n\nPath-query list: `project/sources`, `project/tests`, `projects/readme`, `workspace/report`, `sources/network`, `docs/notes`, `archive/cafe`, `project/`, `sources/`, `p/s`, `s/r`, `zzqv/`, `project//sources`. Only prefixes that already contain a slash enter the path timing table, including trailing slashes typed before the final segment.\n\nCorpus hashes:\n\n- 20k: `7ac619d313a7456ec01a575985e5bdeb3253f4d577c8fd396a353190a4f759a6`.\n- 200k: `56fb7726eb4e13632f181e3601cf78807455c25be65422eff4646e5e6b309b75`.\n\n## Tuning evidence and remaining limits\n\nThe initial single-threaded 200k baseline (one repetition per prefix) measured name p95 **50.924 ms** and path p95 **267.044 ms**. Its [raw samples](../../evidence/2026-11-18T154000Z-m1/baseline-200k.json) and [input fingerprint](../../evidence/2026-11-18T154000Z-m1/baseline-source-manifest.json) are retained as development evidence, not as the final build result. The full earlier source snapshot was not archived; the final source manifest is the reproducible handoff identity.\n\nThe final implementation skips candidates whose best possible tier/kind cannot enter the heap, uses the finite closed-form score for an optimal consecutive prefix, and caches repeated ancestor-chain scores for each query. It does not add parallel scoring. The exhaustive-alignment and bounded-versus-exhaustive tests guard those optimizations.\n\nFinal name p95 at 200k is below the guide's 8 ms core diagnostic target; path p95 remains above it. That path result and the immediate post-build footprint are review points. They do not justify an end-to-end app pass or an automatic switch to parallel work. The benchmark is synthetic, does not control other activity on the machine, and has no UI/discovery/action work.\n\nOutside the selected M1 scope, therefore **not tested here**: real app/settings discovery, folder crawling and rebuilds, permission prompts, opening items/URLs, system actions, hotkey, panel rendering, visible latency, idle CPU, launch-at-login and upgrades. These remain later milestone work. Independent review passed with the packaging fix recorded below; no commit has been made.\n\n\n## Post-review fix\n\n2026-11-18 16:01 UTC — applied Claude's requested packaging fix: `build.sh` now removes the old `build/Apparate.app` after a successful compile and before assembling its contents.\n\nCreated a synthetic stale resource in the existing bundle, ran `./build.sh`, and confirmed that the resource was absent afterward. Strict signature verification, the fixed designated requirement, arm64 architecture, version/minimum-OS/accessory metadata, system-library dependencies and the bundled fzy notice all passed. See the [rebuild log](../../evidence/2026-11-18T154000Z-m1/post-review-build.log) and [bundle checks](../../evidence/2026-11-18T154000Z-m1/post-review-bundle-checks.json). The rebuilt app also passed the [isolated startup check](../../evidence/2026-11-18T154000Z-m1/post-review-app-smoke.json); its owned process and temporary APPARATE_HOME were cleaned up.\n\nOnly `build.sh` changed among the recorded source/build/test inputs. The [post-review source manifest](../../evidence/2026-11-18T154000Z-m1/post-review-source-manifest.json) has SHA-256 `5cc7eb8a21e1abc358c55c86a48021ae1b1e33cade22a8762911ca7f8afc65fc`. Core/test sources and the release test binary are unchanged, so the earlier correctness and benchmark evidence is retained without another run. The app was relinked; its new binary hash is recorded in the bundle checks and startup was rechecked. The earlier fingerprint check's assumption of an identical app binary was therefore not retained as a requirement.\n\n**Post-review result: Passed.** Claude's requested fix is verified. Commit remains on hold; no git command was run.\n","toc":[{"id":"scope-and-build","title":"Scope and build","depth":2},{"id":"observed-results","title":"Observed results","depth":2},{"id":"release-measurements","title":"Release measurements","depth":2},{"id":"tuning-evidence-and-remaining-limits","title":"Tuning evidence and remaining limits","depth":2},{"id":"post-review-fix","title":"Post-review fix","depth":2}],"titleAnchor":"m1-foundation-verification","links":["build/m1-foundation","verification/runs/2026-11-18T154000Z-m1","features/search","features/config","build/m1-foundation","verification/setup"],"attachments":[{"path":"evidence/2026-11-18T154000Z-m1/source-manifest.json","sha256":"ded86677af7b28a8c26c8047fbe31043ec633b0cc4259be04ad741e97825bad2"},{"path":"evidence/2026-11-18T154000Z-m1/bundle-checks.json","sha256":"d801f6282251ca351fa267cf16824794b4708d3815c9f631b415c45cb10fb24e"},{"path":"evidence/2026-11-18T154000Z-m1/build.log","sha256":"428056ea2fb6933616da9e969d6c59a952c31582aee28a6766633ef0e6b46ed5"},{"path":"evidence/2026-11-18T154000Z-m1/app-smoke.json","sha256":"19ee1b341a21dbc517fa6d18e3d67d9fe8a5750c8a6c408f4d3fddbec7b68629"},{"path":"evidence/2026-11-18T154000Z-m1/tests-release.log","sha256":"14b8ebfb1dd7dd7ef5dc99fe05b334b979f4fe5621a77fc36735716447c13ffc"},{"path":"evidence/2026-11-18T154000Z-m1/tests-debug.log","sha256":"0814f5eb4e2930daefdb15b995f13deb28548d59d6b7d2158bbaa06dd6cf4442"},{"path":"evidence/2026-11-18T154000Z-m1/benchmark-20k.json","sha256":"1a4771cb890d13e528e25b17f1e083d531f10a60af5bccabf647947a78839c9f"},{"path":"evidence/2026-11-18T154000Z-m1/benchmark-200k.json","sha256":"932512fed12c2e3adad8693ca6b4f201223f712e0d05f0832ac6e4ce077182b2"},{"path":"evidence/2026-11-18T154000Z-m1/baseline-200k.json","sha256":"21d714c3f4c0d0a7aa9769e1bf9a901913fdfba8b19678e77971cdbf0ffb56fd"},{"path":"evidence/2026-11-18T154000Z-m1/baseline-source-manifest.json","sha256":"67de74c8c1b03d61520262727b41bd54e788280cae170d8e8138af2726b4a434"},{"path":"evidence/2026-11-18T154000Z-m1/post-review-build.log","sha256":"5890eeb2dc629fee9cef04362f99b50aeb693e0e89c0586c81cd0a0115106989"},{"path":"evidence/2026-11-18T154000Z-m1/post-review-bundle-checks.json","sha256":"6936614a8e106fb9ec3ba896eb80bdbac285facaba64bfc293f4fbcbd1c3fd0d"},{"path":"evidence/2026-11-18T154000Z-m1/post-review-app-smoke.json","sha256":"19ee1b341a21dbc517fa6d18e3d67d9fe8a5750c8a6c408f4d3fddbec7b68629"},{"path":"evidence/2026-11-18T154000Z-m1/post-review-source-manifest.json","sha256":"5cc7eb8a21e1abc358c55c86a48021ae1b1e33cade22a8762911ca7f8afc65fc"}],"html":"\u003cp>Run \u003ccode>2026-11-18T154000Z-m1\u003c/code>, initial verification finalized 2026-11-18 15:52 UTC. Codex implemented and verified this build. Claude's \u003ca href=\"#/build/m1-foundation~review\">independent review\u003c/a> passed with one packaging fix, now applied and verified in the \u003ca href=\"#/verification/runs/2026-11-18T154000Z-m1~post-review-fix\">post-review note\u003c/a>. The milestone commit remains on hold until git is set up. \u003cstrong>Passed applies to the selected M1 scenarios below, not to the eventual launcher's end-to-end budgets.\u003c/strong>\u003c/p>\n\u003ch2 id=\"scope-and-build\">Scope and build\u003c/h2>\n\u003cp>This run covers \u003ca href=\"#/features/search\">FEAT-search\u003c/a>, \u003ca href=\"#/features/config\">FEAT-config\u003c/a>, the signed app stub, and the measurements required by the \u003ca href=\"#/build/m1-foundation\">M1 guide\u003c/a>. The selected scenarios exercise ranking, Unicode, scopes, paths, persistence, config error/reload behavior and cancellation; these are the foundation's behavioral boundaries. \u003ca href=\"#/verification/setup\">Setup\u003c/a> contains executable reproduction commands and cleanup rules.\u003c/p>\n\u003cul>\n\u003cli>macOS 27.0 (26A5368g), Apple M1 Pro, 16 GiB, arm64.\u003c/li>\n\u003cli>Swift 6.4.2 (swiftlang-6.4.2.1.9), Command Line Tools; Swift 6 language mode. No full Xcode or downloaded packages.\u003c/li>\n\u003cli>App version 0.1.0; release arm64; identifier \u003ccode>local.apparate\u003c/code>; minimum system 27.0; accessory bundle.\u003c/li>\n\u003cli>No git repository was initialized and no git state was changed. Initial test and benchmark inputs are in the \u003ca href=\"evidence/2026-11-18T154000Z-m1/source-manifest.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: ded86677af7b28a8c26c8047fbe31043ec633b0cc4259be04ad741e97825bad2\">source manifest\u003c/a>. Its SHA-256 is \u003ccode>ded86677af7b28a8c26c8047fbe31043ec633b0cc4259be04ad741e97825bad2\u003c/code>.\u003c/li>\n\u003cli>Binary hashes, bundle metadata, linked system libraries and the verified designated requirement are in \u003ca href=\"evidence/2026-11-18T154000Z-m1/bundle-checks.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: d801f6282251ca351fa267cf16824794b4708d3815c9f631b415c45cb10fb24e\">bundle checks\u003c/a>.\u003c/li>\n\u003cli>App startup used a test-created \u003ccode>APPARATE_HOME\u003c/code>; stateful Core tests used independent temporary folders. All those folders and the smoke process were cleaned up. Evidence and the built bundle remain available.\u003c/li>\n\u003c/ul>\n\u003cp>The build emitted linker warnings for nonexistent optional Command Line Tools Developer framework/library search paths. It linked successfully against system libraries, passed strict signature verification and ran the isolated startup check. No package dependency or missing runtime library was required. See the sanitized \u003ca href=\"evidence/2026-11-18T154000Z-m1/build.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 428056ea2fb6933616da9e969d6c59a952c31582aee28a6766633ef0e6b46ed5\">build log\u003c/a>.\u003c/p>\n\u003ch2 id=\"observed-results\">Observed results\u003c/h2>\n\u003cp>The same 20 test groups passed in debug and release. Each group contains multiple assertions; 20 is a group count, not an assertion count.\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>Scenario\u003c/th>\n\u003cth>Expected\u003c/th>\n\u003cth>Observed\u003c/th>\n\u003cth>Result\u003c/th>\n\u003cth>Evidence\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>Package, bundle and signature\u003c/td>\n\u003ctd>Build release arm64; correct version/minimum OS; fixed designated requirement\u003c/td>\n\u003ctd>\u003ccode>./build.sh\u003c/code> succeeded; \u003ccode>codesign --verify --deep --strict\u003c/code> succeeded; requirement exactly \u003ccode>identifier \"local.apparate\"\u003c/code>; no non-system runtime dependency\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-18T154000Z-m1/bundle-checks.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: d801f6282251ca351fa267cf16824794b4708d3815c9f631b415c45cb10fb24e\">Bundle checks\u003c/a>, \u003ca href=\"evidence/2026-11-18T154000Z-m1/build.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 428056ea2fb6933616da9e969d6c59a952c31582aee28a6766633ef0e6b46ed5\">build\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>App startup/config integration\u003c/td>\n\u003ctd>Isolated data directory receives defaults; process stays alive\u003c/td>\n\u003ctd>Only \u003ccode>config.json\u003c/code> created under APPARATE_HOME; validated values; zero stdout/stderr; owned process and folder cleaned up\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-18T154000Z-m1/app-smoke.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 19ee1b341a21dbc517fa6d18e3d67d9fe8a5750c8a6c408f4d3fddbec7b68629\">Smoke receipt\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Golden queries and matching source\u003c/td>\n\u003ctd>VSC, Code, keyboard la, term, calc, cale and re follow guide; alternate/keyword hits do not fabricate title highlights\u003c/td>\n\u003ctd>Expected first rows and full five-row re order; finite scores and source metadata checked\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-18T154000Z-m1/tests-release.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 14b8ebfb1dd7dd7ef5dc99fe05b334b979f4fe5621a77fc36735716447c13ffc\">Release tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Tiers, kind order, stable ties and top selection\u003c/td>\n\u003ctd>Bounded top results equal exhaustive order, regardless of input order\u003c/td>\n\u003ctd>Duplicate names retained by unique ID; 400-item mixed corpus checked at limits 1/5/50 across 16 queries, reversed order and usage boosts\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-18T154000Z-m1/tests-release.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 14b8ebfb1dd7dd7ef5dc99fe05b334b979f4fe5621a77fc36735716447c13ffc\">Release tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scopes, fallback and spaces\u003c/td>\n\u003ctd>Defaults/reconfigured prefixes obey scope; only unprefixed misses fall back; internal web spaces survive\u003c/td>\n\u003ctd>Empty and explicit misses return no rows; nonempty web/fallback rows retain exact query text\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-18T154000Z-m1/tests-release.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 14b8ebfb1dd7dd7ef5dc99fe05b334b979f4fe5621a77fc36735716447c13ffc\">Release tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Ordered path matching\u003c/td>\n\u003ctd>Root/name segments, reversed order, distinct ancestors, trailing/repeated/leading separators obey guide\u003c/td>\n\u003ctd>Expected local rows; wrong-order unprefixed miss becomes web fallback; separator-only input gives no rows\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-18T154000Z-m1/tests-release.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 14b8ebfb1dd7dd7ef5dc99fe05b334b979f4fe5621a77fc36735716447c13ffc\">Release tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Unicode, lengths and masks\u003c/td>\n\u003ctd>Correct displayed-character offsets; no inherited caps; no mask false negatives\u003c/td>\n\u003ctd>Composed/decomposed accents, ß, CJK, width forms, emoji, CRLF, empty name, 300-character name/100-character query; 1,200 generated inputs; all nonempty sampled subsequences survive\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-18T154000Z-m1/tests-release.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 14b8ebfb1dd7dd7ef5dc99fe05b334b979f4fe5621a77fc36735716447c13ffc\">Release tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Scoring/traceback oracle\u003c/td>\n\u003ctd>Chosen score and highlights achieve the optimal alignment\u003c/td>\n\u003ctd>Exhaustive enumeration for 300 short names agrees with rolling DP and top-result traceback\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-18T154000Z-m1/tests-release.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 14b8ebfb1dd7dd7ef5dc99fe05b334b979f4fe5621a77fc36735716447c13ffc\">Release tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Usage ranking, decay and persistence\u003c/td>\n\u003ctd>Count halves after 30 days; formula determines boost; no tier/kind crossing; bound and reopen work\u003c/td>\n\u003ctd>Count 20 → 10; boost follows logarithm, not halving; immutable old snapshot; reopened count and opaque IDs retained; 2,005 distinct opens leave 2,000 deterministic records\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-18T154000Z-m1/tests-release.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 14b8ebfb1dd7dd7ef5dc99fe05b334b979f4fe5621a77fc36735716447c13ffc\">Release tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Config validation and preservation\u003c/td>\n\u003ctd>Defaults/missing keys work; semantic errors collect; types/future versions rejected; bad files untouched\u003c/td>\n\u003ctd>Defined invalid-prefix/folder/depth/URL cases rejected; null/type errors rejected; last valid values retained; newer/broken file bytes preserved even on save attempt\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-18T154000Z-m1/tests-release.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 14b8ebfb1dd7dd7ef5dc99fe05b334b979f4fe5621a77fc36735716447c13ffc\">Release tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Real config watchers\u003c/td>\n\u003ctd>In-place and atomic edits observed; replacement rearms; errors clear; own save settles\u003c/td>\n\u003ctd>Real file writes/replacements/deletion observed without polling; same-value recovery cleared error; notification count settled\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-18T154000Z-m1/tests-release.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 14b8ebfb1dd7dd7ef5dc99fe05b334b979f4fe5621a77fc36735716447c13ffc\">Release tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Generation races\u003c/td>\n\u003ctd>Only latest complete results reach owner\u003c/td>\n\u003ctd>Slow worker invalidated by burst; owner invalidated after worker's delivery-enqueue fence; stale callback suppressed; changed index delivered correctly\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-18T154000Z-m1/tests-release.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 14b8ebfb1dd7dd7ef5dc99fe05b334b979f4fe5621a77fc36735716447c13ffc\">Release tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Debug configuration\u003c/td>\n\u003ctd>All selected correctness groups also pass without release optimization\u003c/td>\n\u003ctd>20 passed, 0 failed\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-18T154000Z-m1/tests-debug.log\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 0814f5eb4e2930daefdb15b995f13deb28548d59d6b7d2158bbaa06dd6cf4442\">Debug tests\u003c/a>\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>Release measurement capture\u003c/td>\n\u003ctd>Reproducible seeded corpora, complete timed outputs, preparation and footprint recorded\u003c/td>\n\u003ctd>Separate 20k/200k processes; per-keystroke records and consumed-result checksums; tables below\u003c/td>\n\u003ctd>Passed\u003c/td>\n\u003ctd>\u003ca href=\"evidence/2026-11-18T154000Z-m1/benchmark-20k.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 1a4771cb890d13e528e25b17f1e083d531f10a60af5bccabf647947a78839c9f\">20k JSON\u003c/a>, \u003ca href=\"evidence/2026-11-18T154000Z-m1/benchmark-200k.json\" target=\"_blank\" rel=\"noreferrer\" title=\"SHA-256: 932512fed12c2e3adad8693ca6b4f201223f712e0d05f0832ac6e4ce077182b2\">200k JSON\u003c/a>\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>During development, fixture assertions were corrected for extra matching rows in the re corpus, URL directory metadata, a generated combining scalar joining the scope prefix, and a standalone accent that Foundation preserves. The final implementation also treats CRLF as one displayed character. The final debug/release outputs above include the corrected fixtures and that regression case.\u003c/p>\n\u003ch2 id=\"release-measurements\">Release measurements\u003c/h2>\n\u003cp>Single-threaded Core, limit 50, usage λ = 0.5, corpus version 1, seed \u003ccode>4170706172617465\u003c/code>. Five warmups; three repetitions per typed prefix. Each timing includes filtering, scoring, selection and highlight output, and
