Claude's error.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>Watch the file and the folder, not the folder alone. Clear the error when a broken file is fixed. Report a parse error alone, and value errors together. Validate the whole URL with a sample query. Detect duplicate folders lexically.\u003c/td>\n\u003ctd>Accepted.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>Keep spaces inside the query. The web fallback applies only to queries without a prefix. Add a backslash escape to search a prefix character literally.\u003c/td>\n\u003ctd>Spaces and fallback accepted. \u003cstrong>Escape not adopted:\u003c/strong> no established need, per \u003ccode>rule-lean\u003c/code>. Names starting with \u003ccode>.\u003c/code> are hidden and never indexed, and fuzzy matching finds \u003ccode>'notes\u003c/code> or \u003ccode>?draft\u003c/code> without the leading mark. If Codex still disagrees, it goes to the user.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>IDs are opaque, with escaped parts. Identity across renames is decided with the real sources.\u003c/td>\n\u003ctd>Accepted.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>Accepts proposals 3 and 4. Record which name matched, with no highlights for alternate names or keywords. Update the plan's ranking wording.\u003c/td>\n\u003ctd>Accepted; the \u003ca href=\"#/plan~m1-foundation-matching-and-ranking\">plan\u003c/a> is updated.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>Accepts the path rules, with edge cases. A separator-only query lists every indexed path. Measure the costly cases.\u003c/td>\n\u003ctd>Edge cases and measurements accepted. \u003cstrong>A separator-only query gives no rows,\u003c/strong> like an empty query: listing every indexed path helps nobody.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>7\u003c/td>\n\u003ctd>Scope the Swift 6 claim. Make the final check and delivery atomic on one owner. Single-threaded scoring; parallelism only with evidence at review.\u003c/td>\n\u003ctd>Accepted.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>8\u003c/td>\n\u003ctd>A seeded synthetic corpus for M1 measurements.\u003c/td>\n\u003ctd>Accepted.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003ch2 id=\"review\">Review\u003c/h2>\n\u003cp>Claude reviewed M1 on 2026-11-18: all of \u003ccode>Sources/\u003c/code>, \u003ccode>Tests/\u003c/code>, \u003ccode>build.sh\u003c/code>, \u003ccode>Package.swift\u003c/code>, the \u003ca href=\"#/verification/runs/2026-11-18T154000Z-m1\">verification run\u003c/a>, the feature pages and the evidence. Claude re-ran \u003ccode>swift run ApparateCoreTests\u003c/code> independently: 20 groups passed, 0 failed. The records and evidence contain no personal names or paths.\u003c/p>\n\u003cp>\u003cstrong>Result: passed, with one fix.\u003c/strong>\u003c/p>\n\u003ctable>\n\u003cthead>\n\u003ctr>\n\u003cth>#\u003c/th>\n\u003cth>Finding\u003c/th>\n\u003cth>Action\u003c/th>\n\u003c/tr>\n\u003c/thead>\n\u003ctbody>\u003ctr>\n\u003ctd>1\u003c/td>\n\u003ctd>\u003ccode>build.sh\u003c/code> writes into an existing \u003ccode>build/Apparate.app\u003c/code> without clearing it, so a file removed from the build would survive in the bundle, and later in the release zip.\u003c/td>\n\u003ctd>\u003cstrong>Fix now:\u003c/strong> remove the old bundle before assembling, as Klip's \u003ccode>build.sh\u003c/code> does.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>2\u003c/td>\n\u003ctd>\u003ccode>SearchIndex\u003c/code> throws on a duplicate ID, so one duplicate from a real source would fail the whole index. On this Mac, Safari is reachable both through \u003ccode>/Applications\u003c/code> and its system path.\u003c/td>\n\u003ctd>M2: sources de-duplicate before building; the throw stays as a guard.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>3\u003c/td>\n\u003ctd>Each item keeps its full ID, name and path as strings. At 200,000 items the core read 119 MiB right after building and 56 MiB after searching.\u003c/td>\n\u003ctd>M3: store file entries compactly (folder node plus name), and derive the path and ID when needed. Measure on real data.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>4\u003c/td>\n\u003ctd>Path segments can match folders above the indexed folder (\u003ccode>users/\u003c/code> matches everything).\u003c/td>\n\u003ctd>M3: ancestor chains start at the indexed folder's name, as §7 intended.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>5\u003c/td>\n\u003ctd>When an alternate name wins (\u003ccode>code\u003c/code> → \"Code\"), the displayed name shows no bold letters, even though \"Code\" in \"Visual Studio Code\" also matches.\u003c/td>\n\u003ctd>M4: show the displayed name's highlights when the name also matches.\u003c/td>\n\u003c/tr>\n\u003ctr>\n\u003ctd>6\u003c/td>\n\u003ctd>Any change in the data folder, including SQLite's journal files when usage is recorded, re-reads \u003ccode>config.json\u003c/code>.\u003c/td>\n\u003ctd>Accepted: the read is small and an unchanged config does nothing.\u003c/td>\n\u003c/tr>\n\u003c/tbody>\u003c/table>\n\u003cp>Accepted as measured: path search at 200,000 items is 11.4 ms p95 (18.3 ms maximum), above the 8 ms diagnostic target but inside the end-to-end goal of \u003ca href=\"#/decisions~round-1-2026-11-18\">DEC-008\u003c/a>. Revisit it in M3 with real folders.\u003c/p>\n\u003ch2 id=\"records\">Records\u003c/h2>\n\u003cul>\n\u003cli>\u003cstrong>Features:\u003c/strong> add \u003ccode>features/search.md\u003c/code> (\u003ccode>FEAT-search\u003c/code>: parsing, scopes, matching, tiers, ranking, path mode, fallback row, usage) and \u003ccode>features/config.md\u003c/code> (\u003ccode>FEAT-config\u003c/code>), with verification recipes.\u003c/li>\n\u003cli>\u003cstrong>Setup:\u003c/strong> add \u003ccode>verification/setup.md\u003c/code>, covering build, test and data-folder isolation.\u003c/li>\n\u003cli>\u003cstrong>Run:\u003c/strong> record one run for M1 with the results table, the timings from §12, and the tested revision.\u003c/li>\n\u003cli>\u003cstrong>Progress:\u003c/strong> update the table in the \u003ca href=\"#/plan~progress\">plan\u003c/a>.\u003c/li>\n\u003c/ul>\n","backlinks":["index","build/index","features/config","features/search","plan","verification/runs/2026-11-18T154000Z-m1"]},{"id":"features/config","title":"Config","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Config\nsection: Features\nupdated: 2026-11-18\n---\n# Config\n\n**FEAT-config.** Keep settings editable and persistent while a malformed external edit leaves the last valid settings active. The schema and behavior follow the [M1 guide](../build/m1-foundation.md#3-config) and [DEC-003](../decisions.md#round-1-2026-11-18).\n\n## Entry points and prerequisites\n\nThe app stub resolves `APPARATE_HOME` when nonempty, otherwise its Application Support folder, and creates `ConfigStore(directory:)`. M1 runs must supply an isolated temporary `APPARATE_HOME`. The store owns `config.json`, offers `current`, `errors`, `save` and `onChange`, and runs on MainActor. `ConfigStore.decode` validates supplied JSON without filesystem access. The eventual settings window is not built yet.\n\n## Expected outcomes\n\n- Missing `config.json` creates version-1 defaults. Missing keys receive defaults; unknown keys are ignored. Explicit null and wrong value types are invalid. Launch-at-login state is not in this file.\n- The whole document is accepted or rejected. Broken JSON or a type error produces one error; structurally valid documents collect all value errors. A failure preserves the last valid config (defaults at first launch) and never overwrites the bad file. `save` also refuses to overwrite an existing broken or newer-version file.\n- Prefixes must be unique single symbols for known scopes, with no letters, digits, whitespace/control characters, `/` or `~`. Folder paths must be absolute after tilde expansion, lexically distinct, with depth 1–30. Validation does not check whether a folder exists. Search URLs require exactly one `{query}`, an HTTP(S) scheme and a nonempty host after sample substitution.\n- Saving is atomic, sorted and pretty-printed. File and directory vnode sources catch in-place writes, atomic replacement and deletion. Replacement rearms the file watch. Deleting the file recreates defaults. There is no polling.\n- An unchanged valid reload does not notify again. Fixing an invalid file clears errors and notifies even when its config equals the last valid value. Own saves produce no reload loop.\n\nDefaults include Command-Space, a visible menu-bar icon, four home-relative roots at depth 10, `.gitignore` handling enabled, and the DuckDuckGo URL template. These are stored settings only in M1; no hotkey, menu item, filesystem crawl or web action is installed.\n\n## Verification recipe\n\nUse [setup](../verification/setup.md), then `swift run ApparateCoreTests`. Config scenarios create a fresh directory, inspect the actual file, save and reopen it, supply invalid documents, and perform real in-place writes, atomic replacements and deletion. The watcher tests await observable notifications rather than calling reload for those events. They also restore the same valid settings after an error and check that own saves settle without repeated notifications.\n\nAfter `./build.sh`, run `python3 Tests/smoke-app.py`. This launches the bundle executable directly with a fresh `APPARATE_HOME`, waits for its defaults file, checks that the process is alive and only `config.json` was created there, then stops that process and removes its folder. It invokes no window or action entry point.\n\n## Coverage and limits\n\nCovered: first launch, defaults, semantic/type errors, future version, last-valid preservation, atomic serialization, real vnode notifications and recovery. Uncovered in M1: the future settings UI and write failures caused by real user folder permissions. The smoke helper verifies startup/config integration; it does not measure on-screen behavior.\n\n## Verification history\n\n- [M1 build verification](../verification/runs/2026-11-18T154000Z-m1.md) — exact build, observed outcomes and evidence; Claude's review passed and the packaging fix is verified in the post-review note.\n","toc":[{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limits","title":"Coverage and limits","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"config","links":["build/m1-foundation","decisions","verification/setup","verification/runs/2026-11-18T154000Z-m1"],"attachments":[],"html":"\u003cp>\u003cstrong>FEAT-config.\u003c/strong> Keep settings editable and persistent while a malformed external edit leaves the last valid settings active. The schema and behavior follow the \u003ca href=\"#/build/m1-foundation~3-config\">M1 guide\u003c/a> and \u003ca href=\"#/decisions~round-1-2026-11-18\">DEC-003\u003c/a>.\u003c/p>\n\u003ch2 id=\"entry-points-and-prerequisites\">Entry points and prerequisites\u003c/h2>\n\u003cp>The app stub resolves \u003ccode>APPARATE_HOME\u003c/code> when nonempty, otherwise its Application Support folder, and creates \u003ccode>ConfigStore(directory:)\u003c/code>. M1 runs must supply an isolated temporary \u003ccode>APPARATE_HOME\u003c/code>. The store owns \u003ccode>config.json\u003c/code>, offers \u003ccode>current\u003c/code>, \u003ccode>errors\u003c/code>, \u003ccode>save\u003c/code> and \u003ccode>onChange\u003c/code>, and runs on MainActor. \u003ccode>ConfigStore.decode\u003c/code> validates supplied JSON without filesystem access. The eventual settings window is not built yet.\u003c/p>\n\u003ch2 id=\"expected-outcomes\">Expected outcomes\u003c/h2>\n\u003cul>\n\u003cli>Missing \u003ccode>config.json\u003c/code> creates version-1 defaults. Missing keys receive defaults; unknown keys are ignored. Explicit null and wrong value types are invalid. Launch-at-login state is not in this file.\u003c/li>\n\u003cli>The whole document is accepted or rejected. Broken JSON or a type error produces one error; structurally valid documents collect all value errors. A failure preserves the last valid config (defaults at first launch) and never overwrites the bad file. \u003ccode>save\u003c/code> also refuses to overwrite an existing broken or newer-version file.\u003c/li>\n\u003cli>Prefixes must be unique single symbols for known scopes, with no letters, digits, whitespace/control characters, \u003ccode>/\u003c/code> or \u003ccode>~\u003c/code>. Folder paths must be absolute after tilde expansion, lexically distinct, with depth 1–30. Validation does not check whether a folder exists. Search URLs require exactly one \u003ccode>{query}\u003c/code>, an HTTP(S) scheme and a nonempty host after sample substitution.\u003c/li>\n\u003cli>Saving is atomic, sorted and pretty-printed. File and directory vnode sources catch in-place writes, atomic replacement and deletion. Replacement rearms the file watch. Deleting the file recreates defaults. There is no polling.\u003c/li>\n\u003cli>An unchanged valid reload does not notify again. Fixing an invalid file clears errors and notifies even when its config equals the last valid value. Own saves produce no reload loop.\u003c/li>\n\u003c/ul>\n\u003cp>Defaults include Command-Space, a visible menu-bar icon, four home-relative roots at depth 10, \u003ccode>.gitignore\u003c/code> handling enabled, and the DuckDuckGo URL template. These are stored settings only in M1; no hotkey, menu item, filesystem crawl or web action is installed.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Use \u003ca href=\"#/verification/setup\">setup\u003c/a>, then \u003ccode>swift run ApparateCoreTests\u003c/code>. Config scenarios create a fresh directory, inspect the actual file, save and reopen it, supply invalid documents, and perform real in-place writes, atomic replacements and deletion. The watcher tests await observable notifications rather than calling reload for those events. They also restore the same valid settings after an error and check that own saves settle without repeated notifications.\u003c/p>\n\u003cp>After \u003ccode>./build.sh\u003c/code>, run \u003ccode>python3 Tests/smoke-app.py\u003c/code>. This launches the bundle executable directly with a fresh \u003ccode>APPARATE_HOME\u003c/code>, waits for its defaults file, checks that the process is alive and only \u003ccode>config.json\u003c/code> was created there, then stops that process and removes its folder. It invokes no window or action entry point.\u003c/p>\n\u003ch2 id=\"coverage-and-limits\">Coverage and limits\u003c/h2>\n\u003cp>Covered: first launch, defaults, semantic/type errors, future version, last-valid preservation, atomic serialization, real vnode notifications and recovery. Uncovered in M1: the future settings UI and write failures caused by real user folder permissions. The smoke helper verifies startup/config integration; it does not measure on-screen behavior.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-18T154000Z-m1\">M1 build verification\u003c/a> — exact build, observed outcomes and evidence; Claude's review passed and the packaging fix is verified in the post-review note.\u003c/li>\n\u003c/ul>\n","backlinks":["features/index","features/search","verification/runs/2026-11-18T154000Z-m1"]},{"id":"features/index","title":"Features","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Features\nsection: Features\nupdated: 2026-11-18\n---\n# Features\n\nM1 implements the headless foundation. The launcher interface and real data sources arrive in later [milestones](../plan.md).\n\n- [Search](search.md) — FEAT-search: scopes, names, paths, ranking, usage and complete result delivery.\n- [Config](config.md) — FEAT-config: versioned JSON, validation, last-valid state and external edits.\n\nSee [verification setup](../verification/setup.md) for repeatable commands and isolation.\n","toc":[],"titleAnchor":"features","links":["plan","features/search","features/config","verification/setup"],"attachments":[],"html":"\u003cp>M1 implements the headless foundation. The launcher interface and real data sources arrive in later \u003ca href=\"#/plan\">milestones\u003c/a>.\u003c/p>\n\u003cul>\n\u003cli>\u003ca href=\"#/features/search\">Search\u003c/a> — FEAT-search: scopes, names, paths, ranking, usage and complete result delivery.\u003c/li>\n\u003cli>\u003ca href=\"#/features/config\">Config\u003c/a> — FEAT-config: versioned JSON, validation, last-valid state and external edits.\u003c/li>\n\u003c/ul>\n\u003cp>See \u003ca href=\"#/verification/setup\">verification setup\u003c/a> for repeatable commands and isolation.\u003c/p>\n","backlinks":["index","plan"]},{"id":"features/search","title":"Search","section":"Features","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Search\nsection: Features\nupdated: 2026-11-18\n---\n# Search\n\n**FEAT-search.** Find the intended item with a short query and stable, explainable ordering. The expected behavior comes from the [M1 guide](../build/m1-foundation.md), [plan](../plan.md#m1-foundation-matching-and-ranking), and [decisions](../decisions.md). This page describes the built Core interface; a panel, real sources and actions are outside M1.\n\n## Entry points and prerequisites\n\nThe Core library accepts fixture-supplied `SearchItem` values in an immutable `SearchIndex`. IDs are opaque and unique; duplicate IDs are rejected. `ParsedQuery(raw, config:)` applies [config](config.md), `SearchIndex.search` returns the best 50 rows, and `SearchCoordinator.submit` computes on a serial worker and delivers on MainActor. Call `invalidate` when a query, config or index becomes obsolete, or submit its replacement. A submission captures an index, parsed query and usage snapshot.\n\n`UsageStore` owns `index.sqlite` through an actor. Only a successful future action should call `recordSuccessfulOpen`; selecting or viewing a result is not an open. M1 tests invoke this boundary with synthetic IDs and an injected clock.\n\n## Expected outcomes\n\n- Whitespace at query boundaries is trimmed. Internal web-query spacing is preserved. Defaults are `'` for files and folders, `.` for settings, and `?` for web. Config can assign apps and commands prefixes too. There is no escape syntax.\n- Explicit web queries return one row; empty queries return none. Only unprefixed queries with no local matches receive a web fallback. A path query with no local matches follows that same fallback rule.\n- Matching folds case, diacritics and width. Tiers are exact, prefix, word/acronym, fuzzy, then settings keyword. A result identifies its matching name, alternate or keyword(s); only the displayed name receives character-index highlights. Unicode expansions map back to one displayed character.\n- Ranking is tier, kind (apps/commands, settings, folders, files), text score plus bounded usage, folded display name, then ID. Text scores stay finite. Input order does not affect ties; duplicate names with different IDs remain separate rows.\n- A slash activates path mode after explicit prefix parsing. Only files and folders participate. The last segment matches the basename; earlier segments match distinct ancestors in order, allowing gaps. Leading `/` or `~/` does not anchor the search. Repeated separators are ignored; trailing `/` searches descendants; separator-only input returns no rows.\n- Usage counts have a 30-day half-life. Boost is `0.5 * min(1, log1p(count) / log1p(20))`, bounded at 0.5, and cannot cross a tier or kind boundary. At most 2,000 records survive, dropping the lowest decayed counts with ID as a deterministic tie-breaker. A snapshot stays unchanged after subsequent opens.\n- New work invalidates old work. The worker checks cancellation in 256-item chunks; the owner checks the generation again immediately before synchronous delivery. No partial or obsolete result set is published.\n\nASCII uses byte buffers with implicit character offsets; Unicode uses scalar buffers and explicit maps. Prepared ancestor chains are shared. Bounded selection and tier/kind pruning preserve the complete-sort ordering. Query-local parent-score caching was added after the baseline showed repeated path scoring dominated cost.\n\n## Verification recipe\n\nFollow [setup](../verification/setup.md). Run `swift run ApparateCoreTests` for the golden queries, prefix and fallback variants, path edges, Unicode highlights, long inputs, 1,200 generated mask cases, exhaustive short-alignment scoring, bounded-selection equivalence, usage decay/persistence/bounds and controlled generation races. Each stateful scenario creates and removes its own temporary directory.\n\nFor release measurements, build `ApparateCoreTests` with `-c release` and run its `--benchmark 20000 --rounds 3` and `--benchmark 200000 --rounds 3` modes in separate processes. Exact commands are in setup. Output includes the seed, corpus hash, query list, per-keystroke samples, top-50/highlight checksum, preparation time and physical footprint. Do not run other build/test jobs concurrently with measurements.\n\n## Coverage and limits\n\nThese checks exercise real Core entry points and SQLite persistence, using synthetic data only. They do not prove end-to-end launcher latency, crawling behavior, AppKit rendering, action success, permission behavior or idle CPU. Those need later milestones. Report core timings separately from [DEC-008](../decisions.md)'s provisional app budgets.\n\n## Verification history\n\n- [M1 build verification](../verification/runs/2026-11-18T154000Z-m1.md) — build-specific outcomes, measurements and source fingerprints; Claude's review passed and the packaging fix is verified in the post-review note.\n","toc":[{"id":"entry-points-and-prerequisites","title":"Entry points and prerequisites","depth":2},{"id":"expected-outcomes","title":"Expected outcomes","depth":2},{"id":"verification-recipe","title":"Verification recipe","depth":2},{"id":"coverage-and-limits","title":"Coverage and limits","depth":2},{"id":"verification-history","title":"Verification history","depth":2}],"titleAnchor":"search","links":["build/m1-foundation","plan","decisions","features/config","verification/setup","decisions","verification/runs/2026-11-18T154000Z-m1"],"attachments":[],"html":"\u003cp>\u003cstrong>FEAT-search.\u003c/strong> Find the intended item with a short query and stable, explainable ordering. The expected behavior comes from the \u003ca href=\"#/build/m1-foundation\">M1 guide\u003c/a>, \u003ca href=\"#/plan~m1-foundation-matching-and-ranking\">plan\u003c/a>, and \u003ca href=\"#/decisions\">decisions\u003c/a>. This page describes the built Core interface; a panel, real sources and actions are outside M1.\u003c/p>\n\u003ch2 id=\"entry-points-and-prerequisites\">Entry points and prerequisites\u003c/h2>\n\u003cp>The Core library accepts fixture-supplied \u003ccode>SearchItem\u003c/code> values in an immutable \u003ccode>SearchIndex\u003c/code>. IDs are opaque and unique; duplicate IDs are rejected. \u003ccode>ParsedQuery(raw, config:)\u003c/code> applies \u003ca href=\"#/features/config\">config\u003c/a>, \u003ccode>SearchIndex.search\u003c/code> returns the best 50 rows, and \u003ccode>SearchCoordinator.submit\u003c/code> computes on a serial worker and delivers on MainActor. Call \u003ccode>invalidate\u003c/code> when a query, config or index becomes obsolete, or submit its replacement. A submission captures an index, parsed query and usage snapshot.\u003c/p>\n\u003cp>\u003ccode>UsageStore\u003c/code> owns \u003ccode>index.sqlite\u003c/code> through an actor. Only a successful future action should call \u003ccode>recordSuccessfulOpen\u003c/code>; selecting or viewing a result is not an open. M1 tests invoke this boundary with synthetic IDs and an injected clock.\u003c/p>\n\u003ch2 id=\"expected-outcomes\">Expected outcomes\u003c/h2>\n\u003cul>\n\u003cli>Whitespace at query boundaries is trimmed. Internal web-query spacing is preserved. Defaults are \u003ccode>'\u003c/code> for files and folders, \u003ccode>.\u003c/code> for settings, and \u003ccode>?\u003c/code> for web. Config can assign apps and commands prefixes too. There is no escape syntax.\u003c/li>\n\u003cli>Explicit web queries return one row; empty queries return none. Only unprefixed queries with no local matches receive a web fallback. A path query with no local matches follows that same fallback rule.\u003c/li>\n\u003cli>Matching folds case, diacritics and width. Tiers are exact, prefix, word/acronym, fuzzy, then settings keyword. A result identifies its matching name, alternate or keyword(s); only the displayed name receives character-index highlights. Unicode expansions map back to one displayed character.\u003c/li>\n\u003cli>Ranking is tier, kind (apps/commands, settings, folders, files), text score plus bounded usage, folded display name, then ID. Text scores stay finite. Input order does not affect ties; duplicate names with different IDs remain separate rows.\u003c/li>\n\u003cli>A slash activates path mode after explicit prefix parsing. Only files and folders participate. The last segment matches the basename; earlier segments match distinct ancestors in order, allowing gaps. Leading \u003ccode>/\u003c/code> or \u003ccode>~/\u003c/code> does not anchor the search. Repeated separators are ignored; trailing \u003ccode>/\u003c/code> searches descendants; separator-only input returns no rows.\u003c/li>\n\u003cli>Usage counts have a 30-day half-life. Boost is \u003ccode>0.5 * min(1, log1p(count) / log1p(20))\u003c/code>, bounded at 0.5, and cannot cross a tier or kind boundary. At most 2,000 records survive, dropping the lowest decayed counts with ID as a deterministic tie-breaker. A snapshot stays unchanged after subsequent opens.\u003c/li>\n\u003cli>New work invalidates old work. The worker checks cancellation in 256-item chunks; the owner checks the generation again immediately before synchronous delivery. No partial or obsolete result set is published.\u003c/li>\n\u003c/ul>\n\u003cp>ASCII uses byte buffers with implicit character offsets; Unicode uses scalar buffers and explicit maps. Prepared ancestor chains are shared. Bounded selection and tier/kind pruning preserve the complete-sort ordering. Query-local parent-score caching was added after the baseline showed repeated path scoring dominated cost.\u003c/p>\n\u003ch2 id=\"verification-recipe\">Verification recipe\u003c/h2>\n\u003cp>Follow \u003ca href=\"#/verification/setup\">setup\u003c/a>. Run \u003ccode>swift run ApparateCoreTests\u003c/code> for the golden queries, prefix and fallback variants, path edges, Unicode highlights, long inputs, 1,200 generated mask cases, exhaustive short-alignment scoring, bounded-selection equivalence, usage decay/persistence/bounds and controlled generation races. Each stateful scenario creates and removes its own temporary directory.\u003c/p>\n\u003cp>For release measurements, build \u003ccode>ApparateCoreTests\u003c/code> with \u003ccode>-c release\u003c/code> and run its \u003ccode>--benchmark 20000 --rounds 3\u003c/code> and \u003ccode>--benchmark 200000 --rounds 3\u003c/code> modes in separate processes. Exact commands are in setup. Output includes the seed, corpus hash, query list, per-keystroke samples, top-50/highlight checksum, preparation time and physical footprint. Do not run other build/test jobs concurrently with measurements.\u003c/p>\n\u003ch2 id=\"coverage-and-limits\">Coverage and limits\u003c/h2>\n\u003cp>These checks exercise real Core entry points and SQLite persistence, using synthetic data only. They do not prove end-to-end launcher latency, crawling behavior, AppKit rendering, action success, permission behavior or idle CPU. Those need later milestones. Report core timings separately from \u003ca href=\"#/decisions\">DEC-008\u003c/a>'s provisional app budgets.\u003c/p>\n\u003ch2 id=\"verification-history\">Verification history\u003c/h2>\n\u003cul>\n\u003cli>\u003ca href=\"#/verification/runs/2026-11-18T154000Z-m1\">M1 build verification\u003c/a> — build-specific outcomes, measurements and source fingerprints; Claude's review passed and the packaging fix is verified in the post-review note.\u003c/li>\n\u003c/ul>\n","backlinks":["features/index","verification/runs/2026-11-18T154000Z-m1"]},{"id":"decisions","title":"Decisions","section":"Planning","order":0,"metadata":{},"metadataHtml":"\u003cspan>Last updated: 2026-11-18\u003c/span>","updated":"2026-11-18","summary":"","source":"---\ntitle: Decisions\nsection: Planning\nupdated: 2026-11-18\n---\n# Decisions\n\nAccepted product decisions for Apparate. These are expected behaviours and choices, not implementation or verification claims.\n\n## Round 1 — 2026-11-18\n\nSource: the user's submitted grill-form (\"Apparate decisions — round 1\"), asked after the [research alignment](research/alignment.md).\n\n| ID | Decision | Basis |\n| --- | --- | --- |\n| DEC-001 | A query without a prefix searches apps, settings, folders and files. | User choice; matched the recommendation. Prefixes narrow the search ([REQ-005](requirements.md)). |\n| DEC-002 | When matches are equally good, kinds rank apps > settings > folders > files. Learned usage reorders only within a match tier. | User choice; matched the recommendation. Without it, `term` ranked two files above Terminal. |\n| DEC-003 | v1 has a small native settings window that saves to an editable, versioned JSON file. | User choice; required by [REQ-005](requirements.md). The user asked that nativeness and simplicity follow their apps Klip, Yacht and Portia. |\n| DEC-004 | The default hotkey is ⌘Space, and it can be changed. The user turns off Spotlight's shortcut. | User choice; matched the recommendation. |\n| DEC-005 | Default indexed folders: `~/Projects`, `~/Desktop`, `~/Documents`, `~/Downloads`. Users can add folders and set a maximum folder depth. | User choice plus the user's note ([REQ-008](requirements.md)). |\n| DEC-006 | Files listed in `.gitignore` are left out of the index. Hidden files and `node_modules` are excluded regardless. | User choice; matched the recommendation. Whether this can be turned off, and whether `.ignore` files also count, was proposed but not asked. |\n| DEC-007 | Extra v1 features: web search in the default browser, and system commands Lock, Sleep, Restart and Show Trash. | User's note ([REQ-009](requirements.md), [REQ-010](requirements.md)). The user ticked none of the listed features (aliases, file actions, index status, calculator, quicklinks, running apps, recent files, scripts); round 2 asks about the ones both agents recommended. |\n| DEC-008 | Performance budgets accepted (table below). | User choice. |\n| DEC-009 | Apparate is released publicly from the start. | User choice. Channel and signing are asked in round 2. |\n| DEC-010 | macOS 27 only. | User choice; matched the recommendation. |\n| DEC-011 | Claude and Codex continue as builder and reviewer: one builds, the other reviews. | User choice; matched the recommendation. |\n| DEC-012 | Next: ask any remaining decisions, then Claude alone runs a UI design prototype spike in grill-form, with 3–4 variations of each major interface. | User's answer to \"what next\" (chose \"something else\" with this note). |\n\nPerformance budgets (DEC-008). Nothing has been achieved yet. Latencies are p95, measured end to end. Memory is `phys_footprint` in MiB, including any helper process.\n\n| Measure | Target | Limit (p95) |\n| --- | --- | --- |\n| Warm hotkey → panel's first presented frame | ≤ 16 ms | ≤ 33 ms |\n| Keystroke → stable displayed results, 20k items | ≤ 8 ms | ≤ 16 ms |\n| Keystroke → stable displayed results, 200k items | ≤ 16 ms | ≤ 33 ms |\n| Memory with a 20k-item index | ≤ 40 MiB | ≤ 60 MiB |\n| Memory with a 200k-item index | — | ≤ 100 MiB |\n| Idle CPU | 0% | no polling |\n\n## Round 2 — 2026-11-18\n\nSource: the user's submitted grill-form (\"Apparate decisions — round 2\").\n\n| ID | Decision | Basis |\n| --- | --- | --- |\n| DEC-013 | The joint technical recommendation in the [research alignment](research/alignment.md) is the basis for the build. The settings window is AppKit too, matching the reference apps (no SwiftUI). Build uses SwiftPM plus `build.sh`. | User accepted. |\n| DEC-014 | Public releases follow Klip and Yacht: GitHub Releases, ad-hoc signed with a fixed designated requirement, not notarized. | User choice; matched the recommendation. |\n| DEC-015 | Updates are a manual download from GitHub Releases. No update code or dependency in v1. | User choice; matched the recommendation. |\n| DEC-016 | v1 also includes file actions (Reveal in Finder, Copy path), and index status with a Rebuild button in settings. Aliases and pinned results are not in v1. | User choice. |\n| DEC-017 | Web search has a prefix and a fallback row shown when nothing local matches. Results open in the default browser. | User choice; matched the recommendation. The prefix character (proposed `?`) is not yet confirmed. |\n| DEC-018 | The default search engine is DuckDuckGo. The URL template is editable in settings. | User choice. |\n| DEC-019 | Restart asks for confirmation (Return again). Lock, Sleep and Show Trash run immediately. | User choice; matched the recommendation. |\n| DEC-020 | The default maximum depth for indexed folders is 10 levels, adjustable per folder. | User choice. |\n| DEC-021 | Apparate has a menu bar icon, which can be hidden in settings. | User choice; matched the recommendation. |\n| DEC-022 | The UI spike covers all five interfaces: launcher panel, result rows, settings window, menu bar menu, and first run. | User choice. |\n\n## Round 3 — UI design spike — 2026-11-18\n\nSource: the user's submitted grill-forms (\"Apparate UI — round 3\" and \"round 3b\"). Variations are described in the [UI design spike](spikes/2026-11-18-ui-design.md).\n\n| ID | Decision | Basis |\n| --- | --- | --- |\n| DEC-023 | The launcher panel is variation A: compact and fixed in size, with a search field, 28 pt rows, ⌘1–9 hints, and a footer with the selected result's keys (like Klip). | User choice; matched the recommendation. |\n| DEC-024 | Result rows are variation C: one line, matched letters in bold, location dimmed after the title, ⌘N hint on the right. | User choice; matched the recommendation. |\n| DEC-025 | The settings window uses toolbar tabs: General (hotkey with the Spotlight conflict notice, launch at login, menu bar icon), Search (prefix table, search engine, search URL), and Folders (folder table with depth and +/−, the .gitignore switch, index status with Rebuild). | User choice in round 3b; Claude had recommended the one-page layout. |\n| DEC-026 | The menu bar menu has Open Apparate (⌘Space), Settings… (⌘,) and Quit Apparate (⌘Q). Index status and Rebuild live in the settings Folders tab, not the menu. | User choice in round 3b; Claude had recommended adding index status to the menu. |\n| DEC-027 | First launch shows one setup window with two steps and their status: free up ⌘Space (opens Keyboard Shortcuts) and allow access to Desktop, Documents and Downloads. Buttons: Choose Folders… and Done. | User choice in round 3b; matched the recommendation. |\n\nIn round 3, the form showed option previews in three narrow columns, which squeezed the designs. The user asked to see the settings window, menu and first run again in a single full-width column. Round 3b decided them.\n\n## Round 4 — 2026-11-18\n\nSource: the user's submitted grill-form (\"Apparate decisions — round 4\"), asked after the [settings deep-link spike](spikes/2026-11-18-settings-deep-links.md), the [panel latency spike](spikes/2026-11-18-panel-latency.md) and the draft [implementation plan](plan.md).\n\n| ID | Decision | Basis |\n| --- | --- | --- |\n| DEC-028 | The DEC-008 budgets stay as accepted, as provisional end-to-end goals. They are measured properly during the build (M6), then revisited. | User choice; matched the joint recommendation of Claude and Codex. |\n| DEC-029 | When System Settings is already open, Apparate opens the settings link directly. It does not quit System Settings first, and there is no \"Close and reopen\" action. | User choice of Codex's option, with the note \"just open directly, no need to close and reopen\", citing jstack's `rule-lean`. Claude had preferred quitting first; Codex had proposed the extra action. |\n| DEC-030 | The web search prefix is `?`. | User choice; matched the recommendation. Confirms the prefix left open in DEC-017. |\n| DEC-031 | A query containing `/` searches full paths. Other queries match names only. | User choice; matched the recommendation (Codex's proposal in the [alignment](research/alignment.md)). |\n| DEC-032 | **Provisional:** no other default prefixes, so the defaults are `'` files and folders, `.` settings and `?` web. Users can add or change prefixes in settings. | Not answered: the question was left untouched, and grill-form treats that as unresolved, not as \"none\". These defaults match the recommendation and stand until the user answers. Asked again in round 5. |\n| DEC-033 | `.gitignore` handling has a switch in the settings Folders tab, on by default. | User choice; matched the recommendation. Refines DEC-006. |\n| DEC-034 | The public repository uses the MIT licence. | User choice; matched the recommendation. |\n| DEC-035 | None of the four icon directions. Rework the icon as a serious, sleek direction, not in the style of Klip. | User's note (\"rework. don't do it in the style of klip. do a serious, sleek direction\"). A new set of four directions follows. |\n| DEC-036 | Codex builds and Claude reviews. Claude gives detailed guidance for each milestone, with visual and non-visual references. Codex follows it but can push back. Disagreements between them go to the user in a grill-form. | User choice with this note. It fixes the roles left open in DEC-011; Claude had recommended the reverse. |\n| DEC-037 | The project is under local git, with one commit per milestone. Nothing is pushed without the user's go-ahead. | User choice; matched the recommendation. |\n\n## Observed from the reference apps\n\nKlip, Yacht and Portia (in `~/Projects`) are SwiftPM packages built by a `build.sh` script with Command Line Tools only. They are pure AppKit (no SwiftUI) menu bar apps. Each is released as a zip or DMG on GitHub Releases, ad-hoc signed and not notarized. Klip signs with a fixed designated requirement (`identifier \"local.klip\"`), which keeps privacy grants valid across rebuilds. These are observations, not decisions for Apparate; round 2 asks whether to follow them.\n\n## Not yet decided\n\n- The app icon and menu bar glyph: a new set of serious, sleek directions ([DEC-035](#round-4-2026-11-18)), in round 5.\n- Whether there are default prefixes beyond `'`, `.` and `?` ([DEC-032](#round-4-2026-11-18) is provisional), in round 5.\n- Creating the GitHub repository and publishing a release need the user's go-ahead when M7 is reached.\n","toc":[{"id":"round-1-2026-11-18","title":"Round 1 — 2026-11-18","depth":2},{"id":"round-2-2026-11-18","title":"Round 2 — 2026-11-18","depth":2},{"id":"round-3-ui-design-spike-2026-11-18","title":"Round 3 — UI design spike — 2026-11-18","depth":2},{"id":"round-4-2026-11-18","title":"Round 4 — 2026-11-18","depth":2},{"id":"observed-from-the-reference-apps","title":"Observed from the reference apps","depth":2},{"id":"not-yet-deci
